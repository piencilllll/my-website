<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BACKROOMS: LEVEL 0 (3D)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', monospace; }
        
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        /* CRT / VHS Overlay Effects */
        .vhs-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            z-index: 10;
        }

        .vhs-rec {
            position: absolute; top: 25px; left: 30px;
            color: #e6c641; font-weight: bold; font-size: 18px;
            letter-spacing: 2px; text-shadow: 0 0 4px rgba(230,198,65,0.6);
            z-index: 11;
            display: flex; align-items: center; gap: 8px;
        }
        .rec-dot { width: 12px; height: 12px; background: #d94336; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* HUD & Controls Screen */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 8, 5, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #d3c498; z-index: 20; text-align: center; cursor: pointer;
        }

        h1 { font-size: 36px; color: #e6c641; margin-bottom: 10px; letter-spacing: 4px; }
        p { font-size: 14px; margin-bottom: 20px; color: #a39673; max-width: 500px; line-height: 1.6; }
        .click-btn { padding: 12px 24px; background: #e6c641; color: #000; font-weight: bold; border: none; font-size: 16px; cursor: pointer; border-radius: 2px; }

        #stamina-bar-bg {
            position: absolute; bottom: 30px; left: 30px; width: 200px; height: 10px;
            background: rgba(40,35,25,0.8); border: 1px solid #3a3220; z-index: 11;
        }
        #stamina-bar { width: 100%; height: 100%; background: #e6c641; transition: width 0.1s; }

        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #d94336; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 30; font-size: 28px; letter-spacing: 3px;
        }
    </style>
</head>
<body>

<div class="vhs-overlay"></div>
<div class="vhs-rec"><div class="rec-dot"></div> PLAY [LEVEL 0]</div>

<div id="stamina-bar-bg"><div id="stamina-bar"></div></div>

<div id="start-screen">
    <h1>THE BACKROOMS</h1>
    <p>You have noclipped out of reality into Level 0.<br><br><b>W, A, S, D</b> — Walk<br><b>SHIFT</b> — Run<br><b>F</b> — Toggle Flashlight<br><b>MOUSE</b> — Look Around</p>
    <button class="click-btn">CLICK TO ENTER</button>
</div>

<div id="game-over">
    <p>YOU WERE CONSUMED BY THE BACKROOMS</p>
    <button class="click-btn" style="margin-top:20px;" onclick="location.reload()">RETRY</button>
</div>

<div id="canvas-container"></div>

<!-- Load Three.js library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // Audio Synth Engine (Fluorescent Hum + Footsteps)
    let audioCtx, humOsc, gainNode;
    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 60Hz Fluorescent Buzz
        humOsc = audioCtx.createOscillator();
        const humGain = audioCtx.createGain();
        humOsc.type = 'sawtooth';
        humOsc.frequency.setValueAtTime(60, audioCtx.currentTime);
        humGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        humOsc.connect(humGain);
        humGain.connect(audioCtx.destination);
        humOsc.start();
    }

    function playFootstep() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    // Three.js 3D Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050503);
    scene.fog = new THREE.FogExp2(0x12100b, 0.08);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Flashlight & Ambient Lighting
    const ambientLight = new THREE.AmbientLight(0xd4c285, 0.35);
    scene.add(ambientLight);

    const flashlight = new THREE.SpotLight(0xfff7d4, 2.5, 18, Math.PI / 6, 0.5, 1);
    flashlight.castShadow = true;
    scene.add(flashlight);
    scene.add(flashlight.target);

    // Procedural Wall/Floor/Ceiling Textures
    function createWallTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#bfa658';
        ctx.fillRect(0, 0, 256, 256);
        // Wallpaper stripes pattern
        ctx.fillStyle = '#b39a4c';
        for(let i = 0; i < 256; i += 16) {
            ctx.fillRect(i, 0, 8, 256);
        }
        return new THREE.CanvasTexture(canvas);
    }

    const wallTex = createWallTexture();
    wallTex.wrapS = THREE.RepeatWrapping; wallTex.wrapT = THREE.RepeatWrapping;

    const wallMat = new THREE.MeshLambertMaterial({ map: wallTex, color: 0xcca84d });
    const floorMat = new THREE.MeshLambertMaterial({ color: 0x3d3522 }); // Saturated carpet
    const ceilingMat = new THREE.MeshLambertMaterial({ color: 0x8c836c });

    // Grid Map Generation (1 = Wall, 0 = Hallway)
    const mapSize = 24;
    const grid = [];
    const wallGroup = new THREE.Group();

    for (let x = 0; x < mapSize; x++) {
        grid[x] = [];
        for (let z = 0; z < mapSize; z++) {
            const isBorder = x === 0 || x === mapSize - 1 || z === 0 || z === mapSize - 1;
            const isRandomWall = Math.random() < 0.28 && (x > 3 || z > 3);
            if (isBorder || isRandomWall) {
                grid[x][z] = 1;
                const wallGeo = new THREE.BoxGeometry(3, 3.5, 3);
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(x * 3, 1.75, z * 3);
                wallGroup.add(wall);
            } else {
                grid[x][z] = 0;
            }
        }
    }
    scene.add(wallGroup);

    // Floor & Ceiling planes
    const floorGeo = new THREE.PlaneGeometry(mapSize * 3, mapSize * 3);
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set((mapSize * 3) / 2 - 1.5, 0, (mapSize * 3) / 2 - 1.5);
    scene.add(floor);

    const ceiling = new THREE.Mesh(floorGeo, ceilingMat);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set((mapSize * 3) / 2 - 1.5, 3.5, (mapSize * 3) / 2 - 1.5);
    scene.add(ceiling);

    // Ceiling Light Panels
    for (let x = 2; x < mapSize - 2; x += 4) {
        for (let z = 2; z < mapSize - 2; z += 4) {
            if (grid[x][z] === 0) {
                const lightGeo = new THREE.PlaneGeometry(1.5, 1.5);
                const lightMat = new THREE.MeshBasicMaterial({ color: 0xfff3bd });
                const lightMesh = new THREE.Mesh(lightGeo, lightMat);
                lightMesh.rotation.x = Math.PI / 2;
                lightMesh.position.set(x * 3, 3.49, z * 3);
                scene.add(lightMesh);

                const pointLight = new THREE.PointLight(0xe6c641, 0.6, 7);
                pointLight.position.set(x * 3, 3.2, z * 3);
                scene.add(pointLight);
            }
        }
    }

    // Entity (Bacteria / Wire Monster)
    const entityGroup = new THREE.Group();
    const entityMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
    for (let i = 0; i < 8; i++) {
        const limbGeo = new THREE.CylinderGeometry(0.04, 0.04, 3);
        const limb = new THREE.Mesh(limbGeo, entityMat);
        limb.position.set((Math.random() - 0.5) * 0.4, 1.5, (Math.random() - 0.5) * 0.4);
        limb.rotation.z = (Math.random() - 0.5) * 0.5;
        entityGroup.add(limb);
    }
    entityGroup.position.set((mapSize - 3) * 3, 0, (mapSize - 3) * 3);
    scene.add(entityGroup);

    // Player Physics & Movement Controls
    const player = {
        pos: new THREE.Vector3(4.5, 1.6, 4.5),
        rot: new THREE.Euler(0, 0, 0, 'YXZ'),
        speed: 0.04,
        stamina: 100,
        flashlightOn: true,
        stepTimer: 0
    };

    camera.position.copy(player.pos);

    const keys = {};
    window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'KeyF') {
            player.flashlightOn = !player.flashlightOn;
            flashlight.visible = player.flashlightOn;
        }
    });
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    // Pointer Lock Controls
    const startScreen = document.getElementById('start-screen');
    startScreen.addEventListener('click', () => {
        initAudio();
        document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === document.body) {
            startScreen.style.display = 'none';
        } else {
            startScreen.style.display = 'flex';
        }
    });

    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === document.body) {
            player.rot.y -= e.movementX * 0.002;
            player.rot.x -= e.movementY * 0.002;
            player.rot.x = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, player.rot.x));
        }
    });

    // Collision Detection
    function checkCollision(newPos) {
        const gx = Math.floor((newPos.x + 1.5) / 3);
        const gz = Math.floor((newPos.z + 1.5) / 3);
        if (gx >= 0 && gx < mapSize && gz >= 0 && gz < mapSize) {
            return grid[gx][gz] === 1;
        }
        return true;
    }

    // Main Game Loop
    let headBob = 0;
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();

        if (document.pointerLockElement === document.body) {
            // Movement logic
            const moveDir = new THREE.Vector3();
            if (keys['KeyW']) moveDir.z -= 1;
            if (keys['KeyS']) moveDir.z += 1;
            if (keys['KeyA']) moveDir.x -= 1;
            if (keys['KeyD']) moveDir.x += 1;
            moveDir.normalize();

            let currentSpeed = player.speed;
            if (keys['ShiftLeft'] && player.stamina > 0 && moveDir.length() > 0) {
                currentSpeed *= 1.8;
                player.stamina = Math.max(0, player.stamina - 25 * delta);
            } else {
                player.stamina = Math.min(100, player.stamina + 15 * delta);
            }
            document.getElementById('stamina-bar').style.width = player.stamina + '%';

            // Rotate direction relative to camera
            moveDir.applyEuler(new THREE.Euler(0, player.rot.y, 0));

            // Move X & Z with simple ray-bounding collision
            const targetPosX = player.pos.x + moveDir.x * currentSpeed;
            if (!checkCollision(new THREE.Vector3(targetPosX, player.pos.y, player.pos.z))) {
                player.pos.x = targetPosX;
            }
            const targetPosZ = player.pos.z + moveDir.z * currentSpeed;
            if (!checkCollision(new THREE.Vector3(player.pos.x, player.pos.y, targetPosZ))) {
                player.pos.z = targetPosZ;
            }

            // Head Bobbing & Footsteps
            if (moveDir.length() > 0) {
                headBob += delta * (currentSpeed > player.speed ? 14 : 9);
                player.stepTimer += delta * (currentSpeed > player.speed ? 2.2 : 1.4);
                if (player.stepTimer > 1.0) {
                    playFootstep();
                    player.stepTimer = 0;
                }
            }
            camera.position.x = player.pos.x;
            camera.position.y = player.pos.y + Math.sin(headBob) * 0.05;
            camera.position.z = player.pos.z;
            camera.rotation.copy(player.rot);

            // Flashlight follows camera angle
            flashlight.position.copy(camera.position);
            const dir = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
            flashlight.target.position.copy(camera.position).add(dir);

            // Entity AI (Stalks Player)
            const distToEntity = player.pos.distanceTo(entityGroup.position);
            if (distToEntity < 25) {
                const huntDir = new THREE.Vector3().subVectors(player.pos, entityGroup.position).normalize();
                entityGroup.position.addScaledVector(huntDir, 0.02);

                if (distToEntity < 1.5) {
                    document.getElementById('game-over').style.display = 'flex';
                    document.exitPointerLock();
                }
            }
        }

        renderer.render(scene, camera);
    }

    // Window Resize Handling
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
