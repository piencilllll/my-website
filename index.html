<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawm: Far From Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030206;
            color: #d1d5db;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #000;
            border: 2px solid #1a1a24;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }

        /* Scanlines Overlay */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* Title Screen UI */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            background: rgba(3, 2, 6, 0.85);
            transition: opacity 1.5s ease;
        }

        .title-logo {
            font-size: 42px;
            font-weight: bold;
            color: #f3f4f6;
            letter-spacing: 6px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4), 3px 3px #ff0055;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #8b5cf6;
            letter-spacing: 4px;
            margin-bottom: 50px;
            text-transform: uppercase;
        }

        .prompt-text {
            font-size: 14px;
            color: #a1a1aa;
            letter-spacing: 2px;
            animation: pulse 1.6s infinite ease-in-out;
            cursor: pointer;
            text-align: center;
            line-height: 1.5;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Dialogue Box - Undertale Style */
        #dialogue-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 720px;
            height: 150px;
            background: #000;
            border: 4px solid #fff;
            padding: 15px;
            z-index: 20;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 20px;
        }

        #portrait-canvas {
            width: 110px;
            height: 110px;
            border: 2px solid #333; /* guidelines */
            image-rendering: pixelated;
            flex-shrink: 0;
        }

        .text-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .dialogue-text {
            font-size: 18px;
            line-height: 1.3;
            color: #fff;
            white-space: pre-wrap;
            font-family: monospace; /* Monospace is essential for style */
        }

        .next-prompt {
            align-self: flex-end;
            font-size: 11px;
            color: #71717a;
            animation: pulse 1s infinite;
        }

        .hidden {
            display: none !important;
        }

        /* Cinematic Overlay Blackout */
        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 30;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
    </style>

</head>
<body>

<div id="game-container">
    <div class="scanlines"></div>
    <canvas id="stage" width="800" height="600"></canvas>

    <div id="fade-overlay"></div>

    <!-- Title / Start Screen -->
    <div id="title-screen" class="ui-layer">
        <div class="title-logo">KAWM</div>
        <div class="subtitle">FAR FROM HOME</div>
        <div id="start-prompt" class="prompt-text">[ CLICK ANYWHERE TO ACTIVATE AUDIO ]<br><span style="font-size:10px">(Browsers block sound until interact)</span></div>
    </div>

    <!-- Intro Cutscene Dialogue UI - Undertale Style -->
    <div id="dialogue-container" class="hidden">
        <!-- Pixel portrait canvas -->
        <canvas id="portrait-canvas" width="55" height="55"></canvas>
        
        <div class="text-area">
            <div id="speech" class="dialogue-text"></div>
            <div class="next-prompt">[ PRESS SPACE ]</div>
        </div>
    </div>
</div>

<script>
// --- Web Audio API Setup ---
let audioCtx = null;
let isAudioInitialized = false;

function initAudio() {
    if (isAudioInitialized) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        isAudioInitialized = true;
        console.log("Audio Context Initialized.");
        document.getElementById('start-prompt').innerHTML = "[ PRESS ANYKEY OR CLICK TO EMBARK ]";
    } catch (e) {
        console.error("Web Audio API not supported.");
    }
}

// Procedural Retro Sound Generators
function playTextBeep(speaker) {
    if (!audioCtx || !isAudioInitialized) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'square';
    
    // Pitch varies depending on speaker for unique voice chitters
    if (speaker === 'Moe') {
        osc.frequency.setValueAtTime(200 + Math.random() * 20, audioCtx.currentTime); // Lower pitch for Moe
    } else if (speaker === 'McCrack') {
        osc.frequency.setValueAtTime(380 + Math.random() * 40, audioCtx.currentTime); // Higher pitch for McCrack
    } else {
        osc.frequency.setValueAtTime(120, audioCtx.currentTime); // Deep pitch for Narrator
    }

    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.03);
}

function playAdvanceSound() {
    if (!audioCtx || !isAudioInitialized) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(250, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.06);

    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.06);
}

function playStartSound() {
    if (!audioCtx || !isAudioInitialized) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(110, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(330, audioCtx.currentTime + 0.4);

    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
}

// --- Canvas Setup ---
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Portrait Canvas Setup (Internal low-res for pixel effect)
const portraitCanvas = document.getElementById('portrait-canvas');
const pCtx = portraitCanvas.getContext('2d');
pCtx.imageSmoothingEnabled = false;

// --- UI Handles ---
const titleScreen = document.getElementById('title-screen');
const dialogueBox = document.getElementById('dialogue-container');
const speechEl = document.getElementById('speech');
const fadeOverlay = document.getElementById('fade-overlay');

// --- Game Logic States ---
let gameState = 'TITLE'; // TITLE, CINEMATIC_INTRO, DIALOGUE, END_INTRO
let frameCount = 0;

// --- Story Beats Setup ---
let currentScriptIndex = 0;
const script = [
    {
        speaker: "NARRATOR",
        expression: "none",
        text: "The sky over our village didn't turn black from the night...",
        scene: "BURNING_VILLAGE"
    },
    {
        speaker: "NARRATOR",
        expression: "none",
        text: "It turned black from smoke. The attack happened without warning. Fire consumed the timber and kinetic towers.",
        scene: "BURNING_VILLAGE"
    },
    {
        speaker: "McCrack",
        expression: "worried",
        text: "Moe! Hurry up! The dock is collapsing! We have to cast off right now!",
        scene: "ESCAPE_DOCK"
    },
    {
        speaker: "Moe",
        expression: "determined",
        text: "Hold on! The ropes are jammed—McCrack, grab the wooden oars!",
        scene: "ESCAPE_DOCK"
    },
    {
        speaker: "NARRATOR",
        expression: "none",
        text: "We pushed off into the dark expanse of the Kawm Ocean, leaving behind the only life we had ever known.",
        scene: "OCEAN_DRIFT"
    },
    {
        speaker: "McCrack",
        expression: "neutral",
        text: "Do you think... anyone else made it out, Moe?",
        scene: "OCEAN_DRIFT"
    },
    {
        speaker: "Moe",
        expression: "neutral",
        text: "...I don't know. But we can't look back now. We keep sailing until we find refuge.",
        scene: "OCEAN_DRIFT"
    }
];

// --- Typewriter Effect ---
let typeIndex = 0;
let isTyping = false;
let currentText = "";
let typeTimer = null;

function typeWriter(text, cb) {
    speechEl.textContent = "";
    typeIndex = 0;
    isTyping = true;
    currentText = text;

    const currentBeat = script[currentScriptIndex];

    clearInterval(typeTimer);
    typeTimer = setInterval(() => {
        if (typeIndex < text.length) {
            speechEl.textContent += text.charAt(typeIndex);
            
            // Play sound effect on non-space characters
            if (text.charAt(typeIndex) !== ' ') {
                playTextBeep(currentBeat.speaker);
            }
            
            typeIndex++;
        } else {
            clearInterval(typeTimer);
            isTyping = false;
            if (cb) cb();
        }
    }, 40); // Slightly slower for Undertale feel
}

// --- Drawing Kawmling Characters (Stage) ---
function drawKawmlingStage(x, y, scale = 1, hat = 'none', facing = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(facing * scale, scale);

    ctx.strokeStyle = '#ffffff';
    ctx.fillStyle = '#ffffff';
    ctx.lineWidth = 6; // Thicker stickman body style
    ctx.lineCap = 'round';

    // Head
    ctx.beginPath();
    ctx.arc(0, -45, 14, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.beginPath();
    ctx.moveTo(0, -31);
    ctx.lineTo(0, 10);
    ctx.stroke();

    // Arms
    ctx.beginPath();
    ctx.moveTo(0, -22);
    ctx.lineTo(-12, -8);
    ctx.moveTo(0, -22);
    ctx.lineTo(12, -8);
    ctx.stroke();

    // Legs
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.lineTo(-10, 32);
    ctx.moveTo(0, 10);
    ctx.lineTo(10, 32);
    ctx.stroke();

    // Eyes (Stage Version simplified)
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(3, -46, 2, 0, Math.PI * 2);
    ctx.arc(8, -46, 2, 0, Math.PI * 2);
    ctx.fill();

    // Hats (Stage)
    if (hat === 'durag') {
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath();
        ctx.arc(0, -46, 15, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.beginPath(); ctx.moveTo(-14, -46); ctx.lineTo(-20, -36); ctx.lineTo(-10, -38); ctx.fill();
    } else if (hat === 'paperboat') {
        ctx.fillStyle = '#e4e4e7';
        ctx.beginPath();
        ctx.moveTo(-16, -56); ctx.lineTo(16, -56); ctx.lineTo(10, -48); ctx.lineTo(-10, -48);
        ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-6, -56); ctx.lineTo(0, -68); ctx.lineTo(6, -56);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#a1a1aa'; ctx.lineWidth = 1; ctx.stroke();
    }

    ctx.restore();
}

// --- Drawing Pixel Portraits (Dialogue Box) ---
function drawPortrait(speaker, expression) {
    pCtx.clearRect(0, 0, portraitCanvas.width, portraitCanvas.height);
    
    if (speaker === 'NARRATOR') return; // Empty portrait

    pCtx.fillStyle = '#ffffff';
    
    // Low-res Head shape (approx 28x28 pixels wide in internal res)
    const centerX = portraitCanvas.width / 2;
    const centerY = portraitCanvas.height / 2 + 5;
    const headRad = 18;

    pCtx.beginPath();
    pCtx.arc(centerX, centerY, headRad, 0, Math.PI * 2);
    pCtx.fill();

    // Low-res Hats
    if (speaker === 'Moe') {
        // Durag (Blue)
        pCtx.fillStyle = '#3b82f6';
        pCtx.beginPath();
        pCtx.arc(centerX, centerY, headRad + 1, Math.PI, Math.PI * 2);
        pCtx.fill();
        // Flap
        pCtx.beginPath();
        pCtx.moveTo(centerX - headRad, centerY);
        pCtx.lineTo(centerX - headRad - 6, centerY + 10);
        pCtx.lineTo(centerX - headRad + 2, centerY + 8);
        pCtx.fill();
    } else if (speaker === 'McCrack') {
        // Paperboat (Gray)
        pCtx.fillStyle = '#e4e4e7';
        pCtx.beginPath();
        pCtx.moveTo(centerX - 20, centerY - headRad - 2);
        pCtx.lineTo(centerX + 20, centerY - headRad - 2);
        pCtx.lineTo(centerX + 12, centerY - headRad + 8);
        pCtx.lineTo(centerX - 12, centerY - headRad + 8);
        pCtx.closePath();
        pCtx.fill();
        // Peak
        pCtx.beginPath();
        pCtx.moveTo(centerX - 8, centerY - headRad - 2);
        pCtx.lineTo(centerX, centerY - headRad - 14);
        pCtx.lineTo(centerX + 8, centerY - headRad - 2);
        pCtx.closePath();
        pCtx.fill();
    }

    // --- High-Contrast Face (Black details) ---
    pCtx.fillStyle = '#000000';
    pCtx.strokeStyle = '#000000';
    pCtx.lineWidth = 2;
    pCtx.lineCap = 'square';

    // Large Pixel Eyes
    pCtx.fillRect(centerX - 10, centerY - 2, 4, 6);
    pCtx.fillRect(centerX + 6, centerY - 2, 4, 6);

    // Expressions (Eyebrows only, high contrast)
    pCtx.beginPath();
    if (expression === 'worried') {
        pCtx.moveTo(centerX - 12, centerY - 10); pCtx.lineTo(centerX - 6, centerY - 7);
        pCtx.moveTo(centerX + 12, centerY - 10); pCtx.lineTo(centerX + 6, centerY - 7);
    } else if (expression === 'determined') {
        pCtx.moveTo(centerX - 12, centerY - 8); pCtx.lineTo(centerX - 6, centerY - 4);
        pCtx.moveTo(centerX + 12, centerY - 8); pCtx.lineTo(centerX + 6, centerY - 4);
    } else { // neutral
        pCtx.moveTo(centerX - 12, centerY - 8); pCtx.lineTo(centerX - 6, centerY - 8);
        pCtx.moveTo(centerX + 12, centerY - 8); pCtx.lineTo(centerX + 6, centerY - 8);
    }
    pCtx.stroke();
}

// --- Boat Render ---
function drawBoat(x, y) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = '#271c19';
    ctx.beginPath();
    ctx.moveTo(-60, 0); ctx.lineTo(60, 0); ctx.lineTo(45, 30); ctx.lineTo(-45, 30);
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = '#44312c';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.restore();
}

// --- Background Scenes ---
function renderScene(sceneType) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (sceneType === 'BURNING_VILLAGE') {
        ctx.fillStyle = '#0a0508';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let fireGlow = Math.sin(frameCount * 0.1) * 20;
        ctx.fillStyle = `rgb(${180 + fireGlow}, 40, 10)`;
        ctx.fillRect(0, 350, canvas.width, 250);

        ctx.fillStyle = '#050305';
        ctx.fillRect(100, 300, 80, 80);
        ctx.fillRect(220, 260, 120, 120);
        ctx.fillRect(500, 280, 100, 100);

        for (let i = 0; i < 30; i++) {
            let px = (Math.sin(i * 99 + frameCount * 0.02) * 0.5 + 0.5) * canvas.width;
            let py = ((frameCount * (1 + i * 0.1) + i * 50) % 400);
            ctx.fillStyle = i % 2 === 0 ? '#ff4500' : '#ffbe0b';
            ctx.fillRect(px, 400 - py, 3, 3);
        }
    } 
    else if (sceneType === 'ESCAPE_DOCK') {
        ctx.fillStyle = '#0d0714';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#1c1917';
        ctx.fillRect(0, 420, 380, 180);

        // Standard water color here
        ctx.fillStyle = '#060a17';
        ctx.fillRect(380, 440, 420, 160);

        drawBoat(480, 435);

        drawKawmlingStage(280, 395, 1.1, 'durag', 1); // Moe
        drawKawmlingStage(480, 410, 1.0, 'paperboat', -1); // McCrack
    } 
    else if (sceneType === 'OCEAN_DRIFT') {
        // Deep endless ocean night
        ctx.fillStyle = '#02040a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // --- White Waves (Special Request) ---
        let waveOffset = Math.sin(frameCount * 0.03) * 6;
        ctx.fillStyle = '#ffffff'; // White water
        ctx.beginPath();
        ctx.moveTo(0, 380 + waveOffset);
        for (let x = 0; x <= canvas.width; x += 40) {
            ctx.lineTo(x, 380 + Math.sin(x * 0.02 + frameCount * 0.04) * 8 + waveOffset);
        }
        ctx.lineTo(canvas.width, canvas.height);
        ctx.lineTo(0, canvas.height);
        ctx.fill();

        // Gently rocking boat
        let boatY = 380 + waveOffset;
        let boatRot = Math.sin(frameCount * 0.02) * 0.05;

        ctx.save();
        ctx.translate(400, boatY);
        ctx.rotate(boatRot);

        drawBoat(0, 0);
        drawKawmlingStage(-20, -22, 1.0, 'durag', 1); // Moe sitting left
        drawKawmlingStage(22, -22, 0.95, 'paperboat', -1); // McCrack sitting right

        ctx.restore();
    }
}

// --- Main Loop ---
function loop() {
    frameCount++;

    if (gameState === 'TITLE') {
        renderScene('BURNING_VILLAGE');
    } else if (gameState === 'DIALOGUE') {
        let currentScene = script[currentScriptIndex].scene;
        renderScene(currentScene);
    } else if (gameState === 'END_INTRO') {
        renderScene('OCEAN_DRIFT');
    }

    requestAnimationFrame(loop);
}

// --- Game Logic Handling ---
function triggerNextBeat() {
    if (!isAudioInitialized) {
        initAudio();
        return; // Prevent starting game on the very first click used to enable audio
    }

    if (gameState === 'TITLE') {
        playStartSound();
        titleScreen.classList.add('hidden');
        dialogueBox.classList.remove('hidden');
        gameState = 'DIALOGUE';
        advanceScript();
    } else if (gameState === 'DIALOGUE') {
        if (isTyping) {
            // Fast forward typewriter
            clearInterval(typeTimer);
            speechEl.textContent = currentText;
            isTyping = false;
        } else {
            playAdvanceSound();
            currentScriptIndex++;
            if (currentScriptIndex < script.length) {
                advanceScript();
            } else {
                // Intro Ends
                dialogueBox.classList.add('hidden');
                fadeOverlay.style.opacity = '1';
                gameState = 'END_INTRO';
            }
        }
    }
}

function advanceScript() {
    const beat = script[currentScriptIndex];
    
    // Draw the portrait inside the dialogue box
    drawPortrait(beat.speaker, beat.expression);

    // Undertale style doesn't use speaker name labels, 
    // the voice beep and portrait tell you who is talking.
    typeWriter(beat.text);
}

// --- Listeners ---
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
        triggerNextBeat();
    }
});

document.getElementById('game-container').addEventListener('click', () => {
    triggerNextBeat();
});

// Start loop
loop();
</script>
</body>
</html>
