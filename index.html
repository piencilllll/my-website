<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exoplanet Generator & Exploration Hub</title>
    <style>
        :root {
            --bg-dark: #05070a;
            --panel-bg: rgba(13, 17, 23, 0.85);
            --accent-blue: #00f3ff;
            --accent-glow: rgba(0, 243, 255, 0.25);
            --border-color: #21262d;
            --text-bright: #f0f6fc;
            --text-dim: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-bright);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 3D Canvas */
        #planetCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Overlay */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: grid;
            grid-template-columns: 320px 1fr 340px;
            grid-template-rows: 60px 1fr 140px;
            padding: 20px;
            gap: 20px;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Top Bar */
        header {
            grid-column: 1 / -1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        h1 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-blue);
        }

        /* Control Panel Left */
        .panel-left {
            grid-column: 1;
            grid-row: 2;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            backdrop-filter: blur(8px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Surface Telemetry Right */
        .panel-right {
            grid-column: 3;
            grid-row: 2;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            backdrop-filter: blur(8px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Bottom Controls */
        .panel-bottom {
            grid-column: 1 / -1;
            grid-row: 3;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            backdrop-filter: blur(8px);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-bright);
        }

        /* Buttons */
        .btn {
            background: #161b22;
            border: 1px solid var(--border-color);
            color: var(--accent-blue);
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #21262d;
            border-color: var(--accent-blue);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .btn-primary {
            background: var(--accent-blue);
            color: #000;
            border: none;
        }

        .btn-primary:hover {
            background: #33f5ff;
            box-shadow: 0 0 15px var(--accent-blue);
        }

        /* Transition Overlay for Atmosphere Descent */
        #descentOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="descentOverlay"></div>
    <canvas id="planetCanvas"></canvas>

    <div class="ui-layer">
        <header class="interactive">
            <h1>EXOPLANET // ARCHIVE</h1>
            <span id="planet-name-hdr" style="font-weight: bold; color: #fff;">ASTERA-9</span>
        </header>

        <div class="panel-left interactive">
            <h3 style="color: var(--accent-blue); font-size: 0.9rem; text-transform: uppercase;">Orbital Telemetry</h3>
            <hr style="border-color: var(--border-color);">
            
            <div class="stat-group">
                <span class="stat-label">Classification</span>
                <span class="stat-value" id="val-type">Terrestrial Ocean</span>
            </div>
            <div class="stat-group">
                <span class="stat-label">Radius / Mass</span>
                <span class="stat-value" id="val-radius">1.24 R⊕ / 2.1 M⊕</span>
            </div>
            <div class="stat-group">
                <span class="stat-label">Atmosphere Mix</span>
                <span class="stat-value" id="val-atmo">N2, O2, Ar (1.4 atm)</span>
            </div>
            <div class="stat-group">
                <span class="stat-label">Avg Temperature</span>
                <span class="stat-value" id="val-temp">14°C</span>
            </div>
            <div class="stat-group">
                <span class="stat-label">Satellites</span>
                <span class="stat-value" id="val-moons">2 Moons</span>
            </div>
        </div>

        <div class="panel-right interactive">
            <h3 style="color: var(--accent-blue); font-size: 0.9rem; text-transform: uppercase;">Sector Lore & Biosphere</h3>
            <hr style="border-color: var(--border-color);">
            <p id="val-lore" style="font-size: 0.85rem; line-height: 1.5; color: var(--text-dim);">
                Procedural data generating...
            </p>
        </div>

        <div class="panel-bottom interactive">
            <button class="btn" id="genBtn">Generate New World</button>
            <div style="display: flex; gap: 10px;">
                <button class="btn" id="orbitViewBtn">Orbit View</button>
                <button class="btn btn-primary" id="descentBtn">Descend to Surface</button>
            </div>
        </div>
    </div>

    <script>
        // Setup Three.js Scene
        const canvas = document.getElementById('planetCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 4.5);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 8;
        controls.minDistance = 1.3;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);

        // Stars Background
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 2000;
        const starPos = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) {
            starPos[i] = (Math.random() - 0.5) * 200;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        // Procedural Planet Mesh Setup
        const planetGeo = new THREE.SphereGeometry(1, 64, 64);
        let planetMat = new THREE.MeshStandardMaterial({ roughness: 0.8, metalness: 0.1 });
        const planet = new THREE.Mesh(planetGeo, planetMat);
        scene.add(planet);

        // Atmosphere Shell
        const atmoGeo = new THREE.SphereGeometry(1.03, 64, 64);
        const atmoMat = new THREE.MeshBasicMaterial({
            color: 0x00f3ff,
            transparent: true,
            opacity: 0.25,
            side: THREE.BackSide
        });
        const atmosphere = new THREE.Mesh(atmoGeo, atmoMat);
        scene.add(atmosphere);

        // Procedural Texture Generator
        function generatePlanetTexture(primaryColorHex, secondaryColorHex, oceanColorHex) {
            const canvasTex = document.createElement('canvas');
            canvasTex.width = 1024;
            canvasTex.height = 512;
            const ctx = canvasTex.getContext('2d');

            ctx.fillStyle = oceanColorHex;
            ctx.fillRect(0, 0, canvasTex.width, canvasTex.height);

            // Generate Landmass Blobs
            for (let i = 0; i < 40; i++) {
                const x = Math.random() * canvasTex.width;
                const y = Math.random() * canvasTex.height;
                const r = Math.random() * 120 + 30;

                let grad = ctx.createRadialGradient(x, y, 5, x, y, r);
                grad.addColorStop(0, primaryColorHex);
                grad.addColorStop(0.7, secondaryColorHex);
                grad.addColorStop(1, 'transparent');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvasTex);
        }

        // Random Generator Engine
        const prefixes = ["Aethel", "Kepler", "Gliese", "Astra", "Chronos", "Vesper", "Zephyr"];
        const suffixes = ["Prime", "9", "b", "VI", "Major", "X", "Reach"];
        const types = [
            { name: "Oceanic World", land: "#1b4332", land2: "#2d6a4f", water: "#0077b6", atmo: 0x00f3ff },
            { name: "Arid Desert", land: "#e76f51", land2: "#f4a261", water: "#2a9d8f", atmo: 0xffaa44 },
            { name: "Ice Giant / Tundra", land: "#a8ded0", land2: "#f1faee", water: "#1d3557", atmo: 0xaaffff },
            { name: "Volcanic Crag", land: "#370617", land2: "#6a040f", water: "#d00000", atmo: 0xff3300 }
        ];

        function buildNewWorld() {
            const name = prefixes[Math.floor(Math.random() * prefixes.length)] + "-" + suffixes[Math.floor(Math.random() * suffixes.length)];
            const pType = types[Math.floor(Math.random() * types.length)];

            // Build Canvas Texture
            const texture = generatePlanetTexture(pType.land, pType.land2, pType.water);
            planetMat.map = texture;
            planetMat.needsUpdate = true;

            atmosphere.material.color.setHex(pType.atmo);

            // Update UI Data
            document.getElementById('planet-name-hdr').innerText = name;
            document.getElementById('val-type').innerText = pType.name;
            document.getElementById('val-radius').innerText = (Math.random() * 1.5 + 0.5).toFixed(2) + " R⊕";
            document.getElementById('val-temp').innerText = Math.floor(Math.random() * 80 - 20) + "°C";
            document.getElementById('val-moons').innerText = Math.floor(Math.random() * 5) + " Detected";
            document.getElementById('val-lore').innerText = `Sensors indicate unique terrain patterns across ${name}. Atmospheric entry profiles confirm active surface weather systems.`;

            // Reset Overlay
            document.getElementById('descentOverlay').style.background = `radial-gradient(circle, ${pType.land2} 0%, #000 100%)`;
        }

        // Animation / Zoom System
        let isZooming = false;

        document.getElementById('descentBtn').addEventListener('click', () => {
            if(isZooming) return;
            isZooming = true;
            
            const overlay = document.getElementById('descentOverlay');
            overlay.style.opacity = '0.8';

            let startTime = performance.now();
            function animateZoom(time) {
                let elapsed = (time - startTime) / 1000;
                if(elapsed < 2) {
                    camera.position.z = THREE.MathUtils.lerp(camera.position.z, 1.15, 0.03);
                    requestAnimationFrame(animateZoom);
                } else {
                    overlay.style.opacity = '0';
                    isZooming = false;
                }
            }
            requestAnimationFrame(animateZoom);
        });

        document.getElementById('orbitViewBtn').addEventListener('click', () => {
            camera.position.set(0, 0, 4.5);
        });

        document.getElementById('genBtn').addEventListener('click', () => {
            camera.position.set(0, 0, 4.5);
            buildNewWorld();
        });

        // Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Main Loop
        function animate() {
            requestAnimationFrame(animate);
            planet.rotation.y += 0.002;
            atmosphere.rotation.y += 0.0025;
            controls.update();
            renderer.render(scene, camera);
        }

        buildNewWorld();
        animate();
    </script>
</body>
</html>
