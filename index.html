<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift Beyond the Horizon - Chapter 0</title>
    <style>
        :root {
            --bg-dark: #05070a;
            --text-main: #e6e6e6;
            --ui-border: #ffffff;
            --ink-black: #080a0f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Custom White Kawmling Hand Cursor */
        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M8,12 L8,22 C8,25 10,27 13,27 L18,27 C22,27 24,24 24,20 L24,14 C24,12.5 22.5,11.5 21,12.5 C20.5,11 19,10 17.5,11 C16.5,10 15,10.5 14.5,11.5 L14.5,6 C14.5,4.5 12.5,4.5 12.5,6 L12.5,14 L11,12.5 C9.5,11 8,11 8,12 Z' fill='%23ffffff' stroke='%23000000' stroke-width='2'/></svg>"), auto;
        }

        button, .dash-node, #startOverlay {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M8,12 L8,22 C8,25 10,27 13,27 L18,27 C22,27 24,24 24,20 L24,14 C24,12.5 22.5,11.5 21,12.5 C20.5,11 19,10 17.5,11 C16.5,10 15,10.5 14.5,11.5 L14.5,6 C14.5,4.5 12.5,4.5 12.5,6 L12.5,14 L11,12.5 C9.5,11 8,11 8,12 Z' fill='%23ffffff' stroke='%23000000' stroke-width='2'/></svg>"), pointer !important;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #020305;
            overflow: hidden;
        }

        canvas#fxCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            z-index: 10;
            pointer-events: none;
        }

        .shake {
            animation: shake 0.25s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
            40%, 60% { transform: translate3d(7px, 0, 0); }
        }

        #stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .cinematic-text {
            font-size: 1.5rem;
            line-height: 2.2rem;
            max-width: 850px;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.7);
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .cinematic-text.visible {
            opacity: 1;
        }

        /* Boat Scene Setup */
        .boat-scene {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .boat-scene.active {
            opacity: 1;
        }

        .ocean-view {
            width: 92%;
            height: 58%;
            border: 2px solid #2a3545;
            background: radial-gradient(circle at 50% 100%, #0c1829 0%, #020509 90%);
            border-radius: 8px;
            position: relative;
            box-shadow: inset 0 0 60px #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .dash-node {
            width: 130px;
            height: 130px;
            border: 2px dashed #4a5a70;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #8a9ab0;
            font-size: 0.85rem;
            font-weight: bold;
            transition: 0.3s;
            text-align: center;
            padding: 10px;
        }

        .dash-node:hover {
            border-color: #fff;
            color: #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.05);
        }

        /* Dialogue Box & Kawmling Portraits */
        .dialogue-box {
            width: 92%;
            max-width: 950px;
            height: 200px;
            background: var(--ink-black);
            border: 4px solid var(--ui-border);
            border-radius: 6px;
            padding: 20px;
            display: flex;
            gap: 20px;
            box-shadow: 0 0 25px rgba(0,0,0,0.95);
            z-index: 5;
        }

        .portrait-frame {
            width: 150px;
            height: 150px;
            border: 2px solid #fff;
            background: #020305;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            position: relative;
        }

        .portrait-svg {
            width: 100px;
            height: 100px;
        }

        .portrait-label {
            margin-top: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .dialogue-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dialogue-text {
            font-size: 1.25rem;
            line-height: 1.7rem;
            color: #fff;
        }

        .prompt-hint {
            align-self: flex-end;
            font-size: 0.8rem;
            color: #777;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Main Menu Overlay */
        #startOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020305;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #startOverlay h1 {
            font-size: 2.8rem;
            letter-spacing: 6px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        #startOverlay p {
            color: #778899;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <canvas id="fxCanvas"></canvas>
        <div class="crt-overlay"></div>

        <div id="startOverlay" onclick="initializeEngine()">
            <h1>DRIFT BEYOND THE HORIZON</h1>
            <p>[ CLICK ANYWHERE TO BEGIN JOURNEY ]</p>
        </div>

        <div id="stage">
            <div id="cinematicText" class="cinematic-text"></div>
        </div>

        <div id="boatScene" class="boat-scene">
            <div class="ocean-view">
                <div class="dash-node" onclick="inspectNode('Ocean Waters', 'The Kawm Ocean stretches infinitely into the dark. Glowing waves pulse softly below.')">CHECK WATERS</div>
                <div class="dash-node" onclick="inspectNode('Wooden Boat', 'A weathered wooden vessel. It survived the escape, but the timber is soaked.')">INSPECT BOAT</div>
                <div class="dash-node" onclick="inspectNode('Distant Horizon', 'Faint lights flicker far away... Is it a safe shelter, or another anomaly?')">SCAN HORIZON</div>
            </div>

            <div class="dialogue-box">
                <div class="portrait-frame">
                    <svg id="portraitSVG" class="portrait-svg" viewBox="0 0 100 100">
                        <!-- Dynamic SVG rendered via JS -->
                    </svg>
                    <div id="portraitLabel" class="portrait-label">MOE</div>
                </div>
                <div class="dialogue-content">
                    <div id="dialogueText" class="dialogue-text">...</div>
                    <div class="prompt-hint">[ SPACE / CLICK TO CONTINUE ]</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* Audio Engine */
        class AudioEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.startOceanSynth();
            }

            playBlip(freq = 400) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.07);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.07);
            }

            playThud() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(90, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(25, this.ctx.currentTime + 0.35);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }

            startOceanSynth() {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 2;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                const whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(450, this.ctx.currentTime);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.02, this.ctx.currentTime);

                whiteNoise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                whiteNoise.start();
            }
        }

        /* Particle System - Sea Mist & Rain */
        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.initParticles();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            initParticles() {
                this.particles = [];
                for (let i = 0; i < 80; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        length: Math.random() * 15 + 8,
                        speed: Math.random() * 8 + 4,
                        opacity: Math.random() * 0.5 + 0.2
                    });
                }
            }

            render() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.strokeStyle = 'rgba(180, 210, 245, 0.3)';
                this.ctx.lineWidth = 1.2;

                this.particles.forEach(p => {
                    this.ctx.beginPath();
                    this.ctx.moveTo(p.x, p.y);
                    this.ctx.lineTo(p.x - 2, p.y + p.length);
                    this.ctx.stroke();

                    p.y += p.speed;
                    p.x -= 1;

                    if (p.y > this.canvas.height) {
                        p.y = -p.length;
                        p.x = Math.random() * this.canvas.width;
                    }
                });

                requestAnimationFrame(() => this.render());
            }
        }

        /* Kawmling Vector SVG Portraits */
        const portraits = {
            MOE: `
                <!-- Head -->
                <circle cx="50" cy="50" r="28" fill="#ffffff" stroke="#000000" stroke-width="3"/>
                <!-- Durag -->
                <path d="M 22,48 Q 50,18 78,48 Q 50,38 22,48 Z" fill="#111116"/>
                <path d="M 75,45 Q 88,52 85,68" stroke="#111116" stroke-width="4" fill="none"/>
                <!-- Big Bold Eyebrows -->
                <path d="M 30,48 L 44,53" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
                <path d="M 56,53 L 70,48" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
                <!-- Eyes -->
                <circle cx="37" cy="59" r="3" fill="#000000"/>
                <circle cx="63" cy="59" r="3" fill="#000000"/>
            `,
            MCCRACK: `
                <!-- Head -->
                <circle cx="50" cy="52" r="28" fill="#ffffff" stroke="#000000" stroke-width="3"/>
                <!-- Paper Boat Hat -->
                <polygon points="15,42 50,12 85,42 68,42 50,28 32,42" fill="#ffffff" stroke="#000000" stroke-width="3"/>
                <line x1="50" y1="12" x2="50" y2="42" stroke="#000000" stroke-width="2"/>
                <!-- Expressive Eyebrows -->
                <path d="M 28,48 Q 36,42 44,50" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
                <path d="M 56,50 Q 64,42 72,48" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
                <!-- Eyes -->
                <circle cx="36" cy="58" r="3" fill="#000000"/>
                <circle cx="64" cy="58" r="3" fill="#000000"/>
            `,
            SYS: `
                <rect x="20" y="20" width="60" height="60" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="4"/>
                <text x="50" y="58" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">?</text>
            `
        };

        const audio = new AudioEngine();
        let particles;
        let currentStep = 0;
        let isTyping = false;

        const introSequences = [
            "Our home village fell in a single night...",
            "Smoke covered the sky as we reached the shore.",
            "Two Kawmlings, one small wooden boat, and the endless Kawm Ocean ahead.",
            "We drifted into the dark, searching for shelter... or anything left standing."
        ];

        const boatDialogue = [
            { speaker: "MCCRACK", text: "Moe... do you think anyone else made it out of the village?" },
            { speaker: "MOE", text: "I don't know, McCrack. But as long as this boat floats, we keep moving." },
            { speaker: "MCCRACK", text: "Look at the horizon. There's a faint light out there... maybe it's a safe shelter." },
            { speaker: "MOE", text: "Keep your guard up. Check the waters and horizon before we pull closer." }
        ];

        let dialogueIndex = 0;

        function initializeEngine() {
            document.getElementById('startOverlay').style.display = 'none';
            audio.init();
            particles = new ParticleSystem(document.getElementById('fxCanvas'));
            particles.render();
            playIntroSequence();
        }

        function triggerShake() {
            const vp = document.getElementById('viewport');
            vp.classList.add('shake');
            setTimeout(() => vp.classList.remove('shake'), 250);
        }

        function playIntroSequence() {
            if (currentStep < introSequences.length) {
                const textEl = document.getElementById('cinematicText');
                textEl.classList.remove('visible');

                setTimeout(() => {
                    textEl.innerText = introSequences[currentStep];
                    textEl.classList.add('visible');
                    audio.playThud();
                    triggerShake();
                    currentStep++;
                    setTimeout(playIntroSequence, 4200);
                }, 1000);
            } else {
                transitionToBoatScene();
            }
        }

        function transitionToBoatScene() {
            const textEl = document.getElementById('cinematicText');
            textEl.classList.remove('visible');

            setTimeout(() => {
                document.getElementById('stage').style.display = 'none';
                const boatScene = document.getElementById('boatScene');
                boatScene.classList.add('active');
                advanceDialogue();
            }, 1500);
        }

        function typeText(targetEl, text, speed = 30, callback) {
            isTyping = true;
            targetEl.innerText = "";
            let i = 0;

            const timer = setInterval(() => {
                if (i < text.length) {
                    targetEl.innerText += text.charAt(i);
                    if (i % 2 === 0) audio.playBlip(300 + (i * 6) % 120);
                    i++;
                } else {
                    clearInterval(timer);
                    isTyping = false;
                    if (callback) callback();
                }
            }, speed);
        }

        function updatePortrait(speakerKey) {
            const svgEl = document.getElementById('portraitSVG');
            const labelEl = document.getElementById('portraitLabel');
            svgEl.innerHTML = portraits[speakerKey] || portraits.SYS;
            labelEl.innerText = speakerKey;
        }

        function advanceDialogue() {
            if (isTyping) return;

            if (dialogueIndex < boatDialogue.length) {
                const line = boatDialogue[dialogueIndex];
                updatePortrait(line.speaker);
                typeText(document.getElementById('dialogueText'), line.text);
                dialogueIndex++;
            } else {
                updatePortrait('SYS');
                document.getElementById('dialogueText').innerText = "[ Interactive Mode Active. Inspect points around the boat. ]";
            }
        }

        function inspectNode(title, detailText) {
            if (isTyping) return;
            audio.playThud();
            triggerShake();
            updatePortrait('SYS');
            typeText(document.getElementById('dialogueText'), `[${title}]: ${detailText}`);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.getElementById('boatScene').classList.contains('active')) {
                advanceDialogue();
            }
        });

        document.getElementById('boatScene').addEventListener('click', (e) => {
            if (!e.target.classList.contains('dash-node')) {
                advanceDialogue();
            }
        });
    </script>
</body>
</html>
