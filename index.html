<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE UNPUBLISHED ZERO // THE CUTTING ROOM FLOOR</title>
    <style>
        :root {
            --bg: #0d0e12; /* Dark paper feel */
            --paper-texture: #fafafa; /* Lighter sketch paper */
            --cyan: #00f3ff; /* Corrupted correction fluid glow */
            --amber: #ffaa00; /* Discarded text color */
            --purple: #bc13fe; /* Inkwell residue */
            --text-color: #f8fafc;
            --font: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-color: var(--bg); color: var(--text-color);
            font-family: var(--font);
            display: flex; justify-content: center; align-items: center;
        }

        .viewport {
            width: 100vw; height: 100vh; max-width: 1000px; max-height: 650px;
            position: relative;
            background: #000;
            border: 2px solid #1e293b;
            box-shadow: 0 0 40px rgba(0,0,0,1);
            display: flex; flex-direction: column; overflow: hidden;
        }

        canvas#mainCanvas { width: 100%; height: 100%; display: block; }

        /* DIALOGUE BOX (Deltarune / OneShot Inspired) */
        .dialogue-box {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 88%; height: 135px;
            background: rgba(4, 6, 12, 0.98);
            border: 3px solid var(--text-color);
            border-radius: 6px;
            padding: 12px 16px;
            display: none; /* Managed by JS */
            gap: 16px; align-items: center;
            z-index: 10;
        }

        .portrait-container {
            width: 90px; height: 90px;
            border: 2px solid var(--text-color);
            background: #000;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }

        canvas#portraitCanvas { width: 80px; height: 80px; }

        .dialogue-content {
            display: flex; flex-direction: column; justify-content: space-between;
            height: 100%; flex: 1;
        }

        .speaker-name {
            font-size: 0.9rem; font-weight: bold;
            color: var(--cyan); letter-spacing: 2px;
            text-transform: uppercase;
        }

        .dialogue-text {
            font-size: 1.05rem; line-height: 1.4; color: #fff;
            height: 55px;
        }

        .prompt-next {
            font-size: 0.75rem; color: var(--amber);
            align-self: flex-end;
            animation: blink 0.8s infinite alternate;
        }

        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

        /* GAME HUD */
        .game-hud {
            position: absolute; top: 15px; left: 20px;
            display: none; flex-direction: column; gap: 6px; z-index: 10;
        }

        .hud-title {
            font-size: 0.8rem; color: var(--text-color);
            font-weight: bold; letter-spacing: 1.5px;
        }

        .hud-location {
            font-size: 0.7rem; color: var(--text-color); opacity: 0.7;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="viewport">
        <canvas id="mainCanvas"></canvas>

        <!-- DELTARUNE / ONESHOT STYLE DIALOGUE BOX -->
        <div class="dialogue-box" id="dialogueBox">
            <div class="portrait-container">
                <canvas id="portraitCanvas" width="80" height="80"></canvas>
            </div>
            <div class="dialogue-content">
                <div class="speaker-name" id="speakerName">...</div>
                <div class="dialogue-text" id="dialogueText">...</div>
                <div class="prompt-next">[PRESS ENTER / SPACE]</div>
            </div>
        </div>

        <!-- HUD FOR 2.5D OVERWORLD -->
        <div class="game-hud" id="gameHud">
            <div class="hud-title">THE UNPUBLISHED ZERO // THE CURSOR'S WAKE</div>
            <div class="hud-location">LOCATION: SECTOR 0 (THE CUTTING ROOM FLOOR)</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const pCanvas = document.getElementById('portraitCanvas');
        const pCtx = pCanvas.getContext('2d');

        const dialogueBox = document.getElementById('dialogueBox');
        const speakerName = document.getElementById('speakerName');
        const dialogueText = document.getElementById('dialogueText');
        const gameHud = document.getElementById('gameHud');

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game States: 'INTRO_CINEMATIC', 'DIALOGUE_CINEMATIC', 'PLAYING_RPG'
        let gameState = 'INTRO_CINEMATIC';

        // --- CONCEPT: THE INK & THE CURSOR ---
        // LORE: Orb-68 is a self-aware ink blot in an unpublished, rotting novel draft.

        const introSlides = [
            {
                text: "IN THE ABANDONED DRAFTS OF SECTOR ZERO...",
                sub: "A world built from unfinished stories is slowly erased.",
                visual: "ROTTING_DRAFT"
            },
            {
                text: "THIS REALITY WAS NEVER PUBLISHED.",
                sub: "A single corrections blot has achieved self-awareness.",
                visual: "CORRECTION_BLOT"
            },
            {
                text: "ORB-68... THE INK BLOT THAT WOKE UP IN CHAPTER 0.",
                sub: "It is the last chance for the forgotten characters.",
                visual: "ORB_BLOT"
            }
        ];

        let currentIntroSlide = 0;
        let slideAlpha = 0;
        let slideTimer = 0;

        // --- DIALOGUE SEQUENCE DATA ---
        const dialogueSequence = [
            {
                speaker: "Orb-68",
                color: "#00f3ff",
                mood: "orb_happy",
                text: "* (My reality is just wet ink on rough paper?) "
            },
            {
                speaker: "Orb-68",
                color: "#00f3ff",
                mood: "orb_surprised",
                text: "* (And Vektor... he's just a scribble with a tattered hat?)"
            },
            {
                speaker: "Vektor",
                color: "#ffaa00",
                mood: "vektor_normal",
                text: "Adjusting my pencil-sketch trench coat. You got a problem with the artist's unrefined style, blot?"
            },
            {
                speaker: "Orb-68",
                color: "#00f3ff",
                mood: "orb_happy",
                text: "* (No! It's mesmerizing. Where do I go first, Vektor?)"
            },
            {
                speaker: "Vektor",
                color: "#ffaa00",
                mood: "vektor_hat",
                text: "You can't go anywhere. Use WASD to navigate this messy isometric 'Cutting Room Floor' first."
            },
            {
                speaker: "Orb-68",
                color: "#00f3ff",
                mood: "orb_determined",
                text: "* (Understood! The ink is moving.)"
            }
        ];

        let dialogueIndex = 0;
        let typewriterText = "";
        let typewriterTarget = "";
        let typewriterCharIdx = 0;

        // --- 2.5D RPG ENGINE DATA ---
        const player = {
            x: 500,
            y: 350,
            speed: 3.0,
            radius: 16,
            grounded: false,
            animTimer: 0
        };

        const keys = {};

        // Sketched World Objects
        const worldObjects = [
            { x: 350, y: 250, type: 'inkwell', color: '#bc13fe', label: 'ANCIENT INKWELL', talk: "* Inkwell: It smells faintly of unfinished sentences." },
            { x: 650, y: 280, type: 'vektor_npc', color: '#ffaa00', label: 'VEKTOR', talk: "* Vektor: Careful, blot. Step too far and you'll fall into unrendered memory." },
            { x: 500, y: 180, type: 'grammatical_error', color: '#00ff66', label: 'SENTENCE ANOMALY', talk: "* (A cluster of floating grammatical errors has materialized here.)" }
        ];

        let currentInteractObject = null;

        // Key Listeners
        window.addEventListener('keydown', e => {
            keys[e.code] = true;

            if (e.code === 'Space' || e.code === 'Enter') {
                if (gameState === 'INTRO_CINEMATIC') {
                    nextIntroSlide();
                } else if (gameState === 'DIALOGUE_CINEMATIC') {
                    advanceDialogue();
                } else if (gameState === 'PLAYING_RPG') {
                    if (currentInteractObject) {
                        triggerNpcDialogue(currentInteractObject);
                    }
                }
            }
        });

        window.addEventListener('keyup', e => keys[e.code] = false);

        // --- INTRO CINEMATIC LOGIC ---
        function nextIntroSlide() {
            currentIntroSlide++;
            slideAlpha = 0;
            if (currentIntroSlide >= introSlides.length) {
                gameState = 'DIALOGUE_CINEMATIC';
                startDialogueSequence();
            }
        }

        // --- DIALOGUE SYSTEM ---
        function startDialogueSequence() {
            dialogueBox.style.display = 'flex';
            gameHud.style.display = 'none'; // Ensure HUD is off
            dialogueIndex = 0;
            loadDialogueStep();
        }

        function loadDialogueStep() {
            const current = dialogueSequence[dialogueIndex];
            speakerName.innerText = current.speaker.toUpperCase();
            speakerName.style.color = current.color;

            typewriterTarget = current.text;
            typewriterText = "";
            typewriterCharIdx = 0;

            drawPortrait(current.mood);
        }

        function advanceDialogue() {
            // If still typing, finish instantly
            if (typewriterText.length < typewriterTarget.length) {
                typewriterText = typewriterTarget;
                dialogueText.innerText = typewriterText;
                return;
            }

            dialogueIndex++;
            if (dialogueIndex < dialogueSequence.length) {
                loadDialogueStep();
            } else {
                // End Cutscene -> Start RPG Gameplay
                dialogueBox.style.display = 'none';
                gameHud.style.display = 'flex';
                gameState = 'PLAYING_RPG';
            }
        }

        function triggerNpcDialogue(obj) {
            gameState = 'DIALOGUE_CINEMATIC';
            dialogueBox.style.display = 'flex';
            gameHud.style.display = 'none';

            dialogueSequence.length = 0; // Clear cutscene dialogue
            dialogueSequence.push({
                speaker: obj.label,
                color: obj.color,
                mood: obj.type === 'vektor_npc' ? 'vektor_normal' : 'orb_blot_happy',
                text: obj.talk
            });
            dialogueIndex = 0;
            loadDialogueStep();
        }

        // --- PORTRAIT RENDERER (UNDERTALE / INK THEME) ---
        function drawPortrait(mood) {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            pCtx.fillStyle = '#04060c';
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);

            pCtx.save();
            pCtx.translate(40, 40);

            // Redrawing faces for the INK THEME
            if (mood.startsWith('orb_blot')) {
                // Orb-68 Ink Blot Portrait
                pCtx.fillStyle = '#00f3ff'; // Blot color
                pCtx.beginPath();
                pCtx.moveTo(0, -26);
                pCtx.bezierCurveTo(24, -4, 20, 22, 0, 22);
                pCtx.bezierCurveTo(-20, 22, -24, -4, 0, -26);
                pCtx.fill();

                // Eyes & Smudged Smile
                pCtx.fillStyle = '#000';
                pCtx.beginPath();
                if (mood === 'orb_blot_surprised') {
                    pCtx.arc(-6, 2, 4, 0, Math.PI*2); pCtx.arc(6, 2, 4, 0, Math.PI*2); pCtx.fill();
                    pCtx.fillStyle = '#000'; pCtx.beginPath(); pCtx.arc(0, 10, 3, 0, Math.PI*2); pCtx.fill();
                } else {
                    pCtx.arc(-4, 2, 3, 0, Math.PI*2); pCtx.arc(8, 2, 3, 0, Math.PI*2); pCtx.fill();
                    pCtx.strokeStyle = '#000'; pCtx.lineWidth = 1.5;
                    pCtx.beginPath(); pCtx.arc(0, 7, 6, 0, Math.PI); pCtx.stroke();
                }
            }
            else if (mood.startsWith('orb')) {
                // Keep standard droplet design if needed (can remove if preferred)
                pCtx.fillStyle = '#00f3ff';
                pCtx.beginPath(); pCtx.arc(0,0,22,0,Math.PI*2); pCtx.fill();
                pCtx.fillStyle='#000'; pCtx.beginPath(); pCtx.arc(-4,0,3,0,Math.PI*2); pCtx.arc(6,0,3,0,Math.PI*2); pCtx.fill();
            } 
            else if (mood.startsWith('vektor')) {
                // Vektor Humanoid Portrait (Scribbled Style)
                pCtx.fillStyle = '#ffaa00';
                pCtx.fillRect(-12, -10, 24, 24);
                // Eyes & Face
                pCtx.fillStyle = '#000';
                pCtx.fillRect(-7, -4, 4, 5); pCtx.fillRect(3, -4, 4, 5);
                pCtx.fillRect(-5, 6, 10, 2);
                // Sketched Hat Brim and Top
                pCtx.fillStyle = '#1e293b';
                pCtx.fillRect(-20, -14, 40, 5); // Brim
                pCtx.fillRect(-12, -26, 24, 12); // Cap
            }

            pCtx.restore();
        }

        // --- MAIN RENDER & GAME LOOP ---
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'INTRO_CINEMATIC') {
                renderIntroCinematic();
            } 
            else if (gameState === 'DIALOGUE_CINEMATIC' || gameState === 'PLAYING_RPG') {
                renderRPGWorld();

                if (gameState === 'PLAYING_RPG') {
                    updatePlayerPhysics();
                }

                // Update Typewriter Effect
                if (typewriterText.length < typewriterTarget.length) {
                    typewriterCharIdx += 0.55; // Deltarune speed
                    typewriterText = typewriterTarget.substring(0, Math.floor(typewriterCharIdx));
                    dialogueText.innerText = typewriterText;
                }
            }

            requestAnimationFrame(loop);
        }

        // --- INTRO CINEMATIC RENDERER (SKETCH STYLE) ---
        function renderIntroCinematic() {
            slideTimer += 0.02;
            if (slideAlpha < 1) slideAlpha += 0.015;

            const slide = introSlides[currentIntroSlide];

            // Animated Sketched Canvas drawings
            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2 - 40);

            ctx.strokeStyle = `rgba(255, 255, 255, ${slideAlpha * 0.4})`;
            ctx.lineWidth = 1;

            if (slide.visual === 'ROTTING_DRAFT') {
                // Rotting Unfinished Pages drawing
                for(let i=0; i<4; i++) {
                    ctx.rotate(slideTimer * 0.1 + i);
                    ctx.strokeRect(-60, -80, 120, 160);
                }
            } 
            else if (slide.visual === 'CORRECTION_BLOT') {
                // Sentient Corrections Fluid Blot drawing
                ctx.fillStyle = '#00f3ff';
                ctx.beginPath();
                ctx.moveTo(0, -32); ctx.bezierCurveTo(24, -4, 20, 22, 0, 22); ctx.bezierCurveTo(-20, 22, -24, -4, 0, -32);
                ctx.fill();
                ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 15;
            } 
            else if (slide.visual === 'ORB_BLOT') {
                // Redesigned Blot Character waking up
                ctx.fillStyle = '#00f3ff';
                ctx.beginPath(); ctx.arc(0, 0, 30 + Math.sin(slideTimer*3)*3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = `rgba(0, 0, 0, ${slideAlpha})`;
                ctx.beginPath(); ctx.arc(-10, 0, 4, 0, Math.PI*2); ctx.arc(10, 0, 4, 0, Math.PI*2); ctx.fill();
            }

            ctx.restore();

            // Cinematic Subtitles
            ctx.textAlign = 'center';
            ctx.fillStyle = `rgba(255, 255, 255, ${slideAlpha})`;
            ctx.font = 'bold 1.1rem "Courier New", monospace';
            ctx.fillText(slide.text, canvas.width/2, canvas.height - 140);

            ctx.fillStyle = `rgba(100, 116, 139, ${slideAlpha})`;
            ctx.font = '0.85rem monospace';
            ctx.fillText(slide.sub, canvas.width/2, canvas.height - 110);

            ctx.fillStyle = `rgba(255, 170, 0, ${slideAlpha})`;
            ctx.font = '0.75rem "Courier New", monospace';
            ctx.fillText('[PRESS ENTER TO CONTINUE]', canvas.width/2, canvas.height - 50);
        }

        // --- 2.5D RPG WORLD RENDERER (SKETCH & INK THEME) ---
        function renderRPGWorld() {
            // Rough, Unfinished Pencil-Sketch Grid Floor
            const spacing = 35;
            ctx.strokeStyle = 'rgba(250, 250, 250, 0.15)'; // Sketch pencil color
            ctx.lineWidth = 1;

            for (let x = -200; x < canvas.width + 200; x += spacing) {
                ctx.beginPath();
                ctx.moveTo(x, 100);
                ctx.lineTo(x + (x - canvas.width/2) * 0.4, canvas.height); // Iso perspective
                ctx.stroke();
            }

            for (let y = 100; y < canvas.height; y += 28) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw World Objects (Sorted by Y for depth layering)
            const allRenderables = [
                ...worldObjects.map(o => ({ ...o, isPlayer: false })),
                { x: player.x, y: player.y, isPlayer: true }
            ];

            allRenderables.sort((a, b) => a.y - b.y);

            currentInteractObject = null;

            allRenderables.forEach(obj => {
                if (obj.isPlayer) {
                    drawPlayer25D();
                } else {
                    drawWorldObject(obj);

                    // Proximity check
                    const dist = Math.hypot(player.x - obj.x, player.y - obj.y);
                    if (dist < 45) {
                        currentInteractObject = obj;
                        // Prompt tag above object
                        ctx.fillStyle = '#ffaa00';
                        ctx.font = 'bold 0.75rem monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText('[ENTER] INTERACT', obj.x, obj.y - 45);
                    }
                }
            });
        }

        // --- DRAW 2.5D ORB-68 INK BLOT ---
        function drawPlayer25D() {
            const bounce = Math.sin(Date.now() * 0.008) * 3;

            // Simple Ground Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            ctx.ellipse(player.x, player.y + 4, 16, 7, 0, 0, Math.PI*2);
            ctx.fill();

            // Orb-68 Ink Blot (Bouncy liquid physics feel)
            const py = player.y - 12 + bounce;
            ctx.fillStyle = '#00f3ff';
            ctx.beginPath();
            ctx.moveTo(player.x, py - 18);
            ctx.bezierCurveTo(player.x + 16, py - 2, player.x + 18, py + 14, player.x, py + 14);
            ctx.bezierCurveTo(player.x - 18, py + 14, player.x - 16, py - 2, player.x, py - 18);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(player.x - 4, py + 1, 3, 0, Math.PI*2);
            ctx.arc(player.x + 4, py + 1, 3, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(player.x - 3, py + 1, 1.5, 0, Math.PI*2);
            ctx.arc(player.x + 5, py + 1, 1.5, 0, Math.PI*2);
            ctx.fill();
        }

        // --- DRAW ISOMETRIC ENVIRONMENT OBJECTS ---
        function drawWorldObject(obj) {
            // Simple Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            ctx.ellipse(obj.x, obj.y + 4, 18, 8, 0, 0, Math.PI*2);
            ctx.fill();

            ctx.save();
            ctx.translate(obj.x, obj.y);

            if (obj.type === 'inkwell') {
                // Purple Inkwell residude
                ctx.fillStyle = obj.color;
                ctx.fillRect(-12, -20, 24, 20);
                // Glass lip
                ctx.fillStyle = '#000'; ctx.fillRect(-14, -22, 28, 4);
                ctx.shadowColor = obj.color; ctx.shadowBlur = 10;
            } 
            else if (obj.type === 'vektor_npc') {
                // Vektor standing (Scribbled Humanoid)
                ctx.fillStyle = obj.color;
                ctx.fillRect(-6, -20, 12, 20);
                // Hat
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(-12, -24, 24, 4); // Brim
                ctx.fillRect(-7, -32, 14, 8); // Top
            } 
            else if (obj.type === 'grammatical_error') {
                // Grammatical Error Anomaly drawing
                ctx.strokeStyle = obj.color;
                ctx.lineWidth = 1;
                ctx.font = 'bold 1rem "Courier New"';
                ctx.textAlign = 'center';
                ctx.strokeText("Grammar!", 0, Math.sin(Date.now()*0.005)*8 - 15);
                ctx.strokeRect(-10, Math.sin(Date.now()*0.005)*8 - 30, 20, 20);
            }

            ctx.restore();
        }

        // --- RPG PLAYER PHYSICS ---
        function updatePlayerPhysics() {
            player.vx = 0; player.vy = 0;

            if (keys['KeyA'] || keys['ArrowLeft']) player.vx = -player.speed;
            if (keys['KeyD'] || keys['ArrowRight']) player.vx = player.speed;
            if (keys['KeyW'] || keys['ArrowUp']) player.vy = -player.speed * 0.75; // Iso perspective dampening
            if (keys['KeyS'] || keys['ArrowDown']) player.vy = player.speed * 0.75;

            player.x += player.vx; player.y += player.vy;

            // Boundaries
            if (player.x < 40) player.x = 40;
            if (player.x > canvas.width - 40) player.x = canvas.width - 40;
            if (player.y < 120) player.y = 120;
            if (player.y > canvas.height - 40) player.y = canvas.height - 40;
        }

        loop();
    </script>
</body>
</html>
