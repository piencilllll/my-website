<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS1 3D Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030305;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #viewport {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.15);
            border: 2px solid #222;
            background: #000;
        }

        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 16px;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 2px 2px #ff0055;
            z-index: 10;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            pointer-events: auto;
            z-index: 20;
        }

        h1 {
            font-size: 40px;
            letter-spacing: 3px;
            color: #00f0ff;
            margin-bottom: 12px;
            text-shadow: 3px 3px #ff0055;
        }

        p {
            color: #8a8aa0;
            margin-bottom: 24px;
            line-height: 1.6;
            font-size: 14px;
        }

        button {
            background: #00f0ff;
            border: none;
            color: #000;
            padding: 14px 32px;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px #ff0055;
            transition: transform 0.1s;
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #ff0055;
        }

        .hidden {
            display: none !important;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
        }
    </style>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="viewport">
    <div class="scanlines"></div>

    <div class="hud">
        <div>CRYSTALS: <span id="gems">0</span> / 5</div>
        <div>LIVES: <span id="lives">3</span></div>
    </div>

    <div id="start-screen" class="overlay">
        <h1>NEO_HOPPER 64</h1>
        <p>PS1-Style 3D Platformer<br>WASD: Walk | SPACE: Jump (Hold for higher hop)<br>MOUSE: Orbit Camera</p>
        <button id="start-btn">START GAME</button>
    </div>

    <div id="game-over" class="overlay hidden">
        <h1 id="end-title" style="color: #ff0055; text-shadow: 3px 3px #00f0ff;">SYSTEM VOID</h1>
        <p id="end-msg">You fell into the abyss.</p>
        <button id="restart-btn">RETRY LEVEL</button>
    </div>
</div>

<script>
// --- Game Setup ---
let scene, camera, renderer;
let player, playerBox;
let platforms = [];
let gems = [];
let particles = [];
let gemCount = 0;
let lives = 3;
let isRunning = false;

// Physics / Movement
const velocity = new THREE.Vector3();
let isGrounded = false;
const GRAVITY = -0.015;
const JUMP_FORCE = 0.32;
const SPEED = 0.12;

// Controls
const keys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false, Space: false };
let cameraAngle = 0;
let isMouseDown = false;
let previousMouseX = 0;

// UI Elements
const gemsEl = document.getElementById('gems');
const livesEl = document.getElementById('lives');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over');
const endTitle = document.getElementById('end-title');
const endMsg = document.getElementById('end-msg');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const viewport = document.getElementById('viewport');

// Low PS1 Render Resolution
const RENDER_W = 320;
const RENDER_H = 240;

function initEngine() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05020a);
    scene.fog = new THREE.FogExp2(0x05020a, 0.025);

    camera = new THREE.PerspectiveCamera(65, RENDER_W / RENDER_H, 0.1, 100);

    renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(RENDER_W, RENDER_H);
    viewport.appendChild(renderer.domElement);

    // Retro Lighting Setup
    const ambientLight = new THREE.AmbientLight(0x443366);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x00f0ff, 0.9);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);

    setupControls();
    buildLevel();
    createPlayer();
}

function createPlayer() {
    // Low-poly character (PS1 style mascot build)
    const group = new THREE.Group();

    // Body
    const bodyGeo = new THREE.BoxGeometry(0.8, 0.9, 0.8);
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x00f0ff, flatShading: true });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.45;
    group.add(body);

    // Head
    const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
    const headMat = new THREE.MeshLambertMaterial({ color: 0xff0055, flatShading: true });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.1;
    group.add(head);

    // Eyes
    const eyeGeo = new THREE.BoxGeometry(0.15, 0.15, 0.1);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(-0.18, 1.15, 0.3);
    const eyeR = eyeL.clone();
    eyeR.position.x = 0.18;
    group.add(eyeL);
    group.add(eyeR);

    player = group;
    scene.add(player);

    playerBox = new THREE.Box3();
}

function buildLevel() {
    // Clear old elements
    platforms.forEach(p => scene.remove(p));
    gems.forEach(g => scene.remove(g));
    platforms = [];
    gems = [];

    // Platform layout configuration [x, y, z, width, depth]
    const platformData = [
        [0, 0, 0, 6, 6],           // Spawn platform
        [0, 1, -8, 4, 4],          // Step 1
        [6, 2.5, -12, 4, 4],       // Step 2
        [12, 4, -8, 5, 5],         // Middle hub
        [12, 6, 0, 4, 4],          // High platform
        [5, 7.5, 4, 4, 4],         // Peak path 1
        [-2, 9, 0, 5, 5],          // Peak hub
        [-10, 11, -5, 6, 6]        // Goal island
    ];

    const platMat = new THREE.MeshLambertMaterial({ color: 0x221133, flatShading: true });
    const topMat = new THREE.MeshLambertMaterial({ color: 0x338899, flatShading: true });

    platformData.forEach(([x, y, z, w, d]) => {
        const platGroup = new THREE.Group();

        // Base block
        const geo = new THREE.BoxGeometry(w, 2, d);
        const mesh = new THREE.Mesh(geo, platMat);
        mesh.position.y = -1;
        platGroup.add(mesh);

        // Top surface trim
        const topGeo = new THREE.BoxGeometry(w, 0.1, d);
        const topMesh = new THREE.Mesh(topGeo, topMat);
        topMesh.position.y = 0.05;
        platGroup.add(topMesh);

        platGroup.position.set(x, y, z);
        platGroup.userData = { bounds: new THREE.Box3().setFromObject(platGroup) };

        platforms.push(platGroup);
        scene.add(platGroup);
    });

    // Gem positions
    const gemData = [
        [0, 2, -8],
        [6, 3.5, -12],
        [12, 7.5, 0],
        [-2, 10.5, 0],
        [-10, 12.5, -5] // Final gem
    ];

    const gemGeo = new THREE.OctahedronGeometry(0.5, 0);
    const gemMat = new THREE.MeshLambertMaterial({ color: 0xff0055, emissive: 0x660022, flatShading: true });

    gemData.forEach(([x, y, z]) => {
        const gem = new THREE.Mesh(gemGeo, gemMat);
        gem.position.set(x, y, z);
        gems.push(gem);
        scene.add(gem);
    });
}

function setupControls() {
    window.addEventListener('keydown', (e) => {
        if (e.code in keys) keys[e.code] = true;
    });

    window.addEventListener('keyup', (e) => {
        if (e.code in keys) keys[e.code] = false;
    });

    // Mouse Orbit Controls for Camera
    viewport.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        previousMouseX = e.clientX;
    });

    window.addEventListener('mouseup', () => { isMouseDown = false; });

    window.addEventListener('mousemove', (e) => {
        if (isMouseDown) {
            const delta = e.clientX - previousMouseX;
            cameraAngle -= delta * 0.008;
            previousMouseX = e.clientX;
        }
    });
}

function createParticles(pos, color = 0xff0055) {
    for (let i = 0; i < 10; i++) {
        const geo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
        const mat = new THREE.MeshBasicMaterial({ color: color });
        const p = new THREE.Mesh(geo, mat);
        p.position.copy(pos);

        p.userData = {
            vel: new THREE.Vector3(
                (Math.random() - 0.5) * 0.2,
                Math.random() * 0.2,
                (Math.random() - 0.5) * 0.2
            ),
            life: 25
        };

        particles.push(p);
        scene.add(p);
    }
}

function updatePhysics() {
    if (!isRunning) return;

    // Movement relative to camera perspective
    const inputDir = new THREE.Vector3();
    if (keys.KeyW) inputDir.z -= 1;
    if (keys.KeyS) inputDir.z += 1;
    if (keys.KeyA) inputDir.x -= 1;
    if (keys.KeyD) inputDir.x += 1;

    inputDir.normalize();

    // Rotate input vector relative to orbit camera angle
    const moveDir = inputDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraAngle);

    velocity.x = moveDir.x * SPEED;
    velocity.z = moveDir.z * SPEED;

    // Jumping
    if (keys.Space && isGrounded) {
        velocity.y = JUMP_FORCE;
        isGrounded = false;
        createParticles(player.position, 0x00f0ff);
    }

    // Apply gravity
    velocity.y += GRAVITY;

    // Move player
    player.position.x += velocity.x;
    player.position.y += velocity.y;
    player.position.z += velocity.z;

    // Rotate player mesh toward move direction
    if (inputDir.length() > 0) {
        const targetRot = Math.atan2(moveDir.x, moveDir.z);
        player.rotation.y = targetRot;
    }

    // Ground & Platform Collision
    playerBox.setFromObject(player);
    isGrounded = false;

    platforms.forEach(plat => {
        const box = plat.userData.bounds;
        
        // Simple bounding box platform detection
        if (player.position.x >= box.min.x && player.position.x <= box.max.x &&
            player.position.z >= box.min.z && player.position.z <= box.max.z) {
            
            const platTop = box.max.y;
            // Landing check
            if (player.position.y <= platTop && player.position.y >= platTop - 0.4 && velocity.y <= 0) {
                player.position.y = platTop;
                velocity.y = 0;
                isGrounded = true;
            }
        }
    });

    // Collect Gem Collision
    for (let i = gems.length - 1; i >= 0; i--) {
        const gem = gems[i];
        gem.rotation.y += 0.05;

        if (player.position.distanceTo(gem.position) < 1.2) {
            createParticles(gem.position, 0xff0055);
            scene.remove(gem);
            gems.splice(i, 1);
            gemCount++;
            gemsEl.textContent = gemCount;

            if (gemCount >= 5) {
                victory();
            }
        }
    }

    // Particle Updates
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.position.add(p.userData.vel);
        p.userData.life--;
        if (p.userData.life <= 0) {
            scene.remove(p);
            particles.splice(i, 1);
        }
    }

    // Abyss Fall Check
    if (player.position.y < -12) {
        respawnPlayer();
    }

    // Orbit Camera Position
    const camDist = 9;
    const camHeight = 4.5;
    camera.position.x = player.position.x + Math.sin(cameraAngle) * camDist;
    camera.position.z = player.position.z + Math.cos(cameraAngle) * camDist;
    camera.position.y = player.position.y + camHeight;
    camera.lookAt(player.position.x, player.position.y + 0.8, player.position.z);
}

function respawnPlayer() {
    lives--;
    livesEl.textContent = lives;
    createParticles(player.position, 0xff0055);

    if (lives <= 0) {
        endGame(false);
    } else {
        player.position.set(0, 2, 0);
        velocity.set(0, 0, 0);
    }
}

function endGame(won) {
    isRunning = false;
    if (won) {
        endTitle.textContent = "LEVEL CLEARED!";
        endTitle.style.color = "#00f0ff";
        endMsg.textContent = "All 5 crystals recovered successfully.";
    } else {
        endTitle.textContent = "SYSTEM VOID";
        endTitle.style.color = "#ff0055";
        endMsg.textContent = "Out of lives. You fell into the abyss.";
    }
    gameOverScreen.classList.remove('hidden');
}

function victory() {
    endGame(true);
}

function animate() {
    requestAnimationFrame(animate);
    updatePhysics();
    renderer.render(scene, camera);
}

function startGame() {
    gemCount = 0;
    lives = 3;
    gemsEl.textContent = gemCount;
    livesEl.textContent = lives;

    player.position.set(0, 2, 0);
    velocity.set(0, 0, 0);
    cameraAngle = 0;

    buildLevel();

    isRunning = true;
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
}

// System Launch
initEngine();
animate();

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);
</script>
</body>
</html>
