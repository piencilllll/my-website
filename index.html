<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink & The Cursor - Chapter 0 Engine</title>
    <style>
        :root {
            --bg-dark: #08080a;
            --text-main: #e0e0e0;
            --accent-glow: #ffffff;
            --ui-border: #ffffff;
            --ink-black: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Screen Canvas & CRT Overlay */
        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        canvas#fxCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 6px 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* Screen Shake Class */
        .shake {
            animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Narrative Stage Container */
        #stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        /* Cinematic Text Layout */
        .cinematic-text {
            font-size: 1.4rem;
            line-height: 2rem;
            max-width: 800px;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 8px rgba(255,255,255,0.6);
            opacity: 0;
            transition: opacity 1s ease;
        }

        .cinematic-text.visible {
            opacity: 1;
        }

        /* Car Scene HUD & Dialogue Layout */
        .car-scene {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .car-scene.active {
            opacity: 1;
        }

        .dashboard {
            width: 90%;
            height: 60%;
            border: 2px solid #333;
            background: radial-gradient(circle at 50% 120%, #1a1a24 0%, #050508 80%);
            border-radius: 12px;
            position: relative;
            box-shadow: inset 0 0 50px #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .dash-node {
            width: 120px;
            height: 120px;
            border: 2px dashed #444;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #666;
            cursor: pointer;
            transition: 0.3s;
        }

        .dash-node:hover {
            border-color: #fff;
            color: #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        /* Undertale Style Dialogue Box */
        .dialogue-box {
            width: 90%;
            max-width: 900px;
            height: 180px;
            background: var(--ink-black);
            border: 4px solid var(--ui-border);
            border-radius: 4px;
            padding: 20px;
            display: flex;
            gap: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            z-index: 5;
        }

        .portrait {
            width: 130px;
            height: 130px;
            border: 2px solid #fff;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .dialogue-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dialogue-text {
            font-size: 1.2rem;
            line-height: 1.6rem;
            color: #fff;
        }

        .prompt-hint {
            align-self: flex-end;
            font-size: 0.8rem;
            color: #888;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Start Overlay */
        #startOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #startOverlay h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        #startOverlay p {
            color: #666;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <canvas id="fxCanvas"></canvas>
        <div class="crt-overlay"></div>

        <div id="startOverlay" onclick="initializeEngine()">
            <h1>Ink & The Cursor</h1>
            <p>[ Click anywhere to initialize sequence ]</p>
        </div>

        <div id="stage">
            <div id="cinematicText" class="cinematic-text"></div>
        </div>

        <div id="carScene" class="car-scene">
            <div class="dashboard">
                <div class="dash-node" onclick="inspectNode('Rain Sensor', 'Precipitation rate: 84%. Unmapped atmospheric density detected.')">SCAN RAIN</div>
                <div class="dash-node" onclick="inspectNode('Draft Core', 'Orb-68 core stability: 91%. Ink viscosity holding.')">CORE STATUS</div>
                <div class="dash-node" onclick="inspectNode('Navigation', 'Destination: [DELETED]. Route recalculated continuously.')">NAV GRID</div>
            </div>

            <div class="dialogue-box">
                <div id="portrait" class="portrait">ORB-68</div>
                <div class="dialogue-content">
                    <div id="dialogueText" class="dialogue-text">...</div>
                    <div class="prompt-hint">[ SPACE / CLICK TO CONTINUE ]</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* Audio Engine */
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
            }

            init() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.startRainSynth();
            }

            playBlip(freq = 440, type = 'sine') {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playThud() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            startRainSynth() {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 2;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                const whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, this.ctx.currentTime);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.015, this.ctx.currentTime);

                whiteNoise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                whiteNoise.start();
            }
        }

        /* Particle System */
        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.initParticles();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            initParticles() {
                this.particles = [];
                for (let i = 0; i < 70; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        length: Math.random() * 20 + 10,
                        speed: Math.random() * 10 + 5,
                        opacity: Math.random() * 0.4 + 0.1
                    });
                }
            }

            render() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.strokeStyle = 'rgba(200, 220, 255, 0.3)';
                this.ctx.lineWidth = 1;

                this.particles.forEach(p => {
                    this.ctx.beginPath();
                    this.ctx.moveTo(p.x, p.y);
                    this.ctx.lineTo(p.x - 1, p.y + p.length);
                    this.ctx.stroke();

                    p.y += p.speed;
                    p.x -= 0.5;

                    if (p.y > this.canvas.height) {
                        p.y = -p.length;
                        p.x = Math.random() * this.canvas.width;
                    }
                });

                requestAnimationFrame(() => this.render());
            }
        }

        /* Narrative Engine State */
        const audio = new AudioEngine();
        let particles;
        let currentStep = 0;
        let isTyping = false;

        const introSequences = [
            "We were built in the margins of a story that was never meant to be published.",
            "A draft left behind in the dark, gathering dust between deleted lines.",
            "I am Orb-68. An ink blot that acquired a pulse.",
            "Beside me is Vektor. A protagonist who outlived his plot."
        ];

        const carDialogue = [
            { speaker: "ORB-68", text: "The rain outside... it's not water, Vektor. It's unwritten manuscript lines washing out." },
            { speaker: "VEKTOR", text: "Let it wash. As long as this engine runs, we're not bound to their margins anymore." },
            { speaker: "ORB-68", text: "Check the Nav Grid. If the next zone renders, we have a way forward." }
        ];

        let dialogueIndex = 0;

        function initializeEngine() {
            document.getElementById('startOverlay').style.display = 'none';
            audio.init();
            particles = new ParticleSystem(document.getElementById('fxCanvas'));
            particles.render();
            playIntroSequence();
        }

        function triggerShake() {
            const vp = document.getElementById('viewport');
            vp.classList.add('shake');
            setTimeout(() => vp.classList.remove('shake'), 200);
        }

        function playIntroSequence() {
            if (currentStep < introSequences.length) {
                const textEl = document.getElementById('cinematicText');
                textEl.classList.remove('visible');

                setTimeout(() => {
                    textEl.innerText = introSequences[currentStep];
                    textEl.classList.add('visible');
                    audio.playThud();
                    triggerShake();
                    currentStep++;
                    setTimeout(playIntroSequence, 4000);
                }, 1000);
            } else {
                transitionToCarScene();
            }
        }

        function transitionToCarScene() {
            const textEl = document.getElementById('cinematicText');
            textEl.classList.remove('visible');

            setTimeout(() => {
                document.getElementById('stage').style.display = 'none';
                const carScene = document.getElementById('carScene');
                carScene.classList.add('active');
                advanceDialogue();
            }, 1500);
        }

        function typeText(targetEl, text, speed = 30, callback) {
            isTyping = true;
            targetEl.innerText = "";
            let i = 0;

            const timer = setInterval(() => {
                if (i < text.length) {
                    targetEl.innerText += text.charAt(i);
                    if (i % 2 === 0) audio.playBlip(320 + (i * 5) % 100, 'sine');
                    i++;
                } else {
                    clearInterval(timer);
                    isTyping = false;
                    if (callback) callback();
                }
            }, speed);
        }

        function advanceDialogue() {
            if (isTyping) return;

            if (dialogueIndex < carDialogue.length) {
                const line = carDialogue[dialogueIndex];
                document.getElementById('portrait').innerText = line.speaker;
                typeText(document.getElementById('dialogueText'), line.text);
                dialogueIndex++;
            } else {
                document.getElementById('dialogueText').innerText = "[ Interactive Mode Active. Scan Dashboard Nodes. ]";
            }
        }

        function inspectNode(title, detailText) {
            if (isTyping) return;
            audio.playThud();
            triggerShake();
            document.getElementById('portrait').innerText = "SYS";
            typeText(document.getElementById('dialogueText'), `[${title}]: ${detailText}`);
        }

        /* Keyboard Listener */
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.getElementById('carScene').classList.contains('active')) {
                advanceDialogue();
            }
        });

        /* Click Listener for Dialogue */
        document.getElementById('carScene').addEventListener('click', (e) => {
            if (!e.target.classList.contains('dash-node')) {
                advanceDialogue();
            }
        });
    </script>
</body>
</html>
