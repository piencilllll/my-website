<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSX Cyber Core 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030305;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #viewport {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.15);
            border: 2px solid #222;
            background: #000;
        }

        /* Pixelated canvas container */
        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 16px;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 2px 2px #ff0055;
            z-index: 10;
        }

        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }

        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background: #00f0ff;
            box-shadow: 0 0 4px #00f0ff;
        }

        .crosshair::before { top: 3px; left: 0; width: 8px; height: 2px; }
        .crosshair::after { top: 0; left: 3px; width: 2px; height: 8px; }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            pointer-events: auto;
            z-index: 20;
        }

        h1 {
            font-size: 44px;
            letter-spacing: 3px;
            color: #00f0ff;
            margin-bottom: 12px;
            text-shadow: 3px 3px #ff0055;
        }

        p {
            color: #8a8aa0;
            margin-bottom: 24px;
            line-height: 1.6;
            font-size: 14px;
        }

        button {
            background: #00f0ff;
            border: none;
            color: #000;
            padding: 14px 32px;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px #ff0055;
            transition: transform 0.1s;
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #ff0055;
        }

        .hidden {
            display: none !important;
        }

        /* Reticle effect overlay */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
        }
    </style>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="viewport">
    <div class="scanlines"></div>
    <div class="crosshair"></div>

    <div class="hud">
        <div>CORE INTEGRITY: <span id="hp">100</span>%</div>
        <div>DATA PURGED: <span id="score">0</span></div>
    </div>

    <div id="start-screen" class="overlay">
        <h1>CYBER_CORE 1998</h1>
        <p>PS1-Style 3D Polygon Arena<br>WASD: Walk | MOUSE: Aim | CLICK: Fire Pulse</p>
        <button id="start-btn">INITIALIZE SYSTEM</button>
    </div>

    <div id="game-over" class="overlay hidden">
        <h1 style="color: #ff0055; text-shadow: 3px 3px #00f0ff;">FATAL ERROR</h1>
        <p>Entities Cleared: <span id="final-score">0</span></p>
        <button id="restart-btn">REBOOT SYSTEM</button>
    </div>
</div>

<script>
// --- Game Engine Variables ---
let scene, camera, renderer;
let player, controls;
let targets = [];
let projectiles = [];
let particles = [];
let hp = 100;
let score = 0;
let isRunning = false;

// Controls tracking
const keys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false };
let isLocked = false;

// UI Elements
const hpEl = document.getElementById('hp');
const scoreEl = document.getElementById('score');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const finalScoreEl = document.getElementById('final-score');
const viewport = document.getElementById('viewport');

// Low-resolution 3D rendering setup (320x240 for genuine PS1 pixel vibe)
const RENDER_W = 320;
const RENDER_H = 240;

function initEngine() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030308);
    scene.fog = new THREE.FogExp2(0x030308, 0.04);

    camera = new THREE.PerspectiveCamera(70, RENDER_W / RENDER_H, 0.1, 100);
    
    renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(RENDER_W, RENDER_H);
    viewport.appendChild(renderer.domElement);

    // Flat low-poly lighting setup
    const ambientLight = new THREE.AmbientLight(0x333355);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x00f0ff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    buildArena();
    setupControls();
}

// Low-poly Arena Builder
function buildArena() {
    // Flat flat-shaded checkerboard floor
    const floorGeo = new THREE.PlaneGeometry(60, 60, 20, 20);
    const floorMat = new THREE.MeshLambertMaterial({ 
        color: 0x111122, 
        wireframe: false,
        flatShading: true
    });
    
    // Deform terrain slightly for PS1 geometric grit
    const pos = floorGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        pos.setZ(i, (Math.random() - 0.5) * 0.4);
    }
    floorGeo.computeVertexNormals();

    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Outer low-poly pillars/monoliths
    const wallGeo = new THREE.BoxGeometry(2, 8, 2);
    const wallMat = new THREE.MeshLambertMaterial({ color: 0x221133, flatShading: true });

    for (let i = -30; i <= 30; i += 6) {
        let p1 = new THREE.Mesh(wallGeo, wallMat);
        p1.position.set(i, 4, -30);
        scene.add(p1);

        let p2 = new THREE.Mesh(wallGeo, wallMat);
        p2.position.set(i, 4, 30);
        scene.add(p2);

        let p3 = new THREE.Mesh(wallGeo, wallMat);
        p3.position.set(-30, 4, i);
        scene.add(p3);

        let p4 = new THREE.Mesh(wallGeo, wallMat);
        p4.position.set(30, 4, i);
        scene.add(p4);
    }
}

// FPS Pointer Lock Controls
function setupControls() {
    let yaw = 0;
    let pitch = 0;

    viewport.addEventListener('click', () => {
        if (isRunning && !isLocked) {
            viewport.requestPointerLock();
        }
    });

    document.addEventListener('pointerlockchange', () => {
        isLocked = document.pointerLockElement === viewport;
    });

    document.addEventListener('mousemove', (e) => {
        if (!isLocked || !isRunning) return;

        const sensitivity = 0.0025;
        yaw -= e.movementX * sensitivity;
        pitch -= e.movementY * sensitivity;

        pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

        camera.rotation.order = "YXZ";
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
    });

    window.addEventListener('keydown', (e) => { if (e.code in keys) keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { if (e.code in keys) keys[e.code] = false; });
    window.addEventListener('mousedown', (e) => {
        if (isLocked && isRunning && e.button === 0) fireProjectile();
    });
}

// Enemy Spawner (Low-poly floating octahedrons)
function spawnEnemy() {
    const geo = new THREE.OctahedronGeometry(1.2, 0); // Flat shading 3D poly
    const mat = new THREE.MeshLambertMaterial({ 
        color: 0xff0055, 
        flatShading: true,
        emissive: 0x440011 
    });
    const enemy = new THREE.Mesh(geo, mat);

    // Random placement along perimeter
    const angle = Math.random() * Math.PI * 2;
    const dist = 18 + Math.random() * 8;
    enemy.position.set(Math.cos(angle) * dist, 1.2, Math.sin(angle) * dist);

    enemy.userData = {
        hp: 2,
        speed: 0.04 + Math.random() * 0.03,
        rotSpeed: (Math.random() - 0.5) * 0.1
    };

    targets.push(enemy);
    scene.add(enemy);
}

// Player Projectiles
function fireProjectile() {
    const geo = new THREE.TetrahedronGeometry(0.3, 0);
    const mat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
    const proj = new THREE.Mesh(geo, mat);

    proj.position.copy(camera.position);

    // Get forward vector
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    proj.userData = { dir: dir, life: 60 };

    projectiles.push(proj);
    scene.add(proj);
}

// Low-poly Explosion Effect
function createExplosion(pos, color = 0xff0055) {
    for (let i = 0; i < 8; i++) {
        const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const mat = new THREE.MeshBasicMaterial({ color: color });
        const p = new THREE.Mesh(geo, mat);
        p.position.copy(pos);

        p.userData = {
            vel: new THREE.Vector3(
                (Math.random() - 0.5) * 0.2,
                (Math.random() - 0.5) * 0.2,
                (Math.random() - 0.5) * 0.2
            ),
            life: 20
        };

        particles.push(p);
        scene.add(p);
    }
}

// Game Logic Loop
function update() {
    if (!isRunning) return;

    // Player Movement
    const speed = 0.12;
    const dir = new THREE.Vector3();

    if (keys.KeyW) dir.z -= 1;
    if (keys.KeyS) dir.z += 1;
    if (keys.KeyA) dir.x -= 1;
    if (keys.KeyD) dir.x += 1;

    dir.normalize();
    dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);

    camera.position.x += dir.x * speed;
    camera.position.z += dir.z * speed;
    camera.position.y = 1.6; // Eyes height

    // Lock player within arena
    camera.position.x = Math.max(-26, Math.min(26, camera.position.x));
    camera.position.z = Math.max(-26, Math.min(26, camera.position.z));

    // Update Projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.position.addScaledVector(p.userData.dir, 0.8);
        p.rotation.x += 0.2;
        p.userData.life--;

        // Collision with enemies
        for (let j = targets.length - 1; j >= 0; j--) {
            const t = targets[j];
            if (p.position.distanceTo(t.position) < 1.4) {
                t.userData.hp--;
                createExplosion(p.position, 0x00f0ff);

                // Destroy projectile
                scene.remove(p);
                projectiles.splice(i, 1);

                if (t.userData.hp <= 0) {
                    createExplosion(t.position, 0xff0055);
                    scene.remove(t);
                    targets.splice(j, 1);
                    score += 100;
                    scoreEl.textContent = score;

                    // Respawn replacements
                    setTimeout(spawnEnemy, 1000);
                    if (Math.random() > 0.5) setTimeout(spawnEnemy, 1500);
                }
                break;
            }
        }

        if (p.userData.life <= 0 && scene.children.includes(p)) {
            scene.remove(p);
            projectiles.splice(i, 1);
        }
    }

    // Update Enemies
    for (let i = targets.length - 1; i >= 0; i--) {
        const t = targets[i];

        // Move towards player camera
        const toPlayer = new THREE.Vector3().subVectors(camera.position, t.position);
        toPlayer.y = 0; // Lock to floor level
        toPlayer.normalize();

        t.position.addScaledVector(toPlayer, t.userData.speed);
        t.rotation.y += t.userData.rotSpeed;
        t.rotation.x += t.userData.rotSpeed;

        // Hit player
        if (t.position.distanceTo(camera.position) < 1.5) {
            hp -= 20;
            hpEl.textContent = Math.max(0, hp);
            createExplosion(t.position, 0xff0055);

            scene.remove(t);
            targets.splice(i, 1);
            setTimeout(spawnEnemy, 1000);

            if (hp <= 0) endGame();
        }
    }

    // Update Particle FX
    for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.position.add(pt.userData.vel);
        pt.userData.life--;

        if (pt.userData.life <= 0) {
            scene.remove(pt);
            particles.splice(i, 1);
        }
    }
}

function animate() {
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
}

function startGame() {
    hp = 100;
    score = 0;
    hpEl.textContent = hp;
    scoreEl.textContent = score;

    camera.position.set(0, 1.6, 0);
    camera.rotation.set(0, 0, 0);

    // Clear active entities
    targets.forEach(t => scene.remove(t));
    projectiles.forEach(p => scene.remove(p));
    particles.forEach(pt => scene.remove(pt));
    targets = [];
    projectiles = [];
    particles = [];

    // Spawn initial wave
    for (let i = 0; i < 4; i++) spawnEnemy();

    isRunning = true;
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    viewport.requestPointerLock();
}

function endGame() {
    isRunning = false;
    document.exitPointerLock?.();
    finalScoreEl.textContent = score;
    gameOverScreen.classList.remove('hidden');
}

// System Init
initEngine();
animate();

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);
</script>
</body>
</html>
