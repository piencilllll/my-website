<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANOMALY DATABASE // ARCHIVE</title>
    <style>
        :root {
            --bg-dark: #080a0c;
            --panel-bg: rgba(15, 20, 26, 0.9);
            --border-color: #232d38;
            --accent-green: #00ff66;
            --accent-red: #ff3344;
            --accent-amber: #ffaa00;
            --accent-blue: #00f3ff;
            --text-bright: #e6edf3;
            --text-dim: #7d8590;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-bright);
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Scanline Overlay */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.35) 50%,
                rgba(0, 0, 0, 0.35)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.7;
        }

        /* Container Layout */
        .main-wrapper {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            z-index: 1;
        }

        .archive-card {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9), 0 0 15px rgba(0, 255, 102, 0.05);
            display: grid;
            grid-template-columns: 320px 1fr;
            grid-template-rows: auto 1fr auto;
            gap: 20px;
            padding: 24px;
            position: relative;
        }

        /* Favorites Sidebar */
        .saved-sidebar {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 620px;
        }

        .sidebar-title {
            font-size: 0.95rem;
            color: var(--accent-blue);
            letter-spacing: 1.5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            text-transform: uppercase;
        }

        .saved-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .saved-item {
            background: #0f141a;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .saved-item:hover {
            border-color: var(--accent-blue);
            background: #161e27;
        }

        .saved-item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .saved-id {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .saved-name {
            font-size: 0.85rem;
            color: var(--text-bright);
            font-weight: bold;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--accent-red);
            font-size: 1rem;
            cursor: pointer;
            padding: 2px 6px;
        }

        .delete-btn:hover {
            color: #ff0000;
        }

        /* Header */
        header {
            grid-column: 1 / -1;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .archive-title {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--accent-green);
        }

        .threat-badge {
            padding: 4px 12px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Left Column - Visual Preview */
        .visual-panel {
            grid-column: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .canvas-frame {
            width: 100%;
            height: 280px;
            background: #030405;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Right Column - Data Sheet */
        .data-panel {
            grid-column: 2;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .field-value {
            font-size: 0.95rem;
            color: var(--text-bright);
            line-height: 1.5;
        }

        /* Footer / Actions */
        footer {
            grid-column: 1 / -1;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: #121820;
            border: 1px solid var(--border-color);
            color: var(--accent-green);
            padding: 10px 18px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 4px;
        }

        .btn:hover {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
        }

        .btn-save {
            color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .btn-save:hover {
            background: var(--accent-blue);
            color: #000;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
        }

        .btn-danger {
            color: var(--accent-red);
        }

        .btn-danger:hover {
            background: var(--accent-red);
            color: #000;
            box-shadow: 0 0 12px rgba(255, 51, 68, 0.4);
        }

        /* Responsive */
        @media (max-width: 950px) {
            .main-wrapper {
                grid-template-columns: 1fr;
            }
            .archive-card {
                grid-template-columns: 1fr;
            }
            .visual-panel, .data-panel {
                grid-column: 1;
            }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div class="main-wrapper">
        <div class="archive-card">
            <header>
                <div class="archive-title">CLASSIFIED ARCHIVE // ENTITY FILE</div>
                <div id="threat-tag" class="threat-badge">LEVEL 0</div>
            </header>

            <div class="visual-panel">
                <div class="canvas-frame">
                    <canvas id="entityCanvas"></canvas>
                </div>
                <div class="field-group">
                    <span class="field-label">DESIGNATION CODE</span>
                    <span class="field-value" id="val-id">ENT-0000</span>
                </div>
                <div class="field-group">
                    <span class="field-label">ANOMALOUS CLASS</span>
                    <span class="field-value" id="val-class">UNKNOWN</span>
                </div>
            </div>

            <div class="data-panel">
                <div class="field-group">
                    <span class="field-label">COGNOMEN / NAME</span>
                    <span class="field-value" id="val-name" style="font-size: 1.2rem; color: var(--accent-green);">---</span>
                </div>
                <div class="field-group">
                    <span class="field-label">PHYSICAL MORPHOLOGY</span>
                    <span class="field-value" id="val-morph">---</span>
                </div>
                <div class="field-group">
                    <span class="field-label">OBSERVED BEHAVIOR & PHENOMENA</span>
                    <span class="field-value" id="val-behavior">---</span>
                </div>
                <div class="field-group">
                    <span class="field-label">SPECIAL CONTAINMENT PROTOCOLS</span>
                    <span class="field-value" id="val-containment">---</span>
                </div>
            </div>

            <footer>
                <span style="font-size: 0.75rem; color: var(--text-dim);" id="timestamp">SECURE TERMINAL ONLINE</span>
                <div class="button-group">
                    <button class="btn btn-save" id="saveBtn">★ SAVE FILE</button>
                    <button class="btn btn-danger" id="genBtn">GENERATE NEW</button>
                </div>
            </footer>
        </div>

        <!-- Saved Entries Sidebar -->
        <div class="saved-sidebar">
            <div class="sidebar-title">SAVED ENTRIES (<span id="saved-count">0</span>)</div>
            <div class="saved-list" id="saved-list">
                <!-- Dynamic Items -->
            </div>
        </div>
    </div>

    <script>
        // Canvas Setup
        const canvas = document.getElementById('entityCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let t = 0;
        let currentEntry = {};
        let savedEntries = JSON.parse(localStorage.getItem('saved_anomalies') || '[]');

        // Entity Silhouette Renderer
        function renderEntity() {
            t += 0.03;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Background Radar Grid
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.08)';
            ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i = 0; i < canvas.height; i += 20) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // Radar Scanline
            let scanY = (t * 20) % canvas.height;
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.25)';
            ctx.beginPath();
            ctx.moveTo(0, scanY);
            ctx.lineTo(canvas.width, scanY);
            ctx.stroke();

            if (currentEntry.seed) {
                ctx.save();
                ctx.translate(cx, cy);

                let mainColor = '#00ff66';
                if (currentEntry.threatLevel === 'CRITICAL' || currentEntry.threatLevel === 'APOCALYPTIC') mainColor = '#ff3344';
                else if (currentEntry.threatLevel === 'HAZARDOUS') mainColor = '#ffaa00';

                ctx.fillStyle = mainColor;
                ctx.shadowColor = mainColor;
                ctx.shadowBlur = 15;

                const numNodes = 6 + (currentEntry.seed % 6);
                ctx.beginPath();
                for (let i = 0; i < numNodes; i++) {
                    let angle = (i / numNodes) * Math.PI * 2;
                    let noise = Math.sin(t * 2 + i * currentEntry.seed) * 20 + Math.cos(t * 1.5 + i) * 15;
                    let radius = 45 + noise;

                    let x = Math.cos(angle) * radius;
                    let y = Math.sin(angle) * radius;

                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);

                    if (i % 2 === 0) {
                        let tx = Math.cos(angle) * (radius + 40 + Math.sin(t * 3 + i) * 15);
                        let ty = Math.sin(angle) * (radius + 40 + Math.cos(t * 3 + i) * 15);
                        ctx.lineTo(tx, ty);
                    }
                }
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                for (let i = 0; i < 5; i++) {
                    let ox = Math.sin(t + i + currentEntry.seed) * 70;
                    let oy = Math.cos(t * 1.2 + i) * 70;
                    ctx.beginPath();
                    ctx.arc(ox, oy, Math.random() * 3 + 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            requestAnimationFrame(renderEntity);
        }

        // Procedural Text Data Tables
        const namePrefixes = ["The Void", "The Echoing", "Stanza", "Obsidian", "Sub-Surface", "Spectral", "Kinetic", "Non-Euclidean"];
        const nameNouns = ["Weaver", "Watcher", "Vanguard", "Architect", "Anomaly", "Stalker", "Husk", "Crawler", "Disciple"];
        const classes = ["Liminal-Horror", "Biological-Shift", "Spatial-Distortion", "Cognitohazard", "Acoustic-Parasite"];
        const threats = [
            { level: "MINIMAL", color: "#00ff66", bg: "rgba(0,255,106,0.15)" },
            { level: "HAZARDOUS", color: "#ffaa00", bg: "rgba(255,170,0,0.15)" },
            { level: "CRITICAL", color: "#ff3344", bg: "rgba(255,51,68,0.15)" },
            { level: "APOCALYPTIC", color: "#ff0055", bg: "rgba(255,0,85,0.25)" }
        ];
        const morphologies = [
            "Amorphous mass shifting through non-Euclidean geometry. Displays fluctuating perimeter bounds.",
            "Bipedal skeletal composite encased in dense white liquid energy strands.",
            "Sub-surface crystalline structure emitting localized gravitational dampening waves.",
            "Multi-segmented appendage matrix with shifting bioluminescent eye spots."
        ];
        const behaviors = [
            "Remains inert in complete darkness. Actively moves toward radio frequencies and electronic displays.",
            "Distorts structural geometry within a 15-meter radius, causing corridors to loop infinitely.",
            "Emits low-frequency acoustic vibrations that induce mild auditory hallucinations in personnel.",
            "Consumes ambient thermal energy, rapidly freezing surrounding atmosphere upon physical contact."
        ];
        const protocols = [
            "Must be kept in a vacuum-sealed chamber lined with acoustic dampening foam at all times.",
            "Requires continuous low-intensity ultraviolet lighting. No electronic screens permitted inside perimeter.",
            "Containment cell walls must be re-anchored weekly using reinforced concrete and liquid coolants.",
            "Personnel must maintain line-of-sight during maintenance shifts. Never approach without ear defense."
        ];

        function generateNewArchiveEntry() {
            const seed = Math.floor(Math.random() * 10000);
            const threatObj = threats[Math.floor(Math.random() * threats.length)];

            currentEntry = {
                seed: seed,
                id: "ENT-" + Math.floor(1000 + Math.random() * 9000),
                name: namePrefixes[Math.floor(Math.random() * namePrefixes.length)] + " " + nameNouns[Math.floor(Math.random() * nameNouns.length)],
                eClass: classes[Math.floor(Math.random() * classes.length)],
                threatLevel: threatObj.level,
                threatObj: threatObj,
                morph: morphologies[Math.floor(Math.random() * morphologies.length)],
                behavior: behaviors[Math.floor(Math.random() * behaviors.length)],
                containment: protocols[Math.floor(Math.random() * protocols.length)]
            };

            displayEntry(currentEntry);
        }

        function displayEntry(entry) {
            currentEntry = entry;
            document.getElementById('val-id').innerText = entry.id;
            document.getElementById('val-name').innerText = entry.name;
            document.getElementById('val-class').innerText = entry.eClass;
            document.getElementById('val-morph').innerText = entry.morph;
            document.getElementById('val-behavior').innerText = entry.behavior;
            document.getElementById('val-containment').innerText = entry.containment;

            const threatTag = document.getElementById('threat-tag');
            threatTag.innerText = `LEVEL: ${entry.threatLevel}`;
            threatTag.style.color = entry.threatObj.color;
            threatTag.style.border = `1px solid ${entry.threatObj.color}`;
            threatTag.style.backgroundColor = entry.threatObj.bg;

            document.getElementById('timestamp').innerText = `LAST UPDATED: ${new Date().toLocaleTimeString()} // LOG #${entry.seed}`;
        }

        // Save & LocalStorage System
        function saveCurrentEntry() {
            if (savedEntries.some(e => e.id === currentEntry.id)) return;
            savedEntries.push(currentEntry);
            localStorage.setItem('saved_anomalies', JSON.stringify(savedEntries));
            renderSavedList();
        }

        function deleteEntry(id, event) {
            event.stopPropagation();
            savedEntries = savedEntries.filter(e => e.id !== id);
            localStorage.setItem('saved_anomalies', JSON.stringify(savedEntries));
            renderSavedList();
        }

        function renderSavedList() {
            const listEl = document.getElementById('saved-list');
            document.getElementById('saved-count').innerText = savedEntries.length;
            listEl.innerHTML = '';

            savedEntries.forEach(entry => {
                const item = document.createElement('div');
                item.className = 'saved-item';
                item.onclick = () => displayEntry(entry);

                item.innerHTML = `
                    <div class="saved-item-info">
                        <span class="saved-id">${entry.id}</span>
                        <span class="saved-name">${entry.name}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteEntry('${entry.id}', event)">✕</button>
                `;
                listEl.appendChild(item);
            });
        }

        document.getElementById('genBtn').addEventListener('click', generateNewArchiveEntry);
        document.getElementById('saveBtn').addEventListener('click', saveCurrentEntry);

        // Initialize
        renderSavedList();
        generateNewArchiveEntry();
        renderEntity();
    </script>
</body>
</html>
