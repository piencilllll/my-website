<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawmling Sandbox - 3D Engine</title>
    <style>
        :root {
            --bg-color: #080a0f;
            --ui-border: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: #ffffff;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* CRT Overlay */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(8, 10, 15, 0.85);
            border: 2px solid var(--ui-border);
            padding: 15px 20px;
            border-radius: 4px;
            z-index: 15;
            font-size: 0.85rem;
            letter-spacing: 1px;
            line-height: 1.6rem;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        .hud-title {
            font-weight: bold;
            margin-bottom: 5px;
            border-bottom: 1px solid #ffffff;
            padding-bottom: 3px;
        }

        .key {
            background: #ffffff;
            color: #000000;
            padding: 2px 6px;
            font-weight: bold;
            border-radius: 2px;
        }

        #error-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff5555;
            font-size: 1.2rem;
            display: none;
            z-index: 100;
            text-align: center;
        }
    </style>

    <!-- Reliable Three.js CDN -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>

    <div class="crt-overlay"></div>
    <div id="canvas-container"></div>
    <div id="error-msg">Failed to load 3D Engine. Check internet connection or ad-blocker.</div>

    <div id="hud">
        <div class="hud-title">KAWMLING CONTROLS</div>
        <div><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> : Walk</div>
        <div><span class="key">SHIFT</span> : Run</div>
        <div><span class="key">SPACE</span> : Jump</div>
        <div><span class="key">MOUSE</span> : Click & Drag Orbit Camera</div>
    </div>

    <script>
        if (typeof THREE === 'undefined') {
            document.getElementById('error-msg').style.display = 'block';
        } else {
            initGame();
        }

        function initGame() {
            // --- 1. SETUP ENGINE & RENDERER ---
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0c14);
            scene.fog = new THREE.FogExp2(0x0a0c14, 0.015);

            const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            const renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            const PIXEL_SCALE = 0.5;
            renderer.setPixelRatio(window.devicePixelRatio * PIXEL_SCALE);
            renderer.domElement.style.width = "100%";
            renderer.domElement.style.height = "100%";
            renderer.domElement.style.imageRendering = "pixelated";
            
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // --- 2. LIGHTING ---
            const ambientLight = new THREE.AmbientLight(0x556080, 1.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 512;
            dirLight.shadow.mapSize.height = 512;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 100;
            const d = 25;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            const charLight = new THREE.PointLight(0xffffff, 1.2, 15);
            scene.add(charLight);

            // --- 3. PIXELATED BASEPLATE ---
            const baseplateSize = 60;
            const baseplateGeo = new THREE.BoxGeometry(baseplateSize, 2, baseplateSize);
            
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1c2236';
            ctx.fillRect(0, 0, 64, 64);
            ctx.fillStyle = '#121624';
            ctx.fillRect(0, 0, 32, 32);
            ctx.fillRect(32, 32, 32, 32);
            
            const gridTexture = new THREE.CanvasTexture(canvas);
            gridTexture.magFilter = THREE.NearestFilter;
            gridTexture.minFilter = THREE.NearestFilter;
            gridTexture.wrapS = THREE.RepeatWrapping;
            gridTexture.wrapT = THREE.RepeatWrapping;
            gridTexture.repeat.set(15, 15);

            const baseplateMat = new THREE.MeshStandardMaterial({ 
                map: gridTexture,
                roughness: 0.7,
                metalness: 0.1
            });
            const baseplate = new THREE.Mesh(baseplateGeo, baseplateMat);
            baseplate.position.y = -1;
            baseplate.receiveShadow = true;
            scene.add(baseplate);

            const wireframe = new THREE.LineSegments(
                new THREE.EdgesGeometry(baseplateGeo),
                new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 })
            );
            baseplate.add(wireframe);

            // --- 4. THICKENED STICKMAN RIG BUILD ---
            const stickmanMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0xffffff,
                emissiveIntensity: 0.35,
                roughness: 0.2,
                metalness: 0.1,
            });

            const character = new THREE.Group();
            scene.add(character);

            function createCapsuleLimb(radius, length) {
                const group = new THREE.Group();
                const cylGeo = new THREE.CylinderGeometry(radius, radius, length, 12);
                const capGeo = new THREE.SphereGeometry(radius, 12, 12);

                const cylinder = new THREE.Mesh(cylGeo, stickmanMaterial);
                cylinder.position.y = -length / 2;
                cylinder.castShadow = true;
                group.add(cylinder);

                const topCap = new THREE.Mesh(capGeo, stickmanMaterial);
                topCap.position.y = 0;
                topCap.castShadow = true;
                group.add(topCap);

                const botCap = new THREE.Mesh(capGeo, stickmanMaterial);
                botCap.position.y = -length;
                botCap.castShadow = true;
                group.add(botCap);

                return group;
            }

            // Torso (Slightly Thicker Spine)
            const torsoLength = 0.85;
            const torsoGroup = createCapsuleLimb(0.14, torsoLength);
            torsoGroup.position.y = 1.6;
            character.add(torsoGroup);

            // Head (Scaled proportionally to the new body thickness)
            const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.34, 16, 16), stickmanMaterial);
            headMesh.position.set(0, 0.3, 0);
            headMesh.castShadow = true;
            torsoGroup.add(headMesh);

            // Arms (Thicker profile & better joint spacing)
            const armLUpper = createCapsuleLimb(0.09, 0.45);
            armLUpper.position.set(0.24, 1.55, 0);
            character.add(armLUpper);

            const armLLower = createCapsuleLimb(0.08, 0.45);
            armLLower.position.set(0, -0.45, 0);
            armLUpper.add(armLLower);

            const armRUpper = createCapsuleLimb(0.09, 0.45);
            armRUpper.position.set(-0.24, 1.55, 0);
            character.add(armRUpper);

            const armRLower = createCapsuleLimb(0.08, 0.45);
            armRLower.position.set(0, -0.45, 0);
            armRUpper.add(armRLower);

            // Legs (Thicker legs for grounded stance)
            const legLUpper = createCapsuleLimb(0.1, 0.5);
            legLUpper.position.set(0.16, 0.75, 0);
            character.add(legLUpper);

            const legLLower = createCapsuleLimb(0.09, 0.5);
            legLLower.position.set(0, -0.5, 0);
            legLUpper.add(legLLower);

            const legRUpper = createCapsuleLimb(0.1, 0.5);
            legRUpper.position.set(-0.16, 0.75, 0);
            character.add(legRUpper);

            const legRLower = createCapsuleLimb(0.09, 0.5);
            legRLower.position.set(0, -0.5, 0);
            legRUpper.add(legRLower);

            // --- 5. CONTROLS ---
            const keys = { w: false, a: false, s: false, d: false, shift: false, space: false };

            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || k === 'arrowup') keys.w = true;
                if (k === 'a' || k === 'arrowleft') keys.a = true;
                if (k === 's' || k === 'arrowdown') keys.s = true;
                if (k === 'd' || k === 'arrowright') keys.d = true;
                if (e.key === 'Shift') keys.shift = true;
                if (e.key === ' ' || e.code === 'Space') {
                    keys.space = true;
                    jump();
                }
            });

            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || k === 'arrowup') keys.w = false;
                if (k === 'a' || k === 'arrowleft') keys.a = false;
                if (k === 's' || k === 'arrowdown') keys.s = false;
                if (k === 'd' || k === 'arrowright') keys.d = false;
                if (e.key === 'Shift') keys.shift = false;
                if (e.key === ' ' || e.code === 'Space') keys.space = false;
            });

            // Orbit Camera Controls
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let cameraAngleX = 0;
            let cameraAngleY = 0.35;
            const cameraDistance = 10;

            window.addEventListener('mousedown', () => { isDragging = true; });
            window.addEventListener('mouseup', () => { isDragging = false; });
            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;

                    cameraAngleX -= deltaX * 0.008;
                    cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2.2, cameraAngleY + deltaY * 0.008));
                }
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            // --- 6. PHYSICS ---
            let posY = 0;
            let velocityY = 0;
            const gravity = -0.018;
            let isGrounded = true;

            function jump() {
                if (isGrounded) {
                    velocityY = 0.38;
                    isGrounded = false;
                }
            }

            function lerp(start, end, amt) {
                return (1 - amt) * start + amt * end;
            }

            // --- 7. FLUID ANIMATION SYSTEM ---
            let animTime = 0;

            function animateCharacter(delta, moveSpeed, isMoving, isRunning) {
                const animSpeed = isRunning ? 14 : (isMoving ? 9 : 2.5);
                animTime += delta * animSpeed;

                const sinCycle = Math.sin(animTime);
                const cosCycle = Math.cos(animTime);

                // Smooth interpolation blend speed
                const blend = 0.15;

                if (!isGrounded) {
                    // Airborne / Jump pose
                    torsoGroup.rotation.x = lerp(torsoGroup.rotation.x, 0.15, blend);
                    torsoGroup.rotation.y = lerp(torsoGroup.rotation.y, 0, blend);
                    torsoGroup.rotation.z = lerp(torsoGroup.rotation.z, 0, blend);

                    armLUpper.rotation.x = lerp(armLUpper.rotation.x, -2.2, blend);
                    armRUpper.rotation.x = lerp(armRUpper.rotation.x, -2.2, blend);
                    armLUpper.rotation.z = lerp(armLUpper.rotation.z, 0.5, blend);
                    armRUpper.rotation.z = lerp(armRUpper.rotation.z, -0.5, blend);

                    armLLower.rotation.x = lerp(armLLower.rotation.x, -0.4, blend);
                    armRLower.rotation.x = lerp(armRLower.rotation.x, -0.4, blend);

                    legLUpper.rotation.x = lerp(legLUpper.rotation.x, 0.5, blend);
                    legRUpper.rotation.x = lerp(legRUpper.rotation.x, -0.5, blend);
                    legLLower.rotation.x = lerp(legLLower.rotation.x, -0.9, blend);
                    legRLower.rotation.x = lerp(legRLower.rotation.x, -0.2, blend);

                } else if (isMoving) {
                    // Locomotion (Walk / Run)
                    const stride = isRunning ? 1.0 : 0.65;
                    const bodyTilt = isRunning ? 0.28 : 0.1;

                    // Torso dynamics (Bounce, forward lean, and hip rotation sway)
                    torsoGroup.position.y = lerp(torsoGroup.position.y, 1.6 + Math.abs(cosCycle) * (isRunning ? 0.14 : 0.07), blend);
                    torsoGroup.rotation.x = lerp(torsoGroup.rotation.x, bodyTilt, blend);
                    torsoGroup.rotation.y = lerp(torsoGroup.rotation.y, sinCycle * (isRunning ? 0.15 : 0.08), blend);
                    torsoGroup.rotation.z = lerp(torsoGroup.rotation.z, -sinCycle * (isRunning ? 0.06 : 0.03), blend);

                    // Leg rotations with natural knee flex
                    legLUpper.rotation.x = lerp(legLUpper.rotation.x, sinCycle * stride, blend);
                    legRUpper.rotation.x = lerp(legRUpper.rotation.x, -sinCycle * stride, blend);

                    const kneeL = sinCycle > 0 ? -sinCycle * (isRunning ? 1.2 : 0.85) : -0.1;
                    const kneeR = sinCycle < 0 ? sinCycle * (isRunning ? 1.2 : 0.85) : -0.1;
                    legLLower.rotation.x = lerp(legLLower.rotation.x, kneeL, blend);
                    legRLower.rotation.x = lerp(legRLower.rotation.x, kneeR, blend);

                    // Arm swing dynamics with natural elbow bend
                    armLUpper.rotation.x = lerp(armLUpper.rotation.x, -sinCycle * stride * 0.9, blend);
                    armRUpper.rotation.x = lerp(armRUpper.rotation.x, sinCycle * stride * 0.9, blend);
                    armLUpper.rotation.z = lerp(armLUpper.rotation.z, 0.12, blend);
                    armRUpper.rotation.z = lerp(armRUpper.rotation.z, -0.12, blend);

                    const elbowL = -0.25 - Math.max(0, -sinCycle) * (isRunning ? 0.8 : 0.45);
                    const elbowR = -0.25 - Math.max(0, sinCycle) * (isRunning ? 0.8 : 0.45);
                    armLLower.rotation.x = lerp(armLLower.rotation.x, elbowL, blend);
                    armRLower.rotation.x = lerp(armRLower.rotation.x, elbowR, blend);

                } else {
                    // Idle (Smooth organic breathing pose)
                    const breath = Math.sin(animTime) * 0.035;

                    torsoGroup.position.y = lerp(torsoGroup.position.y, 1.6 + breath, blend);
                    torsoGroup.rotation.x = lerp(torsoGroup.rotation.x, 0, blend);
                    torsoGroup.rotation.y = lerp(torsoGroup.rotation.y, 0, blend);
                    torsoGroup.rotation.z = lerp(torsoGroup.rotation.z, 0, blend);

                    armLUpper.rotation.x = lerp(armLUpper.rotation.x, 0, blend);
                    armRUpper.rotation.x = lerp(armRUpper.rotation.x, 0, blend);
                    armLUpper.rotation.z = lerp(armLUpper.rotation.z, 0.18 + breath * 0.4, blend);
                    armRUpper.rotation.z = lerp(armRUpper.rotation.z, -0.18 - breath * 0.4, blend);

                    armLLower.rotation.x = lerp(armLLower.rotation.x, -0.12, blend);
                    armRLower.rotation.x = lerp(armRLower.rotation.x, -0.12, blend);

                    legLUpper.rotation.x = lerp(legLUpper.rotation.x, 0, blend);
                    legRUpper.rotation.x = lerp(legRUpper.rotation.x, 0, blend);
                    legLLower.rotation.x = lerp(legLLower.rotation.x, 0, blend);
                    legRLower.rotation.x = lerp(legRLower.rotation.x, 0, blend);
                }
            }

            // --- 8. GAME LOOP ---
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const delta = clock.getDelta();

                let moveX = 0;
                let moveZ = 0;
                if (keys.w) moveZ += 1;
                if (keys.s) moveZ -= 1;
                if (keys.a) moveX -= 1;
                if (keys.d) moveX += 1;

                const isMoving = moveX !== 0 || moveZ !== 0;
                const isRunning = keys.shift && isMoving;
                const speed = isRunning ? 0.18 : 0.09;

                if (isMoving) {
                    const inputAngle = Math.atan2(moveX, moveZ);
                    const targetRotation = cameraAngleX + inputAngle + Math.PI;

                    let diff = targetRotation - character.rotation.y;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    character.rotation.y += diff * 0.2;

                    const moveAngle = cameraAngleX + inputAngle;
                    character.position.x -= Math.sin(moveAngle) * speed;
                    character.position.z -= Math.cos(moveAngle) * speed;

                    const limit = (baseplateSize / 2) - 1;
                    character.position.x = Math.max(-limit, Math.min(limit, character.position.x));
                    character.position.z = Math.max(-limit, Math.min(limit, character.position.z));
                }

                velocityY += gravity;
                posY += velocityY;

                if (posY <= 0) {
                    posY = 0;
                    velocityY = 0;
                    isGrounded = true;
                }
                character.position.y = posY;

                animateCharacter(delta, speed, isMoving, isRunning);

                camera.position.x = character.position.x + cameraDistance * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
                camera.position.y = character.position.y + 1.5 + cameraDistance * Math.sin(cameraAngleY);
                camera.position.z = character.position.z + cameraDistance * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);
                
                const targetLookAt = character.position.clone().add(new THREE.Vector3(0, 1.5, 0));
                camera.lookAt(targetLookAt);

                charLight.position.copy(character.position).add(new THREE.Vector3(0, 2.5, 0));

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }
    </script>
</body>
</html>
