<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanctuary - Retro Dark Fantasy Mixer</title>
  <style>
    :root {
      --bg-dark: #07080c;
      --panel-bg: rgba(15, 17, 26, 0.85);
      --border-color: #3b334d;
      --border-glow: #7a52aa;
      --accent-gold: #e2b041;
      --accent-purple: #9d65c9;
      --accent-cyan: #4fe0b0;
      --text-muted: #8c829e;
      --text-bright: #f0e6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body, html {
      width: 100%; height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-bright);
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ambient Ember Canvas */
    #ember-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Retro CRT Grain Overlay */
    .grain-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 40%, rgba(3, 4, 7, 0.85) 100%),
                  repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
    }

    /* Main Container */
    .mixer-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 680px;
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      box-shadow: 0 0 25px rgba(122, 82, 170, 0.25), inset 0 0 15px rgba(0,0,0,0.8);
      border-radius: 8px;
      padding: 24px;
      backdrop-filter: blur(8px);
    }

    /* Header */
    header {
      text-align: center;
      border-bottom: 2px dashed var(--border-color);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.4rem;
      letter-spacing: 3px;
      color: var(--accent-gold);
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(226, 176, 65, 0.4);
    }

    header p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Master Controls */
    .master-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid rgba(122, 82, 170, 0.3);
      margin-bottom: 20px;
    }

    .btn-main {
      background: var(--accent-purple);
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 4px 0 #5c387d;
      transition: all 0.1s ease;
    }

    .btn-main:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #5c387d;
    }

    .btn-main.active {
      background: var(--accent-gold);
      color: #111;
      box-shadow: 0 4px 0 #9c731e;
    }

    /* Mixer Channels Grid */
    .channels-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 580px) {
      .channels-grid { grid-template-columns: 1fr; }
    }

    .channel-card {
      background: rgba(8, 10, 16, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .channel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .channel-title {
      font-size: 0.85rem;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .channel-title span { font-size: 1.1rem; }

    .toggle-btn {
      background: transparent;
      border: 1px solid var(--text-muted);
      color: var(--text-muted);
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 3px;
      cursor: pointer;
    }

    .toggle-btn.active {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      background: rgba(79, 224, 176, 0.1);
    }

    /* Custom Slider */
    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #1a1824;
      border-radius: 3px;
      outline: none;
      border: 1px solid #2a2538;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 2px;
      background: var(--accent-gold);
      cursor: pointer;
      box-shadow: 0 0 6px var(--accent-gold);
    }

    .trigger-btn {
      background: rgba(157, 101, 201, 0.2);
      border: 1px solid var(--accent-purple);
      color: var(--text-bright);
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
    }

    .trigger-btn:hover {
      background: rgba(157, 101, 201, 0.4);
    }
  </style>
</head>
<body>

  <canvas id="ember-canvas"></canvas>
  <div class="grain-overlay"></div>

  <div class="mixer-container">
    <header>
      <h1>Sanctuary Ambience</h1>
      <p>Retro Dark Fantasy Soundscape Generator</p>
    </header>

    <div class="master-bar">
      <button class="btn-main" id="power-btn">▶ INITIALIZE SOUND</button>
      <div style="font-size: 0.75rem; color: var(--text-muted);" id="status-readout">SYSTEM IDLE</div>
    </div>

    <div class="channels-grid">

      <!-- Heavy Rain -->
      <div class="channel-card">
        <div class="channel-header">
          <div class="channel-title"><span>🌧️</span> Rainstorm</div>
          <button class="toggle-btn active" id="rain-toggle">ON</button>
        </div>
        <div class="slider-container">
          <input type="range" id="rain-vol" min="0" max="1" step="0.01" value="0.5">
        </div>
      </div>

      <!-- Campfire Crackle -->
      <div class="channel-card">
        <div class="channel-header">
          <div class="channel-title"><span>🔥</span> Hearth Fire</div>
          <button class="toggle-btn active" id="fire-toggle">ON</button>
        </div>
        <div class="slider-container">
          <input type="range" id="fire-vol" min="0" max="1" step="0.01" value="0.4">
        </div>
      </div>

      <!-- Night Wind -->
      <div class="channel-card">
        <div class="channel-header">
          <div class="channel-title"><span>🌬️</span> Howling Wind</div>
          <button class="toggle-btn active" id="wind-toggle">ON</button>
        </div>
        <div class="slider-container">
          <input type="range" id="wind-vol" min="0" max="1" step="0.01" value="0.3">
        </div>
      </div>

      <!-- Abyssal Drone -->
      <div class="channel-card">
        <div class="channel-header">
          <div class="channel-title"><span>🔮</span> Arcane Drone</div>
          <button class="toggle-btn active" id="drone-toggle">ON</button>
        </div>
        <div class="slider-container">
          <input type="range" id="drone-vol" min="0" max="1" step="0.01" value="0.35">
        </div>
      </div>

    </div>

    <!-- Thunder Trigger -->
    <div style="margin-top: 16px;">
      <button class="trigger-btn" id="thunder-btn">⚡ TRIGGER DISTANT THUNDER</button>
    </div>
  </div>

  <script>
    // --- Ember Canvas Particle Animation ---
    const canvas = document.getElementById('ember-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const embers = Array.from({ length: 45 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 2.2 + 0.8,
      speedY: -(Math.random() * 0.4 + 0.1),
      speedX: (Math.random() - 0.5) * 0.3,
      alpha: Math.random() * 0.6 + 0.2
    }));

    function drawEmbers() {
      ctx.clearRect(0, 0, width, height);
      embers.forEach(e => {
        e.y += e.speedY;
        e.x += e.speedX;
        if (e.y < -10) { e.y = height + 10; e.x = Math.random() * width; }
        ctx.fillStyle = `rgba(226, 176, 65, ${e.alpha})`;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(drawEmbers);
    }
    drawEmbers();

    // --- Web Audio Procedural Synthesizers ---
    let audioCtx = null;
    let isPlaying = false;

    // Master & Channel Gain Nodes
    let masterGain, rainGain, fireGain, windGain, droneGain;

    function createNoiseBuffer(duration = 2) {
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      return buffer;
    }

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.8, audioCtx.currentTime);
      masterGain.connect(audioCtx.destination);

      const noiseBuffer = createNoiseBuffer();

      // 1. Rain Synthesizer (Filtered Pink/White Noise)
      const rainSource = audioCtx.createBufferSource();
      rainSource.buffer = noiseBuffer;
      rainSource.loop = true;

      const rainFilter = audioCtx.createBiquadFilter();
      rainFilter.type = 'lowpass';
      rainFilter.frequency.setValueAtTime(900, audioCtx.currentTime);

      rainGain = audioCtx.createGain();
      rainGain.gain.setValueAtTime(document.getElementById('rain-vol').value, audioCtx.currentTime);

      rainSource.connect(rainFilter);
      rainFilter.connect(rainGain);
      rainGain.connect(masterGain);
      rainSource.start();

      // 2. Wind Synthesizer (Modulated Bandpass Filter)
      const windSource = audioCtx.createBufferSource();
      windSource.buffer = noiseBuffer;
      windSource.loop = true;

      const windFilter = audioCtx.createBiquadFilter();
      windFilter.type = 'bandpass';
      windFilter.frequency.setValueAtTime(300, audioCtx.currentTime);
      windFilter.Q.setValueAtTime(3.0, audioCtx.currentTime);

      // LFO for wind howling effect
      const windLFO = audioCtx.createOscillator();
      const windLFOFilterGain = audioCtx.createGain();
      windLFO.frequency.setValueAtTime(0.15, audioCtx.currentTime);
      windLFOFilterGain.gain.setValueAtTime(180, audioCtx.currentTime);
      windLFO.connect(windLFOFilterGain);
      windLFOFilterGain.connect(windFilter.frequency);
      windLFO.start();

      windGain = audioCtx.createGain();
      windGain.gain.setValueAtTime(document.getElementById('wind-vol').value, audioCtx.currentTime);

      windSource.connect(windFilter);
      windFilter.connect(windGain);
      windGain.connect(masterGain);
      windSource.start();

      // 3. Campfire Crackle (Filtered Noise + Random Pop Spikes)
      const fireNoise = audioCtx.createBufferSource();
      fireNoise.buffer = noiseBuffer;
      fireNoise.loop = true;

      const fireFilter = audioCtx.createBiquadFilter();
      fireFilter.type = 'bandpass';
      fireFilter.frequency.setValueAtTime(1200, audioCtx.currentTime);

      fireGain = audioCtx.createGain();
      fireGain.gain.setValueAtTime(document.getElementById('fire-vol').value, audioCtx.currentTime);

      fireNoise.connect(fireFilter);
      fireFilter.connect(fireGain);
      fireGain.connect(masterGain);
      fireNoise.start();

      // Periodic Pops/Crackles
      setInterval(() => {
        if (!isPlaying || fireGain.gain.value === 0) return;
        const pop = audioCtx.createBufferSource();
        pop.buffer = noiseBuffer;
        const popFilter = audioCtx.createBiquadFilter();
        popFilter.type = 'highpass';
        popFilter.frequency.setValueAtTime(2500, audioCtx.currentTime);

        const popGain = audioCtx.createGain();
        popGain.gain.setValueAtTime(Math.random() * 0.15, audioCtx.currentTime);
        popGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

        pop.connect(popFilter);
        popFilter.connect(popGain);
        popGain.connect(fireGain);
        pop.start();
      }, 120);

      // 4. Arcane Synth Drone (C Minor Chord Oscillators)
      const frequencies = [65.41, 77.78, 98.00]; // C2, Eb2, G2
      droneGain = audioCtx.createGain();
      droneGain.gain.setValueAtTime(document.getElementById('drone-vol').value, audioCtx.currentTime);

      frequencies.forEach(freq => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(220, audioCtx.currentTime);

        osc.connect(filter);
        filter.connect(droneGain);
        osc.start();
      });

      droneGain.connect(masterGain);
    }

    // Trigger Distant Thunder
    function triggerThunder() {
      if (!audioCtx || !isPlaying) return;

      const thunderSource = audioCtx.createBufferSource();
      thunderSource.buffer = createNoiseBuffer(4);

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(120, audioCtx.currentTime);

      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.7, now + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 3.8);

      thunderSource.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      thunderSource.start();
    }

    // --- UI Event Listeners ---
    const powerBtn = document.getElementById('power-btn');
    const statusReadout = document.getElementById('status-readout');

    powerBtn.addEventListener('click', () => {
      if (!audioCtx) {
        initAudio();
        isPlaying = true;
        powerBtn.classList.add('active');
        powerBtn.innerText = '⏸ PAUSE SOUND';
        statusReadout.innerText = 'ACTIVE SANCTUARY';
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
        isPlaying = true;
        powerBtn.classList.add('active');
        powerBtn.innerText = '⏸ PAUSE SOUND';
        statusReadout.innerText = 'ACTIVE SANCTUARY';
      } else {
        audioCtx.suspend();
        isPlaying = false;
        powerBtn.classList.remove('active');
        powerBtn.innerText = '▶ INITIALIZE SOUND';
        statusReadout.innerText = 'PAUSED';
      }
    });

    // Volume Sliders Controls
    document.getElementById('rain-vol').addEventListener('input', (e) => {
      if (rainGain) rainGain.gain.setValueAtTime(e.target.value, audioCtx.currentTime);
    });

    document.getElementById('fire-vol').addEventListener('input', (e) => {
      if (fireGain) fireGain.gain.setValueAtTime(e.target.value, audioCtx.currentTime);
    });

    document.getElementById('wind-vol').addEventListener('input', (e) => {
      if (windGain) windGain.gain.setValueAtTime(e.target.value, audioCtx.currentTime);
    });

    document.getElementById('drone-vol').addEventListener('input', (e) => {
      if (droneGain) droneGain.gain.setValueAtTime(e.target.value, audioCtx.currentTime);
    });

    // Mute Toggles
    const setupToggle = (btnId, gainNodeGetter, sliderId) => {
      const btn = document.getElementById(btnId);
      btn.addEventListener('click', () => {
        btn.classList.toggle('active');
        const active = btn.classList.contains('active');
        btn.innerText = active ? 'ON' : 'OFF';
        const sliderVal = document.getElementById(sliderId).value;
        const gain = gainNodeGetter();
        if (gain) gain.gain.setValueAtTime(active ? sliderVal : 0, audioCtx.currentTime);
      });
    };

    setupToggle('rain-toggle', () => rainGain, 'rain-vol');
    setupToggle('fire-toggle', () => fireGain, 'fire-vol');
    setupToggle('wind-toggle', () => windGain, 'wind-vol');
    setupToggle('drone-toggle', () => droneGain, 'drone-vol');

    document.getElementById('thunder-btn').addEventListener('click', triggerThunder);
  </script>
</body>
</html>
