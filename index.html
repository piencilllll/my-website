<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CUTTING ROOM: RAGDOLL RECOVERY</title>
    <style>
        :root {
            --bg: #030712;
            --cyan: #00f3ff;
            --amber: #ffaa00;
            --purple: #bc13fe;
            --font: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: var(--bg); color: #fff;
            font-family: var(--font);
            display: flex; justify-content: center; align-items: center;
            cursor: none;
        }

        .viewport {
            width: 100vw; height: 100vh; max-width: 1000px; max-height: 650px;
            position: relative; background: #000;
            border: 2px solid #1e293b;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.1);
            display: flex; flex-direction: column; overflow: hidden;
        }

        canvas#gameCanvas { width: 100%; height: 100%; display: block; }

        .hud-overlay {
            position: absolute; top: 16px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 10;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.85); border: 1px solid #334155;
            padding: 10px 14px; border-radius: 4px; display: flex; flex-direction: column; gap: 4px;
        }

        .hud-title { font-size: 0.8rem; font-weight: bold; color: var(--cyan); letter-spacing: 1px; }
        .hud-sub { font-size: 0.7rem; color: #94a3b8; }

        .dialogue-box {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; height: 120px;
            background: rgba(3, 7, 18, 0.95);
            border: 2px solid #fff; border-radius: 6px;
            padding: 14px 18px; display: none; gap: 16px; align-items: center;
            z-index: 20;
        }

        .portrait {
            width: 70px; height: 70px; border: 2px solid #fff; background: #000;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        .dialogue-body { display: flex; flex-direction: column; justify-content: space-between; height: 100%; flex: 1; }
        .speaker { font-size: 0.85rem; font-weight: bold; letter-spacing: 2px; }
        .text-content { font-size: 0.95rem; line-height: 1.4; color: #f8fafc; }
        .prompt { font-size: 0.68rem; color: var(--amber); align-self: flex-end; animation: blink 0.8s infinite alternate; }

        @keyframes blink { from { opacity: 0.2; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="viewport">
        <canvas id="gameCanvas"></canvas>

        <div class="hud-overlay">
            <div class="hud-card">
                <div class="hud-title">ACT 1: STABILIZING THE DRAFT</div>
                <div class="hud-sub">[A/D] MOVE | [W/SPACE] JUMP | [E] INTERACT</div>
            </div>
            <div class="hud-card" style="align-items: flex-end;">
                <div class="hud-title" style="color: var(--amber);" id="coreTracker">CORES: 0 / 3</div>
                <div class="hud-sub" id="objectiveText">Find and absorb unstable white ink cores</div>
            </div>
        </div>

        <div class="dialogue-box" id="dialogueBox">
            <div class="portrait" id="portraitBox"></div>
            <div class="dialogue-body">
                <div class="speaker" id="speakerName">...</div>
                <div class="text-content" id="dialogueText">...</div>
                <div class="prompt">[PRESS E OR SPACE TO CONTINUE]</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const dialogueBox = document.getElementById('dialogueBox');
        const speakerName = document.getElementById('speakerName');
        const dialogueText = document.getElementById('dialogueText');
        const portraitBox = document.getElementById('portraitBox');
        const coreTracker = document.getElementById('coreTracker');
        const objectiveText = document.getElementById('objectiveText');

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio Synth
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(250, now);
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.15);
                gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'collect') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'talk') {
                osc.type = 'square'; osc.frequency.setValueAtTime(180, now);
                gain.gain.setValueAtTime(0.04, now); gain.gain.linearRampToValueAtTime(0, now + 0.04);
                osc.start(now); osc.stop(now + 0.04);
            }
        }

        // Custom Pixel Cursor
        const mouse = { x: 0, y: 0 };
        window.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
        });

        // Key State
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'KeyE' || e.code === 'Space') handleInteraction();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Physics Ragdoll Character (Orb-68)
        const orb = {
            x: 100, y: 450, vx: 0, vy: 0,
            radius: 18, grounded: false,
            // Squish physics properties
            scaleX: 1, scaleY: 1,
            rotation: 0, vRot: 0
        };

        const GRAVITY = 0.45;
        const FRICTION = 0.85;

        // Level Platforms
        const platforms = [
            { x: 0, y: 560, w: 1000, h: 90 }, // Main Floor
            { x: 220, y: 440, w: 140, h: 16 },
            { x: 440, y: 340, w: 160, h: 16 },
            { x: 700, y: 260, w: 180, h: 16 },
            { x: 80, y: 240, w: 130, h: 16 }
        ];

        // Collectibles & NPCs
        let coresCollected = 0;
        const cores = [
            { x: 280, y: 400, collected: false },
            { x: 520, y: 300, collected: false },
            { x: 140, y: 200, collected: false }
        ];

        const vektor = { x: 820, y: 204, w: 28, h: 56 };

        // Dialogue System
        let inDialogue = false;
        let dialogueTree = [];
        let dialogueIndex = 0;

        const introDialogue = [
            { speaker: "Vektor", text: "Orb! You're awake. Don't let your ragdoll core collapse. The draft is destabilizing!", color: "#ffaa00" },
            { speaker: "Orb-68", text: "* (I feel bouncy... like an unrendered sketch.)", color: "#00f3ff" },
            { speaker: "Vektor", text: "Jump up the platforms and absorb the 3 White Ink Cores to lock down this stanza!", color: "#ffaa00" }
        ];

        const victoryDialogue = [
            { speaker: "Vektor", text: "Excellent work! All three cores are absorbed. The stanza floor stabilized.", color: "#ffaa00" },
            { speaker: "Orb-68", text: "* (We saved this layer from being erased!)", color: "#00f3ff" }
        ];

        function triggerDialogue(lines) {
            inDialogue = true;
            dialogueTree = lines;
            dialogueIndex = 0;
            dialogueBox.style.display = 'flex';
            renderDialogueStep();
        }

        function renderDialogueStep() {
            const current = dialogueTree[dialogueIndex];
            speakerName.innerText = current.speaker.toUpperCase();
            speakerName.style.color = current.color;
            dialogueText.innerText = current.text;
            playSound('talk');

            portraitBox.innerHTML = current.speaker === 'Vektor' 
                ? '<div style="width:24px;height:24px;background:#ffaa00;"></div>'
                : '<div style="width:24px;height:24px;background:#00f3ff;border-radius:50%;"></div>';
        }

        function handleInteraction() {
            if (inDialogue) {
                dialogueIndex++;
                if (dialogueIndex < dialogueTree.length) {
                    renderDialogueStep();
                } else {
                    inDialogue = false;
                    dialogueBox.style.display = 'none';
                }
                return;
            }

            // Check NPC interaction
            const distToVektor = Math.hypot(orb.x - (vektor.x + 14), orb.y - (vektor.y + 28));
            if (distToVektor < 60) {
                if (coresCollected === 3) {
                    triggerDialogue(victoryDialogue);
                } else {
                    triggerDialogue(introDialogue);
                }
            }
        }

        // --- MAIN GAME LOOP ---
        function updatePhysics() {
            if (inDialogue) return;

            // Horizontal Controls
            if (keys['KeyA'] || keys['ArrowLeft']) {
                orb.vx -= 0.7;
                orb.vRot -= 0.05;
            }
            if (keys['KeyD'] || keys['ArrowRight']) {
                orb.vx += 0.7;
                orb.vRot += 0.05;
            }

            // Jump
            if ((keys['KeyW'] || keys['Space'] || keys['ArrowUp']) && orb.grounded) {
                orb.vy = -11;
                orb.grounded = false;
                orb.scaleX = 0.6; // Stretch up
                orb.scaleY = 1.4;
                playSound('jump');
            }

            // Physics integration
            orb.vy += GRAVITY;
            orb.vx *= FRICTION;
            orb.x += orb.vx;
            orb.y += orb.vy;

            orb.rotation += orb.vRot;
            orb.vRot *= 0.92;

            // Spring return for squish physics
            orb.scaleX += (1 - orb.scaleX) * 0.12;
            orb.scaleY += (1 - orb.scaleY) * 0.12;

            // Platform Collisions
            orb.grounded = false;
            platforms.forEach(plat => {
                if (orb.x + orb.radius > plat.x && orb.x - orb.radius < plat.x + plat.w) {
                    if (orb.y + orb.radius >= plat.y && orb.y - orb.radius < plat.y + plat.h && orb.vy > 0) {
                        orb.y = plat.y - orb.radius;
                        if (orb.vy > 2) {
                            // Impact squish
                            orb.scaleX = 1.3;
                            orb.scaleY = 0.7;
                        }
                        orb.vy = 0;
                        orb.grounded = true;
                    }
                }
            });

            // Boundary limits
            orb.x = Math.max(orb.radius, Math.min(canvas.width - orb.radius, orb.x));

            // Core Pickup Checks
            cores.forEach(c => {
                if (!c.collected) {
                    const d = Math.hypot(orb.x - c.x, orb.y - c.y);
                    if (d < orb.radius + 14) {
                        c.collected = true;
                        coresCollected++;
                        playSound('collect');
                        coreTracker.innerText = `CORES: ${coresCollected} / 3`;
                        if (coresCollected === 3) {
                            objectiveText.innerText = "Talk to Vektor to complete lockdown!";
                            objectiveText.style.color = "var(--cyan)";
                        }
                    }
                }
            });
        }

        let time = 0;
        function render() {
            time += 0.04;
            ctx.fillStyle = '#030712';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background Atmospheric Grid
            ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)'; ctx.lineWidth = 1;
            for(let x=0; x<canvas.width; x+=40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }

            // Draw Platforms
            platforms.forEach(plat => {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
                ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
            });

            // Draw Cores
            cores.forEach(c => {
                if (!c.collected) {
                    const floatY = c.y + Math.sin(time * 4) * 5;
                    ctx.fillStyle = '#fff';
                    ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 12;
                    ctx.beginPath(); ctx.arc(c.x, floatY, 8, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            // Draw Vektor NPC
            ctx.fillStyle = '#ffaa00';
            ctx.fillRect(vektor.x, vektor.y, vektor.w, vektor.h);
            ctx.fillStyle = '#000'; // Eyes
            ctx.fillRect(vektor.x + 6, vektor.y + 12, 4, 6);
            ctx.fillRect(vektor.x + 18, vektor.y + 12, 4, 6);

            const distToV = Math.hypot(orb.x - (vektor.x + 14), orb.y - (vektor.y + 28));
            if (distToV < 60) {
                ctx.fillStyle = '#fff'; ctx.font = 'bold 0.75rem "Courier New"'; ctx.textAlign = 'center';
                ctx.fillText('[E] TALK', vektor.x + 14, vektor.y - 12);
            }

            // Draw Ragdoll Orb-68
            ctx.save();
            ctx.translate(orb.x, orb.y);
            ctx.rotate(orb.rotation);
            ctx.scale(orb.scaleX, orb.scaleY);

            // Outer Squishy Shell
            ctx.fillStyle = '#00f3ff';
            ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 15;
            ctx.beginPath(); ctx.arc(0, 0, orb.radius, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            // Expressive Eyes
            ctx.fillStyle = '#000';
            ctx.fillRect(-6, -4, 4, 7);
            ctx.fillRect(3, -4, 4, 7);

            ctx.restore();

            // Custom Pixel Cursor
            ctx.fillStyle = '#00f3ff';
            ctx.fillRect(mouse.x, mouse.y, 8, 2);
            ctx.fillRect(mouse.x, mouse.y, 2, 8);

            updatePhysics();
            requestAnimationFrame(render);
        }

        // Auto Start Dialogue on Load
        setTimeout(() => triggerDialogue(introDialogue), 500);

        render();
    </script>
</body>
</html>
