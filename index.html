<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanctuary - Retro Dark Fantasy Mixer</title>
  <style>
    :root {
      --bg-dark: #07080c;
      --panel-bg: rgba(15, 17, 26, 0.88);
      --border-color: #3b334d;
      --border-glow: #7a52aa;
      --accent-gold: #e2b041;
      --accent-purple: #9d65c9;
      --accent-cyan: #4fe0b0;
      --accent-red: #ff4a6e;
      --text-muted: #8c829e;
      --text-bright: #f0e6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body, html {
      width: 100%; height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-bright);
      font-family: 'Courier New', Courier, monospace;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
    }

    /* Thunder Lighting Flash Overlay */
    #flash-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #e2f1ff;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 0.05s ease-out;
    }

    /* Ambient Ember Canvas */
    #ember-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Retro CRT Grain Overlay */
    .grain-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 40%, rgba(3, 4, 7, 0.85) 100%),
                  repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
    }

    /* Main Container */
    .mixer-container {
      position: relative;
      z-index: 10;
      width: 92%;
      max-width: 780px;
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      box-shadow: 0 0 30px rgba(122, 82, 170, 0.25), inset 0 0 20px rgba(0,0,0,0.85);
      border-radius: 8px;
      padding: 24px;
      backdrop-filter: blur(10px);
      max-height: 90vh;
      overflow-y: auto;
    }

    /* Header */
    header {
      text-align: center;
      border-bottom: 2px dashed var(--border-color);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: var(--accent-gold);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(226, 176, 65, 0.4);
    }

    header p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Master Controls */
    .master-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
      padding: 12px 18px;
      border-radius: 6px;
      border: 1px solid rgba(122, 82, 170, 0.3);
      margin-bottom: 20px;
    }

    .btn-main {
      background: var(--accent-purple);
      color: #fff;
      border: none;
      padding: 10px 22px;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 4px 0 #5c387d;
      transition: all 0.1s ease;
    }

    .btn-main:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #5c387d;
    }

    .btn-main.active {
      background: var(--accent-gold);
      color: #111;
      box-shadow: 0 4px 0 #9c731e;
    }

    /* Sound Catalogue Grid */
    .catalogue-section-title {
      font-size: 0.8rem;
      color: var(--accent-gold);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .catalogue-section-title::after {
      content: ''; flex: 1; height: 1px; background: var(--border-color);
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .channel-card {
      background: rgba(8, 10, 16, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .channel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .channel-title {
      font-size: 0.8rem;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toggle-btn {
      background: transparent;
      border: 1px solid var(--text-muted);
      color: var(--text-muted);
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 3px;
      cursor: pointer;
    }

    .toggle-btn.active {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      background: rgba(79, 224, 176, 0.1);
    }

    /* Custom Sliders */
    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #1a1824;
      border-radius: 3px;
      outline: none;
      border: 1px solid #2a2538;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 2px;
      background: var(--accent-gold);
      cursor: pointer;
      box-shadow: 0 0 6px var(--accent-gold);
    }

    .trigger-btn {
      background: rgba(226, 176, 65, 0.15);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 12px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      letter-spacing: 1.5px;
      transition: all 0.15 ease;
      box-shadow: 0 0 12px rgba(226, 176, 65, 0.1);
    }

    .trigger-btn:hover {
      background: rgba(226, 176, 65, 0.3);
      box-shadow: 0 0 18px rgba(226, 176, 65, 0.25);
    }

    .trigger-btn:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div id="flash-overlay"></div>
  <canvas id="ember-canvas"></canvas>
  <div class="grain-overlay"></div>

  <div class="mixer-container">
    <header>
      <h1>Sanctuary Audio Vault</h1>
      <p>Procedural Dark Fantasy Soundscape Engine</p>
    </header>

    <div class="master-bar">
      <button class="btn-main" id="power-btn">▶ INITIALIZE ALL SOUNDS</button>
      <div style="font-size: 0.75rem; color: var(--text-muted);" id="status-readout">SYSTEM STANDBY</div>
    </div>

    <!-- Catalogue Section 1: Weather & Environment -->
    <div class="catalogue-section-title"><span>🌤️</span> Environmental Elements</div>
    <div class="channels-grid">

      <!-- Rainstorm -->
      <div class="channel-card">
        <div class="channel-header">
          <div class="channel-title"><span>🌧️</span> Rainstorm</div>
          <button class="toggle-btn active" data-channel="rain">ON</button>
        </div>
        <div class="slider-container">
          <input type="range" id="rain-vol" min="0" max="1" step="0.01" value="0.5">
        </div>
      </div>

      <!-- Hearth Fire -->
      <div class="channel-card">
        <div class="channel-header">
          <div class="channel-title"><span>🔥</span> Hearth Fire</div>
          <button class="toggle-btn active" data-channel="fire">ON</button>
        </div>
        <div class="slider-container">
          <input type="range" id="fire-vol" min="0" max="1" step="0.01" value="0.4">
        </div>
      </div>

      <!-- Howling Wind -->
      <div class="channel-card">
        <div class="channel-header">
          <div class="channel-title"><span>🌬️</span> Howling Wind</div>
          <button class="toggle-btn active" data-channel="wind">ON</button>
        </div>
        <div class="slider-container">
          <input type="range" id="wind-vol" min="0" max="1" step="0.01" value="0.3">
        </div>
      </div>

      <!-- Night Insects -->
      <div class="channel-card">
        <div class="channel-header">
          <div class="channel-title"><span>🦗</span> Night Insects</div>
          <button class="toggle-btn active" data-channel="insects">ON</button>
        </div>
        <div class="slider-container">
          <input type="range" id="insects-vol" min="0" max="1" step="0.01" value="0.25">
        </div>
      </div>

    </div>

    <!-- Catalogue Section 2: Mystical & Underground -->
    <div class="catalogue-section-title"><span>🔮</span> Mystical & Subterranean</div>
    <div class="channels-grid">

      <!-- Arcane Drone -->
      <div class="channel-card">
        <div class="channel-header">
          <div class="channel-title"><span>🔮</span> Arcane Drone</div>
          <button class="toggle-btn active" data-channel="drone">ON</button>
        </div>
        <div class="slider-container">
          <input type="range" id="drone-vol" min="0" max="1" step="0.01" value="0.35">
        </div>
      </div>

      <!-- Underground Stream -->
      <div class="channel-card">
        <div class="channel-header">
          <div class="channel-title"><span>🌊</span> Deep Stream</div>
          <button class="toggle-btn active" data-channel="stream">ON</button>
        </div>
        <div class="slider-container">
          <input type="range" id="stream-vol" min="0" max="1" step="0.01" value="0.3">
        </div>
      </div>

      <!-- Temple Chimes -->
      <div class="channel-card">
        <div class="channel-header">
          <div class="channel-title"><span>🔔</span> Temple Chimes</div>
          <button class="toggle-btn active" data-channel="chimes">ON</button>
        </div>
        <div class="slider-container">
          <input type="range" id="chimes-vol" min="0" max="1" step="0.01" value="0.3">
        </div>
      </div>

      <!-- Dungeon Echoes -->
      <div class="channel-card">
        <div class="channel-header">
          <div class="channel-title"><span>⛓️</span> Dungeon Echoes</div>
          <button class="toggle-btn active" data-channel="echoes">ON</button>
        </div>
        <div class="slider-container">
          <input type="range" id="echoes-vol" min="0" max="1" step="0.01" value="0.2">
        </div>
      </div>

    </div>

    <!-- Special Action Triggers -->
    <div class="catalogue-section-title"><span>⚡</span> Event Triggers</div>
    <div>
      <button class="trigger-btn" id="thunder-btn">⚡ STRIKE THUNDERSTORM ⚡</button>
    </div>
  </div>

  <script>
    // --- Ember Canvas Particle Animation ---
    const canvas = document.getElementById('ember-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const embers = Array.from({ length: 50 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 2.2 + 0.8,
      speedY: -(Math.random() * 0.4 + 0.1),
      speedX: (Math.random() - 0.5) * 0.3,
      alpha: Math.random() * 0.6 + 0.2
    }));

    function drawEmbers() {
      ctx.clearRect(0, 0, width, height);
      embers.forEach(e => {
        e.y += e.speedY;
        e.x += e.speedX;
        if (e.y < -10) { e.y = height + 10; e.x = Math.random() * width; }
        ctx.fillStyle = `rgba(226, 176, 65, ${e.alpha})`;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(drawEmbers);
    }
    drawEmbers();

    // --- Web Audio Engine & Synthesizers ---
    let audioCtx = null;
    let isPlaying = false;
    let masterGain = null;
    let noiseBuffer = null;

    const gains = {};
    const toggles = {
      rain: true, fire: true, wind: true, insects: true,
      drone: true, stream: true, chimes: true, echoes: true
    };

    function ensureAudioContext() {
      if (!audioCtx) {
        initAudio();
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      isPlaying = true;
      document.getElementById('power-btn').classList.add('active');
      document.getElementById('power-btn').innerText = '⏸ PAUSE ALL SOUNDS';
      document.getElementById('status-readout').innerText = 'SANCTUARY ACTIVE';
    }

    function createNoiseBuffer(duration = 3) {
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      return buffer;
    }

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.85, audioCtx.currentTime);
      masterGain.connect(audioCtx.destination);

      noiseBuffer = createNoiseBuffer(3);

      // Helper Gain Generator
      const setupGain = (key, sliderId) => {
        const gain = audioCtx.createGain();
        const val = parseFloat(document.getElementById(sliderId).value);
        gain.gain.setValueAtTime(toggles[key] ? val : 0, audioCtx.currentTime);
        gain.connect(masterGain);
        gains[key] = gain;
        return gain;
      };

      // 1. Rainstorm
      const rainNode = audioCtx.createBufferSource();
      rainNode.buffer = noiseBuffer;
      rainNode.loop = true;
      const rainFilter = audioCtx.createBiquadFilter();
      rainFilter.type = 'lowpass';
      rainFilter.frequency.setValueAtTime(850, audioCtx.currentTime);
      rainNode.connect(rainFilter);
      rainFilter.connect(setupGain('rain', 'rain-vol'));
      rainNode.start();

      // 2. Hearth Fire
      const fireNode = audioCtx.createBufferSource();
      fireNode.buffer = noiseBuffer;
      fireNode.loop = true;
      const fireFilter = audioCtx.createBiquadFilter();
      fireFilter.type = 'bandpass';
      fireFilter.frequency.setValueAtTime(1100, audioCtx.currentTime);
      const fireG = setupGain('fire', 'fire-vol');
      fireNode.connect(fireFilter);
      fireFilter.connect(fireG);
      fireNode.start();

      // Fire Crackle Pops
      setInterval(() => {
        if (!isPlaying || !toggles.fire || gains.fire.gain.value === 0) return;
        const pop = audioCtx.createBufferSource();
        pop.buffer = noiseBuffer;
        const popF = audioCtx.createBiquadFilter();
        popF.type = 'highpass';
        popF.frequency.setValueAtTime(2200, audioCtx.currentTime);
        const popG = audioCtx.createGain();
        popG.gain.setValueAtTime(Math.random() * 0.18, audioCtx.currentTime);
        popG.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        pop.connect(popF);
        popF.connect(popG);
        popG.connect(fireG);
        pop.start();
      }, 100);

      // 3. Howling Wind
      const windNode = audioCtx.createBufferSource();
      windNode.buffer = noiseBuffer;
      windNode.loop = true;
      const windFilter = audioCtx.createBiquadFilter();
      windFilter.type = 'bandpass';
      windFilter.frequency.setValueAtTime(320, audioCtx.currentTime);
      windFilter.Q.setValueAtTime(2.5, audioCtx.currentTime);

      const windLFO = audioCtx.createOscillator();
      const windLFOGain = audioCtx.createGain();
      windLFO.frequency.setValueAtTime(0.12, audioCtx.currentTime);
      windLFOGain.gain.setValueAtTime(160, audioCtx.currentTime);
      windLFO.connect(windLFOGain);
      windLFOGain.connect(windFilter.frequency);
      windLFO.start();

      windNode.connect(windFilter);
      windFilter.connect(setupGain('wind', 'wind-vol'));
      windNode.start();

      // 4. Night Insects (Chirps)
      const insectG = setupGain('insects', 'insects-vol');
      setInterval(() => {
        if (!isPlaying || !toggles.insects || insectG.gain.value === 0) return;
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(4200 + Math.random() * 600, audioCtx.currentTime);
        const g = audioCtx.createGain();
        const now = audioCtx.currentTime;
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.08, now + 0.03);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(g);
        g.connect(insectG);
        osc.start(now);
        osc.stop(now + 0.13);
      }, 350);

      // 5. Arcane Drone
      const droneG = setupGain('drone', 'drone-vol');
      [65.41, 77.78, 98.00, 130.81].forEach(freq => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(210, audioCtx.currentTime);
        osc.connect(filter);
        filter.connect(droneG);
        osc.start();
      });

      // 6. Underground Stream
      const streamNode = audioCtx.createBufferSource();
      streamNode.buffer = noiseBuffer;
      streamNode.loop = true;
      const streamFilter = audioCtx.createBiquadFilter();
      streamFilter.type = 'lowpass';
      streamFilter.frequency.setValueAtTime(450, audioCtx.currentTime);
      
      const streamLFO = audioCtx.createOscillator();
      const streamLFOG = audioCtx.createGain();
      streamLFO.frequency.setValueAtTime(0.8, audioCtx.currentTime);
      streamLFOG.gain.setValueAtTime(120, audioCtx.currentTime);
      streamLFO.connect(streamLFOG);
      streamLFOG.connect(streamFilter.frequency);
      streamLFO.start();

      streamNode.connect(streamFilter);
      streamFilter.connect(setupGain('stream', 'stream-vol'));
      streamNode.start();

      // 7. Temple Chimes
      const chimesG = setupGain('chimes', 'chimes-vol');
      const chimePitchSet = [1046.5, 1174.66, 1318.51, 1567.98, 1760.0];
      setInterval(() => {
        if (!isPlaying || !toggles.chimes || chimesG.gain.value === 0) return;
        if (Math.random() > 0.45) return;
        const pitch = chimePitchSet[Math.floor(Math.random() * chimePitchSet.length)];
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
        const g = audioCtx.createGain();
        const now = audioCtx.currentTime;
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.12, now + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);
        osc.connect(g);
        g.connect(chimesG);
        osc.start(now);
        osc.stop(now + 2.9);
      }, 1200);

      // 8. Dungeon Echoes
      const echoesG = setupGain('echoes', 'echoes-vol');
      setInterval(() => {
        if (!isPlaying || !toggles.echoes || echoesG.gain.value === 0) return;
        if (Math.random() > 0.35) return;
        const osc = audioCtx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140 + Math.random() * 80, audioCtx.currentTime);
        const g = audioCtx.createGain();
        const now = audioCtx.currentTime;
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.15, now + 0.08);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
        osc.connect(g);
        g.connect(echoesG);
        osc.start(now);
        osc.stop(now + 1.9);
      }, 2000);
    }

    // --- Fixed Thunderstorm Trigger & Lighting Effect ---
    function triggerThunder() {
      ensureAudioContext();

      // Lightning Flash Effect
      const flash = document.getElementById('flash-overlay');
      flash.style.opacity = '0.45';
      setTimeout(() => { flash.style.opacity = '0'; }, 80);
      setTimeout(() => { flash.style.opacity = '0.25'; }, 160);
      setTimeout(() => { flash.style.opacity = '0'; }, 280);

      // Synthesize Thunder Audio
      const now = audioCtx.currentTime;
      const thunderSource = audioCtx.createBufferSource();
      thunderSource.buffer = noiseBuffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(180, now);
      filter.frequency.exponentialRampToValueAtTime(40, now + 3.5);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.95, now + 0.12); // Primary Strike
      gain.gain.linearRampToValueAtTime(0.35, now + 0.5);
      gain.gain.linearRampToValueAtTime(0.6, now + 1.1);  // Rolling Rumble
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 4.2); // Decay

      thunderSource.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      thunderSource.start(now);
    }

    // --- Master Power Controls ---
    const powerBtn = document.getElementById('power-btn');
    const statusReadout = document.getElementById('status-readout');

    powerBtn.addEventListener('click', () => {
      if (!audioCtx) {
        ensureAudioContext();
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
        isPlaying = true;
        powerBtn.classList.add('active');
        powerBtn.innerText = '⏸ PAUSE ALL SOUNDS';
        statusReadout.innerText = 'SANCTUARY ACTIVE';
      } else {
        audioCtx.suspend();
        isPlaying = false;
        powerBtn.classList.remove('active');
        powerBtn.innerText = '▶ INITIALIZE ALL SOUNDS';
        statusReadout.innerText = 'PAUSED';
      }
    });

    // --- Dynamic Slider Listeners ---
    ['rain', 'fire', 'wind', 'insects', 'drone', 'stream', 'chimes', 'echoes'].forEach(key => {
      const slider = document.getElementById(`${key}-vol`);
      slider.addEventListener('input', (e) => {
        if (gains[key] && toggles[key]) {
          gains[key].gain.setValueAtTime(parseFloat(e.target.value), audioCtx.currentTime);
        }
      });
    });

    // --- Toggle Buttons ---
    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const channel = btn.getAttribute('data-channel');
        toggles[channel] = !toggles[channel];
        btn.classList.toggle('active', toggles[channel]);
        btn.innerText = toggles[channel] ? 'ON' : 'OFF';

        if (gains[channel]) {
          const sliderVal = parseFloat(document.getElementById(`${channel}-vol`).value);
          gains[channel].gain.setValueAtTime(toggles[channel] ? sliderVal : 0, audioCtx.currentTime);
        }
      });
    });

    document.getElementById('thunder-btn').addEventListener('click', triggerThunder);
  </script>
</body>
</html>
