<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECTOR ZERO // THE DESCENT</title>
    <style>
        :root {
            --bg: #020307;
            --cyan: #00f3ff;
            --amber: #ffaa00;
            --purple: #bc13fe;
            --pink: #ff66cc;
            --text: #f8fafc;
            --dim: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Page locked - no moving or scrolling */
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SCANLINE OVERLAY */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 0, 0, 0.4) 50%, rgba(0, 0, 0, 0.4));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        /* SCREEN FRAME */
        .viewport {
            width: 100vw;
            height: 100vh;
            max-width: 1000px;
            max-height: 650px;
            position: relative;
            background: #000;
            border: 2px solid #1e293b;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        canvas#mainCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* UNDERTALE / DELTARUNE TEXT BOX */
        .dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            height: 130px;
            background: rgba(4, 6, 12, 0.95);
            border: 3px solid #fff;
            border-radius: 6px;
            padding: 12px 16px;
            display: none; /* Managed by JS */
            gap: 16px;
            align-items: center;
            z-index: 10;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        .portrait-container {
            width: 90px;
            height: 90px;
            border: 2px solid var(--cyan);
            background: #000;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas#portraitCanvas {
            width: 80px;
            height: 80px;
        }

        .dialogue-content {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            flex: 1;
        }

        .speaker-name {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--cyan);
            letter-spacing: 2px;
        }

        .dialogue-text {
            font-size: 1.05rem;
            line-height: 1.4;
            color: #fff;
            height: 50px;
        }

        .prompt-next {
            font-size: 0.75rem;
            color: var(--amber);
            align-self: flex-end;
            animation: blink 0.8s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        /* UI OVERLAY FOR RPG GAMEPLAY */
        .game-hud {
            position: absolute;
            top: 15px;
            left: 20px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
            font-family: 'Segoe UI', sans-serif;
        }

        .hud-title {
            font-size: 0.75rem;
            color: var(--cyan);
            font-weight: 800;
            letter-spacing: 2px;
        }

        .hud-keys {
            font-size: 0.7rem;
            color: var(--dim);
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #1e293b;
        }

        .key-tag {
            color: var(--amber);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div class="viewport">
        <!-- CANVAS FOR CINEMATICS & 2.5D GAMEPLAY -->
        <canvas id="mainCanvas"></canvas>

        <!-- DELTARUNE / ONESHOT STYLE DIALOGUE BOX -->
        <div class="dialogue-box" id="dialogueBox">
            <div class="portrait-container">
                <canvas id="portraitCanvas" width="80" height="80"></canvas>
            </div>
            <div class="dialogue-content">
                <div class="speaker-name" id="speakerName">ORB-68</div>
                <div class="dialogue-text" id="dialogueText">...</div>
                <div class="prompt-next">[PRESS SPACE / ENTER]</div>
            </div>
        </div>

        <!-- HUD FOR 2.5D OVERWORLD -->
        <div class="game-hud" id="gameHud">
            <div class="hud-title">ZONE 01 // KINETIC MATRIX</div>
            <div class="hud-keys">
                MOVE: <span class="key-tag">WASD / ARROWS</span> | INTERACT: <span class="key-tag">SPACE</span> | PULSE: <span class="key-tag">E</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const pCanvas = document.getElementById('portraitCanvas');
        const pCtx = pCanvas.getContext('2d');

        const dialogueBox = document.getElementById('dialogueBox');
        const speakerName = document.getElementById('speakerName');
        const dialogueText = document.getElementById('dialogueText');
        const gameHud = document.getElementById('gameHud');

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game States: 'INTRO_CINEMATIC', 'DIALOGUE_CINEMATIC', 'PLAYING_RPG'
        let gameState = 'INTRO_CINEMATIC';

        // --- INTRO CINEMATIC LORE SEQUENCE ---
        const introSlides = [
            {
                text: "BEFORE THE BOUNDARIES OF THE SECTOR WERE DRAWN...",
                sub: "An infinite void existed in absolute silence.",
                visual: "VOID"
            },
            {
                text: "THEN CAME THE DENSITY COLLAPSE.",
                sub: "Raw kinetic matter crystallized into sentient physical forms.",
                visual: "CRYSTAL"
            },
            {
                text: "7 SUBJECTS WERE AWAKENED TO GUARDIAN THE MATRIX.",
                sub: "Orb-68 was the first to open its eyes...",
                visual: "ORB_AWAKEN"
            }
        ];

        let currentIntroSlide = 0;
        let slideAlpha = 0;
        let slideTimer = 0;

        // --- DIALOGUE CUTSCENE DATA ---
        const dialogueSequence = [
            {
                speaker: "Orb-68",
                color: "#00f3ff",
                mood: "orb_normal",
                text: "Vektor... do you ever feel like this floor isn't entirely real?"
            },
            {
                speaker: "Vektor",
                color: "#ffaa00",
                mood: "vektor_normal",
                text: "Real? We're rendered in a 2.5D isometric plane, Orb. Nothing here is real."
            },
            {
                speaker: "Orb-68",
                color: "#00f3ff",
                mood: "orb_surprised",
                text: "Wait, WHAT?! So the dark void around us is just empty canvas memory?!"
            },
            {
                speaker: "Vektor",
                color: "#ffaa00",
                mood: "vektor_hat",
                text: "Exactly. Now stop staring into the camera and use [WASD] to explore the sector."
            },
            {
                speaker: "Orb-68",
                color: "#00f3ff",
                mood: "orb_happy",
                text: "Alright! Let's check out the area! Press SPACE or E to interact!"
            }
        ];

        let dialogueIndex = 0;
        let typewriterText = "";
        let typewriterTarget = "";
        let typewriterCharIdx = 0;

        // --- 2.5D ONESHOT / DELTARUNE PLAYER & WORLD ENGINE ---
        const player = {
            x: 500,
            y: 350,
            z: 0, // Pseudo height/depth
            vx: 0,
            vy: 0,
            speed: 3.2,
            radius: 16,
            bounce: 0,
            facing: 'down',
            pulseRing: 0
        };

        const keys = {};

        // Interactive World Objects
        const worldObjects = [
            { x: 350, y: 250, type: 'crystal', color: '#bc13fe', label: 'KINETIC CRYSTAL', talk: "* A glowing kinetic crystal. It hums with 2.5D energy." },
            { x: 650, y: 280, type: 'vektor_npc', color: '#ffaa00', label: 'VEKTOR', talk: "* Vektor: Adjusting my hat. Don't slip on the grid tiles." },
            { x: 500, y: 180, type: 'monolith', color: '#00ff66', label: 'SECTOR ZERO MONOLITH', talk: "* Sector Terminal: ALL SYSTEMS OPERATIONAL." },
            { x: 250, y: 450, type: 'ghost_npc', color: '#ff66cc', label: 'SHADOW GHOST', talk: "* Shadow Ghost: Cool sunglasses, right? I phase through dimensions." }
        ];

        let currentInteractObject = null;

        // Key Listeners
        window.addEventListener('keydown', e => {
            keys[e.code] = true;

            if (e.code === 'Space' || e.code === 'Enter') {
                if (gameState === 'INTRO_CINEMATIC') {
                    nextIntroSlide();
                } else if (gameState === 'DIALOGUE_CINEMATIC') {
                    advanceDialogue();
                } else if (gameState === 'PLAYING_RPG') {
                    if (currentInteractObject) {
                        triggerNpcDialogue(currentInteractObject);
                    }
                }
            }

            if (e.code === 'KeyE' && gameState === 'PLAYING_RPG') {
                player.pulseRing = 35; // Trigger kinetic pulse animation
            }
        });

        window.addEventListener('keyup', e => keys[e.code] = false);

        // --- INTRO CINEMATIC LOGIC ---
        function nextIntroSlide() {
            currentIntroSlide++;
            slideAlpha = 0;
            if (currentIntroSlide >= introSlides.length) {
                gameState = 'DIALOGUE_CINEMATIC';
                startDialogueSequence();
            }
        }

        // --- DIALOGUE SYSTEM ---
        function startDialogueSequence() {
            dialogueBox.style.display = 'flex';
            dialogueIndex = 0;
            loadDialogueStep();
        }

        function loadDialogueStep() {
            const current = dialogueSequence[dialogueIndex];
            speakerName.innerText = current.speaker.toUpperCase();
            speakerName.style.color = current.color;

            typewriterTarget = current.text;
            typewriterText = "";
            typewriterCharIdx = 0;

            drawPortrait(current.mood);
        }

        function advanceDialogue() {
            // If still typing, finish instantly
            if (typewriterText.length < typewriterTarget.length) {
                typewriterText = typewriterTarget;
                dialogueText.innerText = typewriterText;
                return;
            }

            dialogueIndex++;
            if (dialogueIndex < dialogueSequence.length) {
                loadDialogueStep();
            } else {
                // End Cutscene -> Start RPG Gameplay
                dialogueBox.style.display = 'none';
                gameHud.style.display = 'flex';
                gameState = 'PLAYING_RPG';
            }
        }

        function triggerNpcDialogue(obj) {
            gameState = 'DIALOGUE_CINEMATIC';
            dialogueBox.style.display = 'flex';
            
            dialogueSequence.length = 0; // Clear cutscene dialogue
            dialogueSequence.push({
                speaker: obj.label,
                color: obj.color,
                mood: obj.type === 'vektor_npc' ? 'vektor_normal' : 'orb_happy',
                text: obj.talk
            });
            dialogueIndex = 0;
            loadDialogueStep();
        }

        // --- PORTRAIT RENDERER (UNDERTALE STYLE) ---
        function drawPortrait(mood) {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            pCtx.fillStyle = '#04060c';
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);

            pCtx.save();
            pCtx.translate(40, 40);

            if (mood.startsWith('orb')) {
                // Orb-68 Droplet Portrait
                pCtx.fillStyle = '#00f3ff';
                pCtx.beginPath();
                pCtx.moveTo(0, -26);
                pCtx.bezierCurveTo(22, -2, 24, 22, 0, 22);
                pCtx.bezierCurveTo(-24, 22, -22, -2, 0, -26);
                pCtx.fill();

                // Eyes
                pCtx.fillStyle = '#fff';
                pCtx.beginPath(); pCtx.arc(-6, 2, 5, 0, Math.PI*2); pCtx.arc(6, 2, 5, 0, Math.PI*2); pCtx.fill();
                pCtx.fillStyle = '#000';
                pCtx.beginPath();

                if (mood === 'orb_surprised') {
                    pCtx.arc(-6, 2, 3, 0, Math.PI*2); pCtx.arc(6, 2, 3, 0, Math.PI*2); pCtx.fill();
                    pCtx.strokeStyle = '#000'; pCtx.lineWidth = 2;
                    pCtx.beginPath(); pCtx.arc(0, 12, 4, 0, Math.PI*2); pCtx.stroke();
                } else {
                    pCtx.arc(-4, 2, 2.5, 0, Math.PI*2); pCtx.arc(8, 2, 2.5, 0, Math.PI*2); pCtx.fill();
                    // Smile
                    pCtx.strokeStyle = '#000'; pCtx.lineWidth = 2;
                    pCtx.beginPath(); pCtx.arc(0, 8, 5, 0, Math.PI); pCtx.stroke();
                }
            } 
            else if (mood.startsWith('vektor')) {
                // Vektor Humanoid Portrait
                pCtx.fillStyle = '#ffaa00';
                pCtx.fillRect(-12, -10, 24, 24);
                // Eyes & Face
                pCtx.fillStyle = '#000';
                pCtx.fillRect(-7, -4, 4, 5); pCtx.fillRect(3, -4, 4, 5);
                pCtx.fillRect(-5, 6, 10, 2);
                // Hat
                pCtx.fillStyle = '#1e293b';
                pCtx.fillRect(-20, -14, 40, 5);
                pCtx.fillRect(-12, -26, 24, 12);
            }

            pCtx.restore();
        }

        // --- MAIN RENDER & GAME LOOP ---
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'INTRO_CINEMATIC') {
                renderIntroCinematic();
            } 
            else if (gameState === 'DIALOGUE_CINEMATIC' || gameState === 'PLAYING_RPG') {
                renderRPGWorld();

                if (gameState === 'PLAYING_RPG') {
                    updatePlayerPhysics();
                }

                // Update Typewriter Effect
                if (typewriterText.length < typewriterTarget.length) {
                    typewriterCharIdx += 0.6;
                    typewriterText = typewriterTarget.substring(0, Math.floor(typewriterCharIdx));
                    dialogueText.innerText = typewriterText;
                }
            }

            requestAnimationFrame(loop);
        }

        // --- INTRO CINEMATIC RENDERER ---
        function renderIntroCinematic() {
            slideTimer += 0.02;
            if (slideAlpha < 1) slideAlpha += 0.015;

            const slide = introSlides[currentIntroSlide];

            // Animated Canvas Backgrounds
            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2 - 40);

            if (slide.visual === 'VOID') {
                ctx.strokeStyle = `rgba(0, 243, 255, ${0.15 + Math.sin(slideTimer)*0.1})`;
                ctx.lineWidth = 1;
                for (let r = 20; r < 200; r += 30) {
                    ctx.beginPath();
                    ctx.arc(0, 0, r + Math.sin(slideTimer + r)*5, 0, Math.PI*2);
                    ctx.stroke();
                }
            } 
            else if (slide.visual === 'CRYSTAL') {
                ctx.fillStyle = '#bc13fe';
                ctx.rotate(slideTimer * 0.5);
                ctx.beginPath();
                ctx.moveTo(0, -50); ctx.lineTo(35, 0); ctx.lineTo(0, 50); ctx.lineTo(-35, 0);
                ctx.closePath();
                ctx.fill();
                ctx.shadowColor = '#bc13fe'; ctx.shadowBlur = 20;
            } 
            else if (slide.visual === 'ORB_AWAKEN') {
                ctx.fillStyle = '#00f3ff';
                ctx.beginPath();
                ctx.arc(0, 0, 30 + Math.sin(slideTimer*3)*3, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 30;
            }

            ctx.restore();

            // Cinematic Subtitles
            ctx.textAlign = 'center';
            ctx.fillStyle = `rgba(255, 255, 255, ${slideAlpha})`;
            ctx.font = 'bold 1.2rem "Courier New", monospace';
            ctx.fillText(slide.text, canvas.width/2, canvas.height - 140);

            ctx.fillStyle = `rgba(100, 116, 139, ${slideAlpha})`;
            ctx.font = '0.9rem "Segoe UI", sans-serif';
            ctx.fillText(slide.sub, canvas.width/2, canvas.height - 110);

            ctx.fillStyle = 'rgba(255, 170, 0, 0.8)';
            ctx.font = '0.75rem monospace';
            ctx.fillText('[PRESS SPACE TO CONTINUE]', canvas.width/2, canvas.height - 50);
        }

        // --- 2.5D ONESHOT / ISOMETRIC RPG WORLD RENDERER ---
        function renderRPGWorld() {
            // 2.5D Grid Floor (Perspective effect)
            const gridSpacing = 40;
            ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
            ctx.lineWidth = 1;

            // Draw Perspective Grid Floor
            for (let x = -200; x < canvas.width + 200; x += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(x, 100);
                ctx.lineTo(x + (x - canvas.width/2) * 0.3, canvas.height);
                ctx.stroke();
            }

            for (let y = 100; y < canvas.height; y += 30) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw World Objects (Sorted by Y for depth layering)
            const allRenderables = [
                ...worldObjects.map(o => ({ ...o, isPlayer: false })),
                { x: player.x, y: player.y, isPlayer: true }
            ];

            allRenderables.sort((a, b) => a.y - b.y);

            currentInteractObject = null;

            allRenderables.forEach(obj => {
                if (obj.isPlayer) {
                    drawPlayer25D();
                } else {
                    drawWorldObject(obj);

                    // Check interaction proximity
                    const dist = Math.hypot(player.x - obj.x, player.y - obj.y);
                    if (dist < 45) {
                        currentInteractObject = obj;
                        // Prompt tag above object
                        ctx.fillStyle = '#ffaa00';
                        ctx.font = 'bold 0.75rem sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('[SPACE] INTERACT', obj.x, obj.y - 45);
                    }
                }
            });
        }

        // --- DRAW 2.5D ORB-68 PLAYER ---
        function drawPlayer25D() {
            player.bounce = Math.sin(Date.now() * 0.008) * 4;

            // Kinetic Pulse Ring (Ability E)
            if (player.pulseRing > 0) {
                ctx.strokeStyle = `rgba(0, 243, 255, ${player.pulseRing / 35})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(player.x, player.y, (35 - player.pulseRing) * 2.5, 0, Math.PI*2);
                ctx.stroke();
                player.pulseRing--;
            }

            // Ground Shadow (Adds 2.5D depth perception)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.ellipse(player.x, player.y + 4, 16, 7, 0, 0, Math.PI*2);
            ctx.fill();

            // Orb-68 Droplet Body (Floating with bounce)
            const py = player.y - 12 + player.bounce;
            ctx.fillStyle = '#00f3ff';
            ctx.beginPath();
            ctx.moveTo(player.x, py - 18);
            ctx.bezierCurveTo(player.x + 14, py - 2, player.x + 16, py + 14, player.x, py + 14);
            ctx.bezierCurveTo(player.x - 16, py + 14, player.x - 14, py - 2, player.x, py - 18);
            ctx.fill();

            // Glowing Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(player.x - 4, py + 1, 3, 0, Math.PI*2);
            ctx.arc(player.x + 4, py + 1, 3, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(player.x - 3, py + 1, 1.5, 0, Math.PI*2);
            ctx.arc(player.x + 5, py + 1, 1.5, 0, Math.PI*2);
            ctx.fill();
        }

        // --- DRAW ENVIRONMENT OBJECTS ---
        function drawWorldObject(obj) {
            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.ellipse(obj.x, obj.y + 4, 18, 8, 0, 0, Math.PI*2);
            ctx.fill();

            ctx.save();
            ctx.translate(obj.x, obj.y);

            if (obj.type === 'crystal') {
                ctx.fillStyle = obj.color;
                ctx.beginPath();
                ctx.moveTo(0, -32); ctx.lineTo(14, -14); ctx.lineTo(0, 4); ctx.lineTo(-14, -14);
                ctx.closePath();
                ctx.fill();
            } 
            else if (obj.type === 'vektor_npc') {
                // Vektor standing in world
                ctx.fillStyle = obj.color;
                ctx.fillRect(-6, -20, 12, 20);
                // Hat
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(-12, -24, 24, 4);
                ctx.fillRect(-7, -32, 14, 8);
            } 
            else if (obj.type === 'ghost_npc') {
                // Shadow Ghost in world
                ctx.fillStyle = obj.color;
                ctx.beginPath(); ctx.arc(0, -16, 12, Math.PI, 0); ctx.lineTo(12, 0); ctx.lineTo(-12, 0); ctx.fill();
                // Sunglasses
                ctx.fillStyle = '#000'; ctx.fillRect(-8, -18, 16, 5);
            }
            else if (obj.type === 'monolith') {
                ctx.fillStyle = '#0f172a';
                ctx.strokeStyle = obj.color;
                ctx.lineWidth = 1.5;
                ctx.fillRect(-14, -40, 28, 40);
                ctx.strokeRect(-14, -40, 28, 40);
            }

            ctx.restore();
        }

        // --- RPG PLAYER PHYSICS & MOVEMENT ---
        function updatePlayerPhysics() {
            player.vx = 0;
            player.vy = 0;

            if (keys['KeyA'] || keys['ArrowLeft']) player.vx = -player.speed;
            if (keys['KeyD'] || keys['ArrowRight']) player.vx = player.speed;
            if (keys['KeyW'] || keys['ArrowUp']) player.vy = -player.speed * 0.75; // Isometric damping
            if (keys['KeyS'] || keys['ArrowDown']) player.vy = player.speed * 0.75;

            player.x += player.vx;
            player.y += player.vy;

            // Boundaries
            if (player.x < 40) player.x = 40;
            if (player.x > canvas.width - 40) player.x = canvas.width - 40;
            if (player.y < 120) player.y = 120;
            if (player.y > canvas.height - 40) player.y = canvas.height - 40;
        }

        loop();
    </script>
</body>
</html>
