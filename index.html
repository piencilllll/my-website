<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Far From Home</title>
    <style>
        :root {
            --bg-dark: #05070a;
            --text-main: #e6e6e6;
            --ui-border: #ffffff;
            --ink-black: #080a0f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Custom White Kawmling Hand Cursor */
        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M6,10 L6,22 C6,26 9,28 13,28 L18,28 C23,28 25,25 25,20 L25,13 C25,11 23,10 21,11 C20.5,9.5 18.5,9 17,10 C16,8.5 14,8.5 13,9.5 L13,5 C13,3 10.5,3 10.5,5 L10.5,13 L9,11 C7.5,9.5 6,9.5 6,10 Z' fill='%23ffffff' stroke='%23000000' stroke-width='2.5' stroke-linejoin='round'/></svg>"), auto;
        }

        button, .dash-node, #startOverlay {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M6,10 L6,22 C6,26 9,28 13,28 L18,28 C23,28 25,25 25,20 L25,13 C25,11 23,10 21,11 C20.5,9.5 18.5,9 17,10 C16,8.5 14,8.5 13,9.5 L13,5 C13,3 10.5,3 10.5,5 L10.5,13 L9,11 C7.5,9.5 6,9.5 6,10 Z' fill='%23ffffff' stroke='%23000000' stroke-width='2.5' stroke-linejoin='round'/></svg>"), pointer !important;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #020305;
            overflow: hidden;
        }

        canvas#fxCanvas, canvas#boatCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        canvas#fxCanvas { z-index: 3; }
        
        canvas#boatCanvas { 
            z-index: 1; 
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        canvas#boatCanvas.visible {
            opacity: 1;
        }

        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            z-index: 10;
            pointer-events: none;
        }

        .shake {
            animation: shake 0.25s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
            40%, 60% { transform: translate3d(7px, 0, 0); }
        }

        #stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .cinematic-text {
            font-size: 1.5rem;
            line-height: 2.3rem;
            max-width: 850px;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.7);
            opacity: 0;
            transition: opacity 1.2s ease;
            white-space: normal;
            word-wrap: break-word;
        }

        .cinematic-text.visible { opacity: 1; }

        .boat-scene {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            opacity: 0;
            z-index: 2;
            transition: opacity 1.5s ease;
            pointer-events: none;
        }

        .boat-scene.active { 
            opacity: 1; 
            pointer-events: auto;
        }

        .ocean-view {
            width: 92%;
            height: 55%;
            position: relative;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .node-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .node-container.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .dash-node {
            width: 140px;
            height: 140px;
            border: 2px dashed #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: bold;
            transition: 0.3s;
            text-align: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }

        .dash-node:hover {
            border-style: solid;
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.15);
            transform: scale(1.05);
        }

        .dialogue-box {
            width: 92%;
            max-width: 950px;
            height: 220px;
            background: var(--ink-black);
            border: 4px solid var(--ui-border);
            border-radius: 6px;
            padding: 20px;
            display: flex;
            gap: 20px;
            box-shadow: 0 0 25px rgba(0,0,0,0.95);
            z-index: 5;
        }

        .portrait-frame {
            width: 170px;
            height: 170px;
            border: 2px solid #fff;
            background: #020305;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            position: relative;
        }

        .portrait-svg {
            width: 130px;
            height: 130px;
        }

        .portrait-label {
            margin-top: 2px;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .dialogue-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .dialogue-text {
            font-size: 1.2rem;
            line-height: 1.8rem;
            color: #fff;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
            max-height: 130px;
        }

        .prompt-hint {
            align-self: flex-end;
            font-size: 0.8rem;
            color: #777;
            animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        #startOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020305;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #startOverlay h1 {
            font-size: 3.2rem;
            letter-spacing: 8px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255,255,255,0.6);
        }

        #startOverlay p {
            color: #8899a6;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <canvas id="boatCanvas"></canvas>
        <canvas id="fxCanvas"></canvas>
        <div class="crt-overlay"></div>

        <div id="startOverlay" onclick="initializeEngine()">
            <h1>FAR FROM HOME</h1>
            <p>[ CLICK ANYWHERE TO START ]</p>
        </div>

        <div id="stage">
            <div id="cinematicText" class="cinematic-text"></div>
        </div>

        <div id="boatScene" class="boat-scene">
            <div class="ocean-view">
                <div id="nodeContainer" class="node-container">
                    <div class="dash-node" onclick="inspectNode('Kawm Waters', 'The dark surface stretches endlessly. Glowing waves rock the hull softly.')">CHECK KAWM</div>
                    <div class="dash-node" onclick="inspectNode('Wooden Boat', 'A weathered wooden vessel. It brought you safely away, but liquid slowly seeps through the joints.')">INSPECT BOAT</div>
                    <div class="dash-node" onclick="inspectNode('Distant Horizon', 'Faint flickering lights loom in the distance... Could it be shelter?')">SCAN HORIZON</div>
                </div>
            </div>

            <div class="dialogue-box">
                <div class="portrait-frame">
                    <svg id="portraitSVG" class="portrait-svg" viewBox="0 0 100 100"></svg>
                    <div id="portraitLabel" class="portrait-label">MOE</div>
                </div>
                <div class="dialogue-content">
                    <div id="dialogueText" class="dialogue-text">...</div>
                    <div class="prompt-hint">[ SPACE / CLICK TO CONTINUE ]</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class AudioEngine {
            constructor() { this.ctx = null; }

            init() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.startOceanSynth();
            }

            playBlip(freq = 400) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.07);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.07);
            }

            playThud() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(90, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(25, this.ctx.currentTime + 0.35);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }

            startOceanSynth() {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 2;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }

                const whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(400, this.ctx.currentTime);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.02, this.ctx.currentTime);

                whiteNoise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                whiteNoise.start();
            }
        }

        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.initParticles();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            initParticles() {
                this.particles = [];
                for (let i = 0; i < 80; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        length: Math.random() * 15 + 8,
                        speed: Math.random() * 8 + 4
                    });
                }
            }

            render() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                this.ctx.lineWidth = 1.2;

                this.particles.forEach(p => {
                    this.ctx.beginPath();
                    this.ctx.moveTo(p.x, p.y);
                    this.ctx.lineTo(p.x - 2, p.y + p.length);
                    this.ctx.stroke();

                    p.y += p.speed;
                    p.x -= 1;

                    if (p.y > this.canvas.height) {
                        p.y = -p.length;
                        p.x = Math.random() * this.canvas.width;
                    }
                });

                requestAnimationFrame(() => this.render());
            }
        }

        class BoatAnimator {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.time = 0;
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            render() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.time += 0.03;

                const centerY = this.canvas.height * 0.45;
                const waveY = Math.sin(this.time) * 12;
                const pitch = Math.cos(this.time * 0.8) * 0.08;

                this.drawWaves(centerY + 15, 0.02, 10, '#222222');

                this.ctx.save();
                this.ctx.translate(this.canvas.width / 2, centerY + waveY);
                this.ctx.rotate(pitch);

                this.ctx.fillStyle = '#ffffff';
                this.ctx.strokeStyle = '#000000';
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.moveTo(-90, -10);
                this.ctx.quadraticCurveTo(0, 45, 100, -10);
                this.ctx.lineTo(75, -25);
                this.ctx.lineTo(-75, -25);
                this.ctx.closePath();
                this.ctx.fill();
                this.ctx.stroke();

                this.ctx.beginPath();
                this.ctx.moveTo(-10, -25);
                this.ctx.lineTo(-10, -85);
                this.ctx.stroke();

                this.ctx.restore();

                this.drawWaves(centerY + 25, 0.03, 15, '#ffffff');

                requestAnimationFrame(() => this.render());
            }

            drawWaves(baseY, freq, amp, color) {
                this.ctx.fillStyle = color;
                this.ctx.beginPath();
                this.ctx.moveTo(0, this.canvas.height);
                for (let x = 0; x <= this.canvas.width; x += 10) {
                    const y = baseY + Math.sin(x * freq + this.time) * amp;
                    this.ctx.lineTo(x, y);
                }
                this.ctx.lineTo(this.canvas.width, this.canvas.height);
                this.ctx.closePath();
                this.ctx.fill();
            }
        }

        const portraits = {
            MOE_DETERMINED: `
                <circle cx="50" cy="50" r="30" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
                <path d="M 18,48 Q 50,14 82,48 Q 50,35 18,48 Z" fill="#111116"/>
                <path d="M 78,45 Q 92,52 88,70" stroke="#111116" stroke-width="5" fill="none"/>
                <path d="M 26,45 L 45,53" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
                <path d="M 55,53 L 74,45" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
                <circle cx="37" cy="62" r="3.5" fill="#000000"/>
                <circle cx="63" cy="62" r="3.5" fill="#000000"/>
            `,
            MOE_SERIOUS: `
                <circle cx="50" cy="50" r="30" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
                <path d="M 18,48 Q 50,14 82,48 Q 50,35 18,48 Z" fill="#111116"/>
                <path d="M 78,45 Q 92,52 88,70" stroke="#111116" stroke-width="5" fill="none"/>
                <path d="M 25,48 L 45,48" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
                <path d="M 55,48 L 75,48" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
                <circle cx="37" cy="60" r="3.5" fill="#000000"/>
                <circle cx="63" cy="60" r="3.5" fill="#000000"/>
            `,
            MCCRACK_WORRIED: `
                <circle cx="50" cy="52" r="30" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
                <polygon points="12,42 50,8 88,42 70,42 50,26 30,42" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
                <line x1="50" y1="8" x2="50" y2="42" stroke="#000000" stroke-width="2.5"/>
                <path d="M 25,50 Q 36,40 45,46" stroke="#000000" stroke-width="6" fill="none" stroke-linecap="round"/>
                <path d="M 55,46 Q 64,40 75,50" stroke="#000000" stroke-width="6" fill="none" stroke-linecap="round"/>
                <circle cx="35" cy="60" r="3.5" fill="#000000"/>
                <circle cx="65" cy="60" r="3.5" fill="#000000"/>
                <text x="82" y="32" font-size="22" font-weight="bold" fill="#ffffff">?</text>
            `,
            MCCRACK_HOPEFUL: `
                <circle cx="50" cy="52" r="30" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
                <polygon points="12,42 50,8 88,42 70,42 50,26 30,42" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
                <line x1="50" y1="8" x2="50" y2="42" stroke="#000000" stroke-width="2.5"/>
                <path d="M 25,40 Q 35,34 45,40" stroke="#000000" stroke-width="6" fill="none" stroke-linecap="round"/>
                <path d="M 55,40 Q 65,34 75,40" stroke="#000000" stroke-width="6" fill="none" stroke-linecap="round"/>
                <circle cx="35" cy="58" r="3.5" fill="#000000"/>
                <circle cx="65" cy="58" r="3.5" fill="#000000"/>
                <text x="82" y="32" font-size="22" font-weight="bold" fill="#ffffff">!</text>
            `,
            SYS: `
                <rect x="20" y="20" width="60" height="60" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="4"/>
                <text x="50" y="58" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">?</text>
            `
        };

        const audio = new AudioEngine();
        let particles, boatAnim;
        let currentStep = 0;
        let isTyping = false;
        let isIntroActive = true;

        const introSequences = [
            "Our home village fell in a single night...",
            "Smoke covered the sky as we reached the shore.",
            "Two Kawmlings, one small wooden boat, and the endless Kawm ahead.",
            "We drifted into the dark, searching for shelter... or anything left standing."
        ];

        const boatDialogue = [
            { speaker: "MCCRACK", style: "MCCRACK_WORRIED", text: "Moe... do you think anyone else made it out of the village?" },
            { speaker: "MOE", style: "MOE_SERIOUS", text: "I don't know, McCrack. But as long as this boat floats, we keep moving." },
            { speaker: "MCCRACK", style: "MCCRACK_HOPEFUL", text: "Look at the horizon. There's a faint light out there... maybe it's a safe shelter." },
            { speaker: "MOE", style: "MOE_DETERMINED", text: "Keep your guard up. Check the Kawm and horizon before we pull closer." }
        ];

        let dialogueIndex = 0;

        function initializeEngine() {
            document.getElementById('startOverlay').style.display = 'none';
            audio.init();
            particles = new ParticleSystem(document.getElementById('fxCanvas'));
            particles.render();
            boatAnim = new BoatAnimator(document.getElementById('boatCanvas'));
            boatAnim.render();
            playIntroSequence();
        }

        function triggerShake() {
            const vp = document.getElementById('viewport');
            vp.classList.add('shake');
            setTimeout(() => vp.classList.remove('shake'), 250);
        }

        function playIntroSequence() {
            if (currentStep < introSequences.length) {
                const textEl = document.getElementById('cinematicText');
                textEl.classList.remove('visible');

                setTimeout(() => {
                    textEl.innerText = introSequences[currentStep];
                    textEl.classList.add('visible');
                    audio.playThud();
                    triggerShake();
                    currentStep++;
                    setTimeout(playIntroSequence, 4200);
                }, 1000);
            } else {
                transitionToBoatScene();
            }
        }

        function transitionToBoatScene() {
            const textEl = document.getElementById('cinematicText');
            textEl.classList.remove('visible');

            setTimeout(() => {
                document.getElementById('stage').style.display = 'none';
                const boatScene = document.getElementById('boatScene');
                boatScene.classList.add('active');
                
                // Allow interactions now that intro is complete
                isIntroActive = false;
                
                // Fade boat animation in ONLY when dialogue starts
                document.getElementById('boatCanvas').classList.add('visible');
                
                advanceDialogue();
            }, 1500);
        }

        function typeText(targetEl, text, speed = 25, callback) {
            isTyping = true;
            targetEl.innerText = "";
            let i = 0;

            const timer = setInterval(() => {
                if (i < text.length) {
                    targetEl.innerText += text.charAt(i);
                    if (i % 2 === 0) audio.playBlip(300 + (i * 6) % 120);
                    i++;
                } else {
                    clearInterval(timer);
                    isTyping = false;
                    if (callback) callback();
                }
            }, speed);
        }

        function updatePortrait(speakerKey, styleKey) {
            const svgEl = document.getElementById('portraitSVG');
            const labelEl = document.getElementById('portraitLabel');
            svgEl.innerHTML = portraits[styleKey] || portraits.SYS;
            labelEl.innerText = speakerKey;
        }

        function advanceDialogue() {
            if (isIntroActive || isTyping) return;

            if (dialogueIndex < boatDialogue.length) {
                const line = boatDialogue[dialogueIndex];
                updatePortrait(line.speaker, line.style);
                typeText(document.getElementById('dialogueText'), line.text);
                dialogueIndex++;
            } else {
                // Dialogue finished -> Fade boat animation out, show System nodes
                document.getElementById('boatCanvas').classList.remove('visible');
                updatePortrait('SYS', 'SYS');
                typeText(document.getElementById('dialogueText'), "[ Interactive Mode Active. Inspect points around the boat. ]");
                document.getElementById('nodeContainer').classList.add('visible');
            }
        }

        function inspectNode(title, detailText) {
            if (isIntroActive || isTyping) return;
            audio.playThud();
            triggerShake();
            updatePortrait('SYS', 'SYS');
            typeText(document.getElementById('dialogueText'), `[${title}]: ${detailText}`);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !isIntroActive && document.getElementById('boatScene').classList.contains('active')) {
                advanceDialogue();
            }
        });

        document.getElementById('boatScene').addEventListener('click', (e) => {
            if (!isIntroActive && !e.target.classList.contains('dash-node')) {
                advanceDialogue();
            }
        });
    </script>
</body>
</html>

    <style>

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            z-index: 10;
            pointer-events: none;
        }

        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 30px;
            pointer-events: none;
        }

        .dialogue-box {
            width: 92%;
            max-width: 950px;
            height: 200px;
            background: var(--ink-black);
            border: 4px solid var(--ui-border);
            border-radius: 6px;
            padding: 20px;
            display: flex;
            gap: 20px;
            box-shadow: 0 0 25px rgba(0,0,0,0.95);
            pointer-events: auto;
        }

        .portrait-frame {
            width: 150px;
            height: 150px;
            border: 2px solid #fff;
            background: #020305;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .portrait-svg {
            width: 110px;
            height: 110px;
        }

        .portrait-label {
            margin-top: 2px;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .dialogue-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .dialogue-text {
            font-size: 1.15rem;
            line-height: 1.7rem;
            color: #fff;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .prompt-hint {
            align-self: flex-end;
            font-size: 0.8rem;
            color: #777;
            animation: blink 1s infinite;
        }

        #controlsHUD {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(8, 10, 15, 0.85);
            border: 2px solid #ffffff;
            padding: 12px 18px;
            border-radius: 4px;
            display: none;
            z-index: 5;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="viewport3d"></div>
    <div class="crt-overlay"></div>

    <div id="controlsHUD">
        [W / UP] ACCELERATE | [A/D / LEFT/RIGHT] STEER KAWM BOAT
    </div>

    <div id="uiLayer">
        <div class="dialogue-box" id="dialogueBox">
            <div class="portrait-frame">
                <svg id="portraitSVG" class="portrait-svg" viewBox="0 0 100 100"></svg>
                <div id="portraitLabel" class="portrait-label">SYS</div>
            </div>
            <div class="dialogue-content">
                <div id="dialogueText" class="dialogue-text">Initializing 3D navigation module...</div>
                <div class="prompt-hint" id="promptHint">[ CLICK / SPACE TO CONTINUE ]</div>
            </div>
        </div>
    </div>

    <script>
        // --- PORTRAIT DATA ---
        const portraits = {
            MOE: `
                <circle cx="50" cy="50" r="30" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
                <path d="M 18,48 Q 50,14 82,48 Q 50,35 18,48 Z" fill="#111116"/>
                <path d="M 78,45 Q 92,52 88,70" stroke="#111116" stroke-width="5" fill="none"/>
                <path d="M 26,45 L 45,53" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
                <path d="M 55,53 L 74,45" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
                <circle cx="37" cy="62" r="3.5" fill="#000000"/>
                <circle cx="63" cy="62" r="3.5" fill="#000000"/>
            `,
            MCCRACK: `
                <circle cx="50" cy="52" r="30" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
                <polygon points="12,42 50,8 88,42 70,42 50,26 30,42" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
                <line x1="50" y1="8" x2="50" y2="42" stroke="#000000" stroke-width="2.5"/>
                <path d="M 25,40 Q 35,34 45,40" stroke="#000000" stroke-width="6" fill="none" stroke-linecap="round"/>
                <path d="M 55,40 Q 65,34 75,40" stroke="#000000" stroke-width="6" fill="none" stroke-linecap="round"/>
                <circle cx="35" cy="58" r="3.5" fill="#000000"/>
                <circle cx="65" cy="58" r="3.5" fill="#000000"/>
            `,
            SYS: `
                <rect x="20" y="20" width="60" height="60" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="4"/>
                <text x="50" y="58" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">S</text>
            `
        };

        // --- AUDIO ENGINE ---
        class AudioEngine {
            constructor() { this.ctx = null; }
            init() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playBlip(freq = 350) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.03, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }
        }

        const audio = new AudioEngine();

        // --- THREE.JS SCENE SETUP ---
        const container = document.getElementById('viewport3d');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x120320); // Dark purple atmosphere
        scene.fog = new THREE.FogExp2(0x1a062d, 0.018);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x402060, 1.2);
        scene.add(ambientLight);

        const purplePointLight = new THREE.PointLight(0x9933ff, 2, 40);
        purplePointLight.position.set(0, 5, 0);
        scene.add(purplePointLight);

        // Distant Beacon Light
        const beaconLight = new THREE.PointLight(0xffffff, 5, 250);
        beaconLight.position.set(0, 15, -180);
        scene.add(beaconLight);

        const beaconMesh = new THREE.Mesh(
            new THREE.SphereGeometry(2, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        beaconMesh.position.copy(beaconLight.position);
        scene.add(beaconMesh);

        // --- KAWM OCEAN WATER ---
        const waterGeo = new THREE.PlaneGeometry(500, 500, 40, 40);
        const waterMat = new THREE.MeshLambertMaterial({
            color: 0x080214,
            wireframe: true,
            transparent: true,
            opacity: 0.7
        });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        scene.add(water);

        // --- BOAT ASSEMBLY ---
        const boatGroup = new THREE.Group();
        scene.add(boatGroup);

        // Hull
        const hullGeo = new THREE.BoxGeometry(4.5, 1.8, 9);
        const hullMat = new THREE.MeshLambertMaterial({ color: 0x1a120b });
        const hull = new THREE.Mesh(hullGeo, hullMat);
        hull.position.y = 0.5;
        boatGroup.add(hull);

        // Cabin
        const cabinGeo = new THREE.BoxGeometry(3.8, 2.2, 4.5);
        const cabinMat = new THREE.MeshLambertMaterial({ color: 0x0d0d12 });
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.set(0, 2, -0.5);
        boatGroup.add(cabin);

        // Wheel (Helm)
        const wheelGeo = new THREE.TorusGeometry(0.45, 0.05, 8, 16);
        const wheelMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const helmWheel = new THREE.Mesh(wheelGeo, wheelMat);
        helmWheel.position.set(0, 2.3, 0.8);
        boatGroup.add(helmWheel);

        // SYSTEM (S) Terminal Screen & Panel
        const terminalGeo = new THREE.BoxGeometry(0.9, 0.7, 0.1);
        const terminalMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const terminal = new THREE.Mesh(terminalGeo, terminalMat);
        terminal.position.set(1.1, 2.4, 0.85);
        terminal.rotation.y = -0.25;
        boatGroup.add(terminal);

        // Glowing Screen Face
        const screenGeo = new THREE.PlaneGeometry(0.8, 0.6);
        const screenMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const screenMesh = new THREE.Mesh(screenGeo, screenMat);
        screenMesh.position.set(1.1, 2.4, 0.91);
        screenMesh.rotation.y = -0.25;
        boatGroup.add(screenMesh);

        // Interactive Buttons beside wheel
        for(let i = 0; i < 3; i++) {
            const btn = new THREE.Mesh(
                new THREE.BoxGeometry(0.12, 0.12, 0.12),
                new THREE.MeshBasicMaterial({ color: i === 0 ? 0xff3333 : 0xffffff })
            );
            btn.position.set(-0.8 + (i * 0.25), 2.1, 0.85);
            boatGroup.add(btn);
        }

        // Chair for McCrack
        const chairGeo = new THREE.BoxGeometry(1, 0.1, 1);
        const chairMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
        const chair = new THREE.Mesh(chairGeo, chairMat);
        chair.position.set(-1.1, 1.8, -1.2);
        boatGroup.add(chair);

        // --- CHARACTERS (Stylized 3D Kawmlings) ---
        function createKawmling(isMoe) {
            const charGroup = new THREE.Group();
            
            // Sphere body/head
            const bodyGeo = new THREE.SphereGeometry(0.55, 16, 16);
            const bodyMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.55;
            charGroup.add(body);

            if (isMoe) {
                // Black Durag cap + tail
                const duragGeo = new THREE.SphereGeometry(0.58, 16, 16, 0, Math.PI * 2, 0, Math.PI * 0.55);
                const duragMat = new THREE.MeshBasicMaterial({ color: 0x050508 });
                const durag = new THREE.Mesh(duragGeo, duragMat);
                durag.position.y = 0.56;
                charGroup.add(durag);

                const tailGeo = new THREE.BoxGeometry(0.2, 0.5, 0.05);
                const tail = new THREE.Mesh(tailGeo, duragMat);
                tail.position.set(0, 0.5, -0.55);
                tail.rotation.x = 0.3;
                charGroup.add(tail);
            } else {
                // McCrack Roof Top Hat Accent
                const hatGeo = new THREE.ConeGeometry(0.4, 0.5, 4);
                const hatMat = new THREE.MeshBasicMaterial({ color: 0x050508 });
                const hat = new THREE.Mesh(hatGeo, hatMat);
                hat.position.y = 1.1;
                charGroup.add(hat);
            }

            return charGroup;
        }

        const moe3D = createKawmling(true);
        moe3D.position.set(0, 1.4, 0.3); // At the wheel
        boatGroup.add(moe3D);

        const mcCrack3D = createKawmling(false);
        mcCrack3D.position.set(-1.1, 1.8, -1.2); // On chair
        boatGroup.add(mcCrack3D);

        // --- RAIN PARTICLE SYSTEM ---
        const rainCount = 1200;
        const rainGeo = new THREE.BufferGeometry();
        const rainPos = new Float32Array(rainCount * 3);

        for(let i = 0; i < rainCount * 3; i += 3) {
            rainPos[i] = (Math.random() - 0.5) * 80;
            rainPos[i+1] = Math.random() * 40;
            rainPos[i+2] = (Math.random() - 0.5) * 80;
        }

        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
        const rainMat = new THREE.PointsMaterial({
            color: 0xccccff,
            size: 0.15,
            transparent: true,
            opacity: 0.6
        });
        const rainParticles = new THREE.Points(rainGeo, rainMat);
        scene.add(rainParticles);

        // --- CINEMATIC SEQUENCE & DIALOGUE DATA ---
        const cinematicDialogue = [
            { speaker: "SYS", text: "[ EVALUATING KAWM ENVIRONMENT... RAIN DENSITY: HIGH. VISIBILITY: LOW. ]" },
            { speaker: "MCCRACK", text: "Moe... the sky turned complete purple. Look over there, past the terminal!" },
            { speaker: "MOE", text: "I see it. That bright white light floating in the distance..." },
            { speaker: "MCCRACK", text: "Should we head straight for it? Is SYSTEM done checking the boat?" },
            { speaker: "SYS", text: "[ EVALUATION COMPLETE. HULL STABLE. DIRECT CONTROL GRANTED TO MOE. ]" },
            { speaker: "MOE", text: "Hold on tight, McCrack. Taking the wheel now!" }
        ];

        let dialogueIdx = 0;
        let isTyping = false;
        let isCinematic = true;

        // Camera Cut Sequences (Relative to boat)
        const cameraAngles = [
            { pos: new THREE.Vector3(0, 6, -8), lookAt: new THREE.Vector3(0, 2, 0) },   // Front Wide Cinematic
            { pos: new THREE.Vector3(-2.5, 3.2, -2), lookAt: new THREE.Vector3(-1.1, 2.2, -1.2) }, // McCrack
            { pos: new THREE.Vector3(2.2, 3.2, 1.2), lookAt: new THREE.Vector3(0, 2.2, 0.3) },  // Moe & Wheel
            { pos: new THREE.Vector3(-2.5, 3.2, -2), lookAt: new THREE.Vector3(-1.1, 2.2, -1.2) }, // McCrack
            { pos: new THREE.Vector3(1.8, 3.0, 1.5), lookAt: new THREE.Vector3(1.1, 2.4, 0.85) }, // SYSTEM Screen
            { pos: new THREE.Vector3(0, 3.2, 1.8), lookAt: new THREE.Vector3(0, 2.2, -10) }    // Driving View
        ];

        function updatePortrait(speaker) {
            document.getElementById('portraitSVG').innerHTML = portraits[speaker] || portraits.SYS;
            document.getElementById('portraitLabel').innerText = speaker;
        }

        function typeDialogue(text) {
            isTyping = true;
            const el = document.getElementById('dialogueText');
            el.innerText = "";
            let i = 0;
            const timer = setInterval(() => {
                if (i < text.length) {
                    el.innerText += text.charAt(i);
                    if (i % 2 === 0) audio.playBlip(i % 4 === 0 ? 420 : 320);
                    i++;
                } else {
                    clearInterval(timer);
                    isTyping = false;
                }
            }, 25);
        }

        function advanceCinematic() {
            if (isTyping) return;

            if (dialogueIdx < cinematicDialogue.length) {
                const line = cinematicDialogue[dialogueIdx];
                updatePortrait(line.speaker);
                typeDialogue(line.text);

                // Update Camera Angle smoothly
                const camData = cameraAngles[dialogueIdx];
                targetCamPos.copy(camData.pos);
                targetCamLookAt.copy(camData.lookAt);

                dialogueIdx++;
            } else {
                // Transition to Driving Gameplay Mode
                isCinematic = false;
                document.getElementById('dialogueBox').style.display = 'none';
                document.getElementById('controlsHUD').style.display = 'block';
            }
        }

        // Camera Animation Targets
        const targetCamPos = cameraAngles[0].pos.clone();
        const targetCamLookAt = cameraAngles[0].lookAt.clone();
        const currentCamLookAt = targetCamLookAt.clone();

        // --- BOAT DRIVING CONTROLS ---
        let boatSpeed = 0;
        let boatRotation = 0;
        const keys = { w: false, a: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowRight: false };

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (isCinematic) advanceCinematic();
            }
            if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.code)) {
                keys[e.key] = true;
                keys[e.code] = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.code)) {
                keys[e.key] = false;
                keys[e.code] = false;
            }
        });

        document.getElementById('uiLayer').addEventListener('click', () => {
            audio.init();
            if (isCinematic) advanceCinematic();
        });

        // --- MAIN ANIMATION LOOP ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Water Waving Effect
            const posAttr = waterGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                const u = posAttr.getX(i);
                const v = posAttr.getY(i);
                const z = Math.sin(time * 2 + u * 0.1) * 0.4 + Math.cos(time * 1.5 + v * 0.1) * 0.4;
                posAttr.setZ(i, z);
            }
            waterGeo.computeVertexNormals();
            posAttr.needsUpdate = true;

            // Rain Particle Fall
            const rPositions = rainGeo.attributes.position.array;
            for (let i = 1; i < rainCount * 3; i += 3) {
                rPositions[i] -= 0.8;
                if (rPositions[i] < 0) rPositions[i] = 40;
            }
            rainGeo.attributes.position.needsUpdate = true;

            // Boat Bobbing Motion
            const bobY = Math.sin(time * 2) * 0.15;
            const rollZ = Math.cos(time * 1.5) * 0.04;

            if (isCinematic) {
                boatGroup.position.y = bobY;
                boatGroup.rotation.z = rollZ;

                // Interpolate Camera towards cut target
                camera.position.lerp(boatGroup.position.clone().add(targetCamPos), 0.05);
                currentCamLookAt.lerp(boatGroup.position.clone().add(targetCamLookAt), 0.05);
                camera.lookAt(currentCamLookAt);
            } else {
                // Driving Controls
                if (keys.w || keys.ArrowUp) boatSpeed = THREE.MathUtils.lerp(boatSpeed, 0.25, 0.03);
                else boatSpeed = THREE.MathUtils.lerp(boatSpeed, 0, 0.02);

                if (keys.a || keys.ArrowLeft) boatRotation += 0.015;
                if (keys.d || keys.ArrowRight) boatRotation -= 0.015;

                boatGroup.rotation.y = boatRotation;
                helmWheel.rotation.z = -boatRotation * 4;

                boatGroup.translateZ(-boatSpeed);
                boatGroup.position.y = bobY;
                boatGroup.rotation.z = rollZ;

                // Follow Camera behind boat
                const followCamPos = new THREE.Vector3(0, 3.5, 7.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), boatRotation).add(boatGroup.position);
                camera.position.lerp(followCamPos, 0.08);
                camera.lookAt(boatGroup.position.clone().add(new THREE.Vector3(0, 2, -5).applyAxisAngle(new THREE.Vector3(0, 1, 0), boatRotation)));
            }

            // Beacon Glow Pulse
            beaconLight.intensity = 4 + Math.sin(time * 4) * 1.5;

            renderer.render(scene, camera);
        }

        // Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize First Frame
        advanceCinematic();
        animate();
    </script>
</body>
</html>
