<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Night Shift at Terminal 7</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.85);
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-cyan: #58a6ff;
            --accent-amber: #f0883e;
            --accent-purple: #bc8cff;
            --accent-green: #3fb950;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(88, 166, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(188, 140, 255, 0.05) 0%, transparent 40%);
        }

        #game-container {
            width: 100%;
            max-width: 900px;
            height: 680px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            overflow: hidden;
        }

        /* Header / Relationship HUD */
        #hud {
            background: rgba(13, 17, 23, 0.9);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            text-transform: uppercase;
        }

        .relationships {
            display: flex;
            gap: 20px;
        }

        .rel-tracker {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rel-name { font-weight: 600; }
        .rel-val { 
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255,255,255,0.05);
        }

        /* Dialogue History Box */
        #dialogue-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .msg {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.narrator {
            align-self: center;
            max-width: 95%;
            text-align: center;
            font-style: italic;
            color: #8b949e;
            font-size: 14px;
            margin: 8px 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 6px 0;
        }

        .msg.character { align-self: flex-start; }
        .msg.player { align-self: flex-end; }

        .speaker-tag {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 15px;
            border: 1px solid transparent;
        }

        .msg.player .bubble {
            background: #1f6feb;
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .msg.character .bubble {
            background: #21262d;
            border-color: var(--border-color);
            border-bottom-left-radius: 2px;
        }

        /* Character specific colors */
        .speaker-jax { color: var(--accent-amber); }
        .speaker-lyra { color: var(--accent-purple); }
        .speaker-marlo { color: var(--accent-green); }

        /* Choices Area */
        #choices-container {
            padding: 16px 20px;
            background: rgba(13, 17, 23, 0.95);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-btn {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 16px;
            border-radius: 6px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .choice-btn:hover {
            background: #30363d;
            border-color: var(--accent-cyan);
            color: #fff;
            transform: translateX(4px);
        }

        /* Custom Scrollbar */
        #dialogue-container::-webkit-scrollbar { width: 6px; }
        #dialogue-container::-webkit-scrollbar-track { background: transparent; }
        #dialogue-container::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div class="hud-title">Terminal 7: Sub-Level 3</div>
        <div class="relationships">
            <div class="rel-tracker"><span class="rel-name speaker-jax">Jax:</span> <span id="rel-jax" class="rel-val">Neutral (0)</span></div>
            <div class="rel-tracker"><span class="rel-name speaker-lyra">Lyra:</span> <span id="rel-lyra" class="rel-val">Neutral (0)</span></div>
            <div class="rel-tracker"><span class="rel-name speaker-marlo">Marlo:</span> <span id="rel-marlo" class="rel-val">Neutral (0)</span></div>
        </div>
    </div>

    <div id="dialogue-container"></div>

    <div id="choices-container"></div>
</div>

<script>
    // Game State
    const state = {
        relationships: {
            jax: 0,
            lyra: 0,
            marlo: 0
        }
    };

    // Story Node Database
    const story = {
        start: {
            narrative: "02:14 AM. Rain hums against the reinforced glass of the monitoring station. You're sitting in the breakroom with Jax, who is lazily spinning a balance coin on the table, and Lyra, who hasn't looked up from her diagnostic tablet in two hours.",
            dialogue: [
                { speaker: "Jax", text: "Three years in this pit, and I swear the coffee machine still brews pure motor oil. Hey, rookie. You awake, or are your eyes just open?" }
            ],
            choices: [
                {
                    text: "I'm wide awake. Just wondering why you haven't fixed the coffee machine yet.",
                    target: "coffee_joke",
                    effects: { jax: 2 }
                },
                {
                    text: "Leave me alone, Jax. It's two in the morning.",
                    target: "jax_snark",
                    effects: { jax: -2 }
                },
                {
                    text: "[Turn to Lyra] Is he always this noisy during the graveyard shift?",
                    target: "ask_lyra",
                    effects: { lyra: 2, jax: -1 }
                }
            ]
        },

        coffee_joke: {
            dialogue: [
                { speaker: "Jax", text: "Ha! Direct hit. Look at that, Lyra—our new hire actually has a spine." },
                { speaker: "Lyra", text: "If they had a brain, they wouldn't be working Sub-Level 3. Keep your voices down. The sector four telemetry is spiking again." }
            ],
            choices: [
                {
                    text: "Spiking? Is it another false alarm on the perimeter fence?",
                    target: "telemetry_talk",
                    effects: { lyra: 1 }
                },
                {
                    text: "Jax, ignore her. What's the real story behind this place?",
                    target: "ask_station_lore",
                    effects: { jax: 1, lyra: -1 }
                }
            ]
        },

        jax_snark: {
            dialogue: [
                { speaker: "Jax", text: "Oof. Touchy. Someone forgot to pack their sense of humor along with their night-shift badge." },
                { speaker: "Lyra", text: "Can you both stop acting like children? We have five hours left on the shift and the power grid is fluctuating." }
            ],
            choices: [
                {
                    text: "Sorry, Lyra. What's going on with the grid?",
                    target: "telemetry_talk",
                    effects: { lyra: 2 }
                },
                {
                    text: "Let it fluctuate. The whole station is a ruin anyway.",
                    target: "cynical_path",
                    effects: { jax: 1, lyra: -2 }
                }
            ]
        },

        ask_lyra: {
            dialogue: [
                { speaker: "Lyra", text: "Every single night. He talks to keep himself from realizing how quiet it gets down here." },
                { speaker: "Jax", text: "Hey! That was a low blow. Silence down here means either nothing's happening, or something went terribly wrong. I prefer noise." }
            ],
            choices: [
                {
                    text: "Jax has a point. Silence down here is creepy.",
                    target: "agree_jax",
                    effects: { jax: 2 }
                },
                {
                    text: "I prefer the quiet. Lets you focus on the work.",
                    target: "telemetry_talk",
                    effects: { lyra: 2, jax: -1 }
                }
            ]
        },

        telemetry_talk: {
            narrative: "Heavy boots echo down the metallic hallway outside. Marlo, the veteran shift lead, steps into the doorway shaking water off his coat.",
            dialogue: [
                { speaker: "Marlo", text: "We've got a problem in Sector Four. Primary relay tripped. I need two people down in the maintenance tunnel to reset the manual breaker." },
                { speaker: "Jax", text: "Not it! Last time I went into the maintenance tunnel, a steam pipe almost took off my eyebrow." },
                { speaker: "Lyra", text: "I need to stay here and monitor the primary core readings, or we won't know if the grid collapses entirely." }
            ],
            choices: [
                {
                    text: "I'll go with Marlo. I can handle a manual reset.",
                    target: "go_marlo",
                    effects: { marlo: 3, lyra: 1 }
                },
                {
                    text: "Jax, you're coming with me. We're fixing this together.",
                    target: "go_jax",
                    effects: { jax: 3, marlo: -1 }
                },
                {
                    text: "Lyra, do you really need to stay behind? You know the grid better than anyone.",
                    target: "convince_lyra",
                    effects: { lyra: -1, marlo: -1 }
                }
            ]
        },

        ask_station_lore: {
            dialogue: [
                { speaker: "Jax", text: "You really wanna know? Ten years ago, Terminal 7 wasn't a monitoring depot. It was a deep-geothermal research facility. Then one night, they capped the lower shaft and rebranded overnight." },
                { speaker: "Lyra", text: "Jax, don't fill their head with local campfire stories." },
                { speaker: "Jax", text: "It's not a story! Ask Marlo if you don't believe me." }
            ],
            choices: [
                {
                    text: "What happened to the lower shaft?",
                    target: "deep_lore",
                    effects: { jax: 2 }
                },
                {
                    text: "Lyra's right. Sounds like typical office rumors.",
                    target: "telemetry_talk",
                    effects: { lyra: 2, jax: -1 }
                }
            ]
        },

        cynical_path: {
            dialogue: [
                { speaker: "Jax", text: "Damn. Cold as ice. I respect it." },
                { speaker: "Lyra", text: "That attitude will get you transferred to surface patrol by next month." }
            ],
            choices: [
                {
                    text: "Maybe I'd prefer the surface.",
                    target: "telemetry_talk",
                    effects: {}
                }
            ]
        },

        agree_jax: {
            dialogue: [
                { speaker: "Jax", text: "See? The new kid gets it. Thank you!" },
                { speaker: "Lyra", text: "Great. Now there are two of you." }
            ],
            choices: [
                {
                    text: "Let's get back to whatever Marlo was working on.",
                    target: "telemetry_talk",
                    effects: {}
                }
            ]
        },

        deep_lore: {
            narrative: "Before Jax can finish, Marlo steps into the room, his face dark.",
            dialogue: [
                { speaker: "Marlo", text: "That's enough reminiscing. We've got a breaker trip in Sector Four. I need answers, not ghost stories." }
            ],
            choices: [
                {
                    text: "Understood, boss. What do you need us to do?",
                    target: "go_marlo",
                    effects: { marlo: 2 }
                }
            ]
        },

        go_marlo: {
            narrative: "You walk down the damp, narrow corridor alongside Marlo. The dim orange emergency lights cast long shadows.",
            dialogue: [
                { speaker: "Marlo", text: "You did good back there, stepping up. Jax has talent, but no discipline. Lyra's got discipline, but no courage under pressure. You need a bit of both down here." },
                { speaker: "Marlo", text: "Tell me something honestly. Why did you take this assignment?" }
            ],
            choices: [
                {
                    text: "I needed the hazard pay. Simple as that.",
                    target: "marlo_pay",
                    effects: { marlo: 1 }
                },
                {
                    text: "I wanted to be somewhere quiet where nobody asks questions about my past.",
                    target: "marlo_secret",
                    effects: { marlo: 3 }
                },
                {
                    text: "I wanted to work with people who know what they're doing.",
                    target: "marlo_respect",
                    effects: { marlo: 2 }
                }
            ]
        },

        go_jax: {
            narrative: "You drag a protesting Jax down the service ladder into the warm, clanking maintenance sub-level.",
            dialogue: [
                { speaker: "Jax", text: "Unbelievable. I was five minutes away from winning that argument. Now I'm knee-deep in grease." },
                { speaker: "Jax", text: "Look... thanks for pulling me along though. Marlo gives me the creeps when he gets into his 'serious manager' mode." }
            ],
            choices: [
                {
                    text: "He's just trying to keep us alive, Jax.",
                    target: "defend_marlo",
                    effects: { jax: -1, marlo: 1 }
                },
                {
                    text: "I get it. He acts like he owns the whole station.",
                    target: "bond_jax",
                    effects: { jax: 3 }
                }
            ]
        },

        convince_lyra: {
            dialogue: [
                { speaker: "Lyra", text: "Fine. But if the main terminal overloads while my back is turned, I'm putting it in my official report that it was your idea." }
            ],
            choices: [
                {
                    text: "Fair deal. Let's move.",
                    target: "go_marlo",
                    effects: { lyra: 1 }
                }
            ]
        },

        marlo_pay: {
            dialogue: [
                { speaker: "Marlo", text: "Honest answer. Can't fault a person for wanting a bigger paycheck. Just make sure money isn't the only reason you keep your eyes open down here." }
            ],
            choices: [{ text: "[Reach the breaker panel]", target: "climax_node", effects: {} }]
        },

        marlo_secret: {
            dialogue: [
                { speaker: "Marlo", text: "A past, huh? Everyone in Terminal 7 is running from something. I won't pry. As long as you pull your weight, your secrets are safe with me." }
            ],
            choices: [{ text: "[Reach the breaker panel]", target: "climax_node", effects: {} }]
        },

        marlo_respect: {
            dialogue: [
                { speaker: "Marlo", text: "Hah! You might want to hold your judgment on whether we know what we're doing until we survive winter." }
            ],
            choices: [{ text: "[Reach the breaker panel]", target: "climax_node", effects: {} }]
        },

        defend_marlo: {
            dialogue: [
                { speaker: "Jax", text: "Yeah, yeah. I know. Doesn't mean I have to like the lectures." }
            ],
            choices: [{ text: "[Reach the breaker panel]", target: "climax_node", effects: {} }]
        },

        bond_jax: {
            dialogue: [
                { speaker: "Jax", text: "Right?! Exactly! Finally, someone who sees it." }
            ],
            choices: [{ text: "[Reach the breaker panel]", target: "climax_node", effects: {} }]
        },

        climax_node: {
            narrative: "You reach the heavy iron vault door of Sub-Relay 4. Sparks shower from a junction box overhead. Suddenly, the comms headset buzzes with static—it's Lyra!",
            dialogue: [
                { speaker: "Lyra", text: "[Comms] STOP! Don't flip that switch! The telemetry reading was wrong—it's not a short circuit, it's a high-pressure feedback loop! If you engage the manual breaker, it'll blow the main line!" },
                { speaker: "Marlo", text: "What?! The gauge right in front of me says line pressure is zero!" }
            ],
            choices: [
                {
                    text: "Trust Lyra! She knows the system data better than the analog gauges!",
                    target: "trust_lyra_ending",
                    effects: { lyra: 4, marlo: -1 }
                },
                {
                    text: "Trust Marlo! The manual gauge right here in front of us can't lie!",
                    target: "trust_marlo_ending",
                    effects: { marlo: 4, lyra: -2 }
                },
                {
                    text: "Jax, what do your instincts say?",
                    target: "trust_jax_ending",
                    effects: { jax: 4 }
                }
            ]
        },

        trust_lyra_ending: {
            narrative: "You back away from the lever and override the automated safety protocols from your hand-pad based on Lyra's emergency instructions.",
            dialogue: [
                { speaker: "Lyra", text: "[Comms] Pressure venting... core temperature stabilizing. It worked! You saved the sector grid!" },
                { speaker: "Marlo", text: "Well... I'll be damned. Good call listening to her. I guess this old dog still has things to learn." },
                { speaker: "Jax", text: "That was way too close! Next time, I'm making the coffee." }
            ],
            choices: [{ text: "[Shift Concluded - Play Again]", target: "restart", effects: {} }]
        },

        trust_marlo_ending: {
            narrative: "You grab the heavy iron lever and yank it down. A deafening metallic THUNK echoes through the shaft.",
            dialogue: [
                { speaker: "Marlo", text: "Power restored! See that? Analog never lies." },
                { speaker: "Lyra", text: "[Comms] ...I stand corrected. The sensor node in my panel was burnt out. Good eye, down there." },
                { speaker: "Jax", text: "We survived! I'm celebrating with a double ration of bad coffee." }
            ],
            choices: [{ text: "[Shift Concluded - Play Again]", target: "restart", effects: {} }]
        },

        trust_jax_ending: {
            dialogue: [
                { speaker: "Jax", text: "My instincts? My instincts say hit the emergency purge valve on the wall instead of touching ANY breaker!" },
                { speaker: "Marlo", text: "The purge valve? That's crazy—" },
                { speaker: "Jax", text: "DO IT!" }
            ],
            narrative: "You slam your palm onto the red purge button. A massive blast of steam vents into the outer atmosphere. The alarms instantly die down.",
            dialogue: [
                { speaker: "Lyra", text: "[Comms] ...That was incredibly reckless. Unorthodox. Dangerous... and completely effective." },
                { speaker: "Jax", text: "Hah! Who's the rookie now?!" }
            ],
            choices: [{ text: "[Shift Concluded - Play Again]", target: "restart", effects: {} }]
        }
    };

    // UI Render Engine
    const dialogueContainer = document.getElementById('dialogue-container');
    const choicesContainer = document.getElementById('choices-container');

    function updateHUD() {
        document.getElementById('rel-jax').textContent = getRelText(state.relationships.jax);
        document.getElementById('rel-lyra').textContent = getRelText(state.relationships.lyra);
        document.getElementById('rel-marlo').textContent = getRelText(state.relationships.marlo);
    }

    function getRelText(val) {
        if (val >= 4) return `Warm (+${val})`;
        if (val > 0) return `Friendly (+${val})`;
        if (val === 0) return `Neutral (0)`;
        return `Cold (${val})`;
    }

    function renderNode(nodeKey) {
        if (nodeKey === 'restart') {
            state.relationships.jax = 0;
            state.relationships.lyra = 0;
            state.relationships.marlo = 0;
            dialogueContainer.innerHTML = '';
            updateHUD();
            renderNode('start');
            return;
        }

        const node = story[nodeKey];
        if (!node) return;

        // Render Narrative Scene Description
        if (node.narrative) {
            const narEl = document.createElement('div');
            narEl.className = 'msg narrator';
            narEl.textContent = node.narrative;
            dialogueContainer.appendChild(narEl);
        }

        // Render Character Dialogues
        if (node.dialogue) {
            node.dialogue.forEach(d => {
                const msgEl = document.createElement('div');
                msgEl.className = 'msg character';

                const speakerClass = `speaker-${d.speaker.toLowerCase()}`;
                
                msgEl.innerHTML = `
                    <div class="speaker-tag ${speakerClass}">${d.speaker}</div>
                    <div class="bubble">${d.text}</div>
                `;
                dialogueContainer.appendChild(msgEl);
            });
        }

        // Scroll to bottom
        dialogueContainer.scrollTop = dialogueContainer.scrollHeight;

        // Render Choice Options
        choicesContainer.innerHTML = '';
        if (node.choices) {
            node.choices.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = c.text;
                btn.onclick = () => {
                    // Render Player Chosen Line
                    const playerMsg = document.createElement('div');
                    playerMsg.className = 'msg player';
                    playerMsg.innerHTML = `<div class="bubble">${c.text}</div>`;
                    dialogueContainer.appendChild(playerMsg);

                    // Apply Relationship Adjustments
                    if (c.effects) {
                        for (let k in c.effects) {
                            state.relationships[k] += c.effects[k];
                        }
                        updateHUD();
                    }

                    // Progress to Next Scene
                    renderNode(c.target);
                };
                choicesContainer.appendChild(btn);
            });
        }
    }

    // Launch Game
    updateHUD();
    renderNode('start');
</script>

</body>
</html>
