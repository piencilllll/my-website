<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BACKROOMS: LEVEL 0</title>
    <style>
        :root {
            --bg-color: #050503;
            --terminal-bg: rgba(18, 16, 11, 0.92);
            --border-color: #3a3220;
            --text-main: #d3c498;
            --accent-yellow: #e6c641;
            --accent-red: #d94336;
            --accent-blue: #4aa3df;
            --accent-dim: #73694f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(230, 198, 65, 0.03) 0%, transparent 70%);
        }

        /* CRT Overlay Effects */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            z-index: 100;
        }

        #game-frame {
            width: 100%;
            max-width: 950px;
            height: 720px;
            background: var(--terminal-bg);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(230, 198, 65, 0.08);
            position: relative;
        }

        /* Status Header */
        #vital-bar {
            background: #0d0c08;
            border-bottom: 2px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .stat-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-label {
            color: var(--accent-dim);
            font-weight: bold;
        }

        .bar-container {
            width: 100px;
            height: 12px;
            background: #1c1810;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .fill-sanity { background: var(--accent-yellow); }
        .fill-stamina { background: var(--accent-blue); }

        /* Log / Sensory Engine */
        #terminal-display {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .log-entry {
            line-height: 1.6;
            font-size: 14px;
            letter-spacing: 0.2px;
            animation: textFade 0.2s ease-in;
        }

        @keyframes textFade {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sensory-desc {
            color: var(--text-main);
        }

        .ambient-audio {
            color: var(--accent-yellow);
            font-style: italic;
            border-left: 2px solid var(--accent-yellow);
            padding-left: 10px;
            margin: 4px 0;
        }

        .threat-alert {
            color: var(--accent-red);
            font-weight: bold;
            background: rgba(217, 67, 54, 0.1);
            padding: 8px 12px;
            border: 1px solid var(--accent-red);
        }

        /* Action Controls */
        #action-panel {
            padding: 18px 24px;
            background: #0d0c08;
            border-top: 2px solid var(--border-color);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-action {
            background: #18150e;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 16px;
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s ease;
        }

        .btn-action:hover {
            background: var(--accent-yellow);
            color: #000;
            border-color: var(--accent-yellow);
            font-weight: bold;
        }

        /* Inventory Sidebar Modal */
        #inventory-hud {
            position: absolute;
            top: 55px; right: 20px;
            background: #100f0a;
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            font-size: 12px;
            color: var(--accent-dim);
            z-index: 10;
        }

        .inv-item { color: var(--text-main); font-weight: bold; }

        /* Custom Scrollbar */
        #terminal-display::-webkit-scrollbar { width: 5px; }
        #terminal-display::-webkit-scrollbar-track { background: transparent; }
        #terminal-display::-webkit-scrollbar-thumb { background: var(--border-color); }
    </style>
</head>
<body>

<div class="crt-overlay"></div>

<div id="game-frame">
    <div id="vital-bar">
        <div class="stat-group">
            <span class="stat-label">LOCATION:</span>
            <span id="loc-display" style="color:var(--accent-yellow)">LEVEL 0 [UNMAPPED]</span>
        </div>
        <div class="stat-group">
            <span class="stat-label">SANITY:</span>
            <div class="bar-container"><div id="sanity-fill" class="bar-fill fill-sanity" style="width: 100%;"></div></div>
        </div>
        <div class="stat-group">
            <span class="stat-label">STAMINA:</span>
            <div class="bar-container"><div id="stamina-fill" class="bar-fill fill-stamina" style="width: 100%;"></div></div>
        </div>
    </div>

    <div id="inventory-hud">
        GEAR: <span id="inv-almond" class="inv-item">Almond Water (x1)</span> | <span id="inv-flash" class="inv-item">Flickering Flashlight</span>
    </div>

    <div id="terminal-display"></div>

    <div id="action-panel"></div>
</div>

<script>
    // State Tracking
    const player = {
        sanity: 100,
        stamina: 100,
        almondWater: 1,
        location: "Level 0 - Room 104",
        noiseLevel: 0,
        stepsTaken: 0,
        entityDistance: 100 // 0 = caught
    };

    const encounters = {
        node_start: {
            text: "You regain consciousness on damp, foul-smelling carpet. The overwhelming stench of old, saturated rag-rug fills your throat. Above, buzzing fluorescent tubes cast a monotonous, nauseating yellow glare across monochrome wallpaper extending endlessly in every direction.",
            sound: "[ AUDIO: Continuous 60Hz Fluorescent Light Hum - 78 dB ]",
            actions: [
                { text: "1. Pick yourself up and inspect your immediate surroundings.", target: "inspect_start" },
                { text: "2. Sit still and try to ground your thoughts.", target: "rest_start" }
            ]
        },

        inspect_start: {
            text: "You pull yourself up. The wallpaper is peeling in damp corners, exposing decayed plaster underneath. The floorboards beneath the carpet flex unnaturally. You notice faint, dark scuff marks leading around a sharp 90-degree corner to the left.",
            sound: "[ AUDIO: Low frequency vibration vibrating through floorboards... ]",
            actions: [
                { text: "1. Follow the scuff marks around the corner.", target: "walk_marks" },
                { text: "2. Turn around and head down the long, undisturbed hallway.", target: "walk_long_hall" },
                { text: "3. Drink Almond Water to steady your rapid pulse.", target: "drink_almond", condition: () => player.almondWater > 0 }
            ]
        },

        rest_start: {
            text: "You lie still, controlling your breathing. The fluorescent lights hum with brutal consistency. Seconds drag into minutes. The claustrophobic yellow walls feel like they're slowly contracting.",
            sound: "[ AUDIO: Fluorescent Hum grows louder... Buzzing sound pulsing ]",
            effects: { sanity: -10 },
            actions: [
                { text: "1. Stand up immediately. You can't stay here.", target: "inspect_start" }
            ]
        },

        walk_marks: {
            text: "You walk quietly down the narrow corridor. The carpet squeaks underfoot like wet foam. As you clear the corner, you find a dead-end wall—except for a singular, rusted metal fire alarm box mounted at waist height. Someone has scratched words into the yellow wallpaper: 'DONT LOOK AT IT'.",
            sound: "[ AUDIO: Faint wet squelching sounds... distant, roughly 40 meters away ]",
            effects: { sanity: -5, noise: 10 },
            actions: [
                { text: "1. Pry open the rusted fire alarm box.", target: "box_pry" },
                { text: "2. Retreat slowly before whatever made that wet sound approaches.", target: "retreat_quiet" }
            ]
        },

        walk_long_hall: {
            text: "You trek forward through identical plaster intersections. The spatial geometry feels broken—you turn four right corners in a row and end up in a brand new, massive open room filled with structural pillars.",
            sound: "[ AUDIO: Fluorescent hum suddenly CUTS OUT for 2 seconds, then flickers back ]",
            effects: { stamina: -10, sanity: -5 },
            actions: [
                { text: "1. Move between the central pillars.", target: "pillar_room" },
                { text: "2. Check the dark perimeter walls for doors.", target: "perimeter_dark" }
            ]
        },

        drink_almond: {
            text: "You uncap the vintage glass bottle and take a sip of the sweet, nutty fluid. A cool wave washes over your frayed nerves. Your spatial awareness sharpens.",
            sound: "[ AUDIO: Gulping sound echoes slightly too loud ]",
            effects: { sanity: +30, useAlmond: true },
            actions: [
                { text: "1. Continue exploring.", target: "inspect_start" }
            ]
        },

        box_pry: {
            text: "The metal door yields with a sharp, high-pitched screech that echoes down the infinite halls. Inside isn't a wiring grid—it's a second bottle of fresh Almond Water and a battery cell.",
            sound: "[ AUDIO: ECHOING METAL SCREECH - Threat Awareness Increased! ]",
            effects: { noise: +50, addAlmond: 1 },
            actions: [
                { text: "1. Grab the bottle and RUN back toward the main corridor.", target: "run_away" },
                { text: "2. Hide quietly in the dark alcove beside the box.", target: "hide_alcove" }
            ]
        },

        retreat_quiet: {
            text: "You back away on tip-toe, keeping your weight on your heels. The squelching noise grows closer, then stops... as if whatever is making it has halted to listen.",
            sound: "[ AUDIO: Total silence except your own heartbeat ]",
            effects: { stamina: -5 },
            actions: [
                { text: "1. Hold your breath and don't move a muscle.", target: "freeze_place" },
                { text: "2. Sprint in the opposite direction!", target: "run_away" }
            ]
        },

        freeze_place: {
            text: "You freeze. A towering, wire-thin silhouette made of black, twitching tendrils (a Bacteria / Hound entity) glides past the far end of the hallway. Its limbs make a dry click-clack noise against the carpet. It doesn't notice you.",
            sound: "[ AUDIO: Rapid mechanical clicking... fading away into distance ]",
            effects: { sanity: -15 },
            actions: [
                { text: "1. Slip past into the newly vacated hallway.", target: "walk_long_hall" }
            ]
        },

        run_away: {
            text: "You break into a full sprint! The yellow walls blur together into a disorienting nightmare. Behind you, an inhuman, distorted screech tears through the air. It heard you!",
            sound: "[ AUDIO: HEAVY LOUD FOOTSTEPS GAINING FAST BEHIND YOU ]",
            effects: { stamina: -30, sanity: -20 },
            actions: [
                { text: "1. Dive under a section of sagging, torn wallpaper into a wall void!", target: "wall_clip_attempt" },
                { text: "2. Keep running until your lungs burn!", target: "run_exhaustion" }
            ]
        },

        wall_clip_attempt: {
            text: "You hurl your shoulder into the seam between two drywall panels. Instead of crashing, your body glitches through the physical boundary. You fall hard onto cold, damp concrete... The yellow wallpaper is gone. Dark boiler pipes line the ceiling above.",
            sound: "[ AUDIO: BZZZZT - Glitch noise / System shift ]",
            effects: { sanity: -10 },
            actions: [
                { text: "1. Stand up and assess Level 1: The Zone of Concrete.", target: "level_1_entry" }
            ]
        },

        level_1_entry: {
            text: "YOU HAVE ESCAPED LEVEL 0. Welcome to Level 1. Fog hangs thick in the air. Industrial water drops fall from high pipes. You survived the initial shift.",
            sound: "[ AUDIO: Deep industrial humming & dripping water ]",
            actions: [
                { text: "Play Again (Reset Simulation)", target: "restart" }
            ]
        },

        run_exhaustion: {
            text: "Your legs give out. You collapse onto the saturated carpet. The footsteps behind you stop right over your head. Cold, wet tendrils wrap around your shoulder...",
            sound: "[ AUDIO: LOUD DISTORTED AUDIO SCREAM ]",
            effects: { sanity: -100 },
            actions: [
                { text: "YOU WERE CONSUMED BY THE BACKROOMS. (Restart)", target: "restart" }
            ]
        }
    };

    const termDisplay = document.getElementById('terminal-display');
    const actionPanel = document.getElementById('action-panel');

    function updateStats() {
        document.getElementById('sanity-fill').style.width = `${Math.max(0, player.sanity)}%`;
        document.getElementById('stamina-fill').style.width = `${Math.max(0, player.stamina)}%`;
        
        document.getElementById('inv-almond').textContent = `Almond Water (x${player.almondWater})`;

        if (player.sanity <= 0) {
            renderNode('run_exhaustion');
        }
    }

    function renderNode(nodeKey) {
        if (nodeKey === 'restart') {
            player.sanity = 100;
            player.stamina = 100;
            player.almondWater = 1;
            termDisplay.innerHTML = '';
            renderNode('node_start');
            return;
        }

        const node = encounters[nodeKey];
        if (!node) return;

        // Apply state changes
        if (node.effects) {
            if (node.effects.sanity) player.sanity += node.effects.sanity;
            if (node.effects.stamina) player.stamina += node.effects.stamina;
            if (node.effects.useAlmond) player.almondWater--;
            if (node.effects.addAlmond) player.almondWater += node.effects.addAlmond;
        }
        
        // Clamp stats
        player.sanity = Math.min(100, Math.max(0, player.sanity));
        player.stamina = Math.min(100, Math.max(0, player.stamina));

        updateStats();

        // Render Text Entry
        const entry = document.createElement('div');
        entry.className = 'log-entry';

        let html = `<p class="sensory-desc">${node.text}</p>`;
        if (node.sound) {
            html += `<p class="ambient-audio">${node.sound}</p>`;
        }
        entry.innerHTML = html;
        termDisplay.appendChild(entry);

        termDisplay.scrollTop = termDisplay.scrollHeight;

        // Render Action Buttons
        actionPanel.innerHTML = '';
        if (node.actions) {
            node.actions.forEach(act => {
                if (act.condition && !act.condition()) return;

                const btn = document.createElement('button');
                btn.className = 'btn-action';
                btn.textContent = act.text;
                btn.onclick = () => renderNode(act.target);
                actionPanel.appendChild(btn);
            });
        }
    }

    // Initialize Game
    renderNode('node_start');
</script>

</body>
</html>
