<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Ambient Soundscape</title>
  <style>
    :root {
      --bg-color: #121018;
      --card-bg: rgba(30, 24, 40, 0.75);
      --card-border: #4a3b5c;
      --text-main: #e8dbce;
      --text-sub: #a899ad;
      --accent: #dca368;
      --accent-glow: rgba(220, 163, 104, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Canvas Background */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* Container */
    .container {
      width: 90%;
      max-width: 800px;
      padding: 2rem;
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), 0 0 15px var(--accent-glow);
      backdrop-filter: blur(8px);
      margin: 2rem 0;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent);
      text-shadow: 2px 2px 0px #000;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* Sound Grid */
    .sound-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
    }

    /* Sound Card */
    .sound-card {
      background: rgba(18, 14, 24, 0.8);
      border: 2px solid var(--card-border);
      border-radius: 8px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s ease;
    }

    .sound-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .sound-title {
      font-weight: bold;
      margin-bottom: 1rem;
      font-size: 1.05rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Controls */
    .controls-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .toggle-btn {
      background: #2a2036;
      color: var(--text-main);
      border: 2px solid var(--card-border);
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      transition: all 0.2s;
    }

    .toggle-btn:hover {
      background: var(--card-border);
    }

    .sound-card.active .toggle-btn {
      background: var(--accent);
      color: #121018;
      border-color: var(--accent);
    }

    /* Custom Retro Slider */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }

    input[type="range"]:focus {
      outline: none;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 8px;
      cursor: pointer;
      background: #2a2036;
      border-radius: 4px;
      border: 1px solid var(--card-border);
    }

    input[type="range"]::-webkit-slider-thumb {
      height: 18px;
      width: 14px;
      border-radius: 2px;
      background: var(--accent);
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -6px;
      box-shadow: 0 0 4px #000;
    }

    input[type="range"]::-moz-range-track {
      width: 100%;
      height: 8px;
      cursor: pointer;
      background: #2a2036;
      border-radius: 4px;
      border: 1px solid var(--card-border);
    }

    input[type="range"]::-moz-range-thumb {
      height: 18px;
      width: 14px;
      border-radius: 2px;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 4px #000;
    }

    footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div class="container">
    <header>
      <h1>Nostalgic Ambience</h1>
      <p>Mix your environment. Click play on any track to start audio.</p>
    </header>

    <div class="sound-grid" id="soundGrid">
      <!-- Sound cards dynamically built in JS -->
    </div>

    <footer>
      <p>Built with HTML5 & Web Audio API • Nostalgic Pixel Rain Edition</p>
    </footer>
  </div>

  <script>
    // --- Audio System (Web Audio API Synthesizers) ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // Sound Generator Builders
    const SoundGenerators = {
      rainstorm: (ctx, gainNode) => {
        const bufferSize = ctx.sampleRate * 2;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
        const whiteNoise = ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 800;

        whiteNoise.connect(filter);
        filter.connect(gainNode);
        whiteNoise.start();
        return whiteNoise;
      },

      hearthfire: (ctx, gainNode) => {
        const bufferSize = ctx.sampleRate * 2;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = output[i];
          output[i] *= 3.5;
        }
        const brownNoise = ctx.createBufferSource();
        brownNoise.buffer = noiseBuffer;
        brownNoise.loop = true;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;

        brownNoise.connect(filter);
        filter.connect(gainNode);
        brownNoise.start();
        return brownNoise;
      },

      nightinsects: (ctx, gainNode) => {
        const osc = ctx.createOscillator();
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.value = 4500;

        lfo.type = 'triangle';
        lfo.frequency.value = 12;
        lfoGain.gain.value = 300;

        lfo.connect(osc.frequency);
        osc.connect(gainNode);

        osc.start();
        lfo.start();
        return { stop: () => { osc.stop(); lfo.stop(); } };
      },

      arcadedrone: (ctx, gainNode) => {
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        osc1.type = 'sawtooth';
        osc2.type = 'square';

        osc1.frequency.value = 110; // A2
        osc2.frequency.value = 110.5; // Slight detune for analog warmth

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 350;

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gainNode);

        osc1.start();
        osc2.start();
        return { stop: () => { osc1.stop(); osc2.stop(); } };
      },

      dungeonechoes: (ctx, gainNode) => {
        const osc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();

        osc.type = 'sine';
        osc.frequency.value = 55; // Low A1 note

        filter.type = 'lowpass';
        filter.frequency.value = 150;

        osc.connect(filter);
        filter.connect(gainNode);

        osc.start();
        return osc;
      }
    };

    // Sound definitions
    const sounds = [
      { id: 'rainstorm', name: 'Rainstorm' },
      { id: 'hearthfire', name: 'Hearth Fire' },
      { id: 'nightinsects', name: 'Night Insects' },
      { id: 'arcadedrone', name: 'Arcade Drone' },
      { id: 'dungeonechoes', name: 'Dungeon Echoes' }
    ];

    const soundInstances = {};

    // Build UI
    const grid = document.getElementById('soundGrid');

    sounds.forEach(sound => {
      const card = document.createElement('div');
      card.className = 'sound-card';
      card.id = `card-${sound.id}`;

      card.innerHTML = `
        <div class="sound-title">${sound.name}</div>
        <div class="controls-row">
          <button class="toggle-btn" id="btn-${sound.id}">▶</button>
          <input type="range" id="vol-${sound.id}" min="0" max="1" step="0.01" value="0.5">
        </div>
      `;

      grid.appendChild(card);

      const btn = card.querySelector(`#btn-${sound.id}`);
      const slider = card.querySelector(`#vol-${sound.id}`);

      btn.addEventListener('click', () => toggleSound(sound.id));
      slider.addEventListener('input', (e) => updateVolume(sound.id, e.target.value));

      soundInstances[sound.id] = {
        active: false,
        volume: 0.5,
        gainNode: null,
        source: null
      };
    });

    function toggleSound(id) {
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const instance = soundInstances[id];
      const card = document.getElementById(`card-${id}`);
      const btn = document.getElementById(`btn-${id}`);

      if (!instance.active) {
        // Turn ON
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = instance.volume;
        gainNode.connect(audioCtx.destination);

        const source = SoundGenerators[id](audioCtx, gainNode);

        instance.gainNode = gainNode;
        instance.source = source;
        instance.active = true;

        card.classList.add('active');
        btn.textContent = '❚❚';
      } else {
        // Turn OFF
        if (instance.source) {
          if (instance.source.stop) {
            instance.source.stop();
          } else if (instance.source.disconnect) {
            instance.source.disconnect();
          }
        }
        instance.active = false;
        card.classList.remove('active');
        btn.textContent = '▶';
      }
    }

    function updateVolume(id, value) {
      const instance = soundInstances[id];
      instance.volume = parseFloat(value);
      if (instance.gainNode) {
        instance.gainNode.gain.value = instance.volume;
      }
    }

    // --- Background Animation (Pixel Rainstorm Canvas) ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Raindrop particles
    const drops = [];
    const maxDrops = 150;

    for (let i = 0; i < maxDrops; i++) {
      drops.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        length: Math.random() * 20 + 10,
        speed: Math.random() * 10 + 12,
        opacity: Math.random() * 0.4 + 0.1
      });
    }

    function animate() {
      // Dark trail background effect
      ctx.fillStyle = 'rgba(18, 16, 24, 0.3)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw raindrops
      ctx.lineWidth = 2;
      drops.forEach(drop => {
        ctx.strokeStyle = `rgba(180, 160, 210, ${drop.opacity})`;
        ctx.beginPath();
        ctx.moveTo(drop.x, drop.y);
        ctx.lineTo(drop.x - drop.length * 0.2, drop.y + drop.length);
        ctx.stroke();

        // Update position
        drop.y += drop.speed;
        drop.x -= drop.speed * 0.2;

        // Reset drop when off screen
        if (drop.y > canvas.height) {
          drop.y = -drop.length;
          drop.x = Math.random() * (canvas.width + 200);
        }
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
