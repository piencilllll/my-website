<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis Submarine Simulator</title>
  <style>
    :root {
      --hud-cyan: #00f3ff;
      --hud-green: #00ffaa;
      --hud-red: #ff3366;
      --hud-amber: #ffb700;
      --hud-bg: rgba(2, 10, 22, 0.85);
      --hud-border: rgba(0, 243, 255, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 100%; height: 100%;
      overflow: hidden; background: #000;
      font-family: monospace, system-ui, sans-serif;
      color: #e2e8f0; user-select: none;
    }

    #render-canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
    }

    .viewport-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 5; pointer-events: none;
      background: radial-gradient(circle at center, transparent 55%, rgba(0, 5, 12, 0.65) 100%);
      box-shadow: inset 0 0 120px rgba(0, 243, 255, 0.08);
    }

    .hud-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10; pointer-events: none; padding: 24px;
      display: flex; flex-direction: column; justify-content: space-between;
    }

    header { display: flex; justify-content: space-between; align-items: flex-start; }

    .vessel-card {
      background: var(--hud-bg); border: 1px solid var(--hud-border);
      padding: 12px 20px; border-radius: 8px; backdrop-filter: blur(8px);
    }

    .badge {
      font-size: 0.7rem; color: var(--hud-cyan); border: 1px solid var(--hud-cyan);
      padding: 2px 8px; border-radius: 4px; font-weight: bold; background: rgba(0, 243, 255, 0.1);
    }

    h1 { font-size: 1.1rem; margin-top: 6px; color: #fff; letter-spacing: 1.5px; }

    .radar-box {
      width: 130px; height: 130px; background: var(--hud-bg);
      border: 1px solid var(--hud-border); border-radius: 50%;
      position: relative; overflow: hidden; backdrop-filter: blur(8px);
    }

    .radar-sweep {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(0, 255, 170, 0.5) 0deg, transparent 60deg);
      animation: sweep 2.5s linear infinite;
    }

    .radar-grid {
      position: absolute; top: 15%; left: 15%; width: 70%; height: 70%;
      border: 1px dashed rgba(0, 255, 170, 0.3); border-radius: 50%;
    }

    .radar-center {
      position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
      background: var(--hud-green); border-radius: 50%; transform: translate(-50%, -50%);
    }

    .radar-contact {
      position: absolute; width: 6px; height: 6px; background: var(--hud-red);
      border-radius: 50%; box-shadow: 0 0 8px var(--hud-red);
    }

    @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .footer-hud { display: flex; justify-content: space-between; align-items: flex-end; }

    .telemetry-card {
      background: var(--hud-bg); border: 1px solid var(--hud-border);
      padding: 12px 18px; border-radius: 8px; backdrop-filter: blur(8px); min-width: 160px;
    }

    .label { font-size: 0.65rem; color: #64748b; text-transform: uppercase; }
    .val { font-size: 1.2rem; font-weight: bold; color: var(--hud-cyan); margin-top: 2px; }
    .zone { font-size: 0.75rem; color: var(--hud-amber); font-weight: 600; }

    .controls-card {
      background: var(--hud-bg); border: 1px solid var(--hud-border);
      padding: 12px 20px; border-radius: 8px; backdrop-filter: blur(8px);
      font-size: 0.8rem; line-height: 1.5; color: #cbd5e1;
    }

    .controls-card span { color: #fff; font-weight: bold; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <canvas id="render-canvas"></canvas>
  <div class="viewport-overlay"></div>

  <div class="hud-layer">
    <header>
      <div class="vessel-card">
        <span class="badge">SYSTEM READY</span>
        <h1>AEGIS DEEP-SEA UNIT</h1>
      </div>
      <div class="radar-box">
        <div class="radar-grid"></div>
        <div class="radar-sweep"></div>
        <div class="radar-center"></div>
        <div class="radar-contact" id="contact-1" style="top: 30%; left: 65%;"></div>
      </div>
    </header>

    <div class="footer-hud">
      <div class="telemetry-card">
        <div class="label">CURRENT DEPTH</div>
        <div class="val" id="depth-readout">0 M</div>
        <div class="zone" id="zone-readout">SURFACE ZONE</div>
      </div>

      <div class="controls-card">
        ⌨️ <span>W/S</span>: Engine Throttle | <span>A/D</span>: Yaw Steer<br>
        ⬆️ <span>SPACE</span>: Ascent | ⬇️ <span>SHIFT</span>: Descent<br>
        🖱️ <span>Mouse Drag</span>: 360° Cockpit Camera Look
      </div>

      <div class="telemetry-card" style="text-align: right;">
        <div class="label">PROPULSION SPEED</div>
        <div class="val" id="speed-readout">0.0 KTS</div>
      </div>
    </div>
  </div>

  <script>
    // --- 3D Scene Setup ---
    const canvas = document.getElementById('render-canvas');
    const scene = new THREE.Scene();
    
    // Softer fog so you can see far ahead
    const depthFogColor = new THREE.Color(0x021a38);
    scene.background = depthFogColor;
    scene.fog = new THREE.FogExp2(depthFogColor, 0.006);

    // Global Underwater Ambient Lighting
    const ambientLight = new THREE.AmbientLight(0x1a4575, 2.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0x00d2ff, 1.8);
    sunLight.position.set(0, 100, 0);
    scene.add(sunLight);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // --- Submarine Rig & Cockpit Structure ---
    const submarine = new THREE.Group();
    scene.add(submarine);

    const cameraPivot = new THREE.Group();
    cameraPivot.position.set(0, 0.2, 0);
    submarine.add(cameraPivot);
    cameraPivot.add(camera);

    function buildRealisticCockpit() {
      const cockpit = new THREE.Group();

      const hullGeo = new THREE.CylinderGeometry(2.8, 2.8, 7, 32, 1, true);
      hullGeo.rotateX(Math.PI / 2);
      const hullMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8, side: THREE.BackSide });
      const hull = new THREE.Mesh(hullGeo, hullMat);
      cockpit.add(hull);

      const bezelGeo = new THREE.TorusGeometry(2.0, 0.15, 16, 48);
      const bezelMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.9, roughness: 0.2 });
      const bezel = new THREE.Mesh(bezelGeo, bezelMat);
      bezel.position.set(0, 0, -3.2);
      cockpit.add(bezel);

      const glassGeo = new THREE.CircleGeometry(1.95, 32);
      const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0x00f3ff, transparent: true, opacity: 0.12, transmission: 0.9, roughness: 0.1
      });
      const glass = new THREE.Mesh(glassGeo, glassMat);
      glass.position.set(0, 0, -3.15);
      cockpit.add(glass);

      const dashGeo = new THREE.BoxGeometry(4.2, 1.0, 1.4);
      const dashMat = new THREE.MeshStandardMaterial({ color: 0x020617, roughness: 0.6 });
      const dash = new THREE.Mesh(dashGeo, dashMat);
      dash.position.set(0, -1.1, -2.4);
      dash.rotation.x = 0.25;
      cockpit.add(dash);

      const colors = [0x00f3ff, 0x00ffaa, 0xff3366, 0xffb700];
      for(let i = 0; i < 16; i++) {
        const btnGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.08, 12);
        const btnMat = new THREE.MeshBasicMaterial({ color: colors[i % 4] });
        const btn = new THREE.Mesh(btnGeo, btnMat);
        btn.position.set(-1.6 + (i % 8) * 0.45, -0.85 + Math.floor(i / 8) * 0.25, -2.1);
        btn.rotation.x = 0.25;
        cockpit.add(btn);
      }

      const cabinLight = new THREE.PointLight(0x00f3ff, 2.0, 6);
      cabinLight.position.set(0, 1.5, -0.8);
      cockpit.add(cabinLight);

      // Kinetically Unified Matter Bottle
      const flaskGeo = new THREE.CylinderGeometry(0.1, 0.14, 0.5, 16);
      const flaskMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 0.9, opacity: 0.9 });
      const flask = new THREE.Mesh(flaskGeo, flaskMat);
      flask.position.set(1.8, -0.55, -1.8);
      
      const liquidGeo = new THREE.CylinderGeometry(0.08, 0.12, 0.38, 16);
      const liquidMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const liquid = new THREE.Mesh(liquidGeo, liquidMat);
      liquid.position.set(1.8, -0.6, -1.8);

      const liquidGlow = new THREE.PointLight(0xffffff, 2.0, 3);
      liquidGlow.position.set(1.8, -0.55, -1.8);

      cockpit.add(flask); cockpit.add(liquid); cockpit.add(liquidGlow);
      submarine.add(cockpit);
    }

    buildRealisticCockpit();

    // High-Power Headlight
    const headlight = new THREE.SpotLight(0x00f3ff, 40, 200, Math.PI / 3, 0.5, 1);
    headlight.position.set(0, 0, -3.2);
    headlight.target.position.set(0, 0, -80);
    submarine.add(headlight); submarine.add(headlight.target);

    // Dynamic Underwater Particles ("Marine Snow" for Motion Feedback)
    const particleCount = 1500;
    const particleGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      particlePositions[i] = (Math.random() - 0.5) * 160;
      particlePositions[i + 1] = (Math.random() - 0.5) * 160;
      particlePositions[i + 2] = (Math.random() - 0.5) * 160;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0x00ffff, size: 0.35, transparent: true, opacity: 0.6
    });
    const particleSystem = new THREE.Points(particleGeo, particleMat);
    scene.add(particleSystem);

    // --- Ocean Environment ---
    const skyGeo = new THREE.SphereGeometry(800, 32, 32);
    const skyMat = new THREE.MeshBasicMaterial({ color: 0x01040a, side: THREE.BackSide });
    const sky = new THREE.Mesh(skyGeo, skyMat);
    scene.add(sky);

    const moonGeo = new THREE.SphereGeometry(14, 32, 32);
    const moonMat = new THREE.MeshBasicMaterial({ color: 0xfffaed });
    const moon = new THREE.Mesh(moonGeo, moonMat);
    moon.position.set(150, 220, -400);
    scene.add(moon);

    const waterGeo = new THREE.PlaneGeometry(1000, 1000, 100, 100);
    waterGeo.rotateX(-Math.PI / 2);
    const waterMat = new THREE.MeshStandardMaterial({
      color: 0x004477, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.85
    });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.position.y = 2;
    scene.add(water);

    // Seabed Terrain Generation
    const seabedGeo = new THREE.PlaneGeometry(1200, 1200, 120, 120);
    seabedGeo.rotateX(-Math.PI / 2);
    const pos = seabedGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i); const z = pos.getZ(i);
      const h = Math.sin(x * 0.01) * Math.cos(z * 0.01) * 30 + Math.sin(x * 0.03) * 6;
      pos.setY(i, h - 80);
    }
    seabedGeo.computeVertexNormals();
    const seabedMat = new THREE.MeshStandardMaterial({ color: 0x0f2f52, roughness: 0.8 });
    const seabed = new THREE.Mesh(seabedGeo, seabedMat);
    scene.add(seabed);

    // Bioluminescent Rocks
    const rockGroup = new THREE.Group();
    const rockGeo = new THREE.DodecahedronGeometry(2.5, 1);
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x1a3d61, roughness: 0.8 });
    for (let i = 0; i < 80; i++) {
      const rock = new THREE.Mesh(rockGeo, rockMat);
      const rx = (Math.random() - 0.5) * 600;
      const rz = (Math.random() - 0.5) * 600;
      rock.position.set(rx, -75 + Math.random() * 4, rz);
      rock.scale.set(1 + Math.random() * 2, 1 + Math.random() * 3, 1 + Math.random() * 2);
      rockGroup.add(rock);
    }
    scene.add(rockGroup);

    // Glowing Fish Schools
    const fishCount = 180;
    const fishGroup = new THREE.InstancedMesh(
      new THREE.ConeGeometry(0.4, 1.4, 8).rotateX(Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x005544, roughness: 0.2 }),
      fishCount
    );
    const dummy = new THREE.Object3D();
    const fishData = Array.from({ length: fishCount }, () => ({
      pos: new THREE.Vector3((Math.random() - 0.5) * 400, -10 - Math.random() * 50, (Math.random() - 0.5) * 400),
      vel: new THREE.Vector3((Math.random() - 0.5) * 0.4, 0, (Math.random() - 0.5) * 0.4)
    }));
    scene.add(fishGroup);

    // --- Interaction & Controls ---
    let isMouseDown = false, targetYaw = 0, targetPitch = 0;
    window.addEventListener('mousedown', (e) => { if (e.target.tagName === 'CANVAS') isMouseDown = true; });
    window.addEventListener('mouseup', () => isMouseDown = false);
    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      targetYaw -= e.movementX * 0.003;
      targetPitch -= e.movementY * 0.003;
      targetPitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, targetPitch));
    });

    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    // --- Main Loop ---
    const clock = new THREE.Clock();
    let velocity = new THREE.Vector3(), yaw = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Camera Smooth Interpolation
      cameraPivot.rotation.y = THREE.MathUtils.lerp(cameraPivot.rotation.y, targetYaw, 0.08);
      cameraPivot.rotation.x = THREE.MathUtils.lerp(cameraPivot.rotation.x, targetPitch, 0.08);

      // Submarine Movement
      const fwdSpeed = 30.0 * delta;
      if (keys['KeyW']) velocity.z = THREE.MathUtils.lerp(velocity.z, -fwdSpeed, 0.05);
      else if (keys['KeyS']) velocity.z = THREE.MathUtils.lerp(velocity.z, fwdSpeed * 0.5, 0.05);
      else velocity.z = THREE.MathUtils.lerp(velocity.z, 0, 0.04);

      if (keys['KeyA']) yaw += 1.2 * delta;
      if (keys['KeyD']) yaw -= 1.2 * delta;

      if (keys['Space']) velocity.y = THREE.MathUtils.lerp(velocity.y, fwdSpeed * 0.5, 0.05);
      else if (keys['ShiftLeft'] || keys['ShiftRight']) velocity.y = THREE.MathUtils.lerp(velocity.y, -fwdSpeed * 0.5, 0.05);
      else velocity.y = THREE.MathUtils.lerp(velocity.y, 0, 0.04);

      submarine.rotation.y = yaw;
      submarine.translateZ(velocity.z);
      submarine.position.y = Math.max(-70, Math.min(2.5, submarine.position.y + velocity.y));

      // Keep particles relative to submarine position for continuous drift
      particleSystem.position.copy(submarine.position);

      // Wave Motion
      const wPos = waterGeo.attributes.position;
      for (let i = 0; i < wPos.count; i++) {
        const u = wPos.getX(i); const v = wPos.getY(i);
        wPos.setZ(i, Math.sin(u * 0.04 + time * 1.5) * 0.6 + Math.cos(v * 0.04 + time * 1.5) * 0.6);
      }
      waterGeo.attributes.position.needsUpdate = true;

      // Fish Simulation
      fishData.forEach((f, i) => {
        f.pos.add(f.vel);
        if(Math.abs(f.pos.x) > 250) f.vel.x *= -1;
        if(Math.abs(f.pos.z) > 250) f.vel.z *= -1;
        dummy.position.copy(f.pos);
        dummy.rotation.y = Math.atan2(f.vel.x, f.vel.z);
        dummy.updateMatrix();
        fishGroup.setMatrixAt(i, dummy.matrix);
      });
      fishGroup.instanceMatrix.needsUpdate = true;

      // Telemetry Readouts
      const currentDepth = Math.max(0, Math.round(-submarine.position.y * 10));
      document.getElementById('depth-readout').innerText = currentDepth + ' M';
      document.getElementById('speed-readout').innerText = (Math.abs(velocity.z) * 35).toFixed(1) + ' KTS';

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
