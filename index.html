<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Night Ambience</title>
  <style>
    :root {
      --bg-color: #060a12;
      --card-bg: rgba(12, 22, 40, 0.82);
      --card-border: #1e3a5f;
      --text-main: #e2f1ff;
      --text-sub: #7b9bbd;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Canvas Background */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* Main Card Container */
    .container {
      width: 90%;
      max-width: 820px;
      padding: 2.2rem;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 14px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 20px var(--accent-glow);
      backdrop-filter: blur(10px);
      margin: 2rem 0;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent-glow), 2px 2px 0px #030712;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* Sound Grid */
    .sound-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 1.2rem;
    }

    /* Sound Card */
    .sound-card {
      background: rgba(8, 15, 28, 0.85);
      border: 2px solid var(--card-border);
      border-radius: 10px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.25s ease;
    }

    .sound-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
      background: rgba(14, 28, 50, 0.9);
    }

    .sound-title {
      font-weight: bold;
      margin-bottom: 1rem;
      font-size: 1.05rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Controls */
    .controls-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .toggle-btn {
      background: #0f233d;
      color: var(--text-main);
      border: 2px solid var(--card-border);
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      transition: all 0.2s;
    }

    .toggle-btn:hover {
      background: var(--card-border);
      color: #fff;
    }

    .sound-card.active .toggle-btn {
      background: var(--accent);
      color: #030712;
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    /* Blue Retro Slider */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }

    input[type="range"]:focus {
      outline: none;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 8px;
      cursor: pointer;
      background: #0f233d;
      border-radius: 4px;
      border: 1px solid var(--card-border);
    }

    input[type="range"]::-webkit-slider-thumb {
      height: 18px;
      width: 14px;
      border-radius: 2px;
      background: var(--accent);
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -6px;
      box-shadow: 0 0 6px var(--accent-glow);
    }

    input[type="range"]::-moz-range-track {
      width: 100%;
      height: 8px;
      cursor: pointer;
      background: #0f233d;
      border-radius: 4px;
      border: 1px solid var(--card-border);
    }

    input[type="range"]::-moz-range-thumb {
      height: 18px;
      width: 14px;
      border-radius: 2px;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 6px var(--accent-glow);
    }

    footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div class="container">
    <header>
      <h1>Rainy Bus Stop</h1>
      <p>Adjust the sliders to craft your ambient night landscape.</p>
    </header>

    <div class="sound-grid" id="soundGrid">
      <!-- Sound cards built dynamically -->
    </div>

    <footer>
      <p>Midnight Blue Edition • Web Audio API & Animated Canvas</p>
    </footer>
  </div>

  <script>
    // --- Audio System (Web Audio API Synthesizers) ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // Sound Generators
    const SoundGenerators = {
      rainstorm: (ctx, gainNode) => {
        const bufferSize = ctx.sampleRate * 2;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
        const whiteNoise = ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 750;

        whiteNoise.connect(filter);
        filter.connect(gainNode);
        whiteNoise.start();
        return whiteNoise;
      },

      hearthfire: (ctx, gainNode) => {
        const bufferSize = ctx.sampleRate * 2;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = output[i];
          output[i] *= 3.5;
        }
        const brownNoise = ctx.createBufferSource();
        brownNoise.buffer = noiseBuffer;
        brownNoise.loop = true;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 350;

        brownNoise.connect(filter);
        filter.connect(gainNode);
        brownNoise.start();
        return brownNoise;
      },

      // Improved Cricket/Insects Generator
      nightinsects: (ctx, gainNode) => {
        const osc = ctx.createOscillator();
        const lfo1 = ctx.createOscillator();
        const lfo2 = ctx.createOscillator();
        const lfoGain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.value = 4600;

        // Pulses cricket chirps
        lfo1.type = 'square';
        lfo1.frequency.value = 16;

        // Modulates cricket pitch variation
        lfo2.type = 'sine';
        lfo2.frequency.value = 0.5;

        lfoGain.gain.value = 150;
        lfo2.connect(lfoGain);
        lfoGain.connect(osc.frequency);

        const modGain = ctx.createGain();
        lfo1.connect(modGain.gain);

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 4600;
        filter.Q.value = 5;

        osc.connect(modGain);
        modGain.connect(filter);
        filter.connect(gainNode);

        osc.start();
        lfo1.start();
        lfo2.start();

        return { stop: () => { osc.stop(); lfo1.stop(); lfo2.stop(); } };
      },

      arcadedrone: (ctx, gainNode) => {
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        osc1.type = 'sawtooth';
        osc2.type = 'square';

        osc1.frequency.value = 110;
        osc2.frequency.value = 110.4;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 320;

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gainNode);

        osc1.start();
        osc2.start();
        return { stop: () => { osc1.stop(); osc2.stop(); } };
      },

      // Improved Deep Dungeon Echoes Generator
      dungeonechoes: (ctx, gainNode) => {
        const osc = ctx.createOscillator();
        const subOsc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();

        osc.type = 'triangle';
        subOsc.type = 'sine';

        osc.frequency.value = 65;
        subOsc.frequency.value = 32.5;

        // LFO for atmospheric ambient pitch swelling
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        lfo.type = 'sine';
        lfo.frequency.value = 0.1;
        lfoGain.gain.value = 6;
        lfo.connect(osc.frequency);

        filter.type = 'lowpass';
        filter.frequency.value = 180;

        osc.connect(filter);
        subOsc.connect(filter);
        filter.connect(gainNode);

        osc.start();
        subOsc.start();
        lfo.start();

        return { stop: () => { osc.stop(); subOsc.stop(); lfo.stop(); } };
      }
    };

    const sounds = [
      { id: 'rainstorm', name: 'Rainstorm' },
      { id: 'hearthfire', name: 'Hearth Fire' },
      { id: 'nightinsects', name: 'Night Insects' },
      { id: 'arcadedrone', name: 'Arcade Drone' },
      { id: 'dungeonechoes', name: 'Dungeon Echoes' }
    ];

    const soundInstances = {};
    const grid = document.getElementById('soundGrid');

    sounds.forEach(sound => {
      const card = document.createElement('div');
      card.className = 'sound-card';
      card.id = `card-${sound.id}`;

      card.innerHTML = `
        <div class="sound-title">${sound.name}</div>
        <div class="controls-row">
          <button class="toggle-btn" id="btn-${sound.id}">▶</button>
          <input type="range" id="vol-${sound.id}" min="0" max="1" step="0.01" value="0.5">
        </div>
      `;

      grid.appendChild(card);

      const btn = card.querySelector(`#btn-${sound.id}`);
      const slider = card.querySelector(`#vol-${sound.id}`);

      btn.addEventListener('click', () => toggleSound(sound.id));
      slider.addEventListener('input', (e) => updateVolume(sound.id, e.target.value));

      soundInstances[sound.id] = {
        active: false,
        volume: 0.5,
        gainNode: null,
        source: null
      };
    });

    function toggleSound(id) {
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const instance = soundInstances[id];
      const card = document.getElementById(`card-${id}`);
      const btn = document.getElementById(`btn-${id}`);

      if (!instance.active) {
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = instance.volume;
        gainNode.connect(audioCtx.destination);

        const source = SoundGenerators[id](audioCtx, gainNode);

        instance.gainNode = gainNode;
        instance.source = source;
        instance.active = true;

        card.classList.add('active');
        btn.textContent = '❚❚';
      } else {
        if (instance.source) {
          if (instance.source.stop) {
            instance.source.stop();
          } else if (instance.source.disconnect) {
            instance.source.disconnect();
          }
        }
        instance.active = false;
        card.classList.remove('active');
        btn.textContent = '▶';
      }
    }

    function updateVolume(id, value) {
      const instance = soundInstances[id];
      instance.volume = parseFloat(value);
      if (instance.gainNode) {
        instance.gainNode.gain.value = instance.volume;
      }
    }

    // --- Background Animation (Bus Station + Wind Tree + Rain Canvas) ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Raindrops
    const drops = [];
    const maxDrops = 180;
    for (let i = 0; i < maxDrops; i++) {
      drops.push({
        x: Math.random() * (canvas.width + 300),
        y: Math.random() * canvas.height,
        length: Math.random() * 25 + 15,
        speed: Math.random() * 12 + 14,
        opacity: Math.random() * 0.45 + 0.15
      });
    }

    let windTime = 0;

    function drawScene() {
      const w = canvas.width;
      const h = canvas.height;

      // Dark Blue / Navy Sky Gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
      skyGrad.addColorStop(0, '#040914');
      skyGrad.addColorStop(0.6, '#0a1628');
      skyGrad.addColorStop(1, '#060c18');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h);

      // Road (Bottom)
      const roadY = h * 0.72;
      ctx.fillStyle = '#080d1a';
      ctx.fillRect(0, roadY, w, h - roadY);

      // Road Marking Line
      ctx.strokeStyle = '#1e385c';
      ctx.lineWidth = 4;
      ctx.setLineDash([30, 25]);
      ctx.beginPath();
      ctx.moveTo(0, roadY + (h - roadY) * 0.4);
      ctx.lineTo(w, roadY + (h - roadY) * 0.4);
      ctx.stroke();
      ctx.setLineDash([]); // reset line dash

      // Animated Wind Tree (Left side)
      windTime += 0.03;
      const windSway = Math.sin(windTime) * 12;
      const treeBaseX = w * 0.18;
      const treeBaseY = roadY;

      // Tree Trunk
      ctx.fillStyle = '#0b1626';
      ctx.beginPath();
      ctx.moveTo(treeBaseX - 12, treeBaseY);
      ctx.quadraticCurveTo(treeBaseX + windSway * 0.3, treeBaseY - 90, treeBaseX + windSway, treeBaseY - 180);
      ctx.lineTo(treeBaseX + 12 + windSway, treeBaseY - 180);
      ctx.quadraticCurveTo(treeBaseX + 12, treeBaseY - 90, treeBaseX + 12, treeBaseY);
      ctx.fill();

      // Tree Foliage (Swaying in wind)
      ctx.fillStyle = '#0e243a';
      ctx.beginPath();
      ctx.arc(treeBaseX + windSway, treeBaseY - 210, 65, 0, Math.PI * 2);
      ctx.arc(treeBaseX - 35 + windSway * 0.8, treeBaseY - 180, 45, 0, Math.PI * 2);
      ctx.arc(treeBaseX + 35 + windSway * 1.2, treeBaseY - 180, 50, 0, Math.PI * 2);
      ctx.fill();

      // Bus Station Shelter (Right side)
      const busX = w * 0.68;
      const busY = roadY - 130;
      const busW = 160;
      const busH = 130;

      // Shelter Back & Glass Glow
      ctx.fillStyle = 'rgba(15, 35, 60, 0.4)';
      ctx.fillRect(busX, busY, busW, busH);

      // Shelter Frame
      ctx.strokeStyle = '#1f3e66';
      ctx.lineWidth = 4;
      ctx.strokeRect(busX, busY, busW, busH);

      // Shelter Roof
      ctx.fillStyle = '#162e4c';
      ctx.fillRect(busX - 15, busY - 10, busW + 30, 12);

      // Bench Inside Bus Station
      ctx.fillStyle = '#0f2238';
      ctx.fillRect(busX + 25, busY + 80, busW - 50, 8);
      ctx.fillRect(busX + 35, busY + 88, 6, 25);
      ctx.fillRect(busX + busW - 41, busY + 88, 6, 25);

      // Bus Station Sign Post
      ctx.strokeStyle = '#254a78';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(busX - 35, roadY);
      ctx.lineTo(busX - 35, busY - 25);
      ctx.stroke();

      // Bus Sign Box (Blue Glow)
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 12;
      ctx.fillRect(busX - 50, busY - 50, 30, 25);
      ctx.shadowBlur = 0; // reset shadow

      // Bus Sign Icon / Text Symbol
      ctx.fillStyle = '#060a12';
      ctx.font = 'bold 12px monospace';
      ctx.fillText('BUS', busX - 47, busY - 33);
    }

    function animate() {
      drawScene();

      // Draw Wind-driven Rain
      ctx.lineWidth = 2;
      drops.forEach(drop => {
        ctx.strokeStyle = `rgba(120, 190, 255, ${drop.opacity})`;
        ctx.beginPath();
        ctx.moveTo(drop.x, drop.y);
        ctx.lineTo(drop.x - drop.length * 0.35, drop.y + drop.length);
        ctx.stroke();

        // Update Position
        drop.y += drop.speed;
        drop.x -= drop.speed * 0.35;

        // Reset off-screen rain
        if (drop.y > canvas.height) {
          drop.y = -drop.length;
          drop.x = Math.random() * (canvas.width + 400);
        }
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
