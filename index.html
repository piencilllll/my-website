<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Protocol | Terminal Adventure</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: #151823;
            --accent-cyan: #00f3ff;
            --accent-glow: rgba(0, 243, 255, 0.4);
            --accent-red: #ff2a6d;
            --text-main: #d1d5db;
            --text-bright: #ffffff;
            --border-color: #2a2e3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none; /* Hide default cursor */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Custom Glowing Cursor */
        #custom-cursor {
            width: 16px;
            height: 16px;
            background: var(--accent-cyan);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px var(--accent-cyan), 0 0 30px var(--accent-cyan);
            transition: transform 0.05s ease-out;
        }

        /* Scanline FX Over Overlay */
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.3) 50%,
                rgba(0, 0, 0, 0.3)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
            opacity: 0.6;
        }

        /* Container & Card */
        .game-container {
            width: 90%;
            max-width: 650px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(0, 243, 255, 0.1);
            position: relative;
            z-index: 2;
            animation: fadeIn 0.8s ease-in-out;
        }

        /* Canvas Vector Animation Stage */
        .canvas-frame {
            width: 100%;
            height: 200px;
            background: #050608;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Story Text Area */
        .story-box {
            min-height: 90px;
            margin-bottom: 24px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-bright);
            position: relative;
        }

        /* Options Grid */
        .choices-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            background: #1a1e2d;
            border: 1px solid var(--border-color);
            color: var(--text-bright);
            padding: 14px 20px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .choice-btn:hover {
            border-color: var(--accent-cyan);
            background: #22273a;
            box-shadow: 0 0 12px var(--accent-glow);
            transform: translateX(4px);
            color: var(--accent-cyan);
        }

        .choice-btn:active {
            transform: scale(0.98);
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-cyan);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>
    <div class="scanline"></div>

    <div class="game-container">
        <div class="status-bar">
            <span id="zone-tag">SECTOR 00</span>
            <span id="status-tag">STATUS: ONLINE</span>
        </div>

        <div class="canvas-frame">
            <canvas id="sceneCanvas"></canvas>
        </div>

        <div class="story-box" id="story-text">Loading simulation data...</div>

        <div class="choices-grid" id="choices-container"></div>
    </div>

    <script>
        // Custom Cursor Logic
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.addEventListener('mousedown', () => {
            cursor.style.transform = 'translate(-50%, -50%) scale(0.7)';
        });
        document.addEventListener('mouseup', () => {
            cursor.style.transform = 'translate(-50%, -50%) scale(1)';
        });

        // Canvas Animation Engine
        const canvas = document.getElementById('sceneCanvas');
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let sceneType = 'grid';

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let t = 0;
        function renderScene() {
            t += 0.03;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (sceneType === 'gate') {
                // Moving Corridor / Gate Effect
                ctx.strokeStyle = '#00f3ff';
                ctx.lineWidth = 1.5;
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                for (let i = 1; i < 8; i++) {
                    let size = ((t * 20 + i * 35) % 200);
                    ctx.strokeRect(cx - size, cy - size / 2, size * 2, size);
                }
            } else if (sceneType === 'core') {
                // Pulsing Energy Core
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const radius = 30 + Math.sin(t * 2) * 8;
                
                let gradient = ctx.createRadialGradient(cx, cy, 5, cx, cy, radius + 20);
                gradient.addColorStop(0, '#00f3ff');
                gradient.addColorStop(0.5, '#ff2a6d');
                gradient.addColorStop(1, 'transparent');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(cx, cy, radius + 20, 0, Math.PI * 2);
                ctx.fill();
            } else if (sceneType === 'anomaly') {
                // Glitchy Chaos Particles
                ctx.fillStyle = '#ff2a6d';
                for(let i = 0; i < 25; i++) {
                    let x = (Math.sin(i + t) * 0.5 + 0.5) * canvas.width;
                    let y = (Math.cos(i * 2 + t) * 0.5 + 0.5) * canvas.height;
                    let size = Math.random() * 4 + 2;
                    ctx.fillRect(x, y, size, size);
                }
            } else {
                // Default Synthwave Grid
                ctx.strokeStyle = 'rgba(0, 243, 255, 0.2)';
                ctx.lineWidth = 1;
                let gridGap = 20;
                for (let x = 0; x < canvas.width; x += gridGap) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }
                for (let y = (t * 10) % gridGap; y < canvas.height; y += gridGap) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                }
            }

            animationFrameId = requestAnimationFrame(renderScene);
        }
        renderScene();

        // Story State Tree
        const storyData = {
            start: {
                text: "System Alert: Terminal link initialized. You wake up inside a pitch-black airlock unit. The emergency interface light blinks orange ahead of you.",
                scene: "grid",
                zone: "SECTOR 01 - AIRLOCK",
                status: "ONLINE",
                choices: [
                    { text: "Examine the manual override panel", next: "panel" },
                    { text: "Force open the sealed glass hatch", next: "hatch" }
                ]
            },
            panel: {
                text: "You wipe dust off the screen. It displays two power redirection options to unlock the facility doors. One draws from the Sub-Core, the other triggers an Emergency Purge.",
                scene: "gate",
                zone: "SECTOR 02 - CONTROL",
                status: "POWER LOW",
                choices: [
                    { text: "Reroute power through the Sub-Core", next: "core_path" },
                    { text: "Execute Emergency Purge protocol", next: "purge_path" }
                ]
            },
            hatch: {
                text: "The glass seal hairline-fractures with a loud crack! Cold, unstable mist surges out from the adjacent hallway.",
                scene: "anomaly",
                zone: "SECTOR 01 - BREACH",
                status: "WARNING",
                choices: [
                    { text: "Step cautiously through the breached mist", next: "mist_path" },
                    { text: "Retreat and check the manual panel", next: "panel" }
                ]
            },
            core_path: {
                text: "Humming vibrations fill the deck. A deep blue liquid light runs down glass conduits along the corridor, leading to a massive vault.",
                scene: "core",
                zone: "VAULT - CORE ROOM",
                status: "STABLE",
                choices: [
                    { text: "Access the central terminal console", next: "win_ending" },
                    { text: "Touch the pulsing liquid energy stream", next: "anomaly_ending" }
                ]
            },
            purge_path: {
                text: "Red alarms blare! Siren strobes illuminate the entire chamber as doors seal permanently.",
                scene: "anomaly",
                zone: "CRITICAL FAILURE",
                status: "DANGER",
                choices: [
                    { text: "Reboot System to try again", next: "start" }
                ]
            },
            mist_path: {
                text: "Inside the mist, structural geometry seems to bend unnaturally. Reality distorts as path lines shift around you.",
                scene: "anomaly",
                zone: "UNKNOWN STANZAS",
                status: "ERR_UNSTABLE",
                choices: [
                    { text: "Follow the glowing shift lines deeper", next: "anomaly_ending" },
                    { text: "Turn around immediately", next: "start" }
                ]
            },
            win_ending: {
                text: "Core authorization granted! Full facility map unlocked. You have successfully bypassed the locks and gained master override.",
                scene: "gate",
                zone: "ACCESS GRANTED",
                status: "COMPLETE",
                choices: [
                    { text: "Restart Simulation", next: "start" }
                ]
            },
            anomaly_ending: {
                text: "The unstable energy encapsulates the terminal screen... signal lost in the dark expanse.",
                scene: "anomaly",
                zone: "SIGNAL LOST",
                status: "OFFLINE",
                choices: [
                    { text: "Re-establish Terminal Link", next: "start" }
                ]
            }
        };

        // Render Story Step
        function loadNode(nodeKey) {
            const node = storyData[nodeKey];
            
            document.getElementById('zone-tag').innerText = node.zone;
            document.getElementById('status-tag').innerText = node.status;
            
            // Set Animated Canvas Scene
            sceneType = node.scene;

            // Typewriter Effect for Story Text
            const storyBox = document.getElementById('story-text');
            storyBox.innerHTML = '';
            let charIndex = 0;
            const fullText = node.text;

            function typeWriter() {
                if (charIndex < fullText.length) {
                    storyBox.innerHTML += fullText.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, 18);
                }
            }
            typeWriter();

            // Populate Choice Buttons
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';

            node.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = `> ${choice.text}`;
                btn.onclick = () => loadNode(choice.next);
                choicesContainer.appendChild(btn);
            });
        }

        // Start Initial Scene
        loadNode('start');
    </script>
</body>
</html>
