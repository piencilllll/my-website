<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis Sub-1 — Deep Ocean Exploration Simulator</title>
  <style>
    :root {
      --hud-cyan: #00f3ff;
      --hud-green: #00ffaa;
      --hud-bg: rgba(2, 12, 24, 0.85);
      --hud-border: rgba(0, 243, 255, 0.3);
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #010610;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e2e8f0;
      user-select: none;
    }

    /* 3D Canvas */
    #webgl-canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    /* Submarine Porthole / Cockpit Frame Overlay */
    .cockpit-overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
      box-shadow: inset 0 0 120px rgba(0,0,0,0.95), inset 0 0 400px rgba(0, 15, 30, 0.8);
      border: 28px solid #080d14;
      display: flex; flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }

    /* Porthole Glass Vignette & Scanlines */
    .porthole-vignette {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 55%, rgba(1, 8, 18, 0.85) 85%, rgba(0, 0, 0, 0.98) 100%);
      pointer-events: none;
    }

    /* HUD Top Bar */
    header {
      display: flex; justify-content: space-between; align-items: flex-start;
      z-index: 15;
    }

    .vessel-title {
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      padding: 10px 18px; border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .badge {
      background: rgba(0, 243, 255, 0.15);
      color: var(--hud-cyan);
      border: 1px solid var(--hud-cyan);
      padding: 2px 8px; border-radius: 10px;
      font-size: 0.65rem; letter-spacing: 2px;
      text-transform: uppercase; font-weight: 700;
    }

    h1 { font-size: 1.3rem; margin: 4px 0 0; color: #fff; letter-spacing: 1px; }

    /* Sonar Radar Widget */
    .sonar-box {
      width: 110px; height: 110px;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      border-radius: 50%;
      position: relative; overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
    }

    .sonar-sweep {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(0,255,170,0.4) 0deg, transparent 60deg);
      animation: sweep 3s linear infinite;
    }

    .sonar-grid {
      position: absolute; top: 10%; left: 10%; width: 80%; height: 80%;
      border: 1px dashed rgba(0, 255, 170, 0.3); border-radius: 50%;
    }

    .sonar-center {
      position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
      background: var(--hud-green); border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px var(--hud-green);
    }

    @keyframes sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Telemetry HUD Bottom */
    .telemetry-bar {
      display: flex; justify-content: space-between; align-items: flex-end;
      z-index: 15;
    }

    .stat-card {
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      padding: 12px 18px; border-radius: 12px;
      backdrop-filter: blur(10px);
      min-width: 140px;
    }

    .stat-lbl { font-size: 0.65rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
    .stat-val { font-size: 1.2rem; font-weight: bold; color: var(--hud-cyan); margin-top: 2px; }

    .controls-card {
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      padding: 12px 18px; border-radius: 12px;
      backdrop-filter: blur(10px); font-size: 0.75rem; color: #94a3b8;
    }

    .controls-card span { color: #fff; font-weight: bold; }
  </style>

  <!-- Three.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <!-- Submarine Cockpit Frame & HUD -->
  <div class="porthole-vignette"></div>
  <div class="cockpit-overlay">
    <header>
      <div class="vessel-title">
        <span class="badge">SYSTEM ONLINE</span>
        <h1>AEGIS SUB-1</h1>
      </div>

      <!-- Rotating Sonar Display -->
      <div class="sonar-box">
        <div class="sonar-grid"></div>
        <div class="sonar-sweep"></div>
        <div class="sonar-center"></div>
      </div>
    </header>

    <div class="telemetry-bar">
      <div class="stat-card">
        <div class="stat-lbl">CURRENT DEPTH</div>
        <div class="stat-val" id="tele-depth">320 M</div>
      </div>

      <div class="controls-card">
        🕹️ <span>W / S</span>: Throttle Forward/Back | <span>A / D</span>: Turn Left/Right<br>
        ⬆️ <span>SPACE</span>: Ascend | ⬇️ <span>SHIFT</span>: Descend | 🖱️ <span>Mouse</span>: Look
      </div>

      <div class="stat-card" style="text-align: right;">
        <div class="stat-lbl">HEADING / SPEED</div>
        <div class="stat-val" id="tele-speed">0.0 KTS</div>
      </div>
    </div>
  </div>

  <script>
    // --- 3D Scene & Rendering Setup ---
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();

    // Deep Underwater Fog
    const oceanFogColor = 0x021024;
    scene.background = new THREE.Color(oceanFogColor);
    scene.fog = new THREE.FogExp2(oceanFogColor, 0.018);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 300);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // --- Submarine Vehicle Rig ---
    const submarine = new THREE.Group();
    submarine.position.set(0, 20, 0);
    scene.add(submarine);
    submarine.add(camera);

    // --- Dual Submarine Headlights ---
    const leftHeadlight = new THREE.SpotLight(0x00f3ff, 8, 90, Math.PI / 5, 0.5, 1);
    leftHeadlight.position.set(-2, -0.5, -1);
    leftHeadlight.target.position.set(-2, -0.5, -50);
    submarine.add(leftHeadlight);
    submarine.add(leftHeadlight.target);

    const rightHeadlight = new THREE.SpotLight(0xfff5cc, 10, 110, Math.PI / 4, 0.4, 1);
    rightHeadlight.position.set(2, -0.5, -1);
    rightHeadlight.target.position.set(2, -0.5, -50);
    submarine.add(rightHeadlight);
    submarine.add(rightHeadlight.target);

    // Soft Ambient Underwater Light
    const ambientLight = new THREE.AmbientLight(0x0a2540, 1.5);
    scene.add(ambientLight);

    // --- Procedural Seabed Terrain ---
    const terrainGeo = new THREE.PlaneGeometry(500, 500, 100, 100);
    terrainGeo.rotateX(-Math.PI / 2);

    const pos = terrainGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      // Generate rolling underwater mountains and trenches
      const y = Math.sin(x * 0.03) * Math.cos(z * 0.03) * 8 + Math.sin(x * 0.08) * 4;
      pos.setY(i, y - 15);
    }
    terrainGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshStandardMaterial({
      color: 0x0a1d33,
      roughness: 0.9,
      metalness: 0.1,
      wireframe: false
    });
    const seabed = new THREE.Mesh(terrainGeo, terrainMat);
    scene.add(seabed);

    // --- Floating Marine Snow / Plankton Particles ---
    const particleCount = 2000;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      particlePos[i] = (Math.random() - 0.5) * 160;
      particlePos[i+1] = Math.random() * 80;
      particlePos[i+2] = (Math.random() - 0.5) * 160;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));

    const particleMat = new THREE.PointsMaterial({
      color: 0x00f3ff,
      size: 0.4,
      transparent: true,
      opacity: 0.6
    });
    const marineSnow = new THREE.Points(particleGeo, particleMat);
    scene.add(marineSnow);

    // --- Bioluminescent Glowing Jellyfish & Sea Life ---
    const jellies = [];
    function createJellyfish(x, y, z, colorHex) {
      const group = new THREE.Group();
      group.position.set(x, y, z);

      const capGeo = new THREE.SphereGeometry(1.5, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      const capMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.7, wireframe: true });
      const cap = new THREE.Mesh(capGeo, capMat);
      group.add(cap);

      const light = new THREE.PointLight(colorHex, 2, 15);
      group.add(light);

      scene.add(group);
      jellies.push({ group, startY: y, speed: 0.5 + Math.random() * 0.5 });
    }

    // Spawn Bioluminescent Clusters
    for (let i = 0; i < 25; i++) {
      const color = i % 2 === 0 ? 0x00ffaa : 0xff00aa;
      createJellyfish(
        (Math.random() - 0.5) * 200,
        5 + Math.random() * 30,
        (Math.random() - 0.5) * 200,
        color
      );
    }

    // --- Keyboard & Navigation Controls ---
    const keys = {};
    let velocity = new THREE.Vector3();
    let yaw = 0, pitch = 0;
    let mouseX = 0, mouseY = 0;

    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    window.addEventListener('mousemove', (e) => {
      // Subtle cockpit mouse look
      mouseX = (e.clientX / window.innerWidth - 0.5) * 0.4;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 0.3;
    });

    // --- Physics & Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Steering Input Processing
      const speedFactor = 18.0 * delta;
      const turnSpeed = 1.2 * delta;

      if (keys['KeyW']) velocity.z = THREE.MathUtils.lerp(velocity.z, -speedFactor, 0.05);
      else if (keys['KeyS']) velocity.z = THREE.MathUtils.lerp(velocity.z, speedFactor * 0.5, 0.05);
      else velocity.z = THREE.MathUtils.lerp(velocity.z, 0, 0.03);

      if (keys['KeyA']) yaw += turnSpeed;
      if (keys['KeyD']) yaw -= turnSpeed;

      if (keys['Space']) velocity.y = THREE.MathUtils.lerp(velocity.y, speedFactor * 0.6, 0.05);
      else if (keys['ShiftLeft'] || keys['ShiftRight']) velocity.y = THREE.MathUtils.lerp(velocity.y, -speedFactor * 0.6, 0.05);
      else velocity.y = THREE.MathUtils.lerp(velocity.y, 0, 0.03);

      // Apply Yaw Rotation & Translation
      submarine.rotation.y = yaw;
      submarine.translateZ(velocity.z);
      submarine.position.y += velocity.y;

      // Prevent submarine from going below seabed or breaking water surface
      submarine.position.y = Math.max( -2, Math.min( 45, submarine.position.y ) );

      // Smooth Cockpit Camera Motion
      camera.rotation.y = -mouseX;
      camera.rotation.x = -mouseY;

      // Animate Jellyfish Floating
      jellies.forEach(j => {
        j.group.position.y = j.startY + Math.sin(time * j.speed) * 2;
        j.group.rotation.y += 0.005;
      });

      // Wrap Plankton Particles around submarine
      const pPositions = particleGeo.attributes.position.array;
      for (let i = 0; i < particleCount * 3; i += 3) {
        if (Math.abs(pPositions[i] - submarine.position.x) > 80) pPositions[i] = submarine.position.x + (Math.random() - 0.5) * 140;
        if (Math.abs(pPositions[i+2] - submarine.position.z) > 80) pPositions[i+2] = submarine.position.z + (Math.random() - 0.5) * 140;
      }
      particleGeo.attributes.position.needsUpdate = true;

      // Telemetry HUD Updates
      const depthMeters = Math.round(500 - submarine.position.y * 8);
      const currentSpeed = (Math.abs(velocity.z) * 45).toFixed(1);
      document.getElementById('tele-depth').innerText = depthMeters + ' M';
      document.getElementById('tele-speed').innerText = currentSpeed + ' KTS';

      renderer.render(scene, camera);
    }

    animate();

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
