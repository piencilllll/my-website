<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kawm: Far From Home</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      background: #000;
      border: 4px solid #fff;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
      cursor: pointer;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated; /* PS1 / Retro Pixel Crispness */
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
// --- AUDIO SYNTHESIZER (Square Wave Beeps & SFX) ---
const AudioEngine = {
  ctx: null,
  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  },
  playBeep(pitch = 220) {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(pitch, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.06);
    } catch(e) {}
  }
};

// --- GAME STATE ---
const STATE = {
  mode: 'MENU', // MENU, VILLAGE_FIRE, FOREST_RUN, BOAT_JUMP, OCEAN_DRIFT
  fadeAlpha: 0,
  fadeDirection: 0, // 1: fading to black, -1: fading in, 0: none
  nextMode: null,
  dialogueIndex: 0,
  textCharIndex: 0,
  textTimer: 0,
  menuTime: 0
};

// --- SCRIPT DATA ---
const SCRIPT = [
  // Village Fire
  { mode: 'VILLAGE_FIRE', speaker: 'Moe', expression: 'worried', text: "The village is under attack! Look at the fires... everything is burning!" },
  { mode: 'VILLAGE_FIRE', speaker: 'McCrack', expression: 'determined', text: "We have to run into the forest now! The docks are on the other side!" },
  
  // Forest Run & Boat Jump are action cutscenes driven by animations
  
  // Ocean Drift Dialogue
  { mode: 'OCEAN_DRIFT', speaker: 'Moe', expression: 'worried', text: "We made it out... but the village... everyone is gone, McCrack." },
  { mode: 'OCEAN_DRIFT', speaker: 'McCrack', expression: 'squint', text: "Keep your head up, Moe. The storm is heavy, but we paddle forward." },
  { mode: 'OCEAN_DRIFT', speaker: 'Moe', expression: 'determined', text: "Wait... look through the heavy rain! There's a faint yellow light far across the ocean!" }
];

// --- CANVAS SETUP ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Dynamic Animations Setup
const drips = Array.from({ length: 25 }, () => ({
  x: Math.random() * 800,
  y: Math.random() * -200,
  speed: Math.random() * 2 + 1.5,
  len: Math.random() * 15 + 8,
  width: Math.random() * 3 + 2
}));

const smokeParticles = Array.from({ length: 35 }, () => ({
  x: Math.random() * 800,
  y: Math.random() * 300 + 200,
  size: Math.random() * 40 + 20,
  speedY: Math.random() * 1.5 + 0.5,
  alpha: Math.random() * 0.6 + 0.2
}));

const rain = Array.from({ length: 120 }, () => ({
  x: Math.random() * 800,
  y: Math.random() * 600,
  speed: Math.random() * 12 + 10,
  len: Math.random() * 20 + 10
}));

// Animated Entity Positions
let runX = -50;
let jumpProgress = 0;
let waveOffset = 0;

// --- HELPER: TEXT WRAPPING & SPACING ---
function drawSpacedText(text, x, y, spacing = 2) {
  let currentX = x;
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    ctx.fillText(char, currentX, y);
    currentX += ctx.measureText(char).width + spacing;
  }
}

function drawWrappedText(text, x, y, maxWidth, lineHeight, spacing = 2) {
  const words = text.split(' ');
  let line = '';
  let currentY = y;

  for (let i = 0; i < words.length; i++) {
    const testLine = line + words[i] + ' ';
    // Calculate total width including custom spacing
    let testWidth = 0;
    for (let j = 0; j < testLine.length; j++) {
      testWidth += ctx.measureText(testLine[j]).width + spacing;
    }

    if (testWidth > maxWidth && i > 0) {
      drawSpacedText(line.trim(), x, currentY, spacing);
      line = words[i] + ' ';
      currentY += lineHeight;
    } else {
      line = testLine;
    }
  }
  drawSpacedText(line.trim(), x, currentY, spacing);
}

// --- EXPRESSIVE KAWM-LING PIXEL PORTRAITS ---
function drawKawmlingPortrait(x, y, speaker, expression) {
  // Portrait Box Base
  ctx.fillStyle = '#050508';
  ctx.fillRect(x, y, 105, 105);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.strokeRect(x, y, 105, 105);

  const cx = x + 52.5;
  const cy = y + 55;

  // Thick Stickman Head
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.arc(cx, cy - 5, 26, 0, Math.PI * 2);
  ctx.stroke();

  // Expressive Eyes & Brows
  ctx.fillStyle = '#ffffff';
  ctx.lineWidth = 3;

  if (expression === 'worried') {
    // Slanted worried brows
    ctx.beginPath();
    ctx.moveTo(cx - 16, cy - 20); ctx.lineTo(cx - 4, cy - 14);
    ctx.moveTo(cx + 16, cy - 20); ctx.lineTo(cx + 4, cy - 14);
    ctx.stroke();

    // Large wide eyes
    ctx.beginPath();
    ctx.arc(cx - 10, cy - 8, 4, 0, Math.PI * 2);
    ctx.arc(cx + 10, cy - 8, 4, 0, Math.PI * 2);
    ctx.fill();

    // Wavy mouth
    ctx.beginPath();
    ctx.moveTo(cx - 12, cy + 12);
    ctx.quadraticCurveTo(cx, cy + 6, cx + 12, cy + 14);
    ctx.stroke();
  } else if (expression === 'determined') {
    // Sharp stern brows
    ctx.beginPath();
    ctx.moveTo(cx - 16, cy - 12); ctx.lineTo(cx - 4, cy - 18);
    ctx.moveTo(cx + 16, cy - 12); ctx.lineTo(cx + 4, cy - 18);
    ctx.stroke();

    // Focused eyes
    ctx.beginPath();
    ctx.arc(cx - 10, cy - 6, 3, 0, Math.PI * 2);
    ctx.arc(cx + 10, cy - 6, 3, 0, Math.PI * 2);
    ctx.fill();

    // Firm straight mouth
    ctx.beginPath();
    ctx.moveTo(cx - 12, cy + 10);
    ctx.lineTo(cx + 12, cy + 10);
    ctx.stroke();
  } else if (expression === 'squint') {
    // Squinting eyes
    ctx.beginPath();
    ctx.moveTo(cx - 16, cy - 6); ctx.lineTo(cx - 4, cy - 6);
    ctx.moveTo(cx + 4, cy - 6); ctx.lineTo(cx + 16, cy - 6);
    ctx.stroke();

    // Open mouth talking
    ctx.beginPath();
    ctx.arc(cx, cy + 10, 6, 0, Math.PI);
    ctx.stroke();
  }

  // Accessories
  if (speaker === 'Moe') {
    // Blue Durag
    ctx.fillStyle = '#0055ff';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy - 5, 27, Math.PI * 0.85, Math.PI * 2.15);
    ctx.fill();
    ctx.stroke();

    // Durag tie tail
    ctx.fillStyle = '#0033cc';
    ctx.fillRect(cx + 22, cy - 5, 14, 25);
    ctx.strokeRect(cx + 22, cy - 5, 14, 25);
  } else if (speaker === 'McCrack') {
    // White Paper Boat Hat
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(cx - 32, cy - 25);
    ctx.lineTo(cx + 32, cy - 25);
    ctx.lineTo(cx + 20, cy - 48);
    ctx.lineTo(cx, cy - 36);
    ctx.lineTo(cx - 20, cy - 48);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
}

// --- DIALOGUE TEXTBOX RENDERING ---
function drawDialogueBox() {
  const current = SCRIPT[STATE.dialogueIndex];
  if (!current || current.mode !== STATE.mode) return;

  // Outer Fixed Container (720x155px at bottom)
  const boxX = 40;
  const boxY = 425;
  const boxW = 720;
  const boxH = 155;

  ctx.fillStyle = 'rgba(0, 0, 0, 0.92)';
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 4;
  ctx.strokeRect(boxX, boxY, boxW, boxH);

  // Render Portrait
  drawKawmlingPortrait(boxX + 15, boxY + 25, current.speaker, current.expression);

  // Render Speaker Title
  ctx.fillStyle = current.speaker === 'Moe' ? '#00bfff' : '#ffffff';
  ctx.font = 'bold 16px "Courier New", monospace';
  drawSpacedText(current.speaker.toUpperCase(), boxX + 135, boxY + 35, 3);

  // Typewriter Text Logic
  const fullText = current.text;
  if (STATE.textCharIndex < fullText.length) {
    STATE.textTimer++;
    if (STATE.textTimer % 2 === 0) {
      STATE.textCharIndex++;
      AudioEngine.playBeep(current.speaker === 'Moe' ? 260 : 180);
    }
  }

  const visibleText = fullText.substring(0, STATE.textCharIndex);

  // Render Dialogue Body Text with Custom Spacing & Wrapping
  ctx.fillStyle = '#eeeeee';
  ctx.font = '14px "Courier New", monospace';
  drawWrappedText(visibleText, boxX + 135, boxY + 65, 550, 22, 2);

  // Prompt
  if (STATE.textCharIndex >= fullText.length) {
    ctx.fillStyle = '#888888';
    ctx.font = '11px "Courier New", monospace';
    drawSpacedText('[CLICK / SPACE TO CONTINUE]', boxX + 480, boxY + 140, 1);
  }
}

// --- STAGE FADE TRANSITION CONTROLLER ---
function triggerFadeTo(nextMode) {
  STATE.fadeDirection = 1;
  STATE.nextMode = nextMode;
}

function updateFade() {
  if (STATE.fadeDirection === 1) {
    STATE.fadeAlpha += 0.04;
    if (STATE.fadeAlpha >= 1) {
      STATE.fadeAlpha = 1;
      STATE.mode = STATE.nextMode;
      STATE.fadeDirection = -1;
      // Reset scene variables on state switch
      if (STATE.mode === 'FOREST_RUN') runX = -60;
      if (STATE.mode === 'BOAT_JUMP') jumpProgress = 0;
    }
  } else if (STATE.fadeDirection === -1) {
    STATE.fadeAlpha -= 0.04;
    if (STATE.fadeAlpha <= 0) {
      STATE.fadeAlpha = 0;
      STATE.fadeDirection = 0;
    }
  }

  if (STATE.fadeAlpha > 0) {
    ctx.fillStyle = `rgba(0, 0, 0, ${STATE.fadeAlpha})`;
    ctx.fillRect(0, 0, 800, 600);
  }
}

// --- SCENE 1: START MENU (Dripping Liquid Animation) ---
function renderMenu() {
  STATE.menuTime += 0.05;
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 800, 600);

  // Dripping White Droplets Animation
  ctx.fillStyle = '#ffffff';
  drips.forEach(d => {
    d.y += d.speed;
    if (d.y > 600) {
      d.y = Math.random() * -100;
      d.x = Math.random() * 800;
    }
    // Drip head and tail
    ctx.fillRect(d.x, d.y, d.width, d.len);
    ctx.beginPath();
    ctx.arc(d.x + d.width / 2, d.y + d.len, d.width, 0, Math.PI * 2);
    ctx.fill();
  });

  // Title Text
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 36px "Courier New", monospace';
  drawSpacedText('KAWM: FAR FROM HOME', 140, 260, 4);

  // Pulsing "Tap Anywhere to Start"
  const alpha = (Math.sin(STATE.menuTime * 2) + 1) / 2;
  ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
  ctx.font = '16px "Courier New", monospace';
  drawSpacedText('[ PRESS SPACE OR CLICK TO START ]', 200, 360, 2);
}

// --- SCENE 2: VILLAGE ON FIRE ---
function renderVillageFire() {
  // Burning Red/Orange Sky Horizon
  let bgGrad = ctx.createLinearGradient(0, 0, 0, 600);
  bgGrad.addColorStop(0, '#060202');
  bgGrad.addColorStop(0.5, '#440f00');
  bgGrad.addColorStop(1, '#ff2200');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 800, 600);

  // Silhouetted Destroyed Village Buildings
  ctx.fillStyle = '#080404';
  ctx.fillRect(30, 280, 140, 320);
  ctx.fillRect(210, 220, 180, 380);
  ctx.fillRect(430, 260, 150, 340);
  ctx.fillRect(620, 310, 150, 290);

  // Ascending Thick Smoke Particles
  smokeParticles.forEach(p => {
    p.y -= p.speedY;
    if (p.y < -50) p.y = 500;
    ctx.fillStyle = `rgba(20, 15, 15, ${p.alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });

  // Dynamic Fire Flames on Rooftops
  ctx.fillStyle = '#ffaa00';
  for (let i = 0; i < 800; i += 40) {
    let flameH = Math.sin(Date.now() * 0.01 + i) * 20 + 30;
    ctx.fillRect(i, 320 - flameH, 25, flameH);
  }

  drawDialogueBox();
}

// --- SCENE 3: ANIMATED FOREST RUN ---
function renderForestRun() {
  // Dark Atmospheric Forest Background
  ctx.fillStyle = '#030805';
  ctx.fillRect(0, 0, 800, 600);

  // Parallax Trees
  ctx.fillStyle = '#0a180d';
  for (let i = 0; i < 900; i += 90) {
    ctx.fillRect(i - (runX * 0.5) % 90, 100, 35, 500);
  }

  // Ground Line
  ctx.fillStyle = '#050a06';
  ctx.fillRect(0, 480, 800, 120);

  // Advance Character Running
  runX += 4.5;

  // Draw Running Kawmlings (Thick Stickmen)
  function drawRunner(x, y, isMoe) {
    const legAnim = Math.sin(runX * 0.2) * 15;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 5;

    // Head
    ctx.beginPath(); ctx.arc(x, y - 40, 14, 0, Math.PI * 2); ctx.stroke();
    // Body
    ctx.beginPath(); ctx.moveTo(x, y - 26); ctx.lineTo(x, y); ctx.stroke();
    // Running Legs
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 12 + legAnim, y + 25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 12 - legAnim, y + 25); ctx.stroke();

    // Accessories
    if (isMoe) {
      ctx.fillStyle = '#0055ff';
      ctx.beginPath(); ctx.arc(x, y - 40, 15, Math.PI * 0.85, Math.PI * 2.15); ctx.fill();
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(x - 18, y - 52); ctx.lineTo(x + 18, y - 52); ctx.lineTo(x, y - 65);
      ctx.fill();
    }
  }

  // Draw Moe & McCrack running together
  drawRunner(runX, 455, true);
  drawRunner(runX - 45, 455, false);

  // Transition when run cutscene finishes
  if (runX > 850) {
    triggerFadeTo('BOAT_JUMP');
  }
}

// --- SCENE 4: ANIMATED BOAT JUMP ---
function renderBoatJump() {
  // Dark Ocean & Dock Interface
  ctx.fillStyle = '#02050c';
  ctx.fillRect(0, 0, 800, 600);

  // Timber Dock Platform on Left
  ctx.fillStyle = '#1a0f0a';
  ctx.fillRect(0, 420, 280, 180);

  // Ocean Water on Right
  ctx.fillStyle = '#00ffff';
  ctx.fillRect(280, 460, 520, 140);

  // Low-Poly Pixel Boat Hull floating
  const boatY = 445 + Math.sin(Date.now() * 0.003) * 4;
  ctx.fillStyle = '#2a1810';
  ctx.fillRect(450, boatY, 180, 45);

  jumpProgress += 0.018;

  // Parabolic Jump Trajectory for Stickmen
  const startX = 220; const targetX = 510;
  const currentX = startX + (targetX - startX) * Math.min(jumpProgress, 1);
  const arcY = Math.sin(jumpProgress * Math.PI) * 120;
  const currentY = 420 - arcY;

  // Draw Jumping Characters
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 5;

  // Moe
  ctx.beginPath(); ctx.arc(currentX, currentY - 30, 14, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(currentX, currentY - 16); ctx.lineTo(currentX, currentY + 10); ctx.stroke();
  ctx.fillStyle = '#0055ff';
  ctx.beginPath(); ctx.arc(currentX, currentY - 30, 15, Math.PI * 0.85, Math.PI * 2.15); ctx.fill();

  // McCrack (Following slightly behind)
  const mcX = currentX - 40;
  const mcY = currentY + 10;
  ctx.beginPath(); ctx.arc(mcX, mcY - 30, 14, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mcX, mcY - 16); ctx.lineTo(mcX, mcY + 10); ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(mcX - 16, mcY - 42); ctx.lineTo(mcX + 16, mcY - 42); ctx.lineTo(mcX, mcY - 55);
  ctx.fill();

  if (jumpProgress >= 1.1) {
    triggerFadeTo('OCEAN_DRIFT');
  }
}

// --- SCENE 5: KAWM OCEAN DRIFT & DIALOGUE ---
function renderOceanDrift() {
  // Dark Storm Sky
  let skyGrad = ctx.createLinearGradient(0, 0, 0, 600);
  skyGrad.addColorStop(0, '#010308');
  skyGrad.addColorStop(1, '#081426');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, 800, 600);

  // Faint Distant Yellow Lighthouse Beam on Horizon
  ctx.fillStyle = 'rgba(255, 255, 150, 0.15)';
  ctx.beginPath();
  ctx.moveTo(700, 340);
  ctx.lineTo(0, 200);
  ctx.lineTo(0, 380);
  ctx.fill();

  // White Crested Waves (Sine Wave Displacement)
  waveOffset += 0.04;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(0, 360);
  for (let x = 0; x <= 800; x += 20) {
    let y = Math.sin(x * 0.015 + waveOffset) * 14 + 360;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(800, 600);
  ctx.lineTo(0, 600);
  ctx.fill();

  // Boat Floating with Pitching Motion
  const boatRock = Math.sin(waveOffset * 1.5) * 8;
  const boatY = 345 + boatRock;

  ctx.fillStyle = '#1c0f0a';
  ctx.fillRect(300, boatY, 200, 50);

  // Moe & McCrack Seated in Boat
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 5;

  // Moe Seated
  ctx.beginPath(); ctx.arc(340, boatY - 15, 13, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(340, boatY - 2); ctx.lineTo(340, boatY + 20); ctx.stroke();
  ctx.fillStyle = '#0055ff';
  ctx.beginPath(); ctx.arc(340, boatY - 15, 14, Math.PI * 0.85, Math.PI * 2.15); ctx.fill();

  // McCrack Seated
  ctx.beginPath(); ctx.arc(440, boatY - 15, 13, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(440, boatY - 2); ctx.lineTo(440, boatY + 20); ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(424, boatY - 26); ctx.lineTo(456, boatY - 26); ctx.lineTo(440, boatY - 40);
  ctx.fill();

  // Angled Storm Rain Particles
  ctx.strokeStyle = 'rgba(220, 240, 255, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  rain.forEach(r => {
    r.y += r.speed;
    r.x -= 4;
    if (r.y > 600) { r.y = -20; r.x = Math.random() * 800; }
    ctx.moveTo(r.x, r.y);
    ctx.lineTo(r.x - 8, r.y + r.len);
  });
  ctx.stroke();

  drawDialogueBox();
}

// --- MAIN GAME LOOP ---
function gameLoop() {
  ctx.clearRect(0, 0, 800, 600);

  switch (STATE.mode) {
    case 'MENU':
      renderMenu();
      break;
    case 'VILLAGE_FIRE':
      renderVillageFire();
      break;
    case 'FOREST_RUN':
      renderForestRun();
      break;
    case 'BOAT_JUMP':
      renderBoatJump();
      break;
    case 'OCEAN_DRIFT':
      renderOceanDrift();
      break;
  }

  updateFade();
  requestAnimationFrame(gameLoop);
}

// --- INPUT HANDLERS ---
function handleAdvance() {
  AudioEngine.init();

  if (STATE.mode === 'MENU') {
    triggerFadeTo('VILLAGE_FIRE');
    return;
  }

  const current = SCRIPT[STATE.dialogueIndex];
  if (!current || current.mode !== STATE.mode) return;

  // Complete dialogue line instantly if clicked while typing
  if (STATE.textCharIndex < current.text.length) {
    STATE.textCharIndex = current.text.length;
  } else {
    // Advance to next script line
    STATE.dialogueIndex++;
    STATE.textCharIndex = 0;
    STATE.textTimer = 0;

    const nextScript = SCRIPT[STATE.dialogueIndex];
    if (!nextScript) {
      // End of intro sequence
      return;
    }

    if (nextScript.mode !== STATE.mode) {
      if (STATE.mode === 'VILLAGE_FIRE') {
        triggerFadeTo('FOREST_RUN');
      } else {
        triggerFadeTo(nextScript.mode);
      }
    }
  }
}

window.addEventListener('click', handleAdvance);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') {
    handleAdvance();
  }
});

// Start loop
gameLoop();
</script>
</body>
</html>
