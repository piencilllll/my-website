<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLASSIFIED ARCHIVE // ANOMALOUS SPECIMEN DATABASE</title>
    <style>
        :root {
            --bg-dark: #05070a;
            --panel-bg: rgba(12, 17, 24, 0.85);
            --border-color: #1e293b;
            --accent-green: #00ff66;
            --accent-red: #ff3344;
            --accent-amber: #ffaa00;
            --accent-cyan: #00f3ff;
            --accent-purple: #bc13fe;
            --text-bright: #f8fafc;
            --text-dim: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-bright);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Dynamic Glow Backdrop */
        .ambient-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 30% 30%, rgba(0, 243, 255, 0.05), transparent 60%),
                        radial-gradient(circle at 70% 70%, rgba(188, 19, 254, 0.05), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* Scanline Overlay */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.4) 50%,
                rgba(0, 0, 0, 0.4)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.6;
        }

        /* Layout */
        .main-wrapper {
            width: 100%;
            max-width: 1280px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            z-index: 1;
        }

        .archive-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 20px rgba(0, 243, 255, 0.05);
            display: grid;
            grid-template-columns: 360px 1fr;
            grid-template-rows: auto 1fr auto;
            gap: 24px;
            padding: 28px;
            position: relative;
            overflow: hidden;
        }

        /* Top Accent Status Glow Bar */
        .archive-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-green));
            z-index: 2;
        }

        /* Header */
        header {
            grid-column: 1 / -1;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .archive-title {
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: 700;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .threat-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        /* Left Column - Visual Panel */
        .visual-panel {
            grid-column: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .canvas-frame {
            width: 100%;
            height: 320px;
            background: #020305;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Data Panel */
        .data-panel {
            grid-column: 2;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .field-value {
            font-size: 0.95rem;
            color: var(--text-bright);
            line-height: 1.6;
        }

        /* Sidebar - Saved Archives */
        .saved-sidebar {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 680px;
        }

        .sidebar-title {
            font-size: 0.85rem;
            color: var(--accent-cyan);
            letter-spacing: 1.5px;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        .saved-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .saved-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .saved-item:hover {
            border-color: var(--accent-cyan);
            background: rgba(30, 41, 59, 0.8);
            transform: translateX(4px);
        }

        .saved-id {
            font-size: 0.7rem;
            color: var(--text-dim);
            font-weight: 600;
        }

        .saved-name {
            font-size: 0.85rem;
            color: var(--text-bright);
            font-weight: 600;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: var(--accent-red);
        }

        /* Footer & Buttons */
        footer {
            grid-column: 1 / -1;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-bright);
            padding: 12px 20px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            border-radius: 6px;
        }

        .btn:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            transform: translateY(-2px);
        }

        .btn-save {
            color: var(--accent-cyan);
            border-color: rgba(0, 243, 255, 0.3);
        }

        .btn-save:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        .btn-danger {
            color: var(--accent-red);
            border-color: rgba(255, 51, 68, 0.3);
        }

        .btn-danger:hover {
            background: var(--accent-red);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 51, 68, 0.4);
        }

        @media (max-width: 1024px) {
            .main-wrapper { grid-template-columns: 1fr; }
            .archive-card { grid-template-columns: 1fr; }
            .visual-panel, .data-panel { grid-column: 1; }
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>
    <div class="scanlines"></div>

    <div class="main-wrapper">
        <div class="archive-card">
            <header>
                <div class="archive-title">
                    <span style="display:inline-block; width:8px; height:8px; background:var(--accent-cyan); border-radius:50%; box-shadow: 0 0 10px var(--accent-cyan);"></span>
                    CENTRAL ARCHIVE // ENTITY Dossier
                </div>
                <div id="threat-tag" class="threat-badge">LEVEL 0</div>
            </header>

            <div class="visual-panel">
                <div class="canvas-frame">
                    <canvas id="entityCanvas"></canvas>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="field-group">
                        <span class="field-label">INDEX CODE</span>
                        <span class="field-value" id="val-id" style="font-family: monospace;">ENT-0000</span>
                    </div>
                    <div class="field-group">
                        <span class="field-label">ANOMALOUS CLASS</span>
                        <span class="field-value" id="val-class">UNKNOWN</span>
                    </div>
                </div>
            </div>

            <div class="data-panel">
                <div class="field-group">
                    <span class="field-label">COGNOMEN / DESIGNATION</span>
                    <span class="field-value" id="val-name" style="font-size: 1.3rem; font-weight: 800; color: var(--accent-cyan);">---</span>
                </div>
                <div class="field-group">
                    <span class="field-label">MORPHOLOGICAL PROFILE</span>
                    <span class="field-value" id="val-morph">---</span>
                </div>
                <div class="field-group">
                    <span class="field-label">BEHAVIORAL PATTERNS & ANOMALIES</span>
                    <span class="field-value" id="val-behavior">---</span>
                </div>
                <div class="field-group">
                    <span class="field-label">CONTAINMENT DIRECTIVES</span>
                    <span class="field-value" id="val-containment">---</span>
                </div>
            </div>

            <footer>
                <span style="font-size: 0.75rem; color: var(--text-dim); font-family: monospace;" id="timestamp">TERMINAL READY</span>
                <div class="button-group">
                    <button class="btn btn-save" id="saveBtn">★ BOOKMARK FILE</button>
                    <button class="btn btn-danger" id="genBtn">GENERATE NEW</button>
                </div>
            </footer>
        </div>

        <div class="saved-sidebar">
            <div class="sidebar-title">
                <span>BOOKMARKED ENTRIES</span>
                <span id="saved-count" style="color: var(--text-bright);">0</span>
            </div>
            <div class="saved-list" id="saved-list"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('entityCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let t = 0;
        let currentEntry = {};
        let savedEntries = JSON.parse(localStorage.getItem('saved_anomalies') || '[]');

        // Distinct Anatomical Creature Rig Renderers
        function drawSpider(ctx, colorHex) {
            const bodyY = Math.sin(t * 3) * 6;
            const breathe = Math.sin(t * 2) * 2;

            // Cephalothorax & Abdomen
            ctx.fillStyle = colorHex;
            ctx.beginPath();
            ctx.ellipse(0, bodyY + 15, 22 + breathe, 28 + breathe, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(0, bodyY - 12, 14, 16, 0, 0, Math.PI * 2);
            ctx.fill();

            // Glowing Eyes
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 8;
            [-6, -2, 2, 6].forEach((x, i) => {
                ctx.beginPath();
                ctx.arc(x, bodyY - 18, (i === 1 || i === 2) ? 2.5 : 1.5, 0, Math.PI * 2);
                ctx.fill();
            });

            // 8 Animated Procedural Jointed Legs
            ctx.strokeStyle = colorHex;
            ctx.lineWidth = 3;
            ctx.shadowColor = colorHex;
            ctx.shadowBlur = 10;

            for (let side = -1; side <= 1; side += 2) {
                for (let i = 0; i < 4; i++) {
                    const legAngle = (i * 0.35) - 0.5;
                    const step = Math.sin(t * 4 + i * 0.8 * side) * 12;

                    const jointX = side * (35 + i * 4);
                    const jointY = bodyY - 20 + (i * 12) + step;
                    const tipX = side * (65 + i * 8);
                    const tipY = bodyY + 10 + (i * 16);

                    ctx.beginPath();
                    ctx.moveTo(side * 8, bodyY - 10 + (i * 6));
                    ctx.lineTo(jointX, jointY);
                    ctx.lineTo(tipX, tipY);
                    ctx.stroke();
                }
            }
        }

        function drawSerpent(ctx, colorHex) {
            ctx.strokeStyle = colorHex;
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.shadowColor = colorHex;
            ctx.shadowBlur = 12;

            ctx.beginPath();
            const segments = 30;
            let headX = 0, headY = 0;

            for (let i = 0; i < segments; i++) {
                const wave = Math.sin(t * 3 - i * 0.25) * (20 + i * 1.2);
                const y = -100 + i * 7;
                const x = wave;

                if (i === 0) {
                    ctx.moveTo(x, y);
                    headX = x; headY = y;
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();

            // Head & Glowing Eyes
            ctx.fillStyle = colorHex;
            ctx.beginPath();
            ctx.arc(headX, headY, 14, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(headX - 5, headY - 3, 2.5, 0, Math.PI * 2);
            ctx.arc(headX + 5, headY - 3, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawBiped(ctx, colorHex) {
            const sway = Math.sin(t * 2.5) * 8;
            const breathe = Math.sin(t * 1.8) * 3;

            ctx.strokeStyle = colorHex;
            ctx.fillStyle = colorHex;
            ctx.lineWidth = 4;
            ctx.shadowColor = colorHex;
            ctx.shadowBlur = 10;

            // Skull
            ctx.beginPath();
            ctx.arc(sway, -65, 12, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(sway - 4, -67, 2, 0, Math.PI * 2);
            ctx.arc(sway + 4, -67, 2, 0, Math.PI * 2);
            ctx.fill();

            // Spine & Rib Cage
            ctx.beginPath();
            ctx.moveTo(sway, -53);
            ctx.lineTo(0, 10);
            ctx.stroke();

            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(sway - (10 - i * 2), -45 + (i * 7));
                ctx.lineTo(sway + (10 - i * 2), -45 + (i * 7));
                ctx.stroke();
            }

            // Long Arms
            for (let side = -1; side <= 1; side += 2) {
                const armWave = Math.sin(t * 2.5 + side) * 10;
                ctx.beginPath();
                ctx.moveTo(sway + side * 12, -45);
                ctx.lineTo(sway + side * 28, -15 + armWave);
                ctx.lineTo(sway + side * 35, 25 + armWave);
                ctx.stroke();
            }

            // Legs
            ctx.beginPath();
            ctx.moveTo(0, 10); ctx.lineTo(-18, 45); ctx.lineTo(-22, 85);
            ctx.moveTo(0, 10); ctx.lineTo(18, 45); ctx.lineTo(22, 85);
            ctx.stroke();
        }

        function drawLeviathan(ctx, colorHex) {
            const bodyY = Math.sin(t * 2) * 10;

            ctx.fillStyle = colorHex;
            ctx.strokeStyle = colorHex;
            ctx.shadowColor = colorHex;
            ctx.shadowBlur = 12;

            // Main Mantle / Bell
            ctx.beginPath();
            ctx.moveTo(-45, bodyY);
            ctx.quadraticCurveTo(0, bodyY - 70 - Math.sin(t * 3) * 10, 45, bodyY);
            ctx.quadraticCurveTo(0, bodyY + 15, -45, bodyY);
            ctx.fill();

            // Glowing Core Orbs
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(0, bodyY - 20, 8, 0, Math.PI * 2);
            ctx.arc(-15, bodyY - 10, 5, 0, Math.PI * 2);
            ctx.arc(15, bodyY - 10, 5, 0, Math.PI * 2);
            ctx.fill();

            // Undulating Tentacles
            ctx.strokeStyle = colorHex;
            ctx.lineWidth = 3.5;
            for (let i = -4; i <= 4; i++) {
                const startX = i * 9;
                ctx.beginPath();
                ctx.moveTo(startX, bodyY + 5);

                for (let j = 0; j < 8; j++) {
                    const waveX = Math.sin(t * 3.5 + i * 0.5 + j * 0.4) * (12 + j * 2);
                    const segY = bodyY + 15 + (j * 12);
                    ctx.lineTo(startX + waveX, segY);
                }
                ctx.stroke();
            }
        }

        // Render Controller
        function renderEntity() {
            t += 0.025;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Background Atmospheric Radar Grid
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
            ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += 24) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i = 0; i < canvas.height; i += 24) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            if (currentEntry.seed) {
                ctx.save();
                ctx.translate(cx, cy);

                let colorHex = '#00f3ff';
                if (currentEntry.threatLevel === 'APOCALYPTIC') colorHex = '#bc13fe';
                else if (currentEntry.threatLevel === 'CRITICAL') colorHex = '#ff3344';
                else if (currentEntry.threatLevel === 'HAZARDOUS') colorHex = '#ffaa00';

                // Select Creature Form based on Entry
                const creatureType = currentEntry.creatureType || 0;
                if (creatureType === 0) drawSpider(ctx, colorHex);
                else if (creatureType === 1) drawSerpent(ctx, colorHex);
                else if (creatureType === 2) drawBiped(ctx, colorHex);
                else drawLeviathan(ctx, colorHex);

                ctx.restore();
            }

            requestAnimationFrame(renderEntity);
        }

        // Procedural Text Generator Tables
        const creaturePresets = [
            {
                type: 0,
                prefixes: ["Arachnid", "Weaver", "Eight-Legged", "Chitinous"],
                nouns: ["Stalker", "Crawler", "Horror", "Lurker"],
                classes: ["Biological-Parasite", "Arachnoid-Class"],
                morphs: ["Eight-jointed arachnoid morphology with layered chitin plates and multiple luminescent optical nodes."]
            },
            {
                type: 1,
                prefixes: ["Serpentine", "Echoing", "Sub-Surface", "Coiled"],
                nouns: ["Wyrm", "Leviathan", "Slitherer", "Tendril"],
                classes: ["Spatial-Distortion", "Serpentine Anomaly"],
                morphs: ["Elongated segmented serpent body lacking epidermal scales, moving through acoustic waveforms."]
            },
            {
                type: 2,
                prefixes: ["Skeletal", "Bipedal", "Striding", "Hollow"],
                nouns: ["Husk", "Vanguard", "Watcher", "Spectre"],
                classes: ["Liminal-Horror", "Cognitohazard"],
                morphs: ["Elongated bipedal skeletal organism with extended upper extremities and rib cage structure."]
            },
            {
                type: 3,
                prefixes: ["Floating", "Abyssal", "Non-Euclidean", "Spectral"],
                nouns: ["Weaver", "Sovereign", "Architect", "Gazer"],
                classes: ["Liquid-State Entity", "Aether-Class"],
                morphs: ["Floating central mantle with bioluminescent core rings and multiple fluid tentacular appendages."]
            }
        ];

        const threats = [
            { level: "MINIMAL", color: "#00ff66", bg: "rgba(0, 255, 106, 0.15)" },
            { level: "HAZARDOUS", color: "#ffaa00", bg: "rgba(255, 170, 0, 0.15)" },
            { level: "CRITICAL", color: "#ff3344", bg: "rgba(255, 51, 68, 0.15)" },
            { level: "APOCALYPTIC", color: "#bc13fe", bg: "rgba(188, 19, 254, 0.2)" }
        ];

        const behaviors = [
            "Remains inert in dark environments. Actively maneuvers toward radio frequencies and optical displays.",
            "Distorts structural geometry within a 20-meter radius, causing corridors to loop recursively.",
            "Emits acoustic waves that induce vivid auditory responses in nearby observers.",
            "Absorbs surrounding heat rapidly, freezing local atmospheric moisture upon physical movement."
        ];

        const protocols = [
            "Store inside a vacuum-sealed vault lined with sound-dampening acoustic layers.",
            "Requires continuous low-intensity ultraviolet illumination. No active screens permitted.",
            "Re-anchor cell perimeters weekly using reinforced steel alloy and cooling pumps.",
            "Personnel must maintain continuous line-of-sight during maintenance shifts."
        ];

        function generateNewArchiveEntry() {
            const seed = Math.floor(Math.random() * 10000);
            const threatObj = threats[Math.floor(Math.random() * threats.length)];
            const creatureType = Math.floor(Math.random() * creaturePresets.length);
            const preset = creaturePresets[creatureType];

            currentEntry = {
                seed: seed,
                creatureType: creatureType,
                id: "ENT-" + Math.floor(1000 + Math.random() * 9000),
                name: preset.prefixes[Math.floor(Math.random() * preset.prefixes.length)] + " " + preset.nouns[Math.floor(Math.random() * preset.nouns.length)],
                eClass: preset.classes[Math.floor(Math.random() * preset.classes.length)],
                threatLevel: threatObj.level,
                threatObj: threatObj,
                morph: preset.morphs[0],
                behavior: behaviors[Math.floor(Math.random() * behaviors.length)],
                containment: protocols[Math.floor(Math.random() * protocols.length)]
            };

            displayEntry(currentEntry);
        }

        function displayEntry(entry) {
            currentEntry = entry;
            document.getElementById('val-id').innerText = entry.id;
            document.getElementById('val-name').innerText = entry.name;
            document.getElementById('val-class').innerText = entry.eClass;
            document.getElementById('val-morph').innerText = entry.morph;
            document.getElementById('val-behavior').innerText = entry.behavior;
            document.getElementById('val-containment').innerText = entry.containment;

            const threatTag = document.getElementById('threat-tag');
            threatTag.innerText = `LEVEL: ${entry.threatLevel}`;
            threatTag.style.color = entry.threatObj.color;
            threatTag.style.border = `1px solid ${entry.threatObj.color}`;
            threatTag.style.backgroundColor = entry.threatObj.bg;

            document.getElementById('timestamp').innerText = `SYSTEM SYNC: ${new Date().toLocaleTimeString()} // ID #${entry.seed}`;
        }

        function saveCurrentEntry() {
            if (savedEntries.some(e => e.id === currentEntry.id)) return;
            savedEntries.push(currentEntry);
            localStorage.setItem('saved_anomalies', JSON.stringify(savedEntries));
            renderSavedList();
        }

        function deleteEntry(id, event) {
            event.stopPropagation();
            savedEntries = savedEntries.filter(e => e.id !== id);
            localStorage.setItem('saved_anomalies', JSON.stringify(savedEntries));
            renderSavedList();
        }

        function renderSavedList() {
            const listEl = document.getElementById('saved-list');
            document.getElementById('saved-count').innerText = savedEntries.length;
            listEl.innerHTML = '';

            savedEntries.forEach(entry => {
                const item = document.createElement('div');
                item.className = 'saved-item';
                item.onclick = () => displayEntry(entry);

                item.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:2px;">
                        <span class="saved-id">${entry.id}</span>
                        <span class="saved-name">${entry.name}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteEntry('${entry.id}', event)">✕</button>
                `;
                listEl.appendChild(item);
            });
        }

        document.getElementById('genBtn').addEventListener('click', generateNewArchiveEntry);
        document.getElementById('saveBtn').addEventListener('click', saveCurrentEntry);

        // Run
        renderSavedList();
        generateNewArchiveEntry();
        renderEntity();
    </script>
</body>
</html>
