<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawm: Far From Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030206;
            color: #d1d5db;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #000;
            border: 2px solid #1a1a24;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }

        /* Scanlines Overlay */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* Title Screen UI */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            background: rgba(3, 2, 6, 0.75);
            transition: opacity 1.5s ease;
        }

        .title-logo {
            font-size: 42px;
            font-weight: bold;
            color: #f3f4f6;
            letter-spacing: 6px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4), 3px 3px #ff0055;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #8b5cf6;
            letter-spacing: 4px;
            margin-bottom: 50px;
            text-transform: uppercase;
        }

        .prompt-text {
            font-size: 14px;
            color: #a1a1aa;
            letter-spacing: 2px;
            animation: pulse 1.6s infinite ease-in-out;
            cursor: pointer;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Dialogue Box */
        #dialogue-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 720px;
            min-height: 120px;
            background: rgba(8, 8, 12, 0.92);
            border: 2px solid #3f3f46;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
            padding: 16px 20px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .speaker-name {
            font-size: 14px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-shadow: 1px 1px #000;
        }

        .speaker-name.mc-crack {
            color: #fbbf24;
        }

        .dialogue-text {
            font-size: 15px;
            line-height: 1.5;
            color: #e4e4e7;
            white-space: pre-wrap;
        }

        .next-prompt {
            align-self: flex-end;
            font-size: 11px;
            color: #71717a;
            margin-top: 8px;
            animation: pulse 1s infinite;
        }

        .hidden {
            display: none !important;
        }

        /* Cinematic Overlay Blackout */
        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 30;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="scanlines"></div>
    <canvas id="stage" width="800" height="600"></canvas>

    <div id="fade-overlay"></div>

    <!-- Title / Start Screen -->
    <div id="title-screen" class="ui-layer">
        <div class="title-logo">KAWM</div>
        <div class="subtitle">FAR FROM HOME</div>
        <div class="prompt-text">[ PRESS ANYKEY OR CLICK TO EMBARK ]</div>
    </div>

    <!-- Intro Cutscene Dialogue UI -->
    <div id="dialogue-container" class="hidden">
        <div>
            <div id="speaker" class="speaker-name">Moe</div>
            <div id="speech" class="dialogue-text"></div>
        </div>
        <div class="next-prompt">[ CLICK OR PRESS SPACE TO CONTINUE ]</div>
    </div>
</div>

<script>
// --- Web Audio API Setup ---
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

// Procedural Retro Sound Generators
function playTextBeep(speaker) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'square';
    
    // Pitch varies depending on speaker for unique voice chitters
    if (speaker === 'Moe') {
        osc.frequency.setValueAtTime(220 + Math.random() * 30, audioCtx.currentTime); // Lower pitch for Moe
    } else if (speaker === 'McCrack') {
        osc.frequency.setValueAtTime(440 + Math.random() * 50, audioCtx.currentTime); // Higher pitch for McCrack
    } else {
        osc.frequency.setValueAtTime(150, audioCtx.currentTime); // Deep pitch for Narrator
    }

    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.04);
}

function playAdvanceSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08);

    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
}

function playStartSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(450, audioCtx.currentTime + 0.3);

    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

// --- Canvas Setup ---
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// --- UI Handles ---
const titleScreen = document.getElementById('title-screen');
const dialogueBox = document.getElementById('dialogue-container');
const speakerEl = document.getElementById('speaker');
const speechEl = document.getElementById('speech');
const fadeOverlay = document.getElementById('fade-overlay');

// --- Game Logic States ---
let gameState = 'TITLE'; // TITLE, CINEMATIC_INTRO, DIALOGUE, END_INTRO
let frameCount = 0;

// --- Story Beats Setup ---
let currentScriptIndex = 0;
const script = [
    {
        speaker: "NARRATOR",
        text: "The sky over our village didn't turn black from the night...",
        scene: "BURNING_VILLAGE"
    },
    {
        speaker: "NARRATOR",
        text: "It turned black from smoke. The attack happened without warning. Fire consumed the timber and kinetic towers.",
        scene: "BURNING_VILLAGE"
    },
    {
        speaker: "McCrack",
        text: "Moe! Hurry up! The dock is collapsing! We have to cast off right now!",
        scene: "ESCAPE_DOCK"
    },
    {
        speaker: "Moe",
        text: "Hold on! The ropes are jammed—McCrack, grab the wooden oars!",
        scene: "ESCAPE_DOCK"
    },
    {
        speaker: "NARRATOR",
        text: "We pushed off into the dark expanse of the Kawm Ocean, leaving behind the only life we had ever known.",
        scene: "OCEAN_DRIFT"
    },
    {
        speaker: "McCrack",
        text: "Do you think... anyone else made it out, Moe?",
        scene: "OCEAN_DRIFT"
    },
    {
        speaker: "Moe",
        text: "...I don't know. But we can't look back now. We keep sailing until we find refuge.",
        scene: "OCEAN_DRIFT"
    }
];

// --- Typewriter Effect ---
let typeIndex = 0;
let isTyping = false;
let currentText = "";
let typeTimer = null;

function typeWriter(text, cb) {
    speechEl.textContent = "";
    typeIndex = 0;
    isTyping = true;
    currentText = text;

    const currentSpeaker = script[currentScriptIndex].speaker;

    clearInterval(typeTimer);
    typeTimer = setInterval(() => {
        if (typeIndex < text.length) {
            speechEl.textContent += text.charAt(typeIndex);
            
            // Play sound effect on non-space characters
            if (text.charAt(typeIndex) !== ' ') {
                playTextBeep(currentSpeaker);
            }
            
            typeIndex++;
        } else {
            clearInterval(typeTimer);
            isTyping = false;
            if (cb) cb();
        }
    }, 32);
}

// --- Drawing Kawmling Characters ---
function drawKawmling(x, y, scale = 1, expression = 'neutral', hat = 'none', facing = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(facing * scale, scale);

    ctx.strokeStyle = '#ffffff';
    ctx.fillStyle = '#ffffff';
    ctx.lineWidth = 6; // Thicker stickman body style
    ctx.lineCap = 'round';

    // Head
    ctx.beginPath();
    ctx.arc(0, -45, 14, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.beginPath();
    ctx.moveTo(0, -31);
    ctx.lineTo(0, 10);
    ctx.stroke();

    // Arms
    ctx.beginPath();
    ctx.moveTo(0, -22);
    ctx.lineTo(-12, -8);
    ctx.moveTo(0, -22);
    ctx.lineTo(12, -8);
    ctx.stroke();

    // Legs
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.lineTo(-10, 32);
    ctx.moveTo(0, 10);
    ctx.lineTo(10, 32);
    ctx.stroke();

    // --- Face Details (Eyes & Eyebrows ONLY) ---
    ctx.fillStyle = '#000000';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2.5;

    // Eyes
    ctx.beginPath();
    ctx.arc(3, -46, 2, 0, Math.PI * 2);
    ctx.arc(8, -46, 2, 0, Math.PI * 2);
    ctx.fill();

    // Eyebrows (Dynamic based on expression)
    ctx.beginPath();
    if (expression === 'worried') {
        ctx.moveTo(1, -52); ctx.lineTo(5, -50);
        ctx.moveTo(10, -50); ctx.lineTo(6, -52);
    } else if (expression === 'determined') {
        ctx.moveTo(1, -50); ctx.lineTo(5, -48);
        ctx.moveTo(10, -48); ctx.lineTo(6, -50);
    } else { // Neutral
        ctx.moveTo(1, -50); ctx.lineTo(5, -50);
        ctx.moveTo(6, -50); ctx.lineTo(10, -50);
    }
    ctx.stroke();

    // --- Hats ---
    if (hat === 'durag') {
        // Moe's Durag (Blue Cloth with hanging flap back)
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath();
        ctx.arc(0, -46, 15, Math.PI, Math.PI * 2);
        ctx.fill();
        // Flap back
        ctx.beginPath();
        ctx.moveTo(-14, -46);
        ctx.lineTo(-20, -36);
        ctx.lineTo(-10, -38);
        ctx.fill();
    } else if (hat === 'paperboat') {
        // McCrack's Paper Boat Hat
        ctx.fillStyle = '#e4e4e7';
        ctx.beginPath();
        ctx.moveTo(-16, -56);
        ctx.lineTo(16, -56);
        ctx.lineTo(10, -48);
        ctx.lineTo(-10, -48);
        ctx.closePath();
        ctx.fill();
        // Sail Peak
        ctx.beginPath();
        ctx.moveTo(-6, -56);
        ctx.lineTo(0, -68);
        ctx.lineTo(6, -56);
        ctx.closePath();
        ctx.fill();
        // Outline detail
        ctx.strokeStyle = '#a1a1aa';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    ctx.restore();
}

// --- Boat Render ---
function drawBoat(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // Wood Hull
    ctx.fillStyle = '#271c19';
    ctx.beginPath();
    ctx.moveTo(-60, 0);
    ctx.lineTo(60, 0);
    ctx.lineTo(45, 30);
    ctx.lineTo(-45, 30);
    ctx.closePath();
    ctx.fill();

    // Rim
    ctx.strokeStyle = '#44312c';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.restore();
}

// --- Background Scenes ---
function renderScene(sceneType) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (sceneType === 'BURNING_VILLAGE') {
        // Dark background with distant fire glow
        ctx.fillStyle = '#0a0508';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Distant burning silhouettes
        let fireGlow = Math.sin(frameCount * 0.1) * 20;
        ctx.fillStyle = `rgb(${180 + fireGlow}, 40, 10)`;
        ctx.fillRect(0, 350, canvas.width, 250);

        // Silhouette houses
        ctx.fillStyle = '#050305';
        ctx.fillRect(100, 300, 80, 80);
        ctx.fillRect(220, 260, 120, 120);
        ctx.fillRect(500, 280, 100, 100);

        // Fire embers particle effect
        for (let i = 0; i < 30; i++) {
            let px = (Math.sin(i * 99 + frameCount * 0.02) * 0.5 + 0.5) * canvas.width;
            let py = ((frameCount * (1 + i * 0.1) + i * 50) % 400);
            ctx.fillStyle = i % 2 === 0 ? '#ff4500' : '#ffbe0b';
            ctx.fillRect(px, 400 - py, 3, 3);
        }
    } 
    else if (sceneType === 'ESCAPE_DOCK') {
        // Night dock scene with intense close flame background
        ctx.fillStyle = '#0d0714';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Dock platform
        ctx.fillStyle = '#1c1917';
        ctx.fillRect(0, 420, 380, 180);

        // Water
        ctx.fillStyle = '#060a17';
        ctx.fillRect(380, 440, 420, 160);

        // Boat at dock
        drawBoat(480, 435);

        // Characters on dock/boat
        drawKawmling(280, 395, 1.1, 'determined', 'durag', 1); // Moe running to boat
        drawKawmling(480, 410, 1.0, 'worried', 'paperboat', -1); // McCrack in boat
    } 
    else if (sceneType === 'OCEAN_DRIFT') {
        // Deep endless ocean night
        ctx.fillStyle = '#02040a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Ocean Waves
        let waveOffset = Math.sin(frameCount * 0.03) * 6;
        ctx.fillStyle = '#050c1e';
        ctx.beginPath();
        ctx.moveTo(0, 380 + waveOffset);
        for (let x = 0; x <= canvas.width; x += 40) {
            ctx.lineTo(x, 380 + Math.sin(x * 0.02 + frameCount * 0.04) * 8 + waveOffset);
        }
        ctx.lineTo(canvas.width, canvas.height);
        ctx.lineTo(0, canvas.height);
        ctx.fill();

        // Gently rocking boat
        let boatY = 380 + waveOffset;
        let boatRot = Math.sin(frameCount * 0.02) * 0.05;

        ctx.save();
        ctx.translate(400, boatY);
        ctx.rotate(boatRot);

        drawBoat(0, 0);
        drawKawmling(-20, -22, 1.0, 'determined', 'durag', 1); // Moe sitting left
        drawKawmling(22, -22, 0.95, 'worried', 'paperboat', -1); // McCrack sitting right

        ctx.restore();
    }
}

// --- Main Loop ---
function loop() {
    frameCount++;

    if (gameState === 'TITLE') {
        renderScene('BURNING_VILLAGE');
    } else if (gameState === 'DIALOGUE') {
        let currentScene = script[currentScriptIndex].scene;
        renderScene(currentScene);
    } else if (gameState === 'END_INTRO') {
        renderScene('OCEAN_DRIFT');
    }

    requestAnimationFrame(loop);
}

// --- Game Logic Handling ---
function triggerNextBeat() {
    initAudio();

    if (gameState === 'TITLE') {
        playStartSound();
        titleScreen.classList.add('hidden');
        dialogueBox.classList.remove('hidden');
        gameState = 'DIALOGUE';
        advanceScript();
    } else if (gameState === 'DIALOGUE') {
        if (isTyping) {
            // Fast forward typewriter
            clearInterval(typeTimer);
            speechEl.textContent = currentText;
            isTyping = false;
        } else {
            playAdvanceSound();
            currentScriptIndex++;
            if (currentScriptIndex < script.length) {
                advanceScript();
            } else {
                // Intro Ends
                dialogueBox.classList.add('hidden');
                fadeOverlay.style.opacity = '1';
                gameState = 'END_INTRO';
            }
        }
    }
}

function advanceScript() {
    const beat = script[currentScriptIndex];

    if (beat.speaker === 'NARRATOR') {
        speakerEl.textContent = "— HISTORY —";
        speakerEl.className = "speaker-name";
        speakerEl.style.color = "#a1a1aa";
    } else if (beat.speaker === 'Moe') {
        speakerEl.textContent = "Moe (You)";
        speakerEl.className = "speaker-name";
        speakerEl.style.color = "#38bdf8";
    } else if (beat.speaker === 'McCrack') {
        speakerEl.textContent = "McCrack";
        speakerEl.className = "speaker-name mc-crack";
    }

    typeWriter(beat.text);
}

// --- Listeners ---
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
        triggerNextBeat();
    }
});

document.getElementById('game-container').addEventListener('click', () => {
    triggerNextBeat();
});

// Start loop
loop();
</script>
</body>
</html>
