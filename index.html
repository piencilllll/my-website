<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawm: Far From Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030206;
            color: #d1d5db;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #000;
            border: 3px solid #2d2b38;
            border-radius: 4px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 15px rgba(139, 92, 246, 0.2);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }

        /* Scanlines Overlay */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* Title Screen UI */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            background: radial-gradient(circle, rgba(15, 12, 25, 0.75) 0%, rgba(3, 2, 6, 0.95) 100%);
            transition: opacity 1.5s ease;
        }

        .title-logo {
            font-size: 54px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 12px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5), 4px 4px 0px #ff0055, -2px -2px 0px #00e5ff;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: #a78bfa;
            letter-spacing: 6px;
            margin-bottom: 60px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(167, 139, 250, 0.6);
        }

        .prompt-text {
            font-size: 13px;
            color: #d4d4d8;
            letter-spacing: 2px;
            animation: pulse 1.6s infinite ease-in-out;
            cursor: pointer;
            text-align: center;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border: 1px solid #3f3f46;
            border-radius: 4px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* Dialogue Box - Authentic Undertale Style */
        #dialogue-container {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 720px;
            height: 155px;
            background: #000;
            border: 5px solid #fff;
            border-radius: 6px;
            padding: 16px;
            z-index: 20;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
        }

        #portrait-canvas {
            width: 110px;
            height: 110px;
            background: #050508;
            border: 2px solid #222;
            image-rendering: pixelated;
            flex-shrink: 0;
        }

        .text-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .dialogue-text {
            font-size: 20px;
            line-height: 1.4;
            color: #fff;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .next-prompt {
            align-self: flex-end;
            font-size: 12px;
            color: #888;
            animation: pulse 1s infinite;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        /* Cinematic Overlay Blackout */
        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 30;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="scanlines"></div>
    <canvas id="stage" width="800" height="600"></canvas>

    <div id="fade-overlay"></div>

    <!-- Title / Start Screen -->
    <div id="title-screen" class="ui-layer">
        <div class="title-logo">KAWM</div>
        <div class="subtitle">FAR FROM HOME</div>
        <div id="start-prompt" class="prompt-text">[ CLICK ANYWHERE TO ACTIVATE AUDIO ]<br><span style="font-size:10px; color: #888;">(Browsers block audio until user interaction)</span></div>
    </div>

    <!-- Intro Cutscene Dialogue UI - Undertale Style -->
    <div id="dialogue-container" class="hidden">
        <canvas id="portrait-canvas" width="55" height="55"></canvas>
        <div class="text-area">
            <div id="speech" class="dialogue-text"></div>
            <div class="next-prompt">[ PRESS SPACE ]</div>
        </div>
    </div>
</div>

<script>
// --- Web Audio API Setup ---
let audioCtx = null;
let isAudioInitialized = false;

function initAudio() {
    if (isAudioInitialized) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        isAudioInitialized = true;
        document.getElementById('start-prompt').innerHTML = "[ PRESS ANY KEY OR CLICK TO EMBARK ]";
    } catch (e) {
        console.error("Web Audio API not supported.");
    }
}

// Procedural Retro Sound Generators
function playTextBeep(speaker) {
    if (!audioCtx || !isAudioInitialized) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'square';
    
    if (speaker === 'Moe') {
        osc.frequency.setValueAtTime(190 + Math.random() * 25, audioCtx.currentTime);
    } else if (speaker === 'McCrack') {
        osc.frequency.setValueAtTime(360 + Math.random() * 40, audioCtx.currentTime);
    } else {
        osc.frequency.setValueAtTime(110, audioCtx.currentTime);
    }

    gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.035);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.035);
}

function playAdvanceSound() {
    if (!audioCtx || !isAudioInitialized) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(260, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(520, audioCtx.currentTime + 0.07);

    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.07);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.07);
}

function playStartSound() {
    if (!audioCtx || !isAudioInitialized) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(360, audioCtx.currentTime + 0.45);

    gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.45);
}

// --- Canvas Setup ---
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Portrait Canvas Setup
const portraitCanvas = document.getElementById('portrait-canvas');
const pCtx = portraitCanvas.getContext('2d');
pCtx.imageSmoothingEnabled = false;

// --- UI Handles ---
const titleScreen = document.getElementById('title-screen');
const dialogueBox = document.getElementById('dialogue-container');
const speechEl = document.getElementById('speech');
const fadeOverlay = document.getElementById('fade-overlay');

// --- Game Logic States ---
let gameState = 'TITLE';
let frameCount = 0;

// Rain Particles Array
const rainDrops = [];
for (let i = 0; i < 90; i++) {
    rainDrops.push({
        x: Math.random() * 800,
        y: Math.random() * 600,
        length: Math.random() * 18 + 12,
        speed: Math.random() * 10 + 14
    });
}

// --- Story Beats Setup ---
let currentScriptIndex = 0;
const script = [
    {
        speaker: "NARRATOR",
        expression: "none",
        text: "The sky over our village didn't turn black from the night...",
        scene: "BURNING_VILLAGE"
    },
    {
        speaker: "NARRATOR",
        expression: "none",
        text: "It turned black from smoke. The attack happened without warning. Fire consumed the timber and kinetic towers.",
        scene: "BURNING_VILLAGE"
    },
    {
        speaker: "McCrack",
        expression: "worried",
        text: "Moe! Hurry up! The dock is collapsing! We have to cast off right now!",
        scene: "ESCAPE_DOCK"
    },
    {
        speaker: "Moe",
        expression: "determined",
        text: "Hold on! The ropes are jammed—McCrack, grab the wooden oars!",
        scene: "ESCAPE_DOCK"
    },
    {
        speaker: "NARRATOR",
        expression: "none",
        text: "We pushed off into the dark expanse of the Kawm Ocean, leaving behind the only life we had ever known.",
        scene: "OCEAN_DRIFT"
    },
    {
        speaker: "McCrack",
        expression: "neutral",
        text: "Do you think... anyone else made it out, Moe?",
        scene: "OCEAN_DRIFT"
    },
    {
        speaker: "Moe",
        expression: "neutral",
        text: "...I don't know. But we can't look back now. We keep sailing until we find refuge.",
        scene: "OCEAN_DRIFT"
    }
];

// --- Typewriter Effect ---
let typeIndex = 0;
let isTyping = false;
let currentText = "";
let typeTimer = null;

function typeWriter(text, cb) {
    speechEl.textContent = "";
    typeIndex = 0;
    isTyping = true;
    currentText = text;

    const currentBeat = script[currentScriptIndex];

    clearInterval(typeTimer);
    typeTimer = setInterval(() => {
        if (typeIndex < text.length) {
            speechEl.textContent += text.charAt(typeIndex);
            if (text.charAt(typeIndex) !== ' ') {
                playTextBeep(currentBeat.speaker);
            }
            typeIndex++;
        } else {
            clearInterval(typeTimer);
            isTyping = false;
            if (cb) cb();
        }
    }, 38);
}

// --- Drawing Thicker Kawmling Characters (Stage) ---
function drawKawmlingStage(x, y, scale = 1, hat = 'none', facing = 1, pose = 'standing') {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(facing * scale, scale);

    ctx.strokeStyle = '#ffffff';
    ctx.fillStyle = '#ffffff';
    
    // Thicker body & limbs
    const bodyWidth = 12;
    const limbWidth = 9;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Head
    ctx.beginPath();
    ctx.arc(0, -48, 16, 0, Math.PI * 2);
    ctx.fill();

    if (pose === 'sitting') {
        // Torso
        ctx.lineWidth = bodyWidth;
        ctx.beginPath();
        ctx.moveTo(0, -32);
        ctx.lineTo(0, 5);
        ctx.stroke();

        // Arms (resting on knees)
        ctx.lineWidth = limbWidth;
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.lineTo(12, -8);
        ctx.lineTo(18, 2);
        ctx.stroke();

        // Legs (bent sitting pose)
        ctx.beginPath();
        ctx.moveTo(0, 5);
        ctx.lineTo(18, 5);
        ctx.lineTo(22, 22);
        ctx.stroke();
    } else {
        // Standing Torso
        ctx.lineWidth = bodyWidth;
        ctx.beginPath();
        ctx.moveTo(0, -32);
        ctx.lineTo(0, 10);
        ctx.stroke();

        // Arms
        ctx.lineWidth = limbWidth;
        ctx.beginPath();
        ctx.moveTo(0, -22);
        ctx.lineTo(-14, -6);
        ctx.moveTo(0, -22);
        ctx.lineTo(14, -6);
        ctx.stroke();

        // Legs
        ctx.beginPath();
        ctx.moveTo(0, 10);
        ctx.lineTo(-12, 36);
        ctx.moveTo(0, 10);
        ctx.lineTo(12, 36);
        ctx.stroke();
    }

    // --- Eyes (Black Dots) ---
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(4, -48, 2.5, 0, Math.PI * 2);
    ctx.arc(10, -48, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // --- Hats ---
    if (hat === 'durag') {
        // Blue Durag
        ctx.fillStyle = '#2563eb';
        ctx.beginPath();
        ctx.arc(0, -48, 17.5, Math.PI, Math.PI * 2);
        ctx.fill();
        // Ties / Flap hanging behind head
        ctx.beginPath();
        ctx.moveTo(-16, -48);
        ctx.lineTo(-24, -36);
        ctx.lineTo(-12, -40);
        ctx.fill();
    } else if (hat === 'paperboat') {
        // Paper Boat Hat
        ctx.fillStyle = '#f4f4f5';
        ctx.beginPath();
        ctx.moveTo(-20, -60);
        ctx.lineTo(20, -60);
        ctx.lineTo(12, -50);
        ctx.lineTo(-12, -50);
        ctx.closePath();
        ctx.fill();
        // Triangle Sail Peak
        ctx.beginPath();
        ctx.moveTo(-8, -60);
        ctx.lineTo(0, -74);
        ctx.lineTo(8, -60);
        ctx.closePath();
        ctx.fill();
        // Crease line
        ctx.strokeStyle = '#a1a1aa';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, -74);
        ctx.lineTo(0, -50);
        ctx.stroke();
    }

    ctx.restore();
}

// --- Drawing Pixel Portraits (Dialogue Box) ---
function drawPortrait(speaker, expression) {
    pCtx.clearRect(0, 0, portraitCanvas.width, portraitCanvas.height);
    
    if (speaker === 'NARRATOR') return;

    pCtx.fillStyle = '#ffffff';
    
    const centerX = portraitCanvas.width / 2;
    const centerY = portraitCanvas.height / 2 + 6;
    const headRad = 19;

    // Solid white thicker head
    pCtx.beginPath();
    pCtx.arc(centerX, centerY, headRad, 0, Math.PI * 2);
    pCtx.fill();

    // Hats on Portrait
    if (speaker === 'Moe') {
        pCtx.fillStyle = '#2563eb';
        pCtx.beginPath();
        pCtx.arc(centerX, centerY, headRad + 1.5, Math.PI, Math.PI * 2);
        pCtx.fill();
        pCtx.beginPath();
        pCtx.moveTo(centerX - headRad, centerY);
        pCtx.lineTo(centerX - headRad - 7, centerY + 12);
        pCtx.lineTo(centerX - headRad + 2, centerY + 9);
        pCtx.fill();
    } else if (speaker === 'McCrack') {
        pCtx.fillStyle = '#f4f4f5';
        pCtx.beginPath();
        pCtx.moveTo(centerX - 22, centerY - headRad - 2);
        pCtx.lineTo(centerX + 22, centerY - headRad - 2);
        pCtx.lineTo(centerX + 13, centerY - headRad + 9);
        pCtx.lineTo(centerX - 13, centerY - headRad + 9);
        pCtx.closePath();
        pCtx.fill();
        pCtx.beginPath();
        pCtx.moveTo(centerX - 9, centerY - headRad - 2);
        pCtx.lineTo(centerX, centerY - headRad - 16);
        pCtx.lineTo(centerX + 9, centerY - headRad - 2);
        pCtx.closePath();
        pCtx.fill();
    }

    // Black Eyes & Eyebrows
    pCtx.fillStyle = '#000000';
    pCtx.strokeStyle = '#000000';
    pCtx.lineWidth = 2.5;

    // Eyes
    pCtx.fillRect(centerX - 10, centerY - 2, 4, 6);
    pCtx.fillRect(centerX + 6, centerY - 2, 4, 6);

    // Eyebrows
    pCtx.beginPath();
    if (expression === 'worried') {
        pCtx.moveTo(centerX - 12, centerY - 11); pCtx.lineTo(centerX - 5, centerY - 7);
        pCtx.moveTo(centerX + 12, centerY - 11); pCtx.lineTo(centerX + 5, centerY - 7);
    } else if (expression === 'determined') {
        pCtx.moveTo(centerX - 12, centerY - 7); pCtx.lineTo(centerX - 5, centerY - 11);
        pCtx.moveTo(centerX + 12, centerY - 7); pCtx.lineTo(centerX + 5, centerY - 11);
    } else { // neutral
        pCtx.moveTo(centerX - 12, centerY - 9); pCtx.lineTo(centerX - 5, centerY - 9);
        pCtx.moveTo(centerX + 12, centerY - 9); pCtx.lineTo(centerX + 5, centerY - 9);
    }
    pCtx.stroke();
}

// --- Boat Render ---
function drawBoat(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // Wooden Hull with detailed gradient feel
    ctx.fillStyle = '#1c1310';
    ctx.beginPath();
    ctx.moveTo(-70, -5);
    ctx.lineTo(70, -5);
    ctx.lineTo(50, 32);
    ctx.lineTo(-50, 32);
    ctx.closePath();
    ctx.fill();

    // Plank lines
    ctx.strokeStyle = '#3a2720';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.strokeStyle = '#0d0806';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-60, 10); ctx.lineTo(60, 10);
    ctx.moveTo(-55, 22); ctx.lineTo(55, 22);
    ctx.stroke();

    ctx.restore();
}

// --- Rain Effect Render ---
function drawRain() {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';

    ctx.beginPath();
    for (let i = 0; i < rainDrops.length; i++) {
        let drop = rainDrops[i];
        ctx.moveTo(drop.x, drop.y);
        ctx.lineTo(drop.x - 3, drop.y + drop.length);

        drop.y += drop.speed;
        drop.x -= 1.5;

        if (drop.y > 600) {
            drop.y = -20;
            drop.x = Math.random() * 850;
        }
    }
    ctx.stroke();
}

// --- Background Scenes ---
function renderScene(sceneType) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (sceneType === 'BURNING_VILLAGE') {
        // Dramatic Dark Red Sky Gradient
        let grad = ctx.createLinearGradient(0, 0, 0, 600);
        grad.addColorStop(0, '#0a0305');
        grad.addColorStop(0.6, '#28080a');
        grad.addColorStop(1, '#520e0e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Distant burning silhouettes
        ctx.fillStyle = '#050203';
        ctx.fillRect(80, 280, 90, 140);
        ctx.fillRect(200, 220, 130, 200);
        ctx.fillRect(480, 250, 110, 170);

        // Fire embers particle effect
        for (let i = 0; i < 45; i++) {
            let px = (Math.sin(i * 99 + frameCount * 0.015) * 0.5 + 0.5) * canvas.width;
            let py = ((frameCount * (1 + i * 0.08) + i * 40) % 450);
            ctx.fillStyle = i % 2 === 0 ? '#ff3300' : '#ffb703';
            ctx.fillRect(px, 500 - py, 3, 3);
        }
    } 
    else if (sceneType === 'ESCAPE_DOCK') {
        // Burning Dock Scene
        let grad = ctx.createLinearGradient(0, 0, 0, 600);
        grad.addColorStop(0, '#0a0712');
        grad.addColorStop(0.7, '#1f0d1b');
        grad.addColorStop(1, '#3a111a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Wooden Dock platform
        ctx.fillStyle = '#171210';
        ctx.fillRect(0, 410, 360, 190);
        ctx.strokeStyle = '#2d221e';
        ctx.lineWidth = 4;
        for (let x = 0; x < 360; x += 30) {
            ctx.strokeRect(x, 410, 30, 190);
        }

        // Ocean Water
        ctx.fillStyle = '#050914';
        ctx.fillRect(360, 430, 440, 170);

        drawBoat(480, 425);

        // Thicker Characters
        drawKawmlingStage(260, 375, 1.15, 'durag', 1, 'standing'); // Moe
        drawKawmlingStage(480, 395, 1.05, 'paperboat', -1, 'standing'); // McCrack
    } 
    else if (sceneType === 'OCEAN_DRIFT') {
        // Deep Stormy Ocean Sky
        let grad = ctx.createLinearGradient(0, 0, 0, 600);
        grad.addColorStop(0, '#010206');
        grad.addColorStop(0.6, '#080d1a');
        grad.addColorStop(1, '#111827');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Bright White Ocean Waves (Requested)
        let waveOffset = Math.sin(frameCount * 0.03) * 6;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(0, 380 + waveOffset);
        for (let x = 0; x <= canvas.width; x += 40) {
            ctx.lineTo(x, 380 + Math.sin(x * 0.02 + frameCount * 0.04) * 8 + waveOffset);
        }
        ctx.lineTo(canvas.width, canvas.height);
        ctx.lineTo(0, canvas.height);
        ctx.fill();

        // Gently rocking boat
        let boatY = 380 + waveOffset;
        let boatRot = Math.sin(frameCount * 0.02) * 0.04;

        ctx.save();
        ctx.translate(400, boatY);
        ctx.rotate(boatRot);

        drawBoat(0, 0);
        // Sitting Pose & Thicker Bodies
        drawKawmlingStage(-22, -18, 1.05, 'durag', 1, 'sitting'); // Moe
        drawKawmlingStage(22, -18, 1.0, 'paperboat', -1, 'sitting'); // McCrack

        ctx.restore();

        // Atmospheric Rain overlay
        drawRain();
    }
}

// --- Main Loop ---
function loop() {
    frameCount++;

    if (gameState === 'TITLE') {
        renderScene('BURNING_VILLAGE');
    } else if (gameState === 'DIALOGUE') {
        let currentScene = script[currentScriptIndex].scene;
        renderScene(currentScene);
    } else if (gameState === 'END_INTRO') {
        renderScene('OCEAN_DRIFT');
    }

    requestAnimationFrame(loop);
}

// --- Game Logic Handling ---
function triggerNextBeat() {
    if (!isAudioInitialized) {
        initAudio();
        return;
    }

    if (gameState === 'TITLE') {
        playStartSound();
        titleScreen.classList.add('hidden');
        dialogueBox.classList.remove('hidden');
        gameState = 'DIALOGUE';
        advanceScript();
    } else if (gameState === 'DIALOGUE') {
        if (isTyping) {
            clearInterval(typeTimer);
            speechEl.textContent = currentText;
            isTyping = false;
        } else {
            playAdvanceSound();
            currentScriptIndex++;
            if (currentScriptIndex < script.length) {
                advanceScript();
            } else {
                dialogueBox.classList.add('hidden');
                fadeOverlay.style.opacity = '1';
                gameState = 'END_INTRO';
            }
        }
    }
}

function advanceScript() {
    const beat = script[currentScriptIndex];
    drawPortrait(beat.speaker, beat.expression);
    typeWriter(beat.text);
}

// --- Listeners ---
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
        triggerNextBeat();
    }
});

document.getElementById('game-container').addEventListener('click', () => {
    triggerNextBeat();
});

// Start loop
loop();
</script>
</body>
</html>
