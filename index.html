<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS1 Retro Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* PS1 CRT Scanline Overlay */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.8);
            z-index: 5;
        }

        /* UI HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            z-index: 10;
        }

        #click-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            background: rgba(0,0,0,0.85);
            padding: 30px;
            border: 2px solid #fff;
            text-align: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: #fff;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.5;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="crt-overlay"></div>
    <div id="crosshair"></div>

    <div id="hud">GEMS: <span id="score">0</span> / 5</div>

    <div id="click-prompt">
        <h2>PS1 PLATFORMER DEMO</h2>
        <br>
        <p>CLICK TO LOCK MOUSE & PLAY</p>
        <br>
        <small style="font-size: 14px; color: #aaa;">Controls: WASD (Move) | SPACE (Jump) | MOUSE (Look)</small>
    </div>

    <script>
        // --- 1. GAME SETUP & ENGINE ---
        const container = document.getElementById('canvas-container');
        const clickPrompt = document.getElementById('click-prompt');
        const scoreElem = document.getElementById('score');

        let score = 0;
        let isPointerLocked = false;

        // Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.035);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // Low-resolution rendering for retro PS1 look
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth / 2, window.innerHeight / 2, false); // Downscaled resolution
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.BasicShadowMap;
        container.appendChild(renderer.domElement);

        // --- 2. POINTER LOCK CONTROLS ---
        clickPrompt.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                isPointerLocked = true;
                clickPrompt.style.display = 'none';
            } else {
                isPointerLocked = false;
                clickPrompt.style.display = 'block';
            }
        });

        // Mouse look angles
        let yaw = 0;
        let pitch = 0;
        const mouseSensitivity = 0.0025;

        document.addEventListener('mousemove', (e) => {
            if (!isPointerLocked) return;
            yaw -= e.movementX * mouseSensitivity;
            pitch -= e.movementY * mouseSensitivity;

            // Clamp vertical rotation
            pitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 3, pitch));
        });

        // Keyboard Controls
        const keys = {};
        document.addEventListener('keydown', (e) => keys[e.code] = true);
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        // --- 3. PS1 MATERIAL SHADER (Vertex Jitter) ---
        function createPS1Material(colorHex) {
            return new THREE.ShaderMaterial({
                uniforms: {
                    uColor: { value: new THREE.Color(colorHex) },
                    uSnapResolution: { value: new THREE.Vector2(320, 240) }
                },
                vertexShader: `
                    uniform vec2 uSnapResolution;
                    varying vec3 vNormal;

                    void main() {
                        vNormal = normalMatrix * normal;
                        vec4 clipPos = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        
                        // PS1 Vertex Snapping Effect
                        vec4 snapped = clipPos;
                        snapped.xyz = clipPos.xyz / clipPos.w;
                        snapped.xy = floor(snapped.xy * uSnapResolution) / uSnapResolution;
                        snapped.xyz *= clipPos.w;

                        gl_Position = snapped;
                    }
                `,
                fragmentShader: `
                    uniform vec3 uColor;
                    varying vec3 vNormal;

                    void main() {
                        // Basic low-fi directional lighting
                        vec3 lightDir = normalize(vec3(0.5, 1.0, 0.3));
                        float diff = max(dot(vNormal, lightDir), 0.25);
                        gl_FragColor = vec4(uColor * diff, 1.0);
                    }
                `
            });
        }

        // --- 4. WORLD & LEVEL DESIGN ---
        // Player setup
        const playerRadius = 0.6;
        const playerGeo = new THREE.BoxGeometry(1.2, 1.6, 1.2);
        const playerMat = createPS1Material(0x3388ff);
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 3, 0);
        scene.add(player);

        // Physics variables
        let velocity = new THREE.Vector3();
        let isGrounded = false;
        const gravity = -28;
        const jumpForce = 12;
        const moveSpeed = 9;

        // Level Platforms
        const platforms = [];
        function createPlatform(x, y, z, w, h, d, color = 0x44aa44) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = createPS1Material(color);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            platforms.push({ mesh, bounds: new THREE.Box3().setFromObject(mesh) });
        }

        // Build Level Layout
        createPlatform(0, 0, 0, 12, 1, 12, 0x555566); // Start
        createPlatform(0, 2, -12, 6, 1, 6, 0xaa5533);
        createPlatform(10, 4, -18, 6, 1, 6, 0xaa5533);
        createPlatform(10, 7, -30, 8, 1, 8, 0x33aa55);
        createPlatform(-8, 9, -32, 6, 1, 6, 0xaa33aa);
        createPlatform(0, 12, -45, 14, 1, 14, 0x3388aa); // Final Platform

        // Collectibles (Gems)
        const gems = [];
        function createGem(x, y, z) {
            const geo = new THREE.OctahedronGeometry(0.6, 0);
            const mat = createPS1Material(0xffff00);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            gems.push(mesh);
        }

        createGem(0, 4, -12);
        createGem(10, 6, -18);
        createGem(10, 9, -30);
        createGem(-8, 11, -32);
        createGem(0, 14, -45);

        // --- 5. GAME LOOP & PHYSICS ---
        const clock = new THREE.Clock();

        function update() {
            const delta = Math.min(clock.getDelta(), 0.1);

            if (isPointerLocked) {
                // Movement Vector relative to camera angle
                const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)).normalize();
                const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).normalize();

                const moveDir = new THREE.Vector3();
                if (keys['KeyW']) moveDir.add(forward);
                if (keys['KeyS']) moveDir.sub(forward);
                if (keys['KeyD']) moveDir.add(right);
                if (keys['KeyA']) moveDir.sub(right);

                if (moveDir.lengthSq() > 0) moveDir.normalize();

                velocity.x = moveDir.x * moveSpeed;
                velocity.z = moveDir.z * moveSpeed;

                // Jump
                if (keys['Space'] && isGrounded) {
                    velocity.y = jumpForce;
                    isGrounded = false;
                }
            }

            // Apply Gravity
            velocity.y += gravity * delta;

            // Apply Movement
            player.position.x += velocity.x * delta;
            player.position.y += velocity.y * delta;
            player.position.z += velocity.z * delta;

            // Platform Collision Detection
            isGrounded = false;
            const playerBox = new THREE.Box3().setFromObject(player);

            platforms.forEach(plat => {
                if (playerBox.intersectsBox(plat.bounds)) {
                    // Check top landing collision
                    if (player.position.y - (velocity.y * delta) >= plat.bounds.max.y - 0.2 && velocity.y <= 0) {
                        player.position.y = plat.bounds.max.y + 0.8;
                        velocity.y = 0;
                        isGrounded = true;
                    }
                }
            });

            // Respawn Fall Limit
            if (player.position.y < -15) {
                player.position.set(0, 3, 0);
                velocity.set(0, 0, 0);
            }

            // Update Third-Person Camera Position
            const camDistance = 8;
            const camOffset = new THREE.Vector3(
                Math.sin(yaw) * Math.cos(pitch) * camDistance,
                Math.sin(pitch) * camDistance + 1.5,
                Math.cos(yaw) * Math.cos(pitch) * camDistance
            );

            camera.position.copy(player.position).add(camOffset);
            camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 0.5, 0)));

            // Animate & Collect Gems
            gems.forEach((gem, index) => {
                gem.rotation.y += delta * 2;
                if (player.position.distanceTo(gem.position) < 1.2) {
                    scene.remove(gem);
                    gems.splice(index, 1);
                    score++;
                    scoreElem.textContent = score;
                }
            });
        }

        function render() {
            requestAnimationFrame(render);
            update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth / 2, window.innerHeight / 2, false);
        });

        render();
    </script>
</body>
</html>
