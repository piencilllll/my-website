<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #050508;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.15);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        canvas {
            display: block;
            background: #080810;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stat-box {
            background: rgba(15, 15, 25, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 22px;
            font-weight: bold;
            color: #00f0ff;
            margin-top: 2px;
        }

        .health-bar-container {
            width: 200px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 6px;
        }

        .health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #ff5500);
            transition: width 0.2s ease;
        }

        .screen-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
        }

        h1 {
            font-size: 56px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #00f0ff, #ff0077);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }

        p {
            color: #a0a0c0;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        button {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            border: none;
            color: white;
            padding: 14px 36px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.7);
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="800" height="600"></canvas>
    
    <div class="ui-overlay">
        <div class="hud">
            <div class="stat-box">
                <div>Integrity</div>
                <div class="health-bar-container">
                    <div id="health-bar" class="health-bar"></div>
                </div>
            </div>
            <div class="stat-box" style="text-align: right;">
                <div>Score</div>
                <div id="score" class="stat-value">0</div>
            </div>
        </div>
        
        <div class="controls-hint">WASD / ARROWS : MOVE | SPACE : ACTION | SHIFT : DASH</div>
    </div>

    <div id="start-screen" class="screen-center">
        <h1>PROJECT VOID</h1>
        <p>Navigate the anomaly. Adapt to systemic shifts.<br>Survive as long as possible.</p>
        <button id="start-btn">INITIALIZE</button>
    </div>

    <div id="game-over-screen" class="screen-center hidden">
        <h1 style="background: linear-gradient(135deg, #ff0055, #ff5500); -webkit-background-clip: text;">SYSTEM FAILURE</h1>
        <p>Final Score: <span id="final-score" style="color: #fff; font-weight: bold;">0</span></p>
        <button id="restart-btn">REBOOT</button>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// UI Elements
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const scoreEl = document.getElementById('score');
const finalScoreEl = document.getElementById('final-score');
const healthBar = document.getElementById('health-bar');

// Input state
const keys = {};

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space' && e.target === document.body) e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.code] = false);

// Game Entities & State
let isRunning = false;
let score = 0;
let frameCount = 0;
let phase = 0;
let particles = [];
let hazards = [];
let pickups = [];

const player = {
    x: 400,
    y: 300,
    radius: 12,
    speed: 4.5,
    dashSpeed: 12,
    dashLength: 8,
    dashCooldown: 45,
    dashTimer: 0,
    dashCooldownTimer: 0,
    vx: 0,
    vy: 0,
    hp: 100,
    maxHp: 100,
    invuln: 0
};

function resetGame() {
    score = 0;
    frameCount = 0;
    phase = 1;
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.hp = 100;
    player.invuln = 0;
    hazards = [];
    pickups = [];
    particles = [];
    scoreEl.textContent = '0';
    healthBar.style.width = '100%';
}

function spawnParticle(x, y, color, speed, size, life) {
    const angle = Math.random() * Math.PI * 2;
    particles.push({
        x, y,
        vx: Math.cos(angle) * (Math.random() * speed),
        vy: Math.sin(angle) * (Math.random() * speed),
        color,
        size: Math.random() * size + 1,
        life,
        maxLife: life
    });
}

function spawnHazard() {
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random() * canvas.width; y = -20; }
    else if (edge === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; }
    else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; }
    else { x = -20; y = Math.random() * canvas.height; }

    const angle = Math.atan2(player.y - y, player.x - x);
    const speed = 1.5 + Math.random() * 2 + (phase * 0.3);
    const type = Math.random() < 0.25 ? 'seeker' : 'standard';

    hazards.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: type === 'seeker' ? 8 : 10 + Math.random() * 6,
        color: type === 'seeker' ? '#ff0055' : '#ff7700',
        type,
        pulse: 0
    });
}

function spawnPickup() {
    pickups.push({
        x: 40 + Math.random() * (canvas.width - 80),
        y: 40 + Math.random() * (canvas.height - 80),
        radius: 6,
        color: '#00f0ff',
        life: 300
    });
}

function update() {
    if (!isRunning) return;

    frameCount++;
    score += 1;
    if (frameCount % 60 === 0) scoreEl.textContent = Math.floor(score / 10);
    
    // Phase progression
    phase = 1 + Math.floor(score / 600);

    // Player Movement
    let dx = 0;
    let dy = 0;

    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

    // Normalize diagonal
    if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
    }

    // Dash Logic
    if (player.dashCooldownTimer > 0) player.dashCooldownTimer--;
    
    if ((keys['ShiftLeft'] || keys['ShiftRight'] || keys['Space']) && player.dashCooldownTimer === 0 && (dx !== 0 || dy !== 0)) {
        player.dashTimer = player.dashLength;
        player.dashCooldownTimer = player.dashCooldown;
        player.invuln = player.dashLength + 4;
        
        // Dash particles
        for (let i = 0; i < 12; i++) {
            spawnParticle(player.x, player.y, '#00f0ff', 4, 3, 20);
        }
    }

    const currentSpeed = player.dashTimer > 0 ? player.dashSpeed : player.speed;
    if (player.dashTimer > 0) player.dashTimer--;

    player.x += dx * currentSpeed;
    player.y += dy * currentSpeed;

    // Canvas boundaries
    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

    if (player.invuln > 0) player.invuln--;

    // Trail particle
    if (frameCount % 2 === 0) {
        spawnParticle(
            player.x + (Math.random() - 0.5) * 8,
            player.y + (Math.random() - 0.5) * 8,
            player.dashTimer > 0 ? '#00f0ff' : 'rgba(0, 240, 255, 0.4)',
            0.5, 2, 15
        );
    }

    // Spawning logic
    const spawnRate = Math.max(15, 50 - phase * 4);
    if (frameCount % spawnRate === 0) spawnHazard();
    if (frameCount % 180 === 0 && pickups.length < 3) spawnPickup();

    // Hazards update
    for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];

        if (h.type === 'seeker') {
            const angle = Math.atan2(player.y - h.y, player.x - h.x);
            h.vx += Math.cos(angle) * 0.08;
            h.vy += Math.sin(angle) * 0.08;
            // Cap speed
            const speed = Math.hypot(h.vx, h.vy);
            if (speed > 3) {
                h.vx = (h.vx / speed) * 3;
                h.vy = (h.vy / speed) * 3;
            }
        }

        h.x += h.vx;
        h.y += h.vy;
        h.pulse += 0.05;

        // Collision check with player
        const dist = Math.hypot(player.x - h.x, player.y - h.y);
        if (dist < player.radius + h.radius && player.invuln === 0) {
            player.hp -= 20;
            player.invuln = 30;
            healthBar.style.width = Math.max(0, player.hp) + '%';

            // Hit feedback
            for (let k = 0; k < 15; k++) {
                spawnParticle(player.x, player.y, '#ff0055', 5, 4, 25);
            }

            if (player.hp <= 0) {
                endGame();
            }
        }

        // Despawn offscreen
        if (h.x < -50 || h.x > canvas.width + 50 || h.y < -50 || h.y > canvas.height + 50) {
            hazards.splice(i, 1);
        }
    }

    // Pickups update
    for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.life--;

        const dist = Math.hypot(player.x - p.x, player.y - p.y);
        if (dist < player.radius + p.radius) {
            score += 150;
            player.hp = Math.min(player.maxHp, player.hp + 10);
            healthBar.style.width = player.hp + '%';

            for (let k = 0; k < 10; k++) {
                spawnParticle(p.x, p.y, '#00f0ff', 3, 3, 20);
            }
            pickups.splice(i, 1);
            continue;
        }

        if (p.life <= 0) {
            pickups.splice(i, 1);
        }
    }

    // Particles update
    for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;

        if (pt.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function render() {
    // Clear background with soft fade trail
    ctx.fillStyle = 'rgba(8, 8, 16, 0.3)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid backdrop
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
    ctx.lineWidth = 1;
    const gridSize = 40;
    for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }

    // Render Particles
    particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life / pt.maxLife;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    // Render Pickups
    pickups.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + Math.sin(frameCount * 0.1) * 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    // Render Hazards
    hazards.forEach(h => {
        ctx.fillStyle = h.color;
        ctx.shadowColor = h.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        const drawRadius = h.radius + Math.sin(h.pulse) * 1;
        ctx.arc(h.x, h.y, drawRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    // Render Player
    if (isRunning) {
        if (player.invuln % 4 < 2) { // Blink when invulnerable
            ctx.fillStyle = player.dashTimer > 0 ? '#ffffff' : '#00f0ff';
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }
}

function loop() {
    update();
    render();
    requestAnimationFrame(loop);
}

function startGame() {
    resetGame();
    isRunning = true;
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
}

function endGame() {
    isRunning = false;
    finalScoreEl.textContent = Math.floor(score / 10);
    gameOverScreen.classList.remove('hidden');
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

// Start loop engine
loop();
</script>
</body>
</html>
