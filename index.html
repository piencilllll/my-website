<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono Tactics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #0b0d12;
            color: #d1d5db;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(139, 92, 246, 0.2);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #11131a;
        }

        canvas {
            display: block;
            background: #11131a;
            cursor: pointer;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stat-card {
            background: rgba(17, 19, 26, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-val {
            font-size: 20px;
            font-weight: bold;
            color: #a78bfa;
            margin-top: 2px;
        }

        .turn-indicator {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid #8b5cf6;
            color: #ddd6fe;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: auto;
        }

        .action-panel {
            background: rgba(17, 19, 26, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
        }

        .btn-action {
            background: #1f2430;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .btn-action:hover:not(:disabled) {
            background: #32394a;
            border-color: #a78bfa;
            transform: translateY(-2px);
        }

        .btn-action.active {
            background: #8b5cf6;
            border-color: #a78bfa;
            color: #fff;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        .btn-action:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-action span {
            font-size: 10px;
            color: #9ca3af;
        }

        .btn-action.active span {
            color: #e9d5ff;
        }

        .screen-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
            background: rgba(17, 19, 26, 0.95);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 420px;
        }

        h1 {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        p {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border: none;
            color: white;
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
        }

        .hidden {
            display: none !important;
        }

        .log-box {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 240px;
            max-height: 120px;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 4px;
            pointer-events: none;
        }

        .log-entry {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(17, 19, 26, 0.8);
            border-left: 3px solid #8b5cf6;
            color: #cbd5e1;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="800" height="600"></canvas>

    <div class="ui-overlay">
        <div class="hud-top">
            <div class="stat-card">
                <div>Stage</div>
                <div id="stage-val" class="stat-val">1</div>
            </div>
            <div id="turn-indicator" class="turn-indicator">Player Turn</div>
            <div class="stat-card" style="text-align: right;">
                <div>Actions Left</div>
                <div id="ap-val" class="stat-val">2</div>
            </div>
        </div>

        <div id="hud-bottom" class="hud-bottom hidden">
            <div class="action-panel">
                <button id="btn-move" class="btn-action active">
                    MOVE
                    <span>1 AP</span>
                </button>
                <button id="btn-attack" class="btn-action">
                    ATTACK
                    <span>1 AP</span>
                </button>
                <button id="btn-ability" class="btn-action">
                    OVERCLOCK
                    <span>2 AP</span>
                </button>
                <button id="btn-end" class="btn-action" style="border-color: rgba(239, 68, 68, 0.4);">
                    END TURN
                    <span>PASS</span>
                </button>
            </div>
        </div>

        <div id="log-box" class="log-box"></div>
    </div>

    <div id="start-screen" class="screen-center">
        <h1>CHRONO TACTICS</h1>
        <p>Turn-based grid tactics.<br>Outmaneuver corrupt security nodes.<br>Use Overclock to hit targets from afar.</p>
        <button id="start-btn" class="btn-primary">START MISSION</button>
    </div>

    <div id="game-over-screen" class="screen-center hidden">
        <h1 id="end-title" style="background: linear-gradient(135deg, #ef4444, #f97316); -webkit-background-clip: text;">NODE WIPED</h1>
        <p id="end-desc">Your operational unit was destroyed.</p>
        <button id="restart-btn" class="btn-primary">REDEPLOY</button>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Grid Config
const GRID_COLS = 10;
const GRID_ROWS = 8;
const TILE_SIZE = 56;
const OFFSET_X = (canvas.width - (GRID_COLS * TILE_SIZE)) / 2;
const OFFSET_Y = (canvas.height - (GRID_ROWS * TILE_SIZE)) / 2 + 10;

// UI Elements
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const hudBottom = document.getElementById('hud-bottom');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const stageVal = document.getElementById('stage-val');
const apVal = document.getElementById('ap-val');
const turnIndicator = document.getElementById('turn-indicator');
const endTitle = document.getElementById('end-title');
const endDesc = document.getElementById('end-desc');
const logBox = document.getElementById('log-box');

const btnMove = document.getElementById('btn-move');
const btnAttack = document.getElementById('btn-attack');
const btnAbility = document.getElementById('btn-ability');
const btnEnd = document.getElementById('btn-end');

// Game State
let stage = 1;
let currentTurn = 'player'; // 'player' or 'enemy'
let actionPoints = 2;
const MAX_AP = 2;
let selectedMode = 'move'; // 'move', 'attack', 'ability'
let hoverTile = null;

let grid = [];
let units = [];
let particles = [];
let floats = [];

class Unit {
    constructor(x, y, type, faction) {
        this.gx = x;
        this.gy = y;
        this.px = OFFSET_X + x * TILE_SIZE + TILE_SIZE / 2;
        this.py = OFFSET_Y + y * TILE_SIZE + TILE_SIZE / 2;
        this.type = type; // 'vanguard', 'striker', 'drone'
        this.faction = faction; // 'player', 'enemy'
        
        if (faction === 'player') {
            this.maxHp = 24;
            this.hp = 24;
            this.atk = 8;
            this.range = 1;
            this.color = '#a78bfa';
        } else {
            if (type === 'drone') {
                this.maxHp = 10;
                this.hp = 10;
                this.atk = 4;
                this.range = 2;
                this.color = '#f43f5e';
            } else {
                this.maxHp = 16 + (stage * 4);
                this.hp = this.maxHp;
                this.atk = 5 + stage;
                this.range = 1;
                this.color = '#fb7185';
            }
        }
    }

    update() {
        const tx = OFFSET_X + this.gx * TILE_SIZE + TILE_SIZE / 2;
        const ty = OFFSET_Y + this.gy * TILE_SIZE + TILE_SIZE / 2;
        this.px += (tx - this.px) * 0.2;
        this.py += (ty - this.py) * 0.2;
    }

    draw() {
        ctx.save();
        ctx.translate(this.px, this.py);

        // Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath();
        ctx.ellipse(0, 16, 14, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Unit Body
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;

        if (this.faction === 'player') {
            ctx.beginPath();
            ctx.moveTo(0, -16);
            ctx.lineTo(14, 10);
            ctx.lineTo(-14, 10);
            ctx.closePath();
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(0, 0, 12, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.shadowBlur = 0;

        // HP Bar
        const barW = 28;
        const barH = 4;
        const hpRatio = Math.max(0, this.hp / this.maxHp);
        
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(-barW / 2, -26, barW, barH);
        
        ctx.fillStyle = this.faction === 'player' ? '#10b981' : '#f43f5e';
        ctx.fillRect(-barW / 2, -26, barW * hpRatio, barH);

        ctx.restore();
    }
}

function initGrid() {
    grid = [];
    for (let r = 0; r < GRID_ROWS; r++) {
        let row = [];
        for (let c = 0; c < GRID_COLS; c++) {
            // Random obstacles
            const isBlocked = (Math.random() < 0.12) && !(c < 2 && r > 2 && r < 5);
            row.push({ blocked: isBlocked });
        }
        grid.push(row);
    }
}

function initStage() {
    initGrid();
    units = [];
    
    // Player Unit
    units.push(new Unit(1, 3, 'vanguard', 'player'));

    // Enemy Units based on stage
    const count = Math.min(2 + stage, 6);
    let spawned = 0;
    while (spawned < count) {
        let rx = Math.floor(Math.random() * 4) + 5;
        let ry = Math.floor(Math.random() * GRID_ROWS);
        if (!grid[ry][rx].blocked && !getUnitAt(rx, ry)) {
            const type = (spawned % 2 === 0) ? 'striker' : 'drone';
            units.push(new Unit(rx, ry, type, 'enemy'));
            spawned++;
        }
    }

    actionPoints = MAX_AP;
    currentTurn = 'player';
    selectedMode = 'move';
    updateUI();
    addLog(`Stage ${stage} initialized.`);
}

function getUnitAt(gx, gy) {
    return units.find(u => u.gx === gx && u.gy === gy);
}

function addLog(msg) {
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.textContent = msg;
    logBox.appendChild(entry);
    if (logBox.children.length > 4) {
        logBox.removeChild(logBox.children[0]);
    }
}

function addFloatText(txt, px, py, color = '#fff') {
    floats.push({
        txt, px, py, color,
        life: 40,
        vy: -1
    });
}

function addParticles(px, py, color, count = 8) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 3 + 1;
        particles.push({
            px, py,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            color,
            life: 20 + Math.random() * 10,
            maxLife: 30
        });
    }
}

function updateUI() {
    stageVal.textContent = stage;
    apVal.textContent = actionPoints;
    
    if (currentTurn === 'player') {
        turnIndicator.textContent = 'Player Turn';
        turnIndicator.style.borderColor = '#8b5cf6';
        turnIndicator.style.color = '#ddd6fe';
        hudBottom.classList.remove('hidden');
    } else {
        turnIndicator.textContent = 'Enemy Phase';
        turnIndicator.style.borderColor = '#f43f5e';
        turnIndicator.style.color = '#fecdd3';
        hudBottom.classList.add('hidden');
    }

    btnMove.classList.toggle('active', selectedMode === 'move');
    btnAttack.classList.toggle('active', selectedMode === 'attack');
    btnAbility.classList.toggle('active', selectedMode === 'ability');

    btnMove.disabled = actionPoints < 1;
    btnAttack.disabled = actionPoints < 1;
    btnAbility.disabled = actionPoints < 2;
}

function setMode(mode) {
    if (currentTurn !== 'player') return;
    selectedMode = mode;
    updateUI();
}

function getValidTiles() {
    const playerUnit = units.find(u => u.faction === 'player');
    if (!playerUnit) return [];

    let valid = [];
    const range = selectedMode === 'move' ? 2 : (selectedMode === 'ability' ? 4 : playerUnit.range);

    for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
            const dist = Math.abs(c - playerUnit.gx) + Math.abs(r - playerUnit.gy);
            if (dist > 0 && dist <= range) {
                if (selectedMode === 'move') {
                    if (!grid[r][c].blocked && !getUnitAt(c, r)) {
                        valid.push({ c, r });
                    }
                } else if (selectedMode === 'attack' || selectedMode === 'ability') {
                    const target = getUnitAt(c, r);
                    if (target && target.faction === 'enemy') {
                        valid.push({ c, r });
                    }
                }
            }
        }
    }
    return valid;
}

function handleTileClick(c, r) {
    if (currentTurn !== 'player' || actionPoints <= 0) return;

    const playerUnit = units.find(u => u.faction === 'player');
    if (!playerUnit) return;

    const validTiles = getValidTiles();
    const isValid = validTiles.some(t => t.c === c && t.r === r);

    if (!isValid) return;

    if (selectedMode === 'move') {
        playerUnit.gx = c;
        playerUnit.gy = r;
        actionPoints -= 1;
        addLog(`Moved to [${c}, ${r}]`);
    } else if (selectedMode === 'attack' || selectedMode === 'ability') {
        const target = getUnitAt(c, r);
        if (target) {
            const isAbility = selectedMode === 'ability';
            const dmg = isAbility ? playerUnit.atk * 2 : playerUnit.atk;
            target.hp -= dmg;
            actionPoints -= isAbility ? 2 : 1;

            addParticles(target.px, target.py, '#f43f5e', 12);
            addFloatText(`-${dmg}`, target.px, target.py - 10, '#f43f5e');
            addLog(`${isAbility ? 'Overclocked' : 'Attacked'} enemy for ${dmg} DMG`);

            if (target.hp <= 0) {
                addLog(`Enemy unit destroyed!`);
                units = units.filter(u => u !== target);
            }
        }
    }

    updateUI();
    checkWinLoss();

    if (actionPoints <= 0 && currentTurn === 'player') {
        endPlayerTurn();
    }
}

function endPlayerTurn() {
    if (currentTurn !== 'player') return;
    currentTurn = 'enemy';
    updateUI();
    setTimeout(executeEnemyTurn, 600);
}

function executeEnemyTurn() {
    const enemies = units.filter(u => u.faction === 'enemy');
    const playerUnit = units.find(u => u.faction === 'player');

    if (!playerUnit || enemies.length === 0) {
        checkWinLoss();
        return;
    }

    let delay = 0;

    enemies.forEach((enemy, idx) => {
        setTimeout(() => {
            if (playerUnit.hp <= 0) return;

            const dist = Math.abs(playerUnit.gx - enemy.gx) + Math.abs(playerUnit.gy - enemy.gy);

            if (dist <= enemy.range) {
                // Attack Player
                playerUnit.hp -= enemy.atk;
                addParticles(playerUnit.px, playerUnit.py, '#a78bfa', 10);
                addFloatText(`-${enemy.atk}`, playerUnit.px, playerUnit.py - 10, '#a78bfa');
                addLog(`Enemy hit player for ${enemy.atk} DMG`);
            } else {
                // Move closer
                let bestX = enemy.gx;
                let bestY = enemy.gy;
                let minDist = dist;

                const dirs = [[1,0], [-1,0], [0,1], [0,-1]];
                dirs.forEach(([dx, dy]) => {
                    const nx = enemy.gx + dx;
                    const ny = enemy.gy + dy;
                    if (nx >= 0 && nx < GRID_COLS && ny >= 0 && ny < GRID_ROWS) {
                        if (!grid[ny][nx].blocked && !getUnitAt(nx, ny)) {
                            const d = Math.abs(playerUnit.gx - nx) + Math.abs(playerUnit.gy - ny);
                            if (d < minDist) {
                                minDist = d;
                                bestX = nx;
                                bestY = ny;
                            }
                        }
                    }
                });

                enemy.gx = bestX;
                enemy.gy = bestY;
            }

            if (idx === enemies.length - 1) {
                setTimeout(() => {
                    checkWinLoss();
                    if (units.some(u => u.faction === 'player' && u.hp > 0)) {
                        currentTurn = 'player';
                        actionPoints = MAX_AP;
                        selectedMode = 'move';
                        updateUI();
                        addLog('Player turn started');
                    }
                }, 500);
            }
        }, delay);

        delay += 500;
    });
}

function checkWinLoss() {
    const playerUnit = units.find(u => u.faction === 'player');
    const enemies = units.filter(u => u.faction === 'enemy');

    if (!playerUnit || playerUnit.hp <= 0) {
        endTitle.textContent = "NODE WIPED";
        endDesc.textContent = `You reached Stage ${stage}. Systems compromised.`;
        gameOverScreen.classList.remove('hidden');
        hudBottom.classList.add('hidden');
    } else if (enemies.length === 0) {
        stage++;
        addLog(`Stage Cleared! Advancing...`);
        setTimeout(initStage, 1000);
    }
}

// Canvas Interaction
canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const gx = Math.floor((mx - OFFSET_X) / TILE_SIZE);
    const gy = Math.floor((my - OFFSET_Y) / TILE_SIZE);

    if (gx >= 0 && gx < GRID_COLS && gy >= 0 && gy < GRID_ROWS) {
        hoverTile = { c: gx, r: gy };
    } else {
        hoverTile = null;
    }
});

canvas.addEventListener('click', () => {
    if (hoverTile) {
        handleTileClick(hoverTile.c, hoverTile.r);
    }
});

// Render Loop
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Grid
    const validTiles = currentTurn === 'player' ? getValidTiles() : [];

    for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
            const x = OFFSET_X + c * TILE_SIZE;
            const y = OFFSET_Y + r * TILE_SIZE;

            ctx.fillStyle = grid[r][c].blocked ? '#181b24' : '#1e2330';
            ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);

            // Highlight valid actions
            const isValid = validTiles.some(t => t.c === c && t.r === r);
            if (isValid) {
                ctx.fillStyle = selectedMode === 'move' ? 'rgba(167, 139, 250, 0.25)' : 'rgba(244, 63, 94, 0.25)';
                ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);

                ctx.strokeStyle = selectedMode === 'move' ? '#a78bfa' : '#f43f5e';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
            }

            // Highlight hover
            if (hoverTile && hoverTile.c === c && hoverTile.r === r) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
            }

            if (grid[r][c].blocked) {
                ctx.fillStyle = '#262c3d';
                ctx.beginPath();
                ctx.arc(x + TILE_SIZE / 2, y + TILE_SIZE / 2, 8, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    // Units
    units.forEach(u => {
        u.update();
        u.draw();
    });

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.px += p.vx;
        p.py += p.vy;
        p.life--;

        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.beginPath();
        ctx.arc(p.px, p.py, 3, 0, Math.PI * 2);
        ctx.fill();

        if (p.life <= 0) particles.splice(i, 1);
    }
    ctx.globalAlpha = 1.0;

    // Floating text
    for (let i = floats.length - 1; i >= 0; i--) {
        const f = floats[i];
        f.py += f.vy;
        f.life--;

        ctx.font = 'bold 14px sans-serif';
        ctx.fillStyle = f.color;
        ctx.globalAlpha = f.life / 40;
        ctx.fillText(f.txt, f.px - 10, f.py);

        if (f.life <= 0) floats.splice(i, 1);
    }
    ctx.globalAlpha = 1.0;

    requestAnimationFrame(render);
}

// UI Listeners
btnMove.addEventListener('click', () => setMode('move'));
btnAttack.addEventListener('click', () => setMode('attack'));
btnAbility.addEventListener('click', () => setMode('ability'));
btnEnd.addEventListener('click', endPlayerTurn);

startBtn.addEventListener('click', () => {
    stage = 1;
    startScreen.classList.add('hidden');
    initStage();
});

restartBtn.addEventListener('click', () => {
    stage = 1;
    gameOverScreen.classList.add('hidden');
    initStage();
});

// Start loop
render();
</script>
</body>
</html>
