<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Platformer Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        #canvas-container { width: 100vw; height: 100vh; }
        #hud {
            position: absolute; top: 10px; left: 10px; color: #fff;
            text-shadow: 2px 2px 0 #000; font-size: 16px; pointer-events: none;
        }
        #controls-info {
            position: absolute; bottom: 10px; left: 10px; color: #aaa;
            font-size: 12px; pointer-events: none; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="hud">
        <div>SCORE: <span id="score">0</span> / <span id="total-collectibles">0</span></div>
        <div>LIVES: <span id="lives">3</span></div>
        <div id="status" style="color: #ff3366; font-weight: bold; margin-top: 5px;"></div>
    </div>
    <div id="controls-info">
        <b>WASD / Arrows</b>: Move | <b>SPACE</b>: Jump (Double Jump available) | <b>MOUSE</b>: Rotate Camera (Click to lock)
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <script>
        // --- GAME ENGINE SETUP ---
        const container = document.getElementById('canvas-container');
        
        // Graphics World
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x68b0d8);
        scene.fog = new THREE.FogExp2(0x68b0d8, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Physics World
        const world = new CANNON.World();
        world.gravity.set(0, -22, 0);
        world.broadphase = new CANNON.NaiveBroadphase();
        world.defaultContactMaterial.contactEquationStiffness = 1e7;
        world.defaultContactMaterial.contactEquationRelaxation = 4;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 150;
        const d = 40;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // State Tracking
        let score = 0;
        let lives = 3;
        let totalCollectibles = 0;
        const physicsBodies = [];
        const visualMeshes = [];
        const collectibles = [];
        const hazardBodies = [];
        const movingPlatforms = [];

        // --- PLAYER SETUP ---
        const playerRadius = 0.6;
        const playerShape = new CANNON.Sphere(playerRadius);
        const playerMaterial = new CANNON.Material({ friction: 0.0, restitution: 0.0 });
        const playerBody = new CANNON.Body({ mass: 5, shape: playerShape, material: playerMaterial });
        playerBody.linearDamping = 0.1;
        playerBody.fixedRotation = true;
        world.addBody(playerBody);

        const playerGeo = new THREE.SphereGeometry(playerRadius, 32, 32);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0xff3366, roughness: 0.3, metalness: 0.2 });
        const playerMesh = new THREE.Mesh(playerGeo, playerMat);
        playerMesh.castShadow = true;
        scene.add(playerMesh);

        // --- INPUT & CAMERA CONTROLS ---
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let yaw = 0;
        let pitch = 0.3;
        let jumpsAvailable = 2;
        let canJumpReset = true;

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'w' || e.key === 'ArrowUp') keys.w = true;
            if (e.key.toLowerCase() === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key.toLowerCase() === 's' || e.key === 'ArrowDown') keys.s = true;
            if (e.key.toLowerCase() === 'd' || e.key === 'ArrowRight') keys.d = true;
            if (e.code === 'Space') {
                if (!keys.space && jumpsAvailable > 0) {
                    playerBody.velocity.y = 12;
                    jumpsAvailable--;
                }
                keys.space = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() === 'w' || e.key === 'ArrowUp') keys.w = false;
            if (e.key.toLowerCase() === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key.toLowerCase() === 's' || e.key === 'ArrowDown') keys.s = false;
            if (e.key.toLowerCase() === 'd' || e.key === 'ArrowRight') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        });

        document.body.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        window.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * 0.003;
                pitch -= e.movementY * 0.003;
                pitch = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, pitch));
            }
        });

        // --- LEVEL GENERATION BUILDER ---
        function createBox(x, y, z, w, h, d, color = 0x44aa44, isHazard = false) {
            const shape = new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2));
            const body = new CANNON.Body({ mass: 0, shape: shape });
            body.position.set(x, y, z);
            world.addBody(body);

            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ 
                color: isHazard ? 0xff2222 : color, 
                roughness: 0.5 
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            mesh.castShadow = true;
            scene.add(mesh);

            if (isHazard) hazardBodies.push(body);
            return { body, mesh };
        }

        function createMovingPlatform(x, y, z, w, h, d, rangeX, rangeY, rangeZ, speed) {
            const platform = createBox(x, y, z, w, h, d, 0xddaa22);
            platform.startX = x;
            platform.startY = y;
            platform.startZ = z;
            platform.rangeX = rangeX;
            platform.rangeY = rangeY;
            platform.rangeZ = rangeZ;
            platform.speed = speed;
            movingPlatforms.push(platform);
        }

        function createCollectible(x, y, z) {
            totalCollectibles++;
            const geo = new THREE.OctahedronGeometry(0.4, 0);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.1, emissive: 0x443300 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            scene.add(mesh);

            collectibles.push({ mesh, pos: new THREE.Vector3(x, y, z), collected: false });
            document.getElementById('total-collectibles').innerText = totalCollectibles;
        }

        // --- LEVEL MAP BUILD ---
        const startPos = { x: 0, y: 3, z: 0 };
        playerBody.position.set(startPos.x, startPos.y, startPos.z);

        // Spawn Area
        createBox(0, 0, 0, 10, 1, 10, 0x338833);
        createCollectible(0, 1.5, 0);

        // Stepping Stones & Challenges
        createBox(0, 1, -10, 4, 1, 4, 0x55aa55);
        createCollectible(0, 2.5, -10);

        createMovingPlatform(0, 2, -18, 4, 0.8, 4, 6, 0, 0, 1.5);
        createCollectible(0, 4, -18);

        createBox(0, 3, -26, 3, 1, 3, 0x55aa55);
        createBox(0, 2, -32, 2, 0.5, 2, 0xff2222, true); // Hazard test block

        createMovingPlatform(0, 4, -40, 4, 0.8, 4, 0, 5, 0, 2.0);
        createCollectible(0, 10, -40);

        createBox(0, 10, -52, 12, 1, 12, 0x3355aa);
        createCollectible(-3, 11.5, -52);
        createCollectible(3, 11.5, -52);
        createCollectible(0, 11.5, -55);

        // --- GAME LOOP & UPDATES ---
        const clock = new THREE.Clock();

        function checkGrounded() {
            // Raycast down to check if player is standing on surface
            const from = playerBody.position;
            const to = new CANNON.Vec3(from.x, from.y - playerRadius - 0.15, from.z);
            const result = new CANNON.RaycastResult();
            world.raycastClosest(from, to, {}, result);
            if (result.hasHit) {
                jumpsAvailable = 2; // Reset double jump
            }
        }

        function respawn() {
            lives--;
            document.getElementById('lives').innerText = lives;
            if (lives <= 0) {
                document.getElementById('status').innerText = "GAME OVER - Reloading...";
                setTimeout(() => location.reload(), 2000);
            } else {
                playerBody.position.set(startPos.x, startPos.y, startPos.z);
                playerBody.velocity.set(0, 0, 0);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            // Physics Step
            world.step(1 / 60, delta, 3);
            checkGrounded();

            // Movement relative to Camera Orientation
            const moveSpeed = 12;
            let moveX = 0;
            let moveZ = 0;

            if (keys.w) moveZ -= 1;
            if (keys.s) moveZ += 1;
            if (keys.a) moveX -= 1;
            if (keys.d) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
                moveX /= length;
                moveZ /= length;

                const sinYaw = Math.sin(yaw);
                const cosYaw = Math.cos(yaw);

                const forwardX = -sinYaw * moveZ - cosYaw * moveX;
                const forwardZ = -cosYaw * moveZ + sinYaw * moveX;

                playerBody.velocity.x = forwardX * moveSpeed;
                playerBody.velocity.z = forwardZ * moveSpeed;
            } else {
                playerBody.velocity.x *= 0.85;
                playerBody.velocity.z *= 0.85;
            }

            // Sync Player Graphics
            playerMesh.position.copy(playerBody.position);

            // Update Moving Platforms
            movingPlatforms.forEach(p => {
                const offsetX = Math.sin(time * p.speed) * p.rangeX;
                const offsetY = Math.sin(time * p.speed) * p.rangeY;
                const offsetZ = Math.sin(time * p.speed) * p.rangeZ;

                p.body.position.set(p.startX + offsetX, p.startY + offsetY, p.startZ + offsetZ);
                p.mesh.position.copy(p.body.position);
            });

            // Camera Orbit around Player
            const camDistance = 8;
            camera.position.x = playerMesh.position.x + camDistance * Math.sin(yaw) * Math.cos(pitch);
            camera.position.y = playerMesh.position.y + camDistance * Math.sin(pitch);
            camera.position.z = playerMesh.position.z + camDistance * Math.cos(yaw) * Math.cos(pitch);
            camera.lookAt(playerMesh.position.x, playerMesh.position.y + 0.5, playerMesh.position.z);

            // Collectibles Logic
            collectibles.forEach(c => {
                if (!c.collected) {
                    c.mesh.rotation.y += 0.03;
                    c.mesh.position.y = c.pos.y + Math.sin(time * 3) * 0.15;

                    const dist = playerMesh.position.distanceTo(c.mesh.position);
                    if (dist < playerRadius + 0.5) {
                        c.collected = true;
                        scene.remove(c.mesh);
                        score++;
                        document.getElementById('score').innerText = score;
                        if (score === totalCollectibles) {
                            document.getElementById('status').innerText = "STAGE CLEAR!";
                        }
                    }
                }
            });

            // Hazard Collision & Fall Boundary Checks
            hazardBodies.forEach(h => {
                const dist = playerBody.position.distanceTo(h.position);
                if (dist < 1.5) respawn();
            });

            if (playerBody.position.y < -15) {
                respawn();
            }

            renderer.render(scene, camera);
        }

        // Handle Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
