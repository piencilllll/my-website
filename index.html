<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANOMALY DATABASE // ARCHIVE</title>
    <style>
        :root {
            --bg-dark: #080a0c;
            --panel-bg: rgba(15, 20, 26, 0.9);
            --border-color: #232d38;
            --accent-green: #00ff66;
            --accent-red: #ff3344;
            --accent-amber: #ffaa00;
            --text-bright: #e6edf3;
            --text-dim: #7d8590;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-bright);
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Scanline Overlay */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.35) 50%,
                rgba(0, 0, 0, 0.35)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.7;
        }

        /* Container */
        .archive-card {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9), 0 0 15px rgba(0, 255, 102, 0.05);
            display: grid;
            grid-template-columns: 320px 1fr;
            grid-template-rows: auto 1fr auto;
            gap: 20px;
            padding: 24px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            grid-column: 1 / -1;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .archive-title {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--accent-green);
        }

        .threat-badge {
            padding: 4px 12px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Left Column - Visual Preview */
        .visual-panel {
            grid-column: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .canvas-frame {
            width: 100%;
            height: 280px;
            background: #030405;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Right Column - Data Sheet */
        .data-panel {
            grid-column: 2;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .field-value {
            font-size: 0.95rem;
            color: var(--text-bright);
            line-height: 1.5;
        }

        /* Footer / Actions */
        footer {
            grid-column: 1 / -1;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: #121820;
            border: 1px solid var(--border-color);
            color: var(--accent-green);
            padding: 10px 18px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 4px;
        }

        .btn:hover {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
        }

        .btn-danger {
            color: var(--accent-red);
        }

        .btn-danger:hover {
            background: var(--accent-red);
            color: #000;
            box-shadow: 0 0 12px rgba(255, 51, 68, 0.4);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .archive-card {
                grid-template-columns: 1fr;
            }
            .visual-panel {
                grid-column: 1;
            }
            .data-panel {
                grid-column: 1;
            }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div class="archive-card">
        <header>
            <div class="archive-title">CLASSIFIED ARCHIVE // ENTITY FILE</div>
            <div id="threat-tag" class="threat-badge">LEVEL 0</div>
        </header>

        <div class="visual-panel">
            <div class="canvas-frame">
                <canvas id="entityCanvas"></canvas>
            </div>
            <div class="field-group">
                <span class="field-label">DESIGNATION CODE</span>
                <span class="field-value" id="val-id">ENT-0000</span>
            </div>
            <div class="field-group">
                <span class="field-label">ANOMALOUS CLASS</span>
                <span class="field-value" id="val-class">UNKNOWN</span>
            </div>
        </div>

        <div class="data-panel">
            <div class="field-group">
                <span class="field-label">COGNOMEN / NAME</span>
                <span class="field-value" id="val-name" style="font-size: 1.2rem; color: var(--accent-green);">---</span>
            </div>
            <div class="field-group">
                <span class="field-label">PHYSICAL MORPHOLOGY</span>
                <span class="field-value" id="val-morph">---</span>
            </div>
            <div class="field-group">
                <span class="field-label">OBSERVED BEHAVIOR & PHENOMENA</span>
                <span class="field-value" id="val-behavior">---</span>
            </div>
            <div class="field-group">
                <span class="field-label">SPECIAL CONTAINMENT PROTOCOLS</span>
                <span class="field-value" id="val-containment">---</span>
            </div>
        </div>

        <footer>
            <span style="font-size: 0.75rem; color: var(--text-dim);" id="timestamp">SECURE TERMINAL ONLINE</span>
            <button class="btn btn-danger" id="genBtn">GENERATE NEW FILE</button>
        </footer>
    </div>

    <script>
        // Setup Canvas Engine
        const canvas = document.getElementById('entityCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let animFrame;
        let t = 0;
        let currentSeed = 0;
        let threatLevel = "HARmless";

        // Procedural Entity Silhouette Generator
        function renderEntity() {
            t += 0.03;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Background Grid / Radar Scan
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.08)';
            ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i = 0; i < canvas.height; i += 20) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // Radar Scan Line
            let scanY = (t * 20) % canvas.height;
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.25)';
            ctx.beginPath();
            ctx.moveTo(0, scanY);
            ctx.lineTo(canvas.width, scanY);
            ctx.stroke();

            // Procedural Entity Vector Shapes
            ctx.save();
            ctx.translate(cx, cy);

            let mainColor = '#00ff66';
            if (threatLevel === 'CRITICAL' || threatLevel === 'APOCALYPTIC') mainColor = '#ff3344';
            else if (threatLevel === 'HAZARDOUS' || threatLevel === 'SEVERE') mainColor = '#ffaa00';

            ctx.fillStyle = mainColor;
            ctx.shadowColor = mainColor;
            ctx.shadowBlur = 15;

            // Draw Central Anomalous Core & Tendrils
            const numNodes = 6 + (currentSeed % 6);
            ctx.beginPath();
            for (let i = 0; i < numNodes; i++) {
                let angle = (i / numNodes) * Math.PI * 2;
                let noise = Math.sin(t * 2 + i * currentSeed) * 20 + Math.cos(t * 1.5 + i) * 15;
                let radius = 45 + noise;

                let x = Math.cos(angle) * radius;
                let y = Math.sin(angle) * radius;

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);

                // Branching Tendrils
                if (i % 2 === 0) {
                    let tx = Math.cos(angle) * (radius + 40 + Math.sin(t * 3 + i) * 15);
                    let ty = Math.sin(angle) * (radius + 40 + Math.cos(t * 3 + i) * 15);
                    ctx.lineTo(tx, ty);
                }
            }
            ctx.closePath();
            ctx.fill();

            // Glowing Floating Orbs / Spores
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 5; i++) {
                let ox = Math.sin(t + i + currentSeed) * 70;
                let oy = Math.cos(t * 1.2 + i) * 70;
                ctx.beginPath();
                ctx.arc(ox, oy, Math.random() * 3 + 2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();

            animFrame = requestAnimationFrame(renderEntity);
        }

        // Procedural Text Generator Tables
        const namePrefixes = ["The Void", "The Echoing", "Stanza", "Obsidian", "Sub-Surface", "Spectral", "Kinetic", "Non-Euclidean"];
        const nameNouns = ["Weaver", "Watcher", "Vanguard", "Architect", "Anomaly", "Stalker", "Husk", "Crawler", "Disciple"];

        const classes = ["Liminal-Horror", "Biological-Shift", "Spatial-Distortion", "Cognitohazard", "Acoustic-Parasite"];

        const threats = [
            { level: "MINIMAL", color: "#00ff66", bg: "rgba(0,255,106,0.15)" },
            { level: "HAZARDOUS", color: "#ffaa00", bg: "rgba(255,170,0,0.15)" },
            { level: "CRITICAL", color: "#ff3344", bg: "rgba(255,51,68,0.15)" },
            { level: "APOCALYPTIC", color: "#ff0055", bg: "rgba(255,0,85,0.25)" }
        ];

        const morphologies = [
            "Amorphous mass shifting through non-Euclidean geometry. Displays fluctuating perimeter bounds.",
            "Bipedal skeletal composite encased in dense white liquid energy strands.",
            "Sub-surface crystalline structure emitting localized gravitational dampening waves.",
            "Multi-segmented appendage matrix with shifting bioluminescent eye spots."
        ];

        const behaviors = [
            "Remains inert in complete darkness. Actively moves toward radio frequencies and electronic displays.",
            "Distorts structural geometry within a 15-meter radius, causing corridors to loop infinitely.",
            "Emits low-frequency acoustic vibrations that induce mild auditory hallucinations in personnel.",
            "Consumes ambient thermal energy, rapidly freezing surrounding atmosphere upon physical contact."
        ];

        const protocols = [
            "Must be kept in a vacuum-sealed chamber lined with acoustic dampening foam at all times.",
            "Requires continuous low-intensity ultraviolet lighting. No electronic screens permitted inside perimeter.",
            "Containment cell walls must be re-anchored weekly using reinforced concrete and liquid coolants.",
            "Personnel must maintain line-of-sight during maintenance shifts. Never approach without ear defense."
        ];

        function generateNewArchiveEntry() {
            currentSeed = Math.floor(Math.random() * 10000);

            // Generate ID & Threat
            const idCode = "ENT-" + Math.floor(1000 + Math.random() * 9000);
            const threatObj = threats[Math.floor(Math.random() * threats.length)];
            threatLevel = threatObj.level;

            // Generate Text Data
            const name = namePrefixes[Math.floor(Math.random() * namePrefixes.length)] + " " + nameNouns[Math.floor(Math.random() * nameNouns.length)];
            const eClass = classes[Math.floor(Math.random() * classes.length)];
            const morph = morphologies[Math.floor(Math.random() * morphologies.length)];
            const bhav = behaviors[Math.floor(Math.random() * behaviors.length)];
            const prot = protocols[Math.floor(Math.random() * protocols.length)];

            // Update DOM
            document.getElementById('val-id').innerText = idCode;
            document.getElementById('val-name').innerText = name;
            document.getElementById('val-class').innerText = eClass;
            document.getElementById('val-morph').innerText = morph;
            document.getElementById('val-behavior').innerText = bhav;
            document.getElementById('val-containment').innerText = prot;

            const threatTag = document.getElementById('threat-tag');
            threatTag.innerText = `LEVEL: ${threatObj.level}`;
            threatTag.style.color = threatObj.color;
            threatTag.style.border = `1px solid ${threatObj.color}`;
            threatTag.style.backgroundColor = threatObj.bg;

            document.getElementById('timestamp').innerText = `LAST UPDATED: ${new Date().toLocaleTimeString()} // LOG #${currentSeed}`;
        }

        document.getElementById('genBtn').addEventListener('click', generateNewArchiveEntry);

        // Initialize
        generateNewArchiveEntry();
        renderEntity();
    </script>
</body>
</html>
