<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawm: Far From Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030206;
            color: #d1d5db;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #000;
            border: 3px solid #2d2b38;
            border-radius: 4px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 15px rgba(139, 92, 246, 0.2);
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }

        #stage3d { z-index: 1; }
        #stage2d { z-index: 5; pointer-events: none; }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            background: radial-gradient(circle, rgba(15, 12, 25, 0.75) 0%, rgba(3, 2, 6, 0.95) 100%);
            transition: opacity 1.5s ease;
        }

        .title-logo {
            font-size: 54px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 12px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5), 4px 4px 0px #ff0055, -2px -2px 0px #00e5ff;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: #a78bfa;
            letter-spacing: 6px;
            margin-bottom: 60px;
            text-transform: uppercase;
        }

        .prompt-text {
            font-size: 13px;
            color: #d4d4d8;
            letter-spacing: 2px;
            animation: pulse 1.6s infinite ease-in-out;
            cursor: pointer;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border: 1px solid #3f3f46;
            border-radius: 4px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* Dialogue Box FIXED: Static dimensions, flex for text only */
        #dialogue-container {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 720px;
            height: 155px;
            background: #000;
            border: 5px solid #fff;
            border-radius: 6px;
            z-index: 20;
            overflow: hidden;
            display: none; /* Controlled by JS */
        }

        /* Independent Portrait Layer inside dialogue box */
        #portrait-stage {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 115px;
            height: 115px;
            background: #000;
            border: 3px solid #fff;
            image-rendering: pixelated;
        }

        /* Text area shifted to the right of portrait */
        .text-area {
            position: absolute;
            top: 15px;
            left: 150px;
            width: 545px;
            height: 115px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dialogue-text {
            font-size: 20px;
            line-height: 1.3;
            color: #fff;
            font-weight: bold;
            font-family: monospace;
        }

        .next-prompt {
            align-self: flex-end;
            font-size: 12px;
            color: #888;
            animation: pulse 1s infinite;
        }

        #gameplay-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 25;
            color: #fff;
            font-family: monospace;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }

        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 30;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
    <div class="scanlines"></div>
    
    <canvas id="stage3d"></canvas>
    <canvas id="stage2d" width="800" height="600"></canvas>
    <div id="fade-overlay"></div>

    <div id="gameplay-hud" style="display:none;">
        CONTROLS: [WASD] or [ARROWS] to steer.<br>
        Avoid the rocks! Reach the beacon light!
    </div>

    <div id="title-screen" class="ui-layer">
        <div class="title-logo">KAWM</div>
        <div class="subtitle">FAR FROM HOME</div>
        <div id="start-prompt" class="prompt-text">[ CLICK ANYWHERE TO ACTIVATE AUDIO ]</div>
    </div>

    <!-- Dialogue Box Rebuilt -->
    <div id="dialogue-container">
        <!-- Separate Portrait Canvas -->
        <canvas id="portrait-stage" width="115" height="115"></canvas>
        <div class="text-area">
            <div id="speech" class="dialogue-text"></div>
            <div class="next-prompt">[ PRESS SPACE ]</div>
        </div>
    </div>
</div>

<script>
// --- Web Audio Setup ---
let audioCtx = null;
let isAudioInitialized = false;

function initAudio() {
    if (isAudioInitialized) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        isAudioInitialized = true;
        document.getElementById('start-prompt').innerHTML = "[ PRESS ANY KEY OR CLICK TO EMBARK ]";
    } catch (e) {
        console.error("Web Audio API not supported.");
    }
}

function playTextBeep(speaker) {
    if (!audioCtx || !isAudioInitialized) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    if (speaker === 'Moe') osc.frequency.setValueAtTime(200 + Math.random() * 20, audioCtx.currentTime);
    else if (speaker === 'McCrack') osc.frequency.setValueAtTime(380 + Math.random() * 40, audioCtx.currentTime);
    else osc.frequency.setValueAtTime(120, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.03);
}

function playAdvanceSound() {
    if (!audioCtx || !isAudioInitialized) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(250, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.06);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.06);
}

function playStartSound() {
    if (!audioCtx || !isAudioInitialized) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(110, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(330, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
}

// =========================================================================
// --- 2D CANVAS ENGINE (FIRST PART - DO NOT MESS UP) ---
// =========================================================================
const canvas = document.getElementById('stage2d');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const portCanvas = document.getElementById('portrait-stage');
const pCtx = portCanvas.getContext('2d');
pCtx.imageSmoothingEnabled = false;

const titleScreen = document.getElementById('title-screen');
const dialogueBox = document.getElementById('dialogue-container');
const speechEl = document.getElementById('speech');
const fadeOverlay = document.getElementById('fade-overlay');

let gameState = 'TITLE'; // TITLE, INTRO_2D, CUTSCENE_3D, GAMEPLAY_3D
let frameCount = 0;

const rainDrops2D = [];
for (let i = 0; i < 90; i++) {
    rainDrops2D.push({ x: Math.random() * 800, y: Math.random() * 600, length: Math.random() * 18 + 12, speed: Math.random() * 10 + 14 });
}

const script2D = [
    { speaker: "NARRATOR", expression: "none", text: "The sky over our village didn't turn black from the night...", scene: "BURNING_VILLAGE" },
    { speaker: "NARRATOR", expression: "none", text: "It turned black from smoke. The attack happened without warning. Fire consumed the timber and kinetic towers.", scene: "BURNING_VILLAGE" },
    { speaker: "McCrack", expression: "worried", text: "Moe! Hurry up! The dock is collapsing! We have to cast off right now!", scene: "ESCAPE_DOCK" },
    { speaker: "Moe", expression: "determined", text: "Hold on! The ropes are jammed—McCrack, grab the wooden oars!", scene: "ESCAPE_DOCK" },
    { speaker: "NARRATOR", expression: "none", text: "We pushed off into the dark expanse of the Kawm Ocean, leaving behind the only life we had ever known.", scene: "OCEAN_DRIFT" }
];

const script3D = [
    { speaker: "McCrack", expression: "neutral", text: "Moe... do you think... anyone else made it out?", cameraMode: "TALK_McCRACK" },
    { speaker: "Moe", expression: "neutral", text: "...I don't know. But we have to keep looking. We can't survive out in this ocean forever.", cameraMode: "TALK_MOE" },
    { speaker: "Moe", expression: "squint", text: "Wait... hold on. Do you see that?", cameraMode: "SQUINT_MOE" },
    { speaker: "Moe", expression: "determined", text: "There's a light! McCrack, look! Over there through the fog!", cameraMode: "SQUINT_MOE" },
    { speaker: "McCrack", expression: "worried", text: "Woah! It is! It's a beacon!", cameraMode: "STAND_McCRACK" },
    { speaker: "McCrack", expression: "neutral", text: "Grab the oars, Moe! We have to steer through this storm to get to it!", cameraMode: "LOOK_AT_LIGHT" }
];

let activeScript = script2D;
let currentScriptIndex = 0;
let typeTimer = null;
let currentText = "";
let isTyping = false;

function typeWriter(text, cb) {
    speechEl.textContent = "";
    let typeIndex = 0;
    isTyping = true;
    currentText = text;
    const currentBeat = activeScript[currentScriptIndex];

    clearInterval(typeTimer);
    typeTimer = setInterval(() => {
        if (typeIndex < text.length) {
            speechEl.textContent += text.charAt(typeIndex);
            if (text.charAt(typeIndex) !== ' ') playTextBeep(currentBeat.speaker);
            typeIndex++;
        } else {
            clearInterval(typeTimer);
            isTyping = false;
            if (cb) cb();
        }
    }, 40);
}

function drawKawmlingStage2D(x, y, scale = 1, hat = 'none', facing = 1, pose = 'standing') {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(facing * scale, scale);
    ctx.strokeStyle = '#ffffff'; ctx.fillStyle = '#ffffff';
    const bodyWidth = 12; const limbWidth = 9;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.arc(0, -48, 16, 0, Math.PI * 2); ctx.fill();
    if (pose === 'sitting') {
        ctx.lineWidth = bodyWidth; ctx.beginPath(); ctx.moveTo(0, -32); ctx.lineTo(0, 5); ctx.stroke();
        ctx.lineWidth = limbWidth; ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(12, -8); ctx.lineTo(18, 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(18, 5); ctx.lineTo(22, 22); ctx.stroke();
    } else {
        ctx.lineWidth = bodyWidth; ctx.beginPath(); ctx.moveTo(0, -32); ctx.lineTo(0, 10); ctx.stroke();
        ctx.lineWidth = limbWidth; ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(-14, -6); ctx.moveTo(0, -22); ctx.lineTo(14, -6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(-12, 36); ctx.moveTo(0, 10); ctx.lineTo(12, 36); ctx.stroke();
    }
    ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.arc(4, -48, 2.5, 0, Math.PI * 2); ctx.arc(10, -48, 2.5, 0, Math.PI * 2); ctx.fill();
    if (hat === 'durag') {
        ctx.fillStyle = '#2563eb'; ctx.beginPath(); ctx.arc(0, -48, 17.5, Math.PI, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-16, -48); ctx.lineTo(-24, -36); ctx.lineTo(-12, -40); ctx.fill();
    } else if (hat === 'paperboat') {
        ctx.fillStyle = '#f4f4f5'; ctx.beginPath(); ctx.moveTo(-20, -60); ctx.lineTo(20, -60); ctx.lineTo(12, -50); ctx.lineTo(-12, -50);
        ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(-8, -60); ctx.lineTo(0, -74); ctx.lineTo(8, -60);
        ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#a1a1aa'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, -74); ctx.lineTo(0, -50); ctx.stroke();
    }
    ctx.restore();
}

// **FIXED: Portrait drawing centered perfectly in the new 2D canvas**
function drawPortrait2D(speaker, expression) {
    pCtx.clearRect(0, 0, portCanvas.width, portCanvas.height);
    if (speaker === 'NARRATOR') return;

    pCtx.fillStyle = '#ffffff';
    // Internal resolution of portrait stage is 115x115. Center is (57.5, 57.5)
    const centerX = 57.5; 
    const centerY = 65; // Positioned slightly lower to account for hats
    const headRad = 36;

    // Solid white thicker head
    pCtx.beginPath();
    pCtx.arc(centerX, centerY, headRad, 0, Math.PI * 2);
    pCtx.fill();

    // Hats on Portrait
    if (speaker === 'Moe') {
        pCtx.fillStyle = '#2563eb';
        pCtx.beginPath(); pCtx.arc(centerX, centerY, headRad + 2.5, Math.PI, Math.PI * 2); pCtx.fill();
        pCtx.beginPath(); pCtx.moveTo(centerX - headRad, centerY); pCtx.lineTo(centerX - headRad - 12, centerY + 25); pCtx.lineTo(centerX - headRad + 4, centerY + 18); pCtx.fill();
    } else if (speaker === 'McCrack') {
        pCtx.fillStyle = '#f4f4f5';
        pCtx.beginPath(); pCtx.moveTo(centerX - 42, centerY - headRad - 4); pCtx.lineTo(centerX + 42, centerY - headRad - 4); pCtx.lineTo(centerX + 26, centerY - headRad + 18); pCtx.lineTo(centerX - 26, centerY - headRad + 18); pCtx.closePath(); pCtx.fill();
        pCtx.beginPath(); pCtx.moveTo(centerX - 16, centerY - headRad - 4); pCtx.lineTo(centerX, centerY - headRad - 28); pCtx.lineTo(centerX + 16, centerY - headRad - 4); pCtx.closePath(); pCtx.fill();
    }

    // Black Eyes & Eyebrows (Stick Figure Face)
    pCtx.fillStyle = '#000000'; pCtx.strokeStyle = '#000000'; pCtx.lineWidth = 4;

    // Standard eyes vs Squinting eyes (for 3D sequence)
    if (expression === 'squint') {
        pCtx.fillRect(centerX - 22, centerY - 6, 16, 4); // Squint L
        pCtx.fillRect(centerX + 6, centerY - 6, 16, 4);  // Squint R
    } else {
        pCtx.fillRect(centerX - 18, centerY - 8, 8, 14);
        pCtx.fillRect(centerX + 10, centerY - 8, 8, 14);
    }

    pCtx.beginPath();
    if (expression === 'worried') {
        pCtx.moveTo(centerX - 22, centerY - 20); pCtx.lineTo(centerX - 10, centerY - 14);
        pCtx.moveTo(centerX + 22, centerY - 20); pCtx.lineTo(centerX + 10, centerY - 14);
    } else if (expression === 'determined' || expression === 'squint') {
        pCtx.moveTo(centerX - 22, centerY - 14); pCtx.lineTo(centerX - 10, centerY - 20);
        pCtx.moveTo(centerX + 22, centerY - 14); pCtx.lineTo(centerX + 10, centerY - 20);
    } else { // neutral
        pCtx.moveTo(centerX - 22, centerY - 16); pCtx.lineTo(centerX - 10, centerY - 16);
        pCtx.moveTo(centerX + 22, centerY - 16); pCtx.lineTo(centerX + 10, centerY - 16);
    }
    pCtx.stroke();
}

function drawBoat2D(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#1c1310'; ctx.beginPath(); ctx.moveTo(-70, -5); ctx.lineTo(70, -5); ctx.lineTo(50, 32); ctx.lineTo(-50, 32); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a2720'; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = '#0d0806'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-60, 10); ctx.lineTo(60, 10); ctx.moveTo(-55, 22); ctx.lineTo(55, 22); ctx.stroke();
    ctx.restore();
}

function drawRain2D() {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < rainDrops2D.length; i++) {
        let drop = rainDrops2D[i]; ctx.moveTo(drop.x, drop.y); ctx.lineTo(drop.x - 3, drop.y + drop.length);
        drop.y += drop.speed; drop.x -= 1.5;
        if (drop.y > 600) { drop.y = -20; drop.x = Math.random() * 850; }
    }
    ctx.stroke();
}

function render2DScene(sceneType) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (sceneType === 'BURNING_VILLAGE') {
        let grad = ctx.createLinearGradient(0, 0, 0, 600); grad.addColorStop(0, '#0a0305'); grad.addColorStop(0.6, '#28080a'); grad.addColorStop(1, '#520e0e');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#050203'; ctx.fillRect(80, 280, 90, 140); ctx.fillRect(200, 220, 130, 200); ctx.fillRect(480, 250, 110, 170);
        for (let i = 0; i < 45; i++) {
            let px = (Math.sin(i * 99 + frameCount * 0.015) * 0.5 + 0.5) * canvas.width;
            let py = ((frameCount * (1 + i * 0.08) + i * 40) % 450);
            ctx.fillStyle = i % 2 === 0 ? '#ff3300' : '#ffb703'; ctx.fillRect(px, 500 - py, 3, 3);
        }
    } 
    else if (sceneType === 'ESCAPE_DOCK') {
        let grad = ctx.createLinearGradient(0, 0, 0, 600); grad.addColorStop(0, '#0a0712'); grad.addColorStop(0.7, '#1f0d1b'); grad.addColorStop(1, '#3a111a');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#171210'; ctx.fillRect(0, 410, 360, 190);
        ctx.strokeStyle = '#2d221e'; ctx.lineWidth = 4;
        for (let x = 0; x < 360; x += 30) ctx.strokeRect(x, 410, 30, 190);
        ctx.fillStyle = '#050914'; ctx.fillRect(360, 430, 440, 170);
        drawBoat2D(480, 425);
        drawKawmlingStage2D(260, 375, 1.15, 'durag', 1, 'standing');
        drawKawmlingStage2D(480, 395, 1.05, 'paperboat', -1, 'standing');
    } 
    else if (sceneType === 'OCEAN_DRIFT') {
        let grad = ctx.createLinearGradient(0, 0, 0, 600); grad.addColorStop(0, '#010206'); grad.addColorStop(0.6, '#080d1a'); grad.addColorStop(1, '#111827');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        let waveOffset = Math.sin(frameCount * 0.03) * 6;
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(0, 380 + waveOffset);
        for (let x = 0; x <= canvas.width; x += 40) ctx.lineTo(x, 380 + Math.sin(x * 0.02 + frameCount * 0.04) * 8 + waveOffset);
        ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height); ctx.fill();
        let boatY = 380 + waveOffset; let boatRot = Math.sin(frameCount * 0.02) * 0.04;
        ctx.save(); ctx.translate(400, boatY); ctx.rotate(boatRot); drawBoat2D(0, 0);
        drawKawmlingStage2D(-22, -18, 1.05, 'durag', 1, 'sitting');
        drawKawmlingStage2D(22, -18, 1.0, 'paperboat', -1, 'sitting'); ctx.restore();
        drawRain2D();
    }
}

// =========================================================================
// --- 3D THREE.JS ENGINE (SECOND PART - FIXED VISIBILITY) ---
// =========================================================================
let scene3d, camera3d, renderer3d, oceanMesh;
let boat3d, moe3d, mcCrack3d, lighthouseGroup, rocksGroup;
let rainSystem3d;

// Gameplay state
let boatX = 0;
let boatZ = 0;
let inputs = { left: false, right: false };
const GAME_LENGTH = 1600;

function init3DEngine() {
    const stage3d = document.getElementById('stage3d');
    
    // Renderer - Higher resolution scaling for PS1 effect (0.4 was too low)
    renderer3d = new THREE.WebGLRenderer({ canvas: stage3d, antialias: false, alpha: false });
    renderer3d.setSize(800, 600);
    renderer3d.setPixelRatio(0.8); // Higher factor keeps it from turning pitch black

    scene3d = new THREE.Scene();
    scene3d.background = new THREE.Color(0x050814); // Deep night blue
    scene3d.fog = new THREE.FogExp2(0x050814, 0.003); // LIGHTER FOG for visibility

    // Camera - closer FOV
    camera3d = new THREE.PerspectiveCamera(55, 800 / 600, 0.1, 2000);

    // Dynamic Lighting for visibility (REBUILT)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9); // BRIGHT AMBIENT
    scene3d.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(40, 80, 50);
    scene3d.add(dirLight);

    // -- Create Objects --

    // 1. Water Plane (White Waves)
    const oceanGeo = new THREE.PlaneGeometry(300, 2400, 60, 240);
    oceanGeo.rotateX(-Math.PI / 2);
    const oceanMat = new THREE.MeshLambertMaterial({ color: 0xffffff, wireframe: false });
    oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
    scene3d.add(oceanMesh);

    // 2. The Boat
    boat3d = new THREE.Group();
    const hullGeo = new THREE.BoxGeometry(4.5, 2.2, 11);
    const hullMat = new THREE.MeshLambertMaterial({ color: 0x1f1410 });
    const hull = new THREE.Mesh(hullGeo, hullMat);
    hull.position.y = 1.1; // Sits above water plane base
    boat3d.add(hull);
    scene3d.add(boat3d);

    // 3. Kawm 3D Characters (Stick figures with thickness)
    function createKawmling3D(hatType) {
        const group = new THREE.Group();
        const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const limbGeo = new THREE.CylinderGeometry(0.18, 0.18, 2.2, 8); // Thicker

        // Head
        const headGeo = new THREE.SphereGeometry(0.8, 16, 16);
        const head = new THREE.Mesh(headGeo, whiteMat);
        head.position.y = 3.2;
        group.add(head);

        // Eyes
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const eyeGeo = new THREE.BoxGeometry(0.18, 0.3, 0.1);
        const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.3, 3.3, 0.7);
        const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(0.3, 3.3, 0.7);
        group.add(eyeL, eyeR);

        // Body
        const bodyGeo = new THREE.CylinderGeometry(0.35, 0.35, 2.2, 8);
        const body = new THREE.Mesh(bodyGeo, whiteMat);
        body.position.y = 1.6;
        group.add(body);

        // Arms Container
        group.arms = new THREE.Group();
        group.arms.position.y = 2.4;
        group.add(group.arms);

        const armL = new THREE.Mesh(limbGeo, whiteMat); armL.position.set(-0.6, -0.9, 0); armL.rotation.z = Math.PI / 7;
        const armR = new THREE.Mesh(limbGeo, whiteMat); armR.position.set(0.6, -0.9, 0); armR.rotation.z = -Math.PI / 7;
        group.arms.add(armL, armR);

        // Hats
        if (hatType === 'durag') {
            const duragMat = new THREE.MeshBasicMaterial({ color: 0x2563eb });
            const duragGeo = new THREE.SphereGeometry(0.85, 12, 12, 0, Math.PI * 2, 0, Math.PI / 2);
            const durag = new THREE.Mesh(duragGeo, duragMat);
            durag.position.y = 3.25;
            group.add(durag);
        } else if (hatType === 'paperboat') {
            const hatMat = new THREE.MeshBasicMaterial({ color: 0xf4f4f5 });
            const pBoatGeo = new THREE.ConeGeometry(1.0, 0.8, 4);
            const pBoat = new THREE.Mesh(pBoatGeo, hatMat);
            pBoat.position.y = 4.1;
            pBoat.rotation.y = Math.PI / 4;
            group.add(pBoat);
        }

        return group;
    }

    moe3d = createKawmling3D('durag');
    moe3d.position.set(0, 1.5, -2.5); // Front seat
    boat3d.add(moe3d);

    mcCrack3d = createKawmling3D('paperboat');
    mcCrack3d.position.set(0, 1.5, 2.5); // Back seat
    mcCrack3d.rotation.y = Math.PI; // Face Moe
    boat3d.add(mcCrack3d);

    // 4. Lighthouse Beacon Structure
    lighthouseGroup = new THREE.Group();
    lighthouseGroup.position.set(0, 0, -GAME_LENGTH); // far away

    const towerGeo = new THREE.CylinderGeometry(8, 12, 70, 12);
    const towerMat = new THREE.MeshLambertMaterial({ color: 0x2d3748 }); // dark tower
    const tower = new THREE.Mesh(towerGeo, towerMat);
    tower.position.y = 35;
    lighthouseGroup.add(tower);

    // Glowing Lamp Center
    const bulbGeo = new THREE.SphereGeometry(8, 16, 16);
    const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffea00 }); // VISIBLE YELLOW
    const bulbMesh = new THREE.Mesh(bulbGeo, bulbMat);
    bulbMesh.position.y = 75; // At top
    lighthouseGroup.add(bulbMesh);

    // Strong Point Light for environment
    const beaconLight = new THREE.PointLight(0xffea00, 3, 400);
    beaconLight.position.y = 75;
    lighthouseGroup.add(beaconLight);

    scene3d.add(lighthouseGroup);

    // 5. Rocks to Avoid
    rocksGroup = new THREE.Group();
    const rockMat = new THREE.MeshLambertMaterial({ color: 0x111827 }); // dark gray
    for (let i = 0; i < 35; i++) {
        const h = 25 + Math.random() * 50;
        const rGeo = new THREE.ConeGeometry(6 + Math.random() * 6, h, 6);
        const rock = new THREE.Mesh(rGeo, rockMat);
        rock.position.set(
            (Math.random() - 0.5) * 70,
            h / 2 - 4, // embed in water
            -200 - Math.random() * (GAME_LENGTH - 300)
        );
        rocksGroup.add(rock);
    }
    scene3d.add(rocksGroup);

    // 6. 3D Rain
    const rainGeo = new THREE.BufferGeometry();
    const rainCount = 1200;
    const rainPositions = new Float32Array(rainCount * 3);
    for (let i = 0; i < rainCount * 3; i += 3) {
        rainPositions[i] = (Math.random() - 0.5) * 120;
        rainPositions[i + 1] = Math.random() * 80;
        rainPositions[i + 2] = (Math.random() - 0.5) * 200;
    }
    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
    const rainMat = new THREE.PointsMaterial({ color: 0x93c5fd, size: 0.4, transparent: true, opacity: 0.75 });
    rainSystem3d = new THREE.Points(rainGeo, rainMat);
    scene3d.add(rainSystem3d);
}

// 3D Dynamics Loop
function animate3D() {
    if (gameState === 'TITLE' || gameState === 'INTRO_2D' || gameState === 'FINISH') return;

    const time = Date.now() * 0.002;

    // Ocean Waves Displacement Animation
    const oceanCoords = oceanMesh.geometry.attributes.position;
    for (let i = 0; i < oceanCoords.count; i++) {
        const x = oceanCoords.getX(i);
        const z = oceanCoords.getZ(i);
        // Smaller chaotic waves
        const y = Math.sin(x * 0.08 + time) * 2.5 + Math.cos(z * 0.04 + time * 1.4) * 3;
        oceanCoords.setY(i, y);
    }
    oceanCoords.needsUpdate = true;

    // Boat Buoyancy (Calculate Y based on waves under boat centre)
    const waveY = Math.sin(boat3d.position.x * 0.08 + time) * 2.5 + Math.cos(boat3d.position.z * 0.04 + time * 1.4) * 3;
    boat3d.position.y = waveY;
    boat3d.rotation.z = Math.sin(time) * 0.12; // Roll chaotic
    boat3d.rotation.x = Math.cos(time * 1.2) * 0.08; // Pitch chaotic

    // Character Idle Motion
    moe3d.arms.rotation.x = Math.sin(time * 2) * 0.15;
    mcCrack3d.arms.rotation.x = Math.sin(time * 2 + 1) * 0.15;

    // Rain Movement
    rainSystem3d.position.z = camera3d.position.z - 40;
    const rainPos = rainSystem3d.geometry.attributes.position.array;
    for (let i = 1; i < rainPos.length; i += 3) {
        rainPos[i] -= 1.8; // Fall speed
        if (rainPos[i] < 0) rainPos[i] = 80; // Reset top
    }
    rainSystem3d.geometry.attributes.position.needsUpdate = true;

    // Cutscene Camera Directions
    if (gameState === 'CUTSCENE_3D') {
        const beat = activeScript[currentScriptIndex];

        if (beat.cameraMode === "TALK_McCRACK") {
            // Close up of McCrack
            camera3d.position.set(boat3d.position.x - 7, boat3d.position.y + 5, boat3d.position.z + 6);
            camera3d.lookAt(boat3d.position.x, boat3d.position.y + 3.5, boat3d.position.z + 2.5);
        } 
        else if (beat.cameraMode === "TALK_MOE") {
            // Close up of Moe
            camera3d.position.set(boat3d.position.x + 7, boat3d.position.y + 5, boat3d.position.z - 6);
            camera3d.lookAt(boat3d.position.x, boat3d.position.y + 3.5, boat3d.position.z - 2.5);
        }
        else if (beat.cameraMode === "SQUINT_MOE") {
            // Tight Squint Plan
            camera3d.position.set(boat3d.position.x + 3, boat3d.position.y + 4.5, boat3d.position.z - 6.5);
            camera3d.lookAt(boat3d.position.x, boat3d.position.y + 3.5, boat3d.position.z - 2.5);
            moe3d.rotation.x = -0.25; // animation lean forward
        }
        else if (beat.cameraMode === "STAND_McCRACK") {
            moe3d.rotation.x = 0;
            // animation stand up
            mcCrack3d.position.y = 1.7 + Math.abs(Math.sin(time * 6) * 0.25);
            mcCrack3d.rotation.x = -0.3; // leaning back slightly chaotic
            camera3d.position.set(boat3d.position.x, boat3d.position.y + 6, boat3d.position.z + 8.5);
            camera3d.lookAt(boat3d.position.x, boat3d.position.y + 4, boat3d.position.z + 2);
        }
        else if (beat.cameraMode === "LOOK_AT_LIGHT") {
            mcCrack3d.position.y = 1.5;
            mcCrack3d.rotation.x = 0;
            // Boat far away in the storm view toward light
            camera3d.position.set(boat3d.position.x, boat3d.position.y + 7, boat3d.position.z + 16);
            camera3d.lookAt(0, 20, -GAME_LENGTH);
        }
    } 
    else if (gameState === 'GAMEPLAY_3D') {
        boatZ -= 1.1; // Forward speed

        // Steering Input
        if (inputs.left) boatX += 0.45;
        if (inputs.right) boatX -= 0.45;

        // Clamp
        boatX = Math.max(-28, Math.min(28, boatX));

        boat3d.position.z = boatZ;
        boat3d.position.x = boatX;

        // Third person follow camera
        camera3d.position.set(boatX, boat3d.position.y + 8, boatZ + 18);
        camera3d.lookAt(boatX, boat3d.position.y + 2.5, boatZ - 15);

        // Rock Collision Detection
        const boatBox = new THREE.Box3().setFromObject(boat3d);
        rocksGroup.children.forEach(rock => {
            const rockBox = new THREE.Box3().setFromObject(rock);
            if (boatBox.intersectsBox(rockBox)) {
                // Hti rock - knock boat back
                boatZ += 40;
                boatX = 0;
                if (audioCtx) playAdvanceSound();
            }
        });

        // Win Condition Trigger Clear
        if (boatZ < -GAME_LENGTH + 30) {
            gameState = 'FINISH';
            fadeOverlay.style.opacity = '1';
            dialogueBox.style.display = 'none';
            gameplayHud.classList.add('hidden');
            setTimeout(() => { alert("Refuge Reached! Chapter I Complete."); }, 1800);
        }
    }

    renderer3d.render(scene3d, camera3d);
}

// =========================================================================
// --- GAME LOOP & HANDLERS ---
// =========================================================================
function loop() {
    frameCount++;

    if (gameState === 'TITLE' || gameState === 'INTRO_2D') {
        ctx.clearRect(0, 0, 800, 600); // Clear 2D stage
        const sceneType = gameState === 'TITLE' ? "BURNING_VILLAGE" : activeScript[currentScriptIndex].scene;
        render2DScene(sceneType);
    } 
    else if (gameState === 'CUTSCENE_3D' || gameState === 'GAMEPLAY_3D') {
        ctx.clearRect(0, 0, 800, 600); // 2D canvas pure overlay
        animate3D();
    }

    requestAnimationFrame(loop);
}

function triggerNextBeat() {
    if (!isAudioInitialized) { initAudio(); return; }

    if (gameState === 'TITLE') {
        playStartSound();
        titleScreen.classList.add('hidden');
        dialogueBox.style.display = 'block';
        gameState = 'INTRO_2D';
        advanceScript();
    } 
    else if (gameState === 'INTRO_2D' || gameState === 'CUTSCENE_3D') {
        if (isTyping) {
            clearInterval(typeTimer); speechEl.textContent = currentText; isTyping = false;
        } else {
            playAdvanceSound();
            currentScriptIndex++;
            if (currentScriptIndex < activeScript.length) {
                advanceScript();
            } else {
                handleSequenceEnd();
            }
        }
    }
}

function handleSequenceEnd() {
    if (gameState === 'INTRO_2D') {
        fadeOverlay.style.opacity = '1';
        dialogueBox.style.display = 'none';
        
        setTimeout(() => {
            init3DEngine();
            gameState = 'CUTSCENE_3D';
            activeScript = script3D;
            currentScriptIndex = 0;
            dialogueBox.style.display = 'block';
            fadeOverlay.style.opacity = '0';
            advanceScript();
        }, 1500);
    } 
    else if (gameState === 'CUTSCENE_3D') {
        // Enter Gameplay
        dialogueBox.style.display = 'none';
        gameplayHud.classList.remove('hidden');
        fadeOverlay.style.opacity = '0';
        gameState = 'GAMEPLAY_3D';
    }
}

function advanceScript() {
    const beat = activeScript[currentScriptIndex];
    drawPortrait2D(beat.speaker, beat.expression);
    typeWriter(beat.text);
}

// Input Listeners
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
        if (gameState === 'GAMEPLAY_3D') return; // Space does nothing in gameplay
        triggerNextBeat();
    }
    
    // Gameplay keys (Arrows + WASD)
    if (gameState === 'GAMEPLAY_3D') {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') inputs.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') inputs.right = true;
    }
});

window.addEventListener('keyup', (e) => {
    if (gameState === 'GAMEPLAY_3D') {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') inputs.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') inputs.right = false;
    }
});

// Click listener on container triggers sound initialization and next beat
document.getElementById('game-container').addEventListener('click', () => {
    if (gameState !== 'GAMEPLAY_3D' && gameState !== 'FINISH') {
        triggerNextBeat();
    }
});

// Start loop
loop();
</script>
