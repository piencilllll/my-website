<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawm: Far From Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030206;
            color: #d1d5db;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #000;
            border: 3px solid #2d2b38;
            border-radius: 4px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 15px rgba(139, 92, 246, 0.2);
            overflow: hidden;
        }

        /* Canvas Layering: 3D on bottom, 2D UI on top */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated; /* PS1 crispness */
        }

        #stage2d {
            z-index: 5; /* Above 3D scene */
            pointer-events: none; /* Let clicks pass through to container */
        }

        #stage3d {
            z-index: 1; /* Background */
        }

        /* Scanlines Overlay */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* Title Screen UI */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            background: radial-gradient(circle, rgba(15, 12, 25, 0.75) 0%, rgba(3, 2, 6, 0.95) 100%);
            transition: opacity 1.5s ease;
        }

        .title-logo {
            font-size: 54px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 12px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5), 4px 4px 0px #ff0055, -2px -2px 0px #00e5ff;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: #a78bfa;
            letter-spacing: 6px;
            margin-bottom: 60px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(167, 139, 250, 0.6);
        }

        .prompt-text {
            font-size: 13px;
            color: #d4d4d8;
            letter-spacing: 2px;
            animation: pulse 1.6s infinite ease-in-out;
            cursor: pointer;
            text-align: center;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border: 1px solid #3f3f46;
            border-radius: 4px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* Dialogue Box - Authentic Undertale Style */
        #dialogue-container {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 720px;
            height: 155px;
            background: #000;
            border: 5px solid #fff;
            border-radius: 6px;
            padding: 16px;
            z-index: 20;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            pointer-events: auto; /* Re-enable pointer events for clicking 'next' */
        }

        #portrait-canvas {
            width: 110px;
            height: 110px;
            background: #050508;
            border: 2px solid #222;
            image-rendering: pixelated;
            flex-shrink: 0;
        }

        .text-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .dialogue-text {
            font-size: 20px;
            line-height: 1.4;
            color: #fff;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .next-prompt {
            align-self: flex-end;
            font-size: 12px;
            color: #888;
            animation: pulse 1s infinite;
            font-weight: bold;
        }

        /* Gameplay HUD */
        #gameplay-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 25;
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
        }

        .hidden {
            display: none !important;
        }

        /* Cinematic Overlay Blackout */
        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 30;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
    </style>

    <!-- Three.js Library for 3D Sequence -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
    <div class="scanlines"></div>
    
    <!-- 3D Layer -->
    <canvas id="stage3d"></canvas>
    
    <!-- 2D Layer (Intro + UI) -->
    <canvas id="stage2d" width="800" height="600"></canvas>

    <div id="fade-overlay"></div>

    <!-- Gameplay HUD -->
    <div id="gameplay-hud" class="hidden">
        CONTROLS: [WASD] or [ARROWS] to steer.<br>
        Avoid the rocks! Reach the light!
    </div>

    <!-- Title / Start Screen -->
    <div id="title-screen" class="ui-layer">
        <div class="title-logo">KAWM</div>
        <div class="subtitle">FAR FROM HOME</div>
        <div id="start-prompt" class="prompt-text">[ CLICK ANYWHERE TO ACTIVATE AUDIO ]<br><span style="font-size:10px; color: #888;">(Browsers block audio until user interaction)</span></div>
    </div>

    <!-- Intro Cutscene Dialogue UI - Undertale Style -->
    <div id="dialogue-container" class="hidden">
        <canvas id="portrait-canvas" width="55" height="55"></canvas>
        <div class="text-area">
            <div id="speech" class="dialogue-text"></div>
            <div class="next-prompt">[ PRESS SPACE ]</div>
        </div>
    </div>
</div>

<script>
// --- Web Audio API Setup ---
let audioCtx = null;
let isAudioInitialized = false;

function initAudio() {
    if (isAudioInitialized) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        isAudioInitialized = true;
        document.getElementById('start-prompt').innerHTML = "[ PRESS ANY KEY OR CLICK TO EMBARK ]";
    } catch (e) {
        console.error("Web Audio API not supported.");
    }
}

// Procedural Retro Sound Generators
function playTextBeep(speaker) {
    if (!audioCtx || !isAudioInitialized) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'square';
    
    if (speaker === 'Moe') {
        osc.frequency.setValueAtTime(190 + Math.random() * 25, audioCtx.currentTime);
    } else if (speaker === 'McCrack') {
        osc.frequency.setValueAtTime(360 + Math.random() * 40, audioCtx.currentTime);
    } else {
        osc.frequency.setValueAtTime(110, audioCtx.currentTime);
    }

    gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.035);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.035);
}

function playAdvanceSound() {
    if (!audioCtx || !isAudioInitialized) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(260, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(520, audioCtx.currentTime + 0.07);

    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.07);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.07);
}

function playStartSound() {
    if (!audioCtx || !isAudioInitialized) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(360, audioCtx.currentTime + 0.45);

    gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.45);
}

// =========================================================================
// --- 2D CANVAS ENGINE (FIRST PART - DO NOT MESS UP) ---
// =========================================================================
const canvas = document.getElementById('stage2d');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Portrait Canvas Setup
const portraitCanvas = document.getElementById('portrait-canvas');
const pCtx = portraitCanvas.getContext('2d');
pCtx.imageSmoothingEnabled = false;

// UI Handles
const titleScreen = document.getElementById('title-screen');
const dialogueBox = document.getElementById('dialogue-container');
const speechEl = document.getElementById('speech');
const fadeOverlay = document.getElementById('fade-overlay');
const gameplayHud = document.getElementById('gameplay-hud');

// Game States
// TITLE, INTRO_2D, TRANSITION_TO_3D, CUTSCENE_3D, GAMEPLAY_3D, FINISH
let gameState = 'TITLE'; 
let frameCount = 0;

// Rain Particles Array (2D)
const rainDrops2D = [];
for (let i = 0; i < 90; i++) {
    rainDrops2D.push({
        x: Math.random() * 800,
        y: Math.random() * 600,
        length: Math.random() * 18 + 12,
        speed: Math.random() * 10 + 14
    });
}

// Script Sequences
const script2D = [
    { speaker: "NARRATOR", expression: "none", text: "The sky over our village didn't turn black from the night...", scene: "BURNING_VILLAGE" },
    { speaker: "NARRATOR", expression: "none", text: "It turned black from smoke. The attack happened without warning. Fire consumed the timber and kinetic towers.", scene: "BURNING_VILLAGE" },
    { speaker: "McCrack", expression: "worried", text: "Moe! Hurry up! The dock is collapsing! We have to cast off right now!", scene: "ESCAPE_DOCK" },
    { speaker: "Moe", expression: "determined", text: "Hold on! The ropes are jammed—McCrack, grab the wooden oars!", scene: "ESCAPE_DOCK" },
    { speaker: "NARRATOR", expression: "none", text: "We pushed off into the dark expanse of the Kawm Ocean, leaving behind the only life we had ever known.", scene: "OCEAN_DRIFT" }
];

const script3D = [
    { speaker: "McCrack", expression: "neutral", text: "Moe... do you think... anyone else made it out?", cameraMode: "TALK_McCRACK" },
    { speaker: "Moe", expression: "neutral", text: "...I don't know. But we can't look back now. We have to find a new home.", cameraMode: "TALK_MOE" },
    { speaker: "Moe", expression: "squint", text: "Wait... hold on. Do you see that?", cameraMode: "SQUINT_MOE" },
    { speaker: "Moe", expression: "determined", text: "There's a light! McCrack, look! Over there through the fog!", cameraMode: "SQUINT_MOE" },
    { speaker: "McCrack", expression: "worried", text: "Woah! It is! It's a beacon!", cameraMode: "STAND_McCRACK" },
    { speaker: "McCrack", expression: "neutral", text: "Grab the oars, Moe! We have to steer through this storm to get to it!", cameraMode: "LOOK_AT_LIGHT" }
];

let activeScript = script2D;
let currentScriptIndex = 0;

// Typewriter Effect
let typeIndex = 0;
let isTyping = false;
let currentText = "";
let typeTimer = null;

function typeWriter(text, cb) {
    speechEl.textContent = "";
    typeIndex = 0;
    isTyping = true;
    currentText = text;
    const currentBeat = activeScript[currentScriptIndex];

    clearInterval(typeTimer);
    typeTimer = setInterval(() => {
        if (typeIndex < text.length) {
            speechEl.textContent += text.charAt(typeIndex);
            if (text.charAt(typeIndex) !== ' ') playTextBeep(currentBeat.speaker);
            typeIndex++;
        } else {
            clearInterval(typeTimer);
            isTyping = false;
            if (cb) cb();
        }
    }, 38);
}

// --- 2D Drawing Utilities ---
function drawKawmlingStage2D(x, y, scale = 1, hat = 'none', facing = 1, pose = 'standing') {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(facing * scale, scale);
    ctx.strokeStyle = '#ffffff'; ctx.fillStyle = '#ffffff';
    const bodyWidth = 12; const limbWidth = 9;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // Head
    ctx.beginPath(); ctx.arc(0, -48, 16, 0, Math.PI * 2); ctx.fill();

    if (pose === 'sitting') {
        ctx.lineWidth = bodyWidth; ctx.beginPath(); ctx.moveTo(0, -32); ctx.lineTo(0, 5); ctx.stroke();
        ctx.lineWidth = limbWidth;
        ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(12, -8); ctx.lineTo(18, 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(18, 5); ctx.lineTo(22, 22); ctx.stroke();
    } else {
        ctx.lineWidth = bodyWidth; ctx.beginPath(); ctx.moveTo(0, -32); ctx.lineTo(0, 10); ctx.stroke();
        ctx.lineWidth = limbWidth;
        ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(-14, -6); ctx.moveTo(0, -22); ctx.lineTo(14, -6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(-12, 36); ctx.moveTo(0, 10); ctx.lineTo(12, 36); ctx.stroke();
    }

    // Eyes
    ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.arc(4, -48, 2.5, 0, Math.PI * 2); ctx.arc(10, -48, 2.5, 0, Math.PI * 2); ctx.fill();

    // Hats
    if (hat === 'durag') {
        ctx.fillStyle = '#2563eb'; ctx.beginPath(); ctx.arc(0, -48, 17.5, Math.PI, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-16, -48); ctx.lineTo(-24, -36); ctx.lineTo(-12, -40); ctx.fill();
    } else if (hat === 'paperboat') {
        ctx.fillStyle = '#f4f4f5'; ctx.beginPath(); ctx.moveTo(-20, -60); ctx.lineTo(20, -60); ctx.lineTo(12, -50); ctx.lineTo(-12, -50);
        ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-8, -60); ctx.lineTo(0, -74); ctx.lineTo(8, -60); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#a1a1aa'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, -74); ctx.lineTo(0, -50); ctx.stroke();
    }
    ctx.restore();
}

function drawPortrait2D(speaker, expression) {
    pCtx.clearRect(0, 0, portraitCanvas.width, portraitCanvas.height);
    if (speaker === 'NARRATOR') return;
    pCtx.fillStyle = '#ffffff';
    const centerX = portraitCanvas.width / 2; const centerY = portraitCanvas.height / 2 + 6; const headRad = 19;
    pCtx.beginPath(); pCtx.arc(centerX, centerY, headRad, 0, Math.PI * 2); pCtx.fill();

    if (speaker === 'Moe') {
        pCtx.fillStyle = '#2563eb';
        pCtx.beginPath(); pCtx.arc(centerX, centerY, headRad + 1.5, Math.PI, Math.PI * 2); pCtx.fill();
        pCtx.beginPath(); pCtx.moveTo(centerX - headRad, centerY); pCtx.lineTo(centerX - headRad - 7, centerY + 12); pCtx.lineTo(centerX - headRad + 2, centerY + 9); pCtx.fill();
    } else if (speaker === 'McCrack') {
        pCtx.fillStyle = '#f4f4f5';
        pCtx.beginPath(); pCtx.moveTo(centerX - 22, centerY - headRad - 2); pCtx.lineTo(centerX + 22, centerY - headRad - 2); pCtx.lineTo(centerX + 13, centerY - headRad + 9); pCtx.lineTo(centerX - 13, centerY - headRad + 9); pCtx.closePath(); pCtx.fill();
        pCtx.beginPath(); pCtx.moveTo(centerX - 9, centerY - headRad - 2); pCtx.lineTo(centerX, centerY - headRad - 16); pCtx.lineTo(centerX + 9, centerY - headRad - 2); pCtx.closePath(); pCtx.fill();
    }

    pCtx.fillStyle = '#000000'; pCtx.strokeStyle = '#000000'; pCtx.lineWidth = 2.5;

    // Standard eyes vs Squinting eyes (for 3D part)
    if (expression === 'squint') {
        pCtx.fillRect(centerX - 12, centerY - 2, 8, 2); // Left Squint
        pCtx.fillRect(centerX + 4, centerY - 2, 8, 2);  // Right Squint
    } else {
        pCtx.fillRect(centerX - 10, centerY - 2, 4, 6);
        pCtx.fillRect(centerX + 6, centerY - 2, 4, 6);
    }

    pCtx.beginPath();
    if (expression === 'worried') {
        pCtx.moveTo(centerX - 12, centerY - 11); pCtx.lineTo(centerX - 5, centerY - 7);
        pCtx.moveTo(centerX + 12, centerY - 11); pCtx.lineTo(centerX + 5, centerY - 7);
    } else if (expression === 'determined' || expression === 'squint') {
        pCtx.moveTo(centerX - 12, centerY - 7); pCtx.lineTo(centerX - 5, centerY - 11);
        pCtx.moveTo(centerX + 12, centerY - 7); pCtx.lineTo(centerX + 5, centerY - 11);
    } else { // neutral
        pCtx.moveTo(centerX - 12, centerY - 9); pCtx.lineTo(centerX - 5, centerY - 9);
        pCtx.moveTo(centerX + 12, centerY - 9); pCtx.lineTo(centerX + 5, centerY - 9);
    }
    pCtx.stroke();
}

function drawBoat2D(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#1c1310'; ctx.beginPath(); ctx.moveTo(-70, -5); ctx.lineTo(70, -5); ctx.lineTo(50, 32); ctx.lineTo(-50, 32); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a2720'; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = '#0d0806'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-60, 10); ctx.lineTo(60, 10); ctx.moveTo(-55, 22); ctx.lineTo(55, 22); ctx.stroke();
    ctx.restore();
}

function drawRain2D() {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < rainDrops2D.length; i++) {
        let drop = rainDrops2D[i]; ctx.moveTo(drop.x, drop.y); ctx.lineTo(drop.x - 3, drop.y + drop.length);
        drop.y += drop.speed; drop.x -= 1.5;
        if (drop.y > 600) { drop.y = -20; drop.x = Math.random() * 850; }
    }
    ctx.stroke();
}

function render2DScene(sceneType) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (sceneType === 'BURNING_VILLAGE') {
        let grad = ctx.createLinearGradient(0, 0, 0, 600); grad.addColorStop(0, '#0a0305'); grad.addColorStop(0.6, '#28080a'); grad.addColorStop(1, '#520e0e');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#050203'; ctx.fillRect(80, 280, 90, 140); ctx.fillRect(200, 220, 130, 200); ctx.fillRect(480, 250, 110, 170);
        for (let i = 0; i < 45; i++) {
            let px = (Math.sin(i * 99 + frameCount * 0.015) * 0.5 + 0.5) * canvas.width;
            let py = ((frameCount * (1 + i * 0.08) + i * 40) % 450);
            ctx.fillStyle = i % 2 === 0 ? '#ff3300' : '#ffb703'; ctx.fillRect(px, 500 - py, 3, 3);
        }
    } 
    else if (sceneType === 'ESCAPE_DOCK') {
        let grad = ctx.createLinearGradient(0, 0, 0, 600); grad.addColorStop(0, '#0a0712'); grad.addColorStop(0.7, '#1f0d1b'); grad.addColorStop(1, '#3a111a');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#171210'; ctx.fillRect(0, 410, 360, 190);
        ctx.strokeStyle = '#2d221e'; ctx.lineWidth = 4;
        for (let x = 0; x < 360; x += 30) ctx.strokeRect(x, 410, 30, 190);
        ctx.fillStyle = '#050914'; ctx.fillRect(360, 430, 440, 170);
        drawBoat2D(480, 425);
        drawKawmlingStage2D(260, 375, 1.15, 'durag', 1, 'standing');
        drawKawmlingStage2D(480, 395, 1.05, 'paperboat', -1, 'standing');
    } 
    else if (sceneType === 'OCEAN_DRIFT') {
        let grad = ctx.createLinearGradient(0, 0, 0, 600); grad.addColorStop(0, '#010206'); grad.addColorStop(0.6, '#080d1a'); grad.addColorStop(1, '#111827');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        let waveOffset = Math.sin(frameCount * 0.03) * 6;
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(0, 380 + waveOffset);
        for (let x = 0; x <= canvas.width; x += 40) ctx.lineTo(x, 380 + Math.sin(x * 0.02 + frameCount * 0.04) * 8 + waveOffset);
        ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height); ctx.fill();
        let boatY = 380 + waveOffset; let boatRot = Math.sin(frameCount * 0.02) * 0.04;
        ctx.save(); ctx.translate(400, boatY); ctx.rotate(boatRot); drawBoat2D(0, 0);
        drawKawmlingStage2D(-22, -18, 1.05, 'durag', 1, 'sitting');
        drawKawmlingStage2D(22, -18, 1.0, 'paperboat', -1, 'sitting'); ctx.restore();
        drawRain2D();
    }
}

// =========================================================================
// --- 3D THREE.JS ENGINE (SECOND PART - THE REQUEST) ---
// =========================================================================
let scene3d, camera3d, renderer3d, ocean3d, boat3d, moe3d, mcCrack3d, beacon3d, rocks3d;
let rainSystem3d;

// Gameplay state
let boatX = 0;
let boatZ = 0;
let inputs = { left: false, right: false };
const GAME_LENGTH = 1500; // Total Z distance to reach lighthouse

function init3DSequence() {
    // Canvas setup
    const stage3d = document.getElementById('stage3d');
    
    // Renderer with PS1 resolution scaling
    renderer3d = new THREE.WebGLRenderer({ canvas: stage3d, antialias: false });
    renderer3d.setSize(800, 600);
    renderer3d.setPixelRatio(0.4); // Downscale for pixelation

    scene3d = new THREE.Scene();
    scene3d.background = new THREE.Color(0x010206);
    scene3d.fog = new THREE.FogExp2(0x010206, 0.012); // Dense fog

    // Camera
    camera3d = new THREE.PerspectiveCamera(60, 800 / 600, 0.1, 1000);

    // Lights
    const ambientLight = new THREE.AmbientLight(0x222244, 0.5);
    scene3d.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.3);
    directionalLight.position.set(10, 20, 10);
    scene3d.add(directionalLight);

    // -- Create Objects --

    // 1. White Waves Ocean
    const oceanGeo = new THREE.PlaneGeometry(200, 2000, 50, 200); // Tessellated for vertex waves
    oceanGeo.rotateX(-Math.PI / 2);
    const oceanMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); // Bright white
    ocean3d = new THREE.Mesh(oceanGeo, oceanMat);
    scene3d.add(ocean3d);

    // 2. The Boat
    boat3d = new THREE.Group();
    const hullGeo = new THREE.BoxGeometry(4, 2, 10);
    const darkWoodMat = new THREE.MeshLambertMaterial({ color: 0x1c1310 });
    const hull = new THREE.Mesh(hullGeo, darkWoodMat);
    hull.position.y = 1;
    boat3d.add(hull);
    scene3d.add(boat3d);

    // 3. The Characters (Stick figures with thickness)
    function createKawmling3D(hatType) {
        const group = new THREE.Group();
        const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const limbGeo = new THREE.CylinderGeometry(0.15, 0.15, 2, 6); // Thicker limbs

        // Head
        const headGeo = new THREE.SphereGeometry(0.7, 8, 8);
        const head = new THREE.Mesh(headGeo, whiteMat);
        head.position.y = 3;
        group.add(head);

        // Eyes (Black)
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const eyeGeo = new THREE.BoxGeometry(0.15, 0.25, 0.1);
        const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.25, 3.1, 0.6);
        const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(0.25, 3.1, 0.6);
        group.add(eyeL, eyeR);

        // Body
        const bodyGeo = new THREE.CylinderGeometry(0.3, 0.3, 2, 8);
        const body = new THREE.Mesh(bodyGeo, whiteMat);
        body.position.y = 1.5;
        group.add(body);

        // Arm container (for rotation)
        group.arms = new THREE.Group();
        group.arms.position.y = 2.2;
        group.add(group.arms);

        const armL = new THREE.Mesh(limbGeo, whiteMat); armL.position.set(-0.5, -0.8, 0); armL.rotation.z = Math.PI / 8;
        const armR = new THREE.Mesh(limbGeo, whiteMat); armR.position.set(0.5, -0.8, 0); armR.rotation.z = -Math.PI / 8;
        group.arms.add(armL, armR);

        // Hat
        if (hatType === 'durag') {
            const duragMat = new THREE.MeshBasicMaterial({ color: 0x2563eb });
            const duragGeo = new THREE.SphereGeometry(0.75, 8, 8, 0, Math.PI * 2, 0, Math.PI / 2);
            const durag = new THREE.Mesh(duragGeo, duragMat);
            durag.position.y = 3.05;
            group.add(durag);
        } else if (hatType === 'paperboat') {
            const boatMat = new THREE.MeshBasicMaterial({ color: 0xf4f4f5 });
            const pBoatGeo = new THREE.ConeGeometry(0.9, 0.7, 4);
            const pBoatHat = new THREE.Mesh(pBoatGeo, boatMat);
            pBoatHat.position.y = 3.9;
            pBoatHat.rotation.y = Math.PI/4;
            group.add(pBoatHat);
        }

        return group;
    }

    moe3d = createKawmling3D('durag');
    moe3d.position.set(0, 1.5, -2); // Front seat
    boat3d.add(moe3d);

    mcCrack3d = createKawmling3D('paperboat');
    mcCrack3d.position.set(0, 1.5, 2); // Back seat
    mcCrack3d.rotation.y = Math.PI; // Face Moe
    boat3d.add(mcCrack3d);

    // 4. Lighthouse Beacon
    beacon3d = new THREE.Group();
    beacon3d.position.set(0, 0, -GAME_LENGTH); // far away

    const towerGeo = new THREE.CylinderGeometry(5, 8, 60, 8);
    const towerMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
    const tower = new THREE.Mesh(towerGeo, towerMat);
    tower.position.y = 30;
    beacon3d.add(tower);

    // **THE LIGHT** (Crucial fix - make it bright and unlit)
    const bulbGeo = new THREE.SphereGeometry(6, 16, 16);
    const bulbMat = new THREE.MeshBasicMaterial({ color: 0xfff08a }); // Bright yellow unlit
    const bulb = new THREE.Mesh(bulbGeo, bulbMat);
    bulb.position.y = 65; // At top
    beacon3d.add(bulb);
    
    // Gameplay point light
    const pointLight = new THREE.PointLight(0xfff08a, 2, 200);
    pointLight.position.y = 65;
    beacon3d.add(pointLight);

    scene3d.add(beacon3d);

    // 5. Rocks to dodge
    rocks3d = new THREE.Group();
    const rockMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
    for(let i=0; i<30; i++) {
        const height = 20 + Math.random() * 60;
        const geo = new THREE.ConeGeometry(8 + Math.random()*5, height, 5);
        const rock = new THREE.Mesh(geo, rockMat);
        // Space them along the path
        rock.position.set(
            (Math.random() - 0.5) * 60, 
            height/2 - 5, // embed in water
            -300 - (Math.random() * (GAME_LENGTH - 400))
        );
        rocks3d.add(rock);
    }
    scene3d.add(rocks3d);

    // 6. 3D Rain
    const rainGeo = new THREE.BufferGeometry();
    const rainCount = 1500;
    const vertices = new Float32Array(rainCount * 3);
    for (let i = 0; i < rainCount * 3; i += 3) {
        vertices[i] = (Math.random() - 0.5) * 100;
        vertices[i + 1] = Math.random() * 100;
        vertices[i + 2] = (Math.random() - 0.5) * 200;
    }
    rainGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    const rainMat = new THREE.PointsMaterial({ color: 0xaaaaaa, size: 0.3, transparent: true });
    rainSystem3d = new THREE.Points(rainGeo, rainMat);
    scene3d.add(rainSystem3d);
}

// --- 3D Animation Logic ---
function animate3D() {
    const time = Date.now() * 0.002;

    // 1. Vertex Wave Animation (Ocean + Boat Physics)
    const oceanCoords = ocean3d.geometry.attributes.position;
    for (let i = 0; i < oceanCoords.count; i++) {
        const x = oceanCoords.getX(i);
        const z = oceanCoords.getZ(i);
        // Large chaotic waves
        const y = Math.sin(x * 0.1 + time) * 3 + Math.cos(z * 0.05 + time * 1.5) * 4;
        oceanCoords.setY(i, y);
    }
    oceanCoords.needsUpdate = true;

    // Get wave height under boat centre
    const boatY = Math.sin(boat3d.position.x * 0.1 + time) * 3 + Math.cos(boat3d.position.z * 0.05 + time * 1.5) * 4;
    boat3d.position.y = boatY;
    boat3d.rotation.z = Math.sin(time) * 0.15; // Chaotic Roll
    boat3d.rotation.x = Math.cos(time * 1.2) * 0.1; // Chaotic Pitch

    // 2. Character Basic Animation (Chaotic idle)
    moe3d.arms.rotation.x = Math.sin(time * 2) * 0.2;
    mcCrack3d.arms.rotation.x = Math.sin(time * 2 + 1) * 0.2;

    // 3. Rain particles follow camera Z
    rainSystem3d.position.z = camera3d.position.z - 50;
    const rainVertices = rainSystem3d.geometry.attributes.position.array;
    for (let i = 1; i < rainVertices.length; i += 3) {
        rainVertices[i] -= 2; // Fall speed
        if (rainVertices[i] < 0) rainVertices[i] = 100; // Reset top
    }
    rainSystem3d.geometry.attributes.position.needsUpdate = true;

    // 4. Cutscene / Gameplay Logic
    if (gameState === 'CUTSCENE_3D') {
        const beat = script3D[currentScriptIndex];
        
        if (beat.cameraMode === "TALK_McCRACK") {
            // McCrack profile
            camera3d.position.set(boat3d.position.x - 6, boat3d.position.y + 6, boat3d.position.z + 5);
            camera3d.lookAt(boat3d.position.x, boat3d.position.y + 4, boat3d.position.z + 2);
        } 
        else if (beat.cameraMode === "TALK_MOE") {
            // Moe profile
            camera3d.position.set(boat3d.position.x + 6, boat3d.position.y + 6, boat3d.position.z - 5);
            camera3d.lookAt(boat3d.position.x, boat3d.position.y + 4, boat3d.position.z - 2);
        }
        else if (beat.cameraMode === "SQUINT_MOE") {
            // **Fix scene 2**: Close up of Moe, seeing face/body, squinting, animated notice
            camera3d.position.set(boat3d.position.x, boat3d.position.y + 5, boat3d.position.z - 6);
            camera3d.lookAt(boat3d.position.x, boat3d.position.y + 4, boat3d.position.z - 2);
            // Animation notice: Leans forward
            moe3d.rotation.x = -0.3;
        }
        else if (beat.cameraMode === "STAND_McCRACK") {
            moe3d.rotation.x = 0; // Moe resets
            // animation stand up, slightly falling
            mcCrack3d.position.y = 1.6 + Math.abs(Math.sin(time*5)*0.3); // Stumbling stand
            mcCrack3d.rotation.x = -0.4; // leaning back
            camera3d.position.set(boat3d.position.x, boat3d.position.y + 7, boat3d.position.z + 8);
            camera3d.lookAt(boat3d.position.x, boat3d.position.y + 5, boat3d.position.z + 2);
        }
        else if (beat.cameraMode === "LOOK_AT_LIGHT") {
            mcCrack3d.position.y = 1.5; mcCrack3d.rotation.x = 0; // McCrack sits
            // **Fix scene 3**: Show boat and beacon far away in fog
            camera3d.position.set(boat3d.position.x, boat3d.position.y + 8, boat3d.position.z + 20);
            camera3d.lookAt(0, 10, -GAME_LENGTH);
        }
    } 
    else if (gameState === 'GAMEPLAY_3D') {
        // Longer journey mechanics
        boatZ -= 1.0; // Forward speed (Increased)
        
        // Steering
        if(inputs.left) boatX += 0.4;
        if(inputs.right) boatX -= 0.4;
        
        // Clamp position
        boatX = Math.max(-25, Math.min(25, boatX));

        boat3d.position.z = boatZ;
        boat3d.position.x = boatX;

        // Third person follow camera
        camera3d.position.set(boatX, boat3d.position.y + 8, boatZ + 18);
        camera3d.lookAt(boatX, boat3d.position.y + 2, boatZ - 15);

        // Simple collision check with rocks
        const boatBB = new THREE.Box3().setFromObject(boat3d);
        rocks3d.children.forEach(rock => {
            const rockBB = new THREE.Box3().setFromObject(rock);
            if(boatBB.intersectsBox(rockBB)) {
                // Hti rock - Reset slightly back and center
                boatZ += 50;
                boatX = 0;
                if(audioCtx) playAdvanceSound(); // rough sound placeholder
            }
        });

        // Win Condition
        if (boatZ < -GAME_LENGTH + 20) {
            gameState = 'FINISH';
            fadeOverlay.style.opacity = '1';
            dialogueBox.classList.add('hidden');
            gameplayHud.classList.add('hidden');
            setTimeout(() => { alert("Refuge Reached! Chapter I Complete."); }, 2000);
        }
    }

    renderer3d.render(scene3d, camera3d);
}

// =========================================================================
// --- COMBINED MAIN LOOP & INPUTS ---
// =========================================================================
function loop() {
    frameCount++;

    if (gameState === 'TITLE' || gameState === 'INTRO_2D') {
        ctx.clearRect(0,0,800,600); // Clear 2D stage
        const sceneType = gameState === 'TITLE' ? "BURNING_VILLAGE" : activeScript[currentScriptIndex].scene;
        render2DScene(sceneType);
    } 
    else if (gameState === 'CUTSCENE_3D' || gameState === 'GAMEPLAY_3D') {
        ctx.clearRect(0,0,800,600); // 2D canvas becomes pure UI overlay
        animate3D();
    }

    requestAnimationFrame(loop);
}

function triggerNextBeat() {
    if (!isAudioInitialized) { initAudio(); return; }

    if (gameState === 'TITLE') {
        playStartSound();
        titleScreen.classList.add('hidden');
        dialogueBox.classList.remove('hidden');
        gameState = 'INTRO_2D';
        advanceScript();
    } 
    else if (gameState === 'INTRO_2D' || gameState === 'CUTSCENE_3D') {
        if (isTyping) {
            clearInterval(typeTimer); speechEl.textContent = currentText; isTyping = false;
        } else {
            playAdvanceSound();
            currentScriptIndex++;
            if (currentScriptIndex < activeScript.length) {
                advanceScript();
            } else {
                handleSequenceEnd();
            }
        }
    }
}

function handleSequenceEnd() {
    if (gameState === 'INTRO_2D') {
        // Transition to 3D
        fadeOverlay.style.opacity = '1';
        dialogueBox.classList.add('hidden');
        
        setTimeout(() => {
            init3DSequence();
            gameState = 'CUTSCENE_3D';
            activeScript = script3D;
            currentScriptIndex = 0;
            dialogueBox.classList.remove('hidden');
            fadeOverlay.style.opacity = '0';
            advanceScript();
        }, 2000);
    } 
    else if (gameState === 'CUTSCENE_3D') {
        // Enter Gameplay
        dialogueBox.classList.add('hidden');
        gameplayHud.classList.remove('hidden');
        fadeOverlay.style.opacity = '0';
        gameState = 'GAMEPLAY_3D';
    }
}

function advanceScript() {
    const beat = activeScript[currentScriptIndex];
    drawPortrait2D(beat.speaker, beat.expression);
    typeWriter(beat.text);
}

// Input Listeners
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
        if (gameState === 'GAMEPLAY_3D') return; // Space does nothing in gameplay
        triggerNextBeat();
    }
    
    // Gameplay keys (Arrows + WASD)
    if (gameState === 'GAMEPLAY_3D') {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') inputs.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') inputs.right = true;
    }
});

window.addEventListener('keyup', (e) => {
    if (gameState === 'GAMEPLAY_3D') {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') inputs.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') inputs.right = false;
    }
});

document.getElementById('game-container').addEventListener('click', () => {
    if (gameState !== 'GAMEPLAY_3D' && gameState !== 'FINISH') triggerNextBeat();
});

// Start loop
loop();
</script>
