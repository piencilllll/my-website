<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW REALM :: COMBAT PROTOCOL</title>
    <style>
        :root {
            --bg: #030712;
            --cyan: #06b6d4;
            --purple: #a855f7;
            --red: #ef4444;
            --amber: #f59e0b;
            --font: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: var(--bg); color: #fff;
            font-family: var(--font);
            display: flex; justify-content: center; align-items: center;
            cursor: none;
        }

        .viewport {
            width: 100vw; height: 100vh; max-width: 1000px; max-height: 650px;
            position: relative; background: #000;
            border: 2px solid #1e293b;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.2);
            display: flex; flex-direction: column; overflow: hidden;
        }

        canvas#gameCanvas { width: 100%; height: 100%; display: block; }

        /* HUD OVERLAY */
        .hud {
            position: absolute; top: 16px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 10;
        }

        .player-stats {
            display: flex; flex-direction: column; gap: 8px; width: 260px;
            background: rgba(15, 23, 42, 0.75); border: 1px solid #334155;
            padding: 12px; border-radius: 6px; backdrop-filter: blur(4px);
        }

        .char-name { font-size: 0.85rem; font-weight: bold; letter-spacing: 2px; }

        .bar-container { width: 100%; height: 10px; background: #0f172a; border-radius: 3px; overflow: hidden; border: 1px solid #1e293b; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.1s linear; }

        .hp-fill { background: linear-gradient(90deg, #10b981, #34d399); }
        .stamina-fill { background: linear-gradient(90deg, #06b6d4, #38bdf8); }

        .mission-card {
            background: rgba(15, 23, 42, 0.75); border: 1px solid #334155;
            padding: 12px; border-radius: 6px; text-align: right;
            backdrop-filter: blur(4px);
        }

        .mission-title { font-size: 0.8rem; color: var(--amber); font-weight: bold; }
        .mission-sub { font-size: 0.7rem; color: #94a3b8; margin-top: 4px; }

        /* DAMAGE FLOATING NUMBERS */
        .overlay-layer { position: absolute; inset: 0; pointer-events: none; z-index: 15; }
    </style>
</head>
<body>

    <div class="viewport">
        <canvas id="gameCanvas"></canvas>

        <div class="hud">
            <div class="player-stats">
                <div class="char-name" id="charName" style="color: var(--cyan);">KAEL (SWIFT DUAL-BLADES)</div>
                <div class="bar-container"><div class="bar-fill hp-fill" id="hpBar"></div></div>
                <div class="bar-container"><div class="bar-fill stamina-fill" id="staminaBar"></div></div>
                <div style="font-size: 0.65rem; color: #64748b; margin-top: 2px;">[TAB] SWITCH CHARACTER</div>
            </div>

            <div class="mission-card">
                <div class="mission-title" id="waveTracker">WAVE 1 / 3</div>
                <div class="mission-sub" id="objectiveText">Defeat all shadow sentinels</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const hpBar = document.getElementById('hpBar');
        const staminaBar = document.getElementById('staminaBar');
        const charName = document.getElementById('charName');
        const waveTracker = document.getElementById('waveTracker');
        const objectiveText = document.getElementById('objectiveText');

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Web Audio Synthesizer
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'slash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
                gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'heavy') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.12, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, now);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'dash') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.12);
                gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            }
        }

        // Custom Mouse Tracker
        const mouse = { x: 0, y: 0 };
        window.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
        });

        // Key Listeners
        const keys = {};
        window.addEventListener('keydown', e => {
            if (e.code === 'Tab') {
                e.preventDefault();
                switchCharacter();
                return;
            }
            keys[e.code] = true;
            if (e.code === 'KeyJ') triggerAttack('light');
            if (e.code === 'KeyK') triggerAttack('heavy');
            if (e.code === 'ShiftLeft' || e.code === 'KeyL') triggerDash();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        window.addEventListener('mousedown', e => {
            if (e.button === 0) triggerAttack('light');
            if (e.button === 2) triggerAttack('heavy');
        });
        window.addEventListener('contextmenu', e => e.preventDefault());

        // Playable Characters Roster
        const characters = [
            {
                id: 'kael', name: 'KAEL (SWIFT DUAL-BLADES)', color: '#06b6d4',
                maxHp: 100, maxStamina: 100, speed: 5.5, jumpPower: 11.5,
                lightDmg: 14, heavyDmg: 28, reach: 55, attackSpeed: 180
            },
            {
                id: 'nyx', name: 'NYX (SHADOW SENTINEL)', color: '#a855f7',
                maxHp: 140, maxStamina: 80, speed: 4.2, jumpPower: 10.5,
                lightDmg: 22, heavyDmg: 45, reach: 75, attackSpeed: 320
            }
        ];

        let activeCharIdx = 0;
        let char = characters[0];

        // Player Entity State
        const player = {
            x: 120, y: 450, vx: 0, vy: 0, w: 26, h: 54,
            hp: 100, stamina: 100,
            dir: 1, grounded: false,
            isAttacking: false, attackType: null, attackTimer: 0,
            isDashing: false, dashTimer: 0, iFrames: 0
        };

        function switchCharacter() {
            activeCharIdx = (activeCharIdx + 1) % characters.length;
            char = characters[activeCharIdx];
            charName.innerText = char.name;
            charName.style.color = char.color;
            player.hp = Math.min(player.hp, char.maxHp);
            playSound('dash');
        }

        // Combat Hitboxes & FX Particles
        const hitboxes = [];
        const particles = [];
        const damageTexts = [];

        function spawnDamageText(x, y, text, color = '#fff') {
            damageTexts.push({ x, y, text, color, alpha: 1, vy: -1.5 });
        }

        function triggerAttack(type) {
            if (player.isAttacking || player.isDashing) return;
            const staminaCost = type === 'light' ? 12 : 25;
            if (player.stamina < staminaCost) return;

            player.stamina -= staminaCost;
            player.isAttacking = true;
            player.attackType = type;
            player.attackTimer = char.attackSpeed / 16;

            const dmg = type === 'light' ? char.lightDmg : char.heavyDmg;
            playSound(type === 'light' ? 'slash' : 'heavy');

            // Spawn Melee Hitbox
            hitboxes.push({
                x: player.x + (player.dir === 1 ? player.w : -char.reach),
                y: player.y + 10,
                w: char.reach, h: player.h - 20,
                dmg: dmg, dir: player.dir, duration: 8, active: true
            });
        }

        function triggerDash() {
            if (player.isDashing || player.stamina < 20) return;
            player.stamina -= 20;
            player.isDashing = true;
            player.dashTimer = 12;
            player.iFrames = 15;
            player.vx = player.dir * 12;
            playSound('dash');
        }

        // Level Geometry
        const platforms = [
            { x: 0, y: 550, w: 1000, h: 100 }, // Floor
            { x: 180, y: 420, w: 180, h: 16 },
            { x: 440, y: 320, w: 200, h: 16 },
            { x: 720, y: 220, w: 180, h: 16 }
        ];

        // Enemy AI System
        let wave = 1;
        const enemies = [];

        function spawnWave(count) {
            enemies.length = 0;
            for (let i = 0; i < count; i++) {
                enemies.push({
                    x: 500 + i * 120, y: 400, w: 30, h: 52,
                    hp: 60 + wave * 20, maxHp: 60 + wave * 20,
                    vx: 0, vy: 0, dir: -1, grounded: false,
                    attackCooldown: 0, isHit: 0, color: '#ef4444'
                });
            }
            waveTracker.innerText = `WAVE ${wave} / 3`;
            objectiveText.innerText = `Enemies Remaining: ${enemies.length}`;
        }
        spawnWave(2);

        // Core Physics & Combat Loop
        function updatePhysics() {
            // Player Movement Controls
            if (!player.isDashing) {
                if (keys['KeyA'] || keys['ArrowLeft']) { player.vx = -char.speed; player.dir = -1; }
                else if (keys['KeyD'] || keys['ArrowRight']) { player.vx = char.speed; player.dir = 1; }
                else { player.vx *= 0.7; }
            }

            if ((keys['KeyW'] || keys['Space'] || keys['ArrowUp']) && player.grounded) {
                player.vy = -char.jumpPower;
                player.grounded = false;
            }

            // Stamina Regeneration
            player.stamina = Math.min(char.maxStamina, player.stamina + 0.35);

            // Timers & iFrames
            if (player.attackTimer > 0) { player.attackTimer--; if (player.attackTimer <= 0) player.isAttacking = false; }
            if (player.dashTimer > 0) { player.dashTimer--; if (player.dashTimer <= 0) player.isDashing = false; }
            if (player.iFrames > 0) player.iFrames--;

            // Player Gravity & Collision
            player.vy += 0.55;
            player.x += player.vx;
            player.y += player.vy;

            player.grounded = false;
            platforms.forEach(p => {
                if (player.x + player.w > p.x && player.x < p.x + p.w) {
                    if (player.y + player.h >= p.y && player.y + player.h <= p.y + p.h && player.vy > 0) {
                        player.y = p.y - player.h;
                        player.vy = 0;
                        player.grounded = true;
                    }
                }
            });
            player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

            // Hitbox Collisions vs Enemies
            for (let i = hitboxes.length - 1; i >= 0; i--) {
                const hb = hitboxes[i];
                hb.duration--;

                enemies.forEach(en => {
                    if (hb.active && hb.x < en.x + en.w && hb.x + hb.w > en.x && hb.y < en.y + en.h && hb.y + hb.h > en.y) {
                        en.hp -= hb.dmg;
                        en.isHit = 8;
                        en.vx = hb.dir * 6; // Knockback
                        spawnDamageText(en.x + 10, en.y - 10, `-${hb.dmg}`, char.color);
                        playSound('hit');

                        // FX Particles
                        for(let p=0; p<6; p++) {
                            particles.push({
                                x: en.x + en.w/2, y: en.y + en.h/2,
                                vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
                                color: char.color, life: 12
                            });
                        }
                    }
                });
                hb.active = false;
                if (hb.duration <= 0) hitboxes.splice(i, 1);
            }

            // Enemy AI & Combat Logic
            enemies.forEach((en, idx) => {
                if (en.hp <= 0) return;

                // AI Chasing logic
                const distToPlayer = player.x - en.x;
                en.dir = distToPlayer > 0 ? 1 : -1;
                if (Math.abs(distToPlayer) > 35 && en.isHit <= 0) {
                    en.vx = en.dir * 2.2;
                } else {
                    en.vx *= 0.8;
                }

                // Enemy Attack
                if (Math.abs(distToPlayer) <= 40 && en.attackCooldown <= 0 && player.iFrames <= 0) {
                    player.hp -= 15;
                    player.iFrames = 20;
                    player.vx = en.dir * 8; // Player knockback
                    spawnDamageText(player.x, player.y - 10, '-15', '#ef4444');
                    playSound('hit');
                    en.attackCooldown = 80;
                }

                if (en.attackCooldown > 0) en.attackCooldown--;
                if (en.isHit > 0) en.isHit--;

                en.vy += 0.55;
                en.x += en.vx;
                en.y += en.vy;

                platforms.forEach(p => {
                    if (en.x + en.w > p.x && en.x < p.x + p.w) {
                        if (en.y + en.h >= p.y && en.y + en.h <= p.y + p.h && en.vy > 0) {
                            en.y = p.y - en.h; en.vy = 0;
                        }
                    }
                });
            });

            // Filter dead enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                if (enemies[i].hp <= 0) enemies.splice(i, 1);
            }

            objectiveText.innerText = `Enemies Remaining: ${enemies.length}`;

            // Wave Progression
            if (enemies.length === 0) {
                wave++;
                if (wave <= 3) {
                    spawnWave(wave + 1);
                } else {
                    waveTracker.innerText = "VICTORY!";
                    objectiveText.innerText = "Area Cleared successfully!";
                }
            }

            // HUD UI Sync
            hpBar.style.width = `${Math.max(0, (player.hp / char.maxHp) * 100)}%`;
            staminaBar.style.width = `${Math.max(0, (player.stamina / char.maxStamina) * 100)}%`;
        }

        // Render Graphics Loop
        function render() {
            ctx.fillStyle = '#030712';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Arena Background
            ctx.strokeStyle = 'rgba(51, 65, 85, 0.3)'; ctx.lineWidth = 1;
            for(let x=0; x<canvas.width; x+=40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }

            // Platforms
            platforms.forEach(p => {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            });

            // Draw Hitbox FX Arc
            hitboxes.forEach(hb => {
                ctx.fillStyle = char.color + '44';
                ctx.fillRect(hb.x, hb.y, hb.w, hb.h);
            });

            // Draw Enemies (Shadow Sentinels)
            enemies.forEach(en => {
                ctx.fillStyle = en.isHit > 0 ? '#fff' : en.color;
                ctx.fillRect(en.x, en.y, en.w, en.h);

                // Enemy Eyes
                ctx.fillStyle = '#000';
                const eyeX = en.dir === 1 ? en.x + 18 : en.x + 4;
                ctx.fillRect(eyeX, en.y + 10, 8, 4);

                // Enemy Health Bar Overlay
                ctx.fillStyle = '#1e293b'; ctx.fillRect(en.x, en.y - 10, en.w, 4);
                ctx.fillStyle = '#ef4444'; ctx.fillRect(en.x, en.y - 10, (en.hp / en.maxHp) * en.w, 4);
            });

            // Draw Playable Character (Kael or Nyx)
            ctx.save();
            if (player.iFrames % 2 === 1) ctx.globalAlpha = 0.5;

            ctx.fillStyle = char.color;
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // Character Details (Head/Visor/Weapon Render)
            ctx.fillStyle = '#000';
            const vX = player.dir === 1 ? player.x + 14 : player.x + 2;
            ctx.fillRect(vX, player.y + 8, 10, 5);

            // Weapon Render
            ctx.strokeStyle = char.color; ctx.lineWidth = 3;
            ctx.beginPath();
            if (char.id === 'kael') { // Dual Blades
                const wX = player.dir === 1 ? player.x + player.w + 10 : player.x - 10;
                ctx.moveTo(player.x + player.w/2, player.y + 20);
                ctx.lineTo(wX, player.y + (player.isAttacking ? 10 : 35));
            } else { // Scythe
                const wX = player.dir === 1 ? player.x + player.w + 20 : player.x - 20;
                ctx.moveTo(player.x + player.w/2, player.y + 45);
                ctx.lineTo(wX, player.y - 10);
            }
            ctx.stroke();
            ctx.restore();

            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                const pt = particles[i];
                pt.x += pt.vx; pt.y += pt.vy; pt.life--;
                ctx.fillStyle = pt.color;
                ctx.fillRect(pt.x, pt.y, 3, 3);
                if (pt.life <= 0) particles.splice(i, 1);
            }

            // Floating Damage Text
            for(let i=damageTexts.length-1; i>=0; i--) {
                const dt = damageTexts[i];
                dt.y += dt.vy; dt.alpha -= 0.03;
                ctx.fillStyle = dt.color;
                ctx.globalAlpha = Math.max(0, dt.alpha);
                ctx.font = 'bold 0.85rem "Courier New"';
                ctx.fillText(dt.text, dt.x, dt.y);
                ctx.globalAlpha = 1;
                if (dt.alpha <= 0) damageTexts.splice(i, 1);
            }

            // Custom Crosshair Cursor
            ctx.strokeStyle = char.color; ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 8, 0, Math.PI*2);
            ctx.moveTo(mouse.x - 12, mouse.y); ctx.lineTo(mouse.x + 12, mouse.y);
            ctx.moveTo(mouse.x, mouse.y - 12); ctx.lineTo(mouse.x, mouse.y + 12);
            ctx.stroke();

            updatePhysics();
            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
