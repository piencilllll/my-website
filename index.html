<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Far From Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlays */
        .overlay {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            transition: opacity 1s ease-in-out;
        }

        h1.title {
            font-size: 4rem;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        .tap-prompt {
            font-size: 1.2rem;
            letter-spacing: 4px;
            animation: blink 1.5s infinite;
            cursor: pointer;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* Cinematic Text Box */
        #cinematic-overlay {
            display: none;
            background: transparent;
            padding: 20px;
        }

        .story-text {
            font-size: 1.5rem;
            line-height: 1.8;
            max-width: 800px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #000, 0 0 15px #000;
            margin-top: auto;
            margin-bottom: 80px;
            min-height: 100px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas layer for pixelated visuals and animations -->
        <canvas id="mainCanvas"></canvas>

        <!-- Main Menu -->
        <div id="menu-overlay" class="overlay">
            <h1 class="title">Far From Home</h1>
            <div class="tap-prompt">TAP ANYWHERE TO START</div>
        </div>

        <!-- Cinematic Overlay -->
        <div id="cinematic-overlay" class="overlay">
            <div id="story-text" class="story-text"></div>
        </div>
    </div>

    <script>
        // --- CANVAS SETUP & PIXEL ART GRAPHICS ---
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Scene States: 'MENU', 'CINEMATIC_VILLAGE', 'CINEMATIC_WOODS', 'CINEMATIC_BOAT', 'END'
        let currentScene = 'MENU';
        let sceneAlpha = 1.0;
        let fadeTarget = 1.0;
        let fadeSpeed = 0.02;

        // Rain effect state
        const rainDrops = Array.from({ length: 150 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            length: Math.random() * 20 + 10,
            speed: Math.random() * 10 + 10
        }));

        // --- AUDIO SYNTHESIZER (No external files needed) ---
        let audioCtx = null;
        let rainNoiseNode = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Generate Ambient Rain Noise
            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            rainNoiseNode = audioCtx.createBufferSource();
            rainNoiseNode.buffer = noiseBuffer;
            rainNoiseNode.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 800;

            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.08;

            rainNoiseNode.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            rainNoiseNode.start();
        }

        function playTextClickSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400 + Math.random() * 200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playDroneSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(60, audioCtx.currentTime);
            
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 200;

            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 2);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
        }

        // --- DRAWING FUNCTIONS ---
        function drawRain() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            rainDrops.forEach(drop => {
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x - 2, drop.y + drop.length);
                drop.y += drop.speed;
                drop.x -= 1;
                if (drop.y > canvas.height) {
                    drop.y = -20;
                    drop.x = Math.random() * canvas.width;
                }
            });
            ctx.stroke();
        }

        // Kawmling Stickman Renderer (Thicker, distinct style)
        function drawKawmling(x, y, scale, headAccessory) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.strokeStyle = '#FFFFFF';
            ctx.fillStyle = '#FFFFFF';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';

            // Head
            ctx.beginPath();
            ctx.arc(0, -40, 16, 0, Math.PI * 2);
            ctx.stroke();

            // Accessories
            if (headAccessory === 'durag') { // Moe
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.arc(0, -42, 18, Math.PI, 0);
                ctx.fill();
                // Durag tails
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(-12, -40);
                ctx.lineTo(-24, -25);
                ctx.moveTo(-12, -40);
                ctx.lineTo(-20, -18);
                ctx.stroke();
                ctx.lineWidth = 6;
            } else if (headAccessory === 'paperboat') { // McCrack
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.moveTo(-22, -52);
                ctx.lineTo(0, -70);
                ctx.lineTo(22, -52);
                ctx.lineTo(12, -52);
                ctx.lineTo(0, -60);
                ctx.lineTo(-12, -52);
                ctx.closePath();
                ctx.fill();
            }

            // Body
            ctx.beginPath();
            ctx.moveTo(0, -24);
            ctx.lineTo(0, 20);
            ctx.stroke();

            // Arms
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(-18, 5);
            ctx.moveTo(0, -10);
            ctx.lineTo(18, 5);
            ctx.stroke();

            // Legs
            ctx.beginPath();
            ctx.moveTo(0, 20);
            ctx.lineTo(-14, 50);
            ctx.moveTo(0, 20);
            ctx.lineTo(14, 50);
            ctx.stroke();

            ctx.restore();
        }

        // Background visual scenes
        function drawVillageScene() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Silhouetted Destroyed Village / Flames
            ctx.fillStyle = '#111';
            ctx.fillRect(cx - 200, cy - 100, 400, 200);

            // Fire Effect (Pixelated particles)
            for (let i = 0; i < 40; i++) {
                let fx = cx - 180 + Math.random() * 360;
                let fy = cy + 50 - Math.random() * 120;
                let size = Math.random() * 12 + 4;
                ctx.fillStyle = Math.random() > 0.5 ? '#FFFFFF' : '#888888';
                ctx.fillRect(fx, fy, size, size);
            }

            // House Silhouettes
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.moveTo(cx - 150, cy + 50);
            ctx.lineTo(cx - 100, cy - 30);
            ctx.lineTo(cx - 50, cy + 50);
            ctx.moveTo(cx + 20, cy + 50);
            ctx.lineTo(cx + 80, cy - 50);
            ctx.lineTo(cx + 140, cy + 50);
            ctx.fill();
        }

        function drawWoodsScene() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Forest background silhouettes
            ctx.fillStyle = '#1a1a1a';
            for (let i = -4; i <= 4; i++) {
                let tx = cx + i * 70;
                ctx.beginPath();
                ctx.moveTo(tx - 30, cy + 100);
                ctx.lineTo(tx, cy - 80);
                ctx.lineTo(tx + 30, cy + 100);
                ctx.fill();
            }

            // Running Kawmlings
            drawKawmling(cx - 60, cy + 40, 0.9, 'durag');
            drawKawmling(cx + 40, cy + 40, 0.9, 'paperboat');
        }

        function drawBoatScene() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // White Kawm Ocean
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, cy + 40, canvas.width, canvas.height - (cy + 40));

            // Waves
            ctx.strokeStyle = '#CCCCCC';
            ctx.lineWidth = 3;
            ctx.beginPath();
            let time = Date.now() * 0.003;
            for (let x = 0; x < canvas.width; x += 20) {
                ctx.lineTo(x, cy + 40 + Math.sin(x * 0.02 + time) * 5);
            }
            ctx.stroke();

            // Simple Dark Boat
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.moveTo(cx - 80, cy + 20);
            ctx.lineTo(cx + 80, cy + 20);
            ctx.lineTo(cx + 50, cy + 60);
            ctx.lineTo(cx - 50, cy + 60);
            ctx.closePath();
            ctx.fill();

            // Friends in Boat
            drawKawmling(cx - 20, cy + 5, 0.6, 'durag');
            drawKawmling(cx + 20, cy + 5, 0.6, 'paperboat');
        }

        // --- MAIN RENDER LOOP ---
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Smooth scene transitions
            if (sceneAlpha < fadeTarget) sceneAlpha = Math.min(1, sceneAlpha + fadeSpeed);
            if (sceneAlpha > fadeTarget) sceneAlpha = Math.max(0, sceneAlpha - fadeSpeed);

            ctx.save();
            ctx.globalAlpha = sceneAlpha;

            // Draw current active visual background
            if (currentScene === 'CINEMATIC_VILLAGE') drawVillageScene();
            else if (currentScene === 'CINEMATIC_WOODS') drawWoodsScene();
            else if (currentScene === 'CINEMATIC_BOAT') drawBoatScene();

            ctx.restore();

            // Ambient rain always renders in background
            drawRain();

            requestAnimationFrame(render);
        }

        // --- CINEMATIC SCRIPT & STORY SYSTEM ---
        const storyScript = [
            {
                scene: 'CINEMATIC_VILLAGE',
                text: "Our home... the village. It was destroyed in an instant by sudden terror attacks. Everything burned to ashes."
            },
            {
                scene: 'CINEMATIC_WOODS',
                text: "Two friends—Moe, wearing his classic durag, and McCrack, with his paperboat hat—managed to escape into the dark woods."
            },
            {
                scene: 'CINEMATIC_BOAT',
                text: "Reaching the edge of the land, they set sail onto the white waters of the Kawm Ocean, searching desperately for a new place to call home..."
            }
        ];

        let scriptIndex = 0;
        let isTyping = false;

        function typeWriter(text, element, speed = 40) {
            element.innerHTML = "";
            isTyping = true;
            let i = 0;

            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    if (i % 2 === 0) playTextClickSound();
                    i++;
                    setTimeout(type, speed);
                } else {
                    isTyping = false;
                }
            }
            type();
        }

        function advanceCinematic() {
            if (isTyping) return; // Prevent skipping while writing text

            if (scriptIndex < storyScript.length) {
                const step = storyScript[scriptIndex];

                // Trigger fade transition if scene changes
                if (currentScene !== step.scene) {
                    fadeTarget = 0;
                    setTimeout(() => {
                        currentScene = step.scene;
                        fadeTarget = 1;
                    }, 500);
                }

                typeWriter(step.text, document.getElementById('story-text'));
                scriptIndex++;
            } else {
                // End Cinematic Sequence
                fadeTarget = 0;
                document.getElementById('cinematic-overlay').classList.add('hidden');
                setTimeout(() => {
                    currentScene = 'END';
                    alert("To be continued... (Game Demo Ends Here)");
                }, 1000);
            }
        }

        // --- EVENT LISTENERS ---
        const menuOverlay = document.getElementById('menu-overlay');
        const cinematicOverlay = document.getElementById('cinematic-overlay');

        document.body.addEventListener('click', () => {
            initAudio();

            if (currentScene === 'MENU') {
                menuOverlay.classList.add('hidden');
                cinematicOverlay.style.display = 'flex';
                playDroneSound();
                advanceCinematic();
            } else if (currentScene.startsWith('CINEMATIC')) {
                advanceCinematic();
            }
        });

        // Initialize Loop
        render();
    </script>
</body>
</html>
