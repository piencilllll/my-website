<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kawm: Far From Home</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      background: #050510;
      border: 4px solid #fff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }
    canvas { display: block; width: 100%; height: 100%; }
    
    /* Stage 1 Dialogue Container */
    #dialogue-container {
      position: absolute;
      bottom: 20px;
      left: 40px;
      width: 720px;
      height: 155px;
      border: 4px solid #ffffff;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      padding: 15px;
      gap: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
      z-index: 10;
    }
    #portrait-canvas {
      width: 115px;
      height: 115px;
      border: 2px solid #ffffff;
      background: #111;
      flex-shrink: 0;
    }
    #dialogue-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }
    #speaker-name {
      font-size: 16px;
      font-weight: bold;
      color: #00ffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #dialogue-text {
      font-size: 14px;
      line-height: 1.4;
      color: #eee;
    }
    #dialogue-prompt {
      font-size: 11px;
      color: #888;
      text-align: right;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Controls HUD Overlay for Stage 2 */
    #hud-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 5;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      border: 1px solid #fff;
      display: none;
    }
    
    #win-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 4px;
      border: 4px solid #fff;
      padding: 20px 40px;
      background: #000;
      color: #fff;
      display: none;
      z-index: 20;
    }
  </style>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
  <!-- Dynamic 2D / 3D Render Canvas -->
  <canvas id="stage-canvas" width="800" height="600"></canvas>

  <!-- Stage 1 Dialogue Overlay -->
  <div id="dialogue-container">
    <canvas id="portrait-canvas" width="115" height="115"></canvas>
    <div id="dialogue-content">
      <div id="speaker-name">Moe</div>
      <div id="dialogue-text">...</div>
      <div id="dialogue-prompt">[PRESS SPACE / CLICK TO CONTINUE]</div>
    </div>
  </div>

  <!-- Stage 2 UI Controls -->
  <div id="hud-overlay">Controls: [A / D] or [← / →] to Steer</div>
  <div id="win-banner">STAGE CLEAR - LIGHTHOUSE REACHED</div>
</div>

<script>
// --- AUDIO SYSTEM (Square Wave Chiptune Beeps) ---
const AudioEngine = {
  ctx: null,
  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  },
  playBeep(pitch = 220) {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(pitch, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.08);
    } catch(e) {}
  }
};

// --- GAME STATE MANAGEMENT ---
const STATE = {
  stage: 1, // 1: Prologue 2D, 2: Three.js 3D
  scene: 'BURNING_VILLAGE', // BURNING_VILLAGE, ESCAPE_DOCK, OCEAN_DRIFT
  dialogueIndex: 0,
  textCharIndex: 0,
  textTimer: null
};

// --- DIALOGUE SCRIPT ---
const SCRIPT = [
  { scene: 'BURNING_VILLAGE', speaker: 'Moe', expression: 'worried', text: "The village... it's completely gone, McCrack. We can't stay here!" },
  { scene: 'BURNING_VILLAGE', speaker: 'McCrack', expression: 'determined', text: "To the docks! The rowboat is our only chance left." },
  { scene: 'ESCAPE_DOCK', speaker: 'Moe', expression: 'neutral', text: "Push off! Quick, before the embers reach the timber!" },
  { scene: 'ESCAPE_DOCK', speaker: 'McCrack', expression: 'squint', text: "Hold tight! The ocean storm is rolling in fast!" },
  { scene: 'OCEAN_DRIFT', speaker: 'Moe', expression: 'worried', text: "I can't see anything through this heavy rain! Where are we heading?!" },
  { scene: 'OCEAN_DRIFT', speaker: 'McCrack', expression: 'determined', text: "Look at the horizon! That light... the distant lighthouse! Take the oars!" }
];

// --- STAGE 1: 2D CANVASES & RENDER ENGINE ---
const canvas2D = document.getElementById('stage-canvas');
const ctx2D = canvas2D.getContext('2d');
const portraitCanvas = document.getElementById('portrait-canvas');
const pCtx = portraitCanvas.getContext('2d');

// Stage 1 Particle Systems
let embers = Array.from({ length: 45 }, () => ({
  x: Math.random() * 800,
  y: Math.random() * 600,
  size: Math.random() * 4 + 1,
  speedY: Math.random() * 2 + 1,
  speedX: (Math.random() - 0.5) * 1.5
}));

let rain2D = Array.from({ length: 120 }, () => ({
  x: Math.random() * 800,
  y: Math.random() * 600,
  len: Math.random() * 18 + 10,
  speed: Math.random() * 12 + 15
}));

let waveOffset = 0;

function drawPortrait(speaker, expression) {
  pCtx.clearRect(0, 0, 115, 115);
  pCtx.fillStyle = '#111';
  pCtx.fillRect(0, 0, 115, 115);
  
  pCtx.strokeStyle = '#ffffff';
  pCtx.lineWidth = 4;
  
  // Head Circle
  pCtx.beginPath();
  pCtx.arc(57.5, 60, 28, 0, Math.PI * 2);
  pCtx.stroke();
  
  // Dynamic Facial Expressions
  pCtx.beginPath();
  if (expression === 'worried') {
    // Eyebrows slanted up
    pCtx.moveTo(42, 48); pCtx.lineTo(52, 53);
    pCtx.moveTo(73, 48); pCtx.lineTo(63, 53);
    // Mouth wavy
    pCtx.moveTo(48, 73); pCtx.quadraticCurveTo(57.5, 68, 67, 73);
  } else if (expression === 'determined') {
    // Angry angled brows
    pCtx.moveTo(42, 50); pCtx.lineTo(52, 55);
    pCtx.moveTo(73, 50); pCtx.lineTo(63, 55);
    // Flat stern mouth
    pCtx.moveTo(48, 72); pCtx.lineTo(67, 72);
  } else if (expression === 'squint') {
    // Squint eyes
    pCtx.moveTo(45, 55); pCtx.lineTo(53, 55);
    pCtx.moveTo(62, 55); pCtx.lineTo(70, 55);
    // Slight open mouth
    pCtx.arc(57.5, 70, 5, 0, Math.PI);
  } else {
    // Neutral
    pCtx.moveTo(45, 53); pCtx.arc(45, 53, 2, 0, Math.PI * 2);
    pCtx.moveTo(70, 53); pCtx.arc(70, 53, 2, 0, Math.PI * 2);
    pCtx.moveTo(48, 70); pCtx.lineTo(67, 70);
  }
  pCtx.stroke();
  
  // Accessories (Durag / Paper Boat Hat)
  if (speaker === 'Moe') {
    // Blue Durag
    pCtx.fillStyle = '#0066ff';
    pCtx.beginPath();
    pCtx.arc(57.5, 60, 29, Math.PI * 0.85, Math.PI * 2.15);
    pCtx.fill();
    pCtx.stroke();
    // Durag Flap Behind
    pCtx.fillStyle = '#0044cc';
    pCtx.fillRect(80, 55, 12, 25);
  } else if (speaker === 'McCrack') {
    // White Paper Boat Hat
    pCtx.fillStyle = '#ffffff';
    pCtx.strokeStyle = '#ffffff';
    pCtx.beginPath();
    pCtx.moveTo(25, 36);
    pCtx.lineTo(90, 36);
    pCtx.lineTo(75, 15);
    pCtx.lineTo(57.5, 25);
    pCtx.lineTo(40, 15);
    pCtx.closePath();
    pCtx.fill();
    pCtx.stroke();
  }
}

function updateDialogue() {
  const current = SCRIPT[STATE.dialogueIndex];
  if (!current) {
    startStage2();
    return;
  }

  STATE.scene = current.scene;
  document.getElementById('speaker-name').innerText = current.speaker;
  document.getElementById('speaker-name').style.color = current.speaker === 'Moe' ? '#00bfff' : '#ffffff';
  
  drawPortrait(current.speaker, current.expression);

  // Typewriter effect
  clearInterval(STATE.textTimer);
  STATE.textCharIndex = 0;
  document.getElementById('dialogue-text').innerText = "";
  
  STATE.textTimer = setInterval(() => {
    if (STATE.textCharIndex < current.text.length) {
      document.getElementById('dialogue-text').innerText += current.text[STATE.textCharIndex];
      AudioEngine.playBeep(current.speaker === 'Moe' ? 260 : 180);
      STATE.textCharIndex++;
    } else {
      clearInterval(STATE.textTimer);
    }
  }, 25);
}

function advanceDialogue() {
  AudioEngine.init();
  const current = SCRIPT[STATE.dialogueIndex];
  if (STATE.textCharIndex < current.text.length) {
    // Complete line instantly
    clearInterval(STATE.textTimer);
    document.getElementById('dialogue-text').innerText = current.text;
    STATE.textCharIndex = current.text.length;
  } else {
    // Move to next line
    STATE.dialogueIndex++;
    if (STATE.dialogueIndex < SCRIPT.length) {
      updateDialogue();
    } else {
      startStage2();
    }
  }
}

// Render 2D Prologue Scene
function renderStage1() {
  if (STATE.stage !== 1) return;

  ctx2D.clearRect(0, 0, 800, 600);

  if (STATE.scene === 'BURNING_VILLAGE') {
    // Horizon gradient
    let grad = ctx2D.createLinearGradient(0, 0, 0, 600);
    grad.addColorStop(0, '#050202');
    grad.addColorStop(0.5, '#441100');
    grad.addColorStop(1, '#ff3300');
    ctx2D.fillStyle = grad;
    ctx2D.fillRect(0, 0, 800, 600);

    // Silhouetted Buildings
    ctx2D.fillStyle = '#0a0505';
    ctx2D.fillRect(50, 320, 120, 280);
    ctx2D.fillRect(200, 260, 160, 340);
    ctx2D.fillRect(450, 300, 140, 300);
    ctx2D.fillRect(620, 350, 150, 250);

    // Ember Particles
    ctx2D.fillStyle = '#ffaa00';
    embers.forEach(e => {
      e.y -= e.speedY;
      e.x += e.speedX;
      if (e.y < 0) e.y = 600;
      ctx2D.fillRect(e.x, e.y, e.size, e.size);
    });

  } else if (STATE.scene === 'ESCAPE_DOCK') {
    // Dark dock background
    let grad = ctx2D.createLinearGradient(0, 0, 0, 600);
    grad.addColorStop(0, '#02050e');
    grad.addColorStop(1, '#112233');
    ctx2D.fillStyle = grad;
    ctx2D.fillRect(0, 0, 800, 600);

    // Timber framing
    ctx2D.fillStyle = '#150d0a';
    for (let i = 0; i < 800; i += 80) {
      ctx2D.fillRect(i, 350, 40, 250);
    }
    ctx2D.fillRect(0, 330, 800, 30);

  } else if (STATE.scene === 'OCEAN_DRIFT') {
    // Dark Stormy Water & Sine Waves
    let grad = ctx2D.createLinearGradient(0, 0, 0, 600);
    grad.addColorStop(0, '#02040a');
    grad.addColorStop(1, '#081428');
    ctx2D.fillStyle = grad;
    ctx2D.fillRect(0, 0, 800, 600);

    waveOffset += 0.05;
    ctx2D.fillStyle = '#ffffff';
    ctx2D.beginPath();
    ctx2D.moveTo(0, 400);
    for (let x = 0; x <= 800; x += 20) {
      let y = Math.sin(x * 0.02 + waveOffset) * 12 + 400;
      ctx2D.lineTo(x, y);
    }
    ctx2D.lineTo(800, 600);
    ctx2D.lineTo(0, 600);
    ctx2D.fill();

    // Heavy Angled Rain Particles
    ctx2D.strokeStyle = 'rgba(200, 220, 255, 0.4)';
    ctx2D.lineWidth = 1.5;
    ctx2D.beginPath();
    rain2D.forEach(r => {
      r.y += r.speed;
      r.x -= 3;
      if (r.y > 600) { r.y = -20; r.x = Math.random() * 800; }
      ctx2D.moveTo(r.x, r.y);
      ctx2D.lineTo(r.x - 6, r.y + r.len);
    });
    ctx2D.stroke();
  }

  requestAnimationFrame(renderStage1);
}

// --- STAGE 2: THREE.JS 3D OCEAN ENGINE ---
let scene, camera, renderer;
let oceanMesh, boatGroup, lighthouseLamp;
let rocks = [];
let rainParticles;
let keys = {};
let gameActive = false;
let boatPos = { x: 0, z: 0, speedZ: -1.2 };

function startStage2() {
  STATE.stage = 2;
  document.getElementById('dialogue-container').style.display = 'none';
  document.getElementById('hud-overlay').style.display = 'block';

  // Initialize Three.js Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050a18);

  camera = new THREE.PerspectiveCamera(60, 800 / 600, 0.1, 2000);
  
  renderer = new THREE.WebGLRenderer({ canvas: canvas2D, antialias: true });
  renderer.setSize(800, 600);

  // Lighting & Atmosphere (High visibility)
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(100, 300, 100);
  scene.add(dirLight);

  // WHITE OCEAN MESH (Driven by dynamic sine displacement)
  const oceanGeo = new THREE.PlaneGeometry(300, 2000, 64, 256);
  oceanGeo.rotateX(-Math.PI / 2);
  
  // High contrast crisp white water material
  const oceanMat = new THREE.MeshLambertMaterial({
    color: 0xffffff,
    wireframe: false,
    flatShady: true
  });
  oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
  oceanMesh.position.z = -800;
  scene.add(oceanMesh);

  // LOW-POLY BOAT MODEL CONTAINER
  boatGroup = new THREE.Group();
  
  // Hull (Dark Timber)
  const hullGeo = new THREE.BoxGeometry(3, 1.2, 7);
  const hullMat = new THREE.MeshLambertMaterial({ color: 0x2a1810 });
  const hull = new THREE.Mesh(hullGeo, hullMat);
  hull.position.y = 0.5;
  boatGroup.add(hull);

  // Protagonists (Low-Poly 3D Stick Figures)
  function createCharacter(hatType) {
    const charGroup = new THREE.Group();
    // Body / Head (White)
    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), mat);
    head.position.y = 1.4;
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1), mat);
    body.position.y = 0.7;
    charGroup.add(head);
    charGroup.add(body);

    // Hats
    if (hatType === 'durag') {
      const durag = new THREE.Mesh(
        new THREE.SphereGeometry(0.43, 8, 8, 0, Math.PI * 2, 0, Math.PI * 0.5),
        new THREE.MeshBasicMaterial({ color: 0x0055ff })
      );
      durag.position.y = 1.42;
      charGroup.add(durag);
    } else if (hatType === 'paper_hat') {
      const hatGeo = new THREE.ConeGeometry(0.5, 0.5, 4);
      const hatMat = new THREE.MeshBasicMaterial({ color: 0xeeeeee });
      const hat = new THREE.Mesh(hatGeo, hatMat);
      hat.position.y = 1.9;
      hat.rotation.y = Math.PI / 4;
      charGroup.add(hat);
    }
    return charGroup;
  }

  const moe = createCharacter('durag');
  moe.position.set(-0.8, 0.5, 1);
  boatGroup.add(moe);

  const mcCrack = createCharacter('paper_hat');
  mcCrack.position.set(0.8, 0.5, -1);
  boatGroup.add(mcCrack);

  scene.add(boatGroup);

  // LIGHTHOUSE BEACON AT Z: -1600
  const towerGeo = new THREE.CylinderGeometry(8, 12, 120, 8);
  const towerMat = new THREE.MeshLambertMaterial({ color: 0x111115 });
  const lighthouse = new THREE.Mesh(towerGeo, towerMat);
  lighthouse.position.set(0, 60, -1600);
  scene.add(lighthouse);

  // Yellow Lamp PointLight
  const lampGeo = new THREE.SphereGeometry(5, 16, 16);
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
  const lampMesh = new THREE.Mesh(lampGeo, lampMat);
  lampMesh.position.set(0, 115, -1590);
  scene.add(lampMesh);

  lighthouseLamp = new THREE.PointLight(0xffff00, 3, 400);
  lighthouseLamp.position.set(0, 115, -1580);
  scene.add(lighthouseLamp);

  // OBSTACLES: 35+ Procedural Rock Cones
  const rockGeo = new THREE.ConeGeometry(4, 12, 5);
  const rockMat = new THREE.MeshLambertMaterial({ color: 0x1c2024, flatShading: true });
  for (let i = 0; i < 40; i++) {
    const rock = new THREE.Mesh(rockGeo, rockMat);
    const x = (Math.random() - 0.5) * 120;
    const z = -100 - Math.random() * 1400;
    rock.position.set(x, 2, z);
    rock.rotation.y = Math.random() * Math.PI;
    scene.add(rock);
    rocks.push(rock);
  }

  // 3D POINT-CLOUD RAIN SYSTEM
  const rainGeo = new THREE.BufferGeometry();
  const rainCount = 1500;
  const posArray = new Float32Array(rainCount * 3);
  for (let i = 0; i < rainCount * 3; i += 3) {
    posArray[i] = (Math.random() - 0.5) * 200;
    posArray[i + 1] = Math.random() * 100;
    posArray[i + 2] = (Math.random() - 0.5) * 2000;
  }
  rainGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
  const rainMat = new THREE.PointsMaterial({ color: 0xaaaaaa, size: 0.6, transparent: true, opacity: 0.6 });
  rainParticles = new THREE.Points(rainGeo, rainMat);
  scene.add(rainParticles);

  // Event Listeners for Steering
  window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
  window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

  gameActive = true;
  animate3D();
}

// STAGE 2 LOOP
let time3D = 0;
function animate3D() {
  if (!gameActive) return;
  requestAnimationFrame(animate3D);

  time3D += 0.04;

  // Steering Mechanics
  if (keys['a'] || keys['arrowleft']) boatPos.x -= 0.6;
  if (keys['d'] || keys['arrowright']) boatPos.x += 0.6;

  // Boundary Constraints
  boatPos.x = Math.max(-50, Math.min(50, boatPos.x));
  boatPos.z += boatPos.speedZ;

  // Update Boat Position & Real-Time Wave Buoyancy Physics
  const buoyY = Math.sin(time3D * 2 + boatPos.z * 0.05) * 0.8;
  const pitch = Math.cos(time3D * 1.5) * 0.08;
  const roll = Math.sin(time3D * 2.5) * 0.1;

  boatGroup.position.set(boatPos.x, buoyY, boatPos.z);
  boatGroup.rotation.set(pitch, 0, roll);

  // Dynamic Camera Following
  camera.position.set(boatPos.x * 0.7, 12, boatPos.z + 22);
  camera.lookAt(boatPos.x * 0.3, 3, boatPos.z - 30);

  // Wave Displacement Animation (Sine Waves)
  const pos = oceanMesh.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const u = pos.getX(i);
    const v = pos.getY(i);
    const zVal = Math.sin(u * 0.1 + time3D) * 1.2 + Math.cos(v * 0.05 + time3D) * 1.5;
    pos.setZ(i, zVal);
  }
  oceanMesh.geometry.attributes.position.needsUpdate = true;

  // Rock Collision Detection (Simple Reset Safety)
  rocks.forEach(rock => {
    const dist = boatGroup.position.distanceTo(rock.position);
    if (dist < 4.5) {
      boatPos.x = 0; // Bounce back safety
    }
  });

  // Win Condition: Reaching Lighthouse (Z <= -1550)
  if (boatPos.z <= -1550) {
    gameActive = false;
    document.getElementById('win-banner').style.display = 'block';
  }

  renderer.render(scene, camera);
}

// START GAME INITIALIZATION
updateDialogue();
renderStage1();

// Click / Keyboard Advance Handler for Stage 1
window.addEventListener('click', () => { if (STATE.stage === 1) advanceDialogue(); });
window.addEventListener('keydown', (e) => {
  if (STATE.stage === 1 && (e.code === 'Space' || e.code === 'Enter')) {
    advanceDialogue();
  }
});
</script>
</body>
</html>
