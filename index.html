<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL RECOVERY :: SECTOR 09</title>
    <style>
        :root {
            --bg: #04070d;
            --green: #10b981;
            --amber: #f59e0b;
            --red: #ef4444;
            --font: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: var(--bg); color: #fff;
            font-family: var(--font);
            display: flex; justify-content: center; align-items: center;
            cursor: none;
        }

        .viewport {
            width: 100vw; height: 100vh; max-width: 1000px; max-height: 650px;
            position: relative; background: #000;
            border: 2px solid #1e293b;
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.15);
            display: flex; flex-direction: column; overflow: hidden;
        }

        canvas#gameCanvas { width: 100%; height: 100%; display: block; }

        .hud-overlay {
            position: absolute; top: 16px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 10;
        }

        .hud-card {
            background: rgba(6, 75, 52, 0.25); border: 1px solid #059669;
            padding: 10px 14px; border-radius: 4px; display: flex; flex-direction: column; gap: 4px;
            backdrop-filter: blur(4px);
        }

        .hud-title { font-size: 0.8rem; font-weight: bold; color: var(--green); letter-spacing: 1px; }
        .hud-sub { font-size: 0.7rem; color: #a7f3d0; }

        .dialogue-box {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; height: 125px;
            background: rgba(4, 13, 10, 0.95);
            border: 2px solid var(--green); border-radius: 6px;
            padding: 14px 18px; display: none; gap: 16px; align-items: center;
            z-index: 20;
        }

        .portrait {
            width: 70px; height: 70px; border: 2px solid var(--green); background: #000;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        .dialogue-body { display: flex; flex-direction: column; justify-content: space-between; height: 100%; flex: 1; }
        .speaker { font-size: 0.85rem; font-weight: bold; letter-spacing: 2px; }
        .text-content { font-size: 0.9rem; line-height: 1.4; color: #ecfdf5; }
        .prompt { font-size: 0.68rem; color: var(--amber); align-self: flex-end; animation: blink 0.8s infinite alternate; }

        @keyframes blink { from { opacity: 0.2; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="viewport">
        <canvas id="gameCanvas"></canvas>

        <div class="hud-overlay">
            <div class="hud-card">
                <div class="hud-title" id="actTitle">MISSION 1: RECOVERY</div>
                <div class="hud-sub">[A/D] MOVE | [W/SPACE] JUMP | [E] INTERACT</div>
            </div>
            <div class="hud-card" style="align-items: flex-end;">
                <div class="hud-title" style="color: var(--amber);" id="itemTracker">DATA NODES: 0 / 3</div>
                <div class="hud-sub" id="objectiveText">Find the missing encrypted nodes</div>
            </div>
        </div>

        <div class="dialogue-box" id="dialogueBox">
            <div class="portrait" id="portraitBox"></div>
            <div class="dialogue-body">
                <div class="speaker" id="speakerName">...</div>
                <div class="text-content" id="dialogueText">...</div>
                <div class="prompt">[PRESS E OR SPACE TO CONTINUE]</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const dialogueBox = document.getElementById('dialogueBox');
        const speakerName = document.getElementById('speakerName');
        const dialogueText = document.getElementById('dialogueText');
        const portraitBox = document.getElementById('portraitBox');
        const actTitle = document.getElementById('actTitle');
        const itemTracker = document.getElementById('itemTracker');
        const objectiveText = document.getElementById('objectiveText');

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio Synthesizer
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
                gain.gain.setValueAtTime(0.06, now); gain.gain.linearRampToValueAtTime(0, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'collect') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(880, now + 0.08);
                gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'talk') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, now);
                gain.gain.setValueAtTime(0.03, now); gain.gain.linearRampToValueAtTime(0, now + 0.04);
                osc.start(now); osc.stop(now + 0.04);
            } else if (type === 'hit') {
                osc.type = 'square'; osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.12, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        // Mouse Tracker
        const mouse = { x: 0, y: 0 };
        window.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
        });

        // Key Listeners
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'KeyE' || e.code === 'Space') handleInteraction();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Player Physics (Cipher)
        const cipher = {
            x: 80, y: 480, vx: 0, vy: 0,
            radius: 16, grounded: false,
            scaleX: 1, scaleY: 1, rotation: 0, vRot: 0
        };

        const GRAVITY = 0.45;
        const FRICTION = 0.84;

        // Level Geometry
        const platforms = [
            { x: 0, y: 550, w: 1000, h: 100 }, // Floor
            { x: 180, y: 430, w: 150, h: 16 },
            { x: 400, y: 330, w: 180, h: 16 },
            { x: 680, y: 240, w: 200, h: 16 },
            { x: 80, y: 220, w: 140, h: 16 },
            { x: 440, y: 150, w: 130, h: 16 }
        ];

        // Mission Logic State
        let currentMission = 1; // 1: Nodes, 2: Terminal Override, 3: Core Stabilized
        let nodesCollected = 0;
        let terminalHacked = false;

        const nodes = [
            { x: 250, y: 390, collected: false },
            { x: 740, y: 200, collected: false },
            { x: 140, y: 180, collected: false }
        ];

        const terminal = { x: 490, y: 106, w: 30, h: 44 };
        const unit09 = { x: 840, y: 494, w: 32, h: 56 };

        // Moving Red Anomaly Hazard
        const hazard = { x: 400, y: 310, vx: 2, minX: 400, maxX: 560 };

        // Dialogue Data
        let inDialogue = false;
        let dialogueTree = [];
        let dialogueIndex = 0;

        const m1Intro = [
            { speaker: "Unit-09", text: "Cipher, glad your kernel booted up. The grid lost three encrypted Data Nodes.", color: "#f59e0b" },
            { speaker: "Cipher", text: "* (I can stretch across platforms to retrieve them.)", color: "#10b981" },
            { speaker: "Unit-09", text: "Collect all 3 Nodes, but avoid the red corrupted anomaly on the middle platform!", color: "#f59e0b" }
        ];

        const m2Start = [
            { speaker: "Unit-09", text: "Great job! All 3 Data Nodes recovered. Now reach the top mainframe terminal!", color: "#f59e0b" },
            { speaker: "Cipher", text: "* (The top platform terminal? I'm on it.)", color: "#10b981" }
        ];

        const m3Victory = [
            { speaker: "Unit-09", text: "OVERRIDE COMPLETE! Sector 09 is purged of anomalies. Excellent work, Cipher!", color: "#f59e0b" },
            { speaker: "Cipher", text: "* (System restored. Ready for standby mode.)", color: "#10b981" }
        ];

        function triggerDialogue(lines) {
            inDialogue = true;
            dialogueTree = lines;
            dialogueIndex = 0;
            dialogueBox.style.display = 'flex';
            renderDialogueStep();
        }

        function renderDialogueStep() {
            const current = dialogueTree[dialogueIndex];
            speakerName.innerText = current.speaker.toUpperCase();
            speakerName.style.color = current.color;
            dialogueText.innerText = current.text;
            playSound('talk');

            portraitBox.innerHTML = current.speaker === 'Unit-09'
                ? '<div style="width:26px;height:26px;background:#f59e0b;border:2px solid #fff;"></div>'
                : '<div style="width:24px;height:24px;background:#10b981;border-radius:50%;"></div>';
        }

        function handleInteraction() {
            if (inDialogue) {
                dialogueIndex++;
                if (dialogueIndex < dialogueTree.length) {
                    renderDialogueStep();
                } else {
                    inDialogue = false;
                    dialogueBox.style.display = 'none';
                }
                return;
            }

            // Check NPC Unit-09 Interaction
            const dUnit = Math.hypot(cipher.x - (unit09.x + 16), cipher.y - (unit09.y + 28));
            if (dUnit < 60) {
                if (currentMission === 1 && nodesCollected < 3) triggerDialogue(m1Intro);
                if (currentMission === 1 && nodesCollected === 3) {
                    currentMission = 2;
                    actTitle.innerText = "MISSION 2: OVERRIDE";
                    itemTracker.innerText = "TERMINAL: LOCKED";
                    objectiveText.innerText = "Reach top platform & press [E] on Terminal";
                    triggerDialogue(m2Start);
                }
                if (currentMission === 3) triggerDialogue(m3Victory);
            }

            // Check Terminal Interaction
            const dTerm = Math.hypot(cipher.x - (terminal.x + 15), cipher.y - (terminal.y + 22));
            if (dTerm < 50 && currentMission === 2) {
                terminalHacked = true;
                currentMission = 3;
                playSound('collect');
                actTitle.innerText = "MISSION 3: RESTORED";
                itemTracker.innerText = "SECTOR: ONLINE";
                objectiveText.innerText = "Return to Unit-09 for debrief";
                triggerDialogue(m3Victory);
            }
        }

        // Physics Update Loop
        function updatePhysics() {
            if (inDialogue) return;

            // Player Movements
            if (keys['KeyA'] || keys['ArrowLeft']) {
                cipher.vx -= 0.7; cipher.vRot -= 0.05;
            }
            if (keys['KeyD'] || keys['ArrowRight']) {
                cipher.vx += 0.7; cipher.vRot += 0.05;
            }

            // Jump
            if ((keys['KeyW'] || keys['Space'] || keys['ArrowUp']) && cipher.grounded) {
                cipher.vy = -11;
                cipher.grounded = false;
                cipher.scaleX = 0.6; cipher.scaleY = 1.4;
                playSound('jump');
            }

            cipher.vy += GRAVITY;
            cipher.vx *= FRICTION;
            cipher.x += cipher.vx;
            cipher.y += cipher.vy;

            cipher.rotation += cipher.vRot;
            cipher.vRot *= 0.9;

            cipher.scaleX += (1 - cipher.scaleX) * 0.12;
            cipher.scaleY += (1 - cipher.scaleY) * 0.12;

            // Platform Collision
            cipher.grounded = false;
            platforms.forEach(plat => {
                if (cipher.x + cipher.radius > plat.x && cipher.x - cipher.radius < plat.x + plat.w) {
                    if (cipher.y + cipher.radius >= plat.y && cipher.y - cipher.radius < plat.y + plat.h && cipher.vy > 0) {
                        cipher.y = plat.y - cipher.radius;
                        if (cipher.vy > 2) {
                            cipher.scaleX = 1.35; cipher.scaleY = 0.65;
                        }
                        cipher.vy = 0;
                        cipher.grounded = true;
                    }
                }
            });

            cipher.x = Math.max(cipher.radius, Math.min(canvas.width - cipher.radius, cipher.x));

            // Hazard Physics & Respawn
            hazard.x += hazard.vx;
            if (hazard.x < hazard.minX || hazard.x > hazard.maxX) hazard.vx *= -1;

            const dHazard = Math.hypot(cipher.x - hazard.x, cipher.y - hazard.y);
            if (dHazard < cipher.radius + 12) {
                playSound('hit');
                cipher.x = 80; cipher.y = 480; // Respawn at start
                cipher.vx = 0; cipher.vy = 0;
            }

            // Node Collection
            if (currentMission === 1) {
                nodes.forEach(n => {
                    if (!n.collected) {
                        const d = Math.hypot(cipher.x - n.x, cipher.y - n.y);
                        if (d < cipher.radius + 12) {
                            n.collected = true;
                            nodesCollected++;
                            playSound('collect');
                            itemTracker.innerText = `DATA NODES: ${nodesCollected} / 3`;
                            if (nodesCollected === 3) {
                                objectiveText.innerText = "Return to Unit-09 for next directive";
                            }
                        }
                    }
                });
            }
        }

        // Render Loop
        let time = 0;
        function render() {
            time += 0.04;
            ctx.fillStyle = '#04070d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid Lines
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.08)'; ctx.lineWidth = 1;
            for(let x=0; x<canvas.width; x+=40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }

            // Platforms
            platforms.forEach(p => {
                ctx.fillStyle = '#064e3b';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = '#059669'; ctx.lineWidth = 2;
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            });

            // Terminal Machine
            ctx.fillStyle = terminalHacked ? '#10b981' : '#f59e0b';
            ctx.fillRect(terminal.x, terminal.y, terminal.w, terminal.h);
            ctx.fillStyle = '#000'; ctx.fillRect(terminal.x + 4, terminal.y + 6, 22, 16);
            const dTerm = Math.hypot(cipher.x - (terminal.x + 15), cipher.y - (terminal.y + 22));
            if (dTerm < 50 && currentMission === 2) {
                ctx.fillStyle = '#fff'; ctx.font = 'bold 0.75rem "Courier New"'; ctx.textAlign = 'center';
                ctx.fillText('[E] OVERRIDE', terminal.x + 15, terminal.y - 10);
            }

            // Nodes
            nodes.forEach(n => {
                if (!n.collected) {
                    ctx.fillStyle = '#10b981';
                    ctx.shadowColor = '#10b981'; ctx.shadowBlur = 10;
                    ctx.fillRect(n.x - 6, n.y - 6 + Math.sin(time * 4) * 4, 12, 12);
                    ctx.shadowBlur = 0;
                }
            });

            // Hazard Entity
            ctx.fillStyle = '#ef4444';
            ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(hazard.x, hazard.y, 12 + Math.sin(time*8)*2, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // Unit-09 NPC
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(unit09.x, unit09.y, unit09.w, unit09.h);
            ctx.fillStyle = '#000';
            ctx.fillRect(unit09.x + 6, unit09.y + 12, 6, 6);
            ctx.fillRect(unit09.x + 20, unit09.y + 12, 6, 6);

            const dUnit = Math.hypot(cipher.x - (unit09.x + 16), cipher.y - (unit09.y + 28));
            if (dUnit < 60) {
                ctx.fillStyle = '#fff'; ctx.font = 'bold 0.75rem "Courier New"'; ctx.textAlign = 'center';
                ctx.fillText('[E] TALK', unit09.x + 16, unit09.y - 12);
            }

            // Cipher Player Render
            ctx.save();
            ctx.translate(cipher.x, cipher.y);
            ctx.rotate(cipher.rotation);
            ctx.scale(cipher.scaleX, cipher.scaleY);

            ctx.fillStyle = '#10b981';
            ctx.shadowColor = '#10b981'; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(0, 0, cipher.radius, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#000';
            ctx.fillRect(-5, -3, 3, 6); ctx.fillRect(2, -3, 3, 6);
            ctx.restore();

            // Pixel Cursor
            ctx.fillStyle = '#10b981';
            ctx.fillRect(mouse.x, mouse.y, 8, 2);
            ctx.fillRect(mouse.x, mouse.y, 2, 8);

            updatePhysics();
            requestAnimationFrame(render);
        }

        setTimeout(() => triggerDialogue(m1Intro), 500);
        render();
    </script>
</body>
</html>
