<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE UNPUBLISHED ZERO // THE CURSOR'S WAKE</title>
    <style>
        :root {
            --bg: #000;
            --paper-texture: #fafafa;
            --cyan: #00f3ff;
            --amber: #ffaa00;
            --purple: #bc13fe;
            --green: #00ff66;
            --text-color: #f8fafc;
            --font: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-color: var(--bg); color: var(--text-color);
            font-family: var(--font);
            display: flex; justify-content: center; align-items: center;
        }

        /* SCREEN FRAME (VIEWPORT) */
        .viewport {
            width: 100vw; height: 100vh; max-width: 1000px; max-height: 650px;
            position: relative;
            background: #000;
            border: 2px solid #1e293b;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* CANVAS FOR VISUALS (RAIN, NEON, PLAYER) */
        canvas#mainCanvas { width: 100%; height: 100%; display: block; }

        /* SCANLINE OVERLAY */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.3));
            background-size: 100% 4px;
            pointer-events: none; z-index: 100;
        }

        /* MAIN MENU INTERFACE */
        .ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10;
        }

        .main-menu {
            display: flex; flex-direction: column; gap: 20px;
            background: rgba(0,0,0,0.8); padding: 40px; border-radius: 8px;
            border: 1px solid #1e293b;
        }

        .menu-title {
            font-size: 1.4rem; font-weight: bold; color: #fff;
            letter-spacing: 4px; margin-bottom: 20px;
            text-align: center;
        }

        .menu-btn {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 12px 24px;
            font-size: 0.85rem; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; border-radius: 6px;
            transition: all 0.2s; text-align: left;
            display: flex; justify-content: space-between; align-items: center;
        }

        .menu-btn:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            transform: translateX(5px);
        }

        /* DIALOGUE BOX (Deltarune/OneShot Style) */
        .dialogue-box {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 88%; height: 130px;
            background: rgba(4, 6, 12, 0.98);
            border: 3px solid #fff;
            border-radius: 6px;
            padding: 12px 16px;
            display: none; /* Managed by JS */
            gap: 16px; align-items: center;
            z-index: 20;
        }

        .portrait-container {
            width: 90px; height: 90px;
            border: 2px solid var(--cyan);
            background: #000;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }

        canvas#portraitCanvas { width: 80px; height: 80px; }

        .dialogue-content {
            display: flex; flex-direction: column; justify-content: space-between;
            height: 100%; flex: 1;
        }

        .speaker-name {
            font-size: 0.85rem; font-weight: bold;
            color: var(--cyan); letter-spacing: 2px;
            text-transform: uppercase;
        }

        .dialogue-text {
            font-size: 1.05rem; line-height: 1.4; color: #fff;
            height: 50px;
        }

        .prompt-next {
            font-size: 0.75rem; color: var(--amber);
            align-self: flex-end;
            animation: blink 0.8s infinite alternate;
        }

        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

        /* RPG OVERLAY (Not asking for game today, but setup exists) */
        .rpg-hud {
            position: absolute; top: 15px; left: 20px;
            display: none; flex-direction: column; gap: 6px; z-index: 10;
            font-family: 'Segoe UI', sans-serif;
        }

    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div class="viewport">
        <!-- Main Graphic Canvas -->
        <canvas id="mainCanvas"></canvas>

        <!-- UI OVERLAY (Menu System) -->
        <div class="ui-overlay" id="uiOverlay">
            <div class="main-menu" id="mainMenu">
                <div class="menu-title">THE UNPUBLISHED ZERO</div>
                <button class="menu-btn" id="btnPlay"><span>[START_DRAFT_LOAD]</span><span style="color:var(--cyan);">[PLAY]</span></button>
                <button class="menu-btn" id="btnSettings"><span>[CONFIG_NULL]</span><span style="color:var(--amber);">[SETTINGS]</span></button>
            </div>
        </div>

        <!-- DIALOGUE BOX (Cutscenes) -->
        <div class="dialogue-box" id="dialogueBox">
            <div class="portrait-container">
                <canvas id="portraitCanvas" width="80" height="80"></canvas>
            </div>
            <div class="dialogue-content">
                <div class="speaker-name" id="speakerName">...</div>
                <div class="dialogue-text" id="dialogueText">...</div>
                <div class="prompt-next">[PRESS ENTER / SPACE]</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const pCanvas = document.getElementById('portraitCanvas');
        const pCtx = pCanvas.getContext('2d');

        const uiOverlay = document.getElementById('uiOverlay');
        const dialogueBox = document.getElementById('dialogueBox');
        const speakerName = document.getElementById('speakerName');
        const dialogueText = document.getElementById('dialogueText');

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game States: 'MENU', 'CINEMATIC_START', 'PLAYING_RPG'
        let gameState = 'MENU';

        // Custom Pixel Cursor Setup
        canvas.style.cursor = "none";
        uiOverlay.style.cursor = "none";

        const mouse = { x: canvas.width/2, y: canvas.height/2 };
        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        // Setup Main Menu Buttons
        document.getElementById('btnPlay').onclick = () => startCinematic();
        document.getElementById('btnSettings').onclick = () => {
             dialogueBox.style.display = 'flex';
             speakerName.innerText = "SYSTEM";
             dialogueText.innerText = "* CONFIGURATION ARRAY NULL. SETTINGS NOT LOADED.";
             currentMood = 'orb_annoyed';
             setTimeout(() => dialogueBox.style.display = 'none', 3000);
        };

        function startCinematic() {
            gameState = 'CINEMATIC_START';
            uiOverlay.style.display = 'none'; // Hide Menu
            dialogueBox.style.display = 'flex';
            dialogueIndex = 0;
            loadDialogueStep();
        }

        // --- CINEMATIC DIALOGUE (THE ASCENTContext) ---
        // Context: Orb-68 wakes up inside the moving car, seeing the neon city.
        const cinematicDialogue = [
            {
                speaker: "Orb-68",
                color: "#00f3ff",
                mood: "orb_blot_happy",
                text: "...* (The ink... it’s moving? Why is the page vibrating?)"
            },
            {
                speaker: "Orb-68",
                color: "#00f3ff",
                mood: "orb_blot_surprised",
                text: "* (My eyes... everything is so beautiful. These neon lines... what is this place?)"
            },
            {
                speaker: "Vektor",
                color: "#ffaa00",
                mood: "vektor_normal",
                text: "Don't get too mesmerized, blot. This is Ref City's neural grid. The artist's unpolished desire."
            },
            {
                speaker: "Orb-68",
                color: "#00f3ff",
                mood: "orb_blot_happy",
                text: "* (Ref City? Are we inside the published memory?)"
            },
            {
                speaker: "Vektor",
                color: "#ffaa00",
                mood: "vektor_hat",
                text: "We are inside a memory of a memory. A conceptual sector. Chapter 0. The Cutting Room Floor."
            },
            {
                speaker: "Vektor",
                color: "#ffaa00",
                mood: "vektor_normal",
                text: "Adjusting my sketched tattered coat. Let’s see if we can stabilization this core before the draft is completely deleted."
            },
            {
                speaker: "Orb-68",
                color: "#00f3ff",
                mood: "orb_blot_determined",
                text: "...* (Stabilize the core... The Ink is ready.)"
            }
        ];

        let dialogueIndex = 0;
        let typewriterText = "";
        let typewriterTarget = "";
        let typewriterCharIdx = 0;

        window.addEventListener('keydown', e => {
            if ((e.code === 'Enter' || e.code === 'Space') && gameState === 'CINEMATIC_START') {
                advanceDialogue();
            }
        });

        function loadDialogueStep() {
            const current = cinematicDialogue[dialogueIndex];
            speakerName.innerText = current.speaker.toUpperCase();
            speakerName.style.color = current.color;

            typewriterTarget = current.text;
            typewriterText = "";
            typewriterCharIdx = 0;

            drawPortrait(current.mood);
        }

        function advanceDialogue() {
            if (typewriterText.length < typewriterTarget.length) {
                typewriterText = typewriterTarget;
                dialogueText.innerText = typewriterText;
                return;
            }

            dialogueIndex++;
            if (dialogueIndex < cinematicDialogue.length) {
                loadDialogueStep();
            } else {
                gameState = 'FINISHED_CINEMATIC';
                dialogueBox.style.display = 'none';
                speak("* (Ascent complete. You are now controlling Orb-68. Search the floor using WASD... Oh wait, that part of the code isn't in this snippet today.)", "vektor_normal");
            }
        }

        // --- VISUAL LOOP (CANVAS GRAPHICS) ---
        let rain = [];
        for(let i=0; i<80; i++) {
            rain.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, speed: 10 + Math.random()*8 });
        }

        let time = 0;
        function loop() {
            time += 0.03;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'MENU') {
                renderMenuVisuals();
            } else if (gameState === 'CINEMATIC_START' || gameState === 'FINISHED_CINEMATIC') {
                renderCarCinematic();
            }

            requestAnimationFrame(loop);
        }

        // --- VISUAL RENDERERS ---

        // MENU VISUALS (Black background, simple text, pixel cursor)
        function renderMenuVisuals() {
            // Background grid faintly visible
            ctx.strokeStyle = 'rgba(30, 41, 59, 0.3)';
            ctx.lineWidth = 1;
            for(let x=0; x<canvas.width; x+=30) {
                ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for(let y=0; y<canvas.height; y+=30) {
                ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            drawPixelCursor();
        }

        // CINEMATIC VISUALS (Inside Car, Neon City, Rain)
        function renderCarCinematic() {
            // Neon City Lights (Ref City Matrix) seen through windshield
            drawWindshieldFrame();

            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2 - 50);

            // Ref City Neon Matrix effect
            for(let r=40; r<240; r+=25) {
                ctx.strokeStyle = `rgba(0, 243, 255, ${0.1 + Math.sin(time + r)*0.1})`;
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(0, 0, r + Math.sin(time*2 + r)*5, 0, Math.PI*2); ctx.stroke();
            }
            // Amber spotlights
            ctx.fillStyle = `rgba(255, 170, 0, ${0.15 + Math.sin(time*3)*0.05})`;
            ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 40;
            ctx.fillRect(-200, 40, 60, 100); ctx.fillRect(140, -100, 80, 80);
            ctx.shadowBlur = 0;

            ctx.restore();

            // Animated Rainfall on windshield
            drawRain();

            // Draw Car Dashboard (Very simple geometric context)
            drawCarDashboard();
        }

        // Helpers
        function drawWindshieldFrame() {
            ctx.fillStyle = '#0f172a'; // Car interior border
            ctx.fillRect(0, 0, canvas.width, 60); // Header roof
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100); // Dashboard base
            ctx.fillRect(0, 0, 40, canvas.height); // A-Pillar Left
            ctx.fillRect(canvas.width - 40, 0, 40, canvas.height); // A-Pillar Right
        }

        function drawCarDashboard() {
            ctx.fillStyle = '#1e293b'; // Dash top
            ctx.fillRect(0, canvas.height - 100, canvas.width, 10);
            ctx.strokeStyle = 'var(--cyan)'; ctx.lineWidth = 1;
            ctx.strokeRect(0, canvas.height - 100, canvas.width, 10);
        }

        function drawRain() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1;
            rain.forEach(drop => {
                ctx.beginPath(); ctx.moveTo(drop.x, drop.y); ctx.lineTo(drop.x + drop.speed*0.1, drop.y + drop.speed); ctx.stroke();
                drop.y += drop.speed;
                if (drop.y > canvas.height) drop.y = -10;
            });
        }

        function drawPixelCursor() {
            // Very simple geometric pixel cursor (Arrow)
            ctx.fillStyle = '#fff';
            ctx.fillRect(mouse.x, mouse.y, 16, 4);
            ctx.fillRect(mouse.x + 4, mouse.y + 4, 12, 4);
            ctx.fillRect(mouse.x + 8, mouse.y + 8, 8, 4);
            ctx.fillRect(mouse.x + 12, mouse.y + 12, 4, 4);
            ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
            ctx.strokeRect(mouse.x, mouse.y, 16, 4);
        }

        // --- UNDERTALE PORTRAIT ANIMATION ---
        function drawPortrait(mood) {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            pCtx.fillStyle = '#04060c';
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);

            pCtx.save();
            pCtx.translate(40, 40);

            if (mood.startsWith('orb')) {
                // Orb-68 Droplet Portrait
                pCtx.fillStyle = '#00f3ff'; // Blot color
                pCtx.beginPath();
                pCtx.moveTo(0, -26);
                pCtx.bezierCurveTo(24, -4, 20, 22, 0, 22);
                pCtx.bezierCurveTo(-20, 22, -24, -4, 0, -26);
                pCtx.fill();

                pCtx.fillStyle = '#fff';
                pCtx.beginPath();
                pCtx.arc(-6, 2, 5, 0, Math.PI*2); pCtx.arc(6, 2, 5, 0, Math.PI*2); pCtx.fill();
                pCtx.fillStyle = '#000';
                pCtx.beginPath();

                if (mood === 'orb_blot_surprised') {
                    pCtx.arc(-6, 2, 3, 0, Math.PI*2); pCtx.arc(6, 2, 3, 0, Math.PI*2); pCtx.fill();
                    pCtx.strokeStyle = '#000'; pCtx.lineWidth = 2;
                    pCtx.beginPath(); pCtx.arc(0, 12, 4, 0, Math.PI*2); pCtx.stroke();
                } else {
                    pCtx.arc(-4, 2, 2.5, 0, Math.PI*2); pCtx.arc(8, 2, 2.5, 0, Math.PI*2); pCtx.fill();
                    // Smile
                    pCtx.strokeStyle = '#000'; pCtx.lineWidth = 2;
                    pCtx.beginPath(); pCtx.arc(0, 8, 6, 0, Math.PI); pCtx.stroke();
                }
            } 
            else if (mood.startsWith('vektor')) {
                // Vektor Humanoid Portrait (Scribbled Style)
                pCtx.fillStyle = '#ffaa00';
                pCtx.fillRect(-12, -10, 24, 24);
                // Eyes & Face
                pCtx.fillStyle = '#000';
                pCtx.fillRect(-7, -4, 4, 5); pCtx.fillRect(3, -4, 4, 5);
                pCtx.fillRect(-5, 6, 10, 2);
                // Sketched Hat
                pCtx.fillStyle = '#1e293b';
                pCtx.fillRect(-20, -14, 40, 5);
                pCtx.fillRect(-12, -26, 24, 12);
            }

            pCtx.restore();
        }

        // Helper to output debug tips through assistant box
        function speak(text, mood) {
             dialogueBox.style.display = 'flex';
             speakerName.innerText = "SYSTEM";
             speakerName.style.color = "#bc13fe"; // Purple for sys help
             dialogueText.innerText = text;
             drawPortrait(mood);
        }

        // Initialize Everything
        loop();
    </script>
</body>
</html>
