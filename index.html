<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Prototype - Pointer Lock</title>
    <style>
        :root {
            --bg-color: #05070a;
            --accent-blue: #00f0ff;
            --accent-red: #ff0055;
            --accent-gold: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            border: 2px solid #1a2233;
            border-radius: 6px;
            overflow: hidden;
            cursor: crosshair;
        }

        canvas {
            display: block;
            background: #080c14;
        }

        /* CRT Filter FX */
        .crt-scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-stats {
            background: rgba(8, 12, 20, 0.85);
            border: 1px solid #2a354d;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.5;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .hud-stats span {
            color: var(--accent-blue);
            font-weight: bold;
        }

        .hud-controls {
            background: rgba(8, 12, 20, 0.85);
            border: 1px solid #2a354d;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 11px;
            color: #8a9bb8;
            text-align: right;
        }

        .key-badge {
            background: #ffffff;
            color: #000;
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: bold;
        }

        /* Game Over / Start Screens */
        #screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 10, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
        }

        h1 {
            font-size: 42px;
            letter-spacing: 4px;
            color: var(--accent-blue);
            text-shadow: 0 0 15px var(--accent-blue);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        p.subtitle {
            font-size: 14px;
            color: #8a9bb8;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 0 0 5px var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .btn:hover {
            background: var(--accent-blue);
            color: #000;
            box-shadow: 0 0 25px var(--accent-blue);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="crt-scanline"></div>
        
        <div id="ui-layer">
            <div class="hud-top">
                <div class="hud-stats">
                    SCORE: <span id="score-val">0</span><br>
                    WAVE: <span id="wave-val">1</span><br>
                    HP: <span id="hp-val">100</span>
                </div>
                <div class="hud-controls">
                    <span class="key-badge">W</span><span class="key-badge">A</span><span class="key-badge">S</span><span class="key-badge">D</span> Move<br>
                    <span class="key-badge">MOUSE</span> Aim & Attack<br>
                    <span class="key-badge">SPACE</span> Dash (Invulnerable)
                </div>
            </div>
        </div>

        <div id="screen-overlay">
            <h1 id="screen-title">PROJECT: VOID</h1>
            <p class="subtitle" id="screen-sub">Survive the spatial breach.</p>
            <button class="btn" id="start-btn" onclick="startGame()">DEPLOY</button>
        </div>

        <canvas id="canvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');

        // UI elements
        const scoreVal = document.getElementById('score-val');
        const waveVal = document.getElementById('wave-val');
        const hpVal = document.getElementById('hp-val');
        const overlay = document.getElementById('screen-overlay');
        const screenTitle = document.getElementById('screen-title');
        const screenSub = document.getElementById('screen-sub');
        const startBtn = document.getElementById('start-btn');

        // Audio System (Procedural Web Audio API)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'shoot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'dash') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'kill') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // Game State Variables
        let isRunning = false;
        let score = 0;
        let wave = 1;
        let aimX = canvas.width / 2;
        let aimY = canvas.height / 2;
        let keys = {};
        let isMouseDown = false;

        // Pointer Lock Mechanics
        function requestLock() {
            canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
            canvas.requestPointerLock();
        }

        canvas.addEventListener('click', () => {
            if (isRunning && document.pointerLockElement !== canvas) {
                requestLock();
            }
        });

        document.addEventListener('mousemove', e => {
            if (!isRunning) return;

            if (document.pointerLockElement === canvas) {
                // Virtual Reticle tracking via relative motion delta
                aimX += e.movementX;
                aimY += e.movementY;
            } else {
                // Fallback direct coordinates
                const rect = canvas.getBoundingClientRect();
                aimX = e.clientX - rect.left;
                aimY = e.clientY - rect.top;
            }

            // Clamp reticle inside screen bounds
            aimX = Math.max(0, Math.min(canvas.width, aimX));
            aimY = Math.max(0, Math.min(canvas.height, aimY));
        });

        // Collections
        let player;
        let bullets = [];
        let enemies = [];
        let particles = [];
        let floatingTexts = [];

        // Input Listeners
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.code === 'Space' && isRunning) {
                player.dash();
            }
        });

        window.addEventListener('keyup', e => {
            keys[e.key.toLowerCase()] = false;
        });

        window.addEventListener('mousedown', e => {
            if (e.button === 0 && isRunning) {
                isMouseDown = true;
                player.shoot();
            }
        });

        window.addEventListener('mouseup', e => {
            if (e.button === 0) {
                isMouseDown = false;
            }
        });

        // Entities
        class Player {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.radius = 14;
                this.speed = 3.8;
                this.hp = 100;
                this.maxHp = 100;
                this.angle = 0;

                // Dash Mechanics
                this.isDashing = false;
                this.dashTimer = 0;
                this.dashCooldown = 0;
                this.dashSpeed = 12;
                this.dashAngle = 0;

                // Fire Rate
                this.lastShot = 0;
                this.fireRate = 130; // ms
            }

            update(delta) {
                // Movement Handling
                let dx = 0;
                let dy = 0;
                if (keys['w'] || keys['arrowup']) dy -= 1;
                if (keys['s'] || keys['arrowdown']) dy += 1;
                if (keys['a'] || keys['arrowleft']) dx -= 1;
                if (keys['d'] || keys['arrowright']) dx += 1;

                // Normalize movement vector
                if (dx !== 0 && dy !== 0) {
                    dx *= 0.7071;
                    dy *= 0.7071;
                }

                // Handle Dash Physics
                if (this.isDashing) {
                    this.x += Math.cos(this.dashAngle) * this.dashSpeed;
                    this.y += Math.sin(this.dashAngle) * this.dashSpeed;
                    this.dashTimer--;

                    // Trail Particles
                    createParticles(this.x, this.y, '#00f0ff', 2, 3);

                    if (this.dashTimer <= 0) {
                        this.isDashing = false;
                    }
                } else {
                    this.x += dx * this.speed;
                    this.y += dy * this.speed;
                }

                // Constrain inside Screen Boundaries
                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

                if (this.dashCooldown > 0) this.dashCooldown--;

                // Rotate towards locked aim pointer
                this.angle = Math.atan2(aimY - this.y, aimX - this.x);
            }

            dash() {
                if (this.dashCooldown === 0 && !this.isDashing) {
                    let dx = 0;
                    let dy = 0;
                    if (keys['w'] || keys['arrowup']) dy -= 1;
                    if (keys['s'] || keys['arrowdown']) dy += 1;
                    if (keys['a'] || keys['arrowleft']) dx -= 1;
                    if (keys['d'] || keys['arrowright']) dx += 1;

                    // Dash in movement direction, or aiming direction if neutral
                    this.dashAngle = (dx !== 0 || dy !== 0) ? Math.atan2(dy, dx) : this.angle;
                    this.isDashing = true;
                    this.dashTimer = 10;
                    this.dashCooldown = 45; // Frames
                    playSound('dash');
                }
            }

            shoot() {
                const now = Date.now();
                if (now - this.lastShot >= this.fireRate) {
                    bullets.push(new Bullet(this.x, this.y, this.angle));
                    this.lastShot = now;
                    playSound('shoot');

                    // Muzzle flash particle effect
                    createParticles(
                        this.x + Math.cos(this.angle) * 15,
                        this.y + Math.sin(this.angle) * 15,
                        '#00f0ff', 4, 4
                    );
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Player Body Triangle
                ctx.fillStyle = this.isDashing ? '#ffffff' : '#00f0ff';
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = this.isDashing ? 20 : 10;

                ctx.beginPath();
                ctx.moveTo(16, 0);
                ctx.lineTo(-12, -10);
                ctx.lineTo(-6, 0);
                ctx.lineTo(-12, 10);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.speed = 12;
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;
                this.radius = 3;
                this.markedForDeletion = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.markedForDeletion = true;
                }
            }

            draw() {
                ctx.save();
                ctx.fillStyle = '#00f0ff';
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Enemy {
            constructor(type) {
                this.type = type; // 'chaser', 'fast', 'tank'
                this.markedForDeletion = false;

                // Spawn on map perimeter
                if (Math.random() < 0.5) {
                    this.x = Math.random() < 0.5 ? -20 : canvas.width + 20;
                    this.y = Math.random() * canvas.height;
                } else {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() < 0.5 ? -20 : canvas.height + 20;
                }

                // Setup Stats based on type
                if (type === 'fast') {
                    this.speed = 3.2;
                    this.hp = 1;
                    this.radius = 10;
                    this.color = '#ffd700';
                    this.scoreVal = 15;
                } else if (type === 'tank') {
                    this.speed = 1.2;
                    this.hp = 6;
                    this.radius = 22;
                    this.color = '#ff0055';
                    this.scoreVal = 40;
                } else { // Standard Chaser
                    this.speed = 2.0;
                    this.hp = 2;
                    this.radius = 14;
                    this.color = '#ff3366';
                    this.scoreVal = 20;
                }
            }

            update() {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                
                if (this.type === 'fast') {
                    // Diamond Shape
                    ctx.moveTo(this.x, this.y - this.radius);
                    ctx.lineTo(this.x + this.radius, this.y);
                    ctx.lineTo(this.x, this.y + this.radius);
                    ctx.lineTo(this.x - this.radius, this.y);
                } else if (this.type === 'tank') {
                    // Hexagon
                    for (let i = 0; i < 6; i++) {
                        const a = (Math.PI / 3) * i;
                        const px = this.x + Math.cos(a) * this.radius;
                        const py = this.y + Math.sin(a) * this.radius;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                } else {
                    // Circle
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                }
                
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, speedScale = 1) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 4 + 1) * speedScale;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = Math.random() * 0.04 + 0.02;
                this.size = Math.random() * 3 + 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.life = 1.0;
                this.vy = -1;
            }

            update() {
                this.y += this.vy;
                this.life -= 0.025;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.font = 'bold 12px Courier New';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        function createParticles(x, y, color, count = 8, speedScale = 1) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, speedScale));
            }
        }

        function drawReticle() {
            ctx.save();
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 1.5;
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 6;

            ctx.beginPath();
            ctx.arc(aimX, aimY, 8, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(aimX - 12, aimY); ctx.lineTo(aimX - 4, aimY);
            ctx.moveTo(aimX + 4, aimY); ctx.lineTo(aimX + 12, aimY);
            ctx.moveTo(aimX, aimY - 12); ctx.lineTo(aimX, aimY - 4);
            ctx.moveTo(aimX, aimY + 4); ctx.lineTo(aimX, aimY + 12);
            ctx.stroke();

            ctx.restore();
        }

        function spawnWave() {
            const enemyCount = 6 + wave * 4;
            for (let i = 0; i < enemyCount; i++) {
                setTimeout(() => {
                    if (!isRunning) return;
                    let rand = Math.random();
                    let type = 'chaser';
                    if (rand < 0.25) type = 'fast';
                    else if (rand > 0.8) type = 'tank';
                    enemies.push(new Enemy(type));
                }, i * 400);
            }
        }

        function startGame() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }

            score = 0;
            wave = 1;
            bullets = [];
            enemies = [];
            particles = [];
            floatingTexts = [];
            aimX = canvas.width / 2;
            aimY = canvas.height / 2;
            
            player = new Player();
            
            scoreVal.textContent = score;
            waveVal.textContent = wave;
            hpVal.textContent = player.hp;

            overlay.classList.add('hidden');
            isRunning = true;

            requestLock();
            spawnWave();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isRunning = false;
            playSound('kill');
            if (document.exitPointerLock) {
                document.exitPointerLock();
            }
            screenTitle.textContent = "SIGNAL LOST";
            screenSub.textContent = `FINAL SCORE: ${score} | SURVIVED WAVES: ${wave}`;
            startBtn.textContent = "RETRY";
            overlay.classList.remove('hidden');
        }

        // Main Loop
        function gameLoop() {
            if (!isRunning) return;

            // Clear Screen
            ctx.fillStyle = 'rgba(8, 12, 20, 0.4)'; // Motion Trail FX
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Update & Draw Player
            player.update();
            player.draw();

            // Automatic attack on mouse hold
            if (isMouseDown) {
                player.shoot();
            }

            // 2. Update & Draw Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.update();
                b.draw();

                if (b.markedForDeletion) {
                    bullets.splice(i, 1);
                }
            }

            // 3. Update & Draw Enemies & Collision
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.update();
                e.draw();

                // Collision: Bullet vs Enemy
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    let dist = Math.hypot(e.x - b.x, e.y - b.y);

                    if (dist < e.radius + b.radius) {
                        e.hp--;
                        bullets.splice(j, 1);
                        createParticles(b.x, b.y, e.color, 5, 0.8);
                        playSound('hit');

                        if (e.hp <= 0) {
                            e.markedForDeletion = true;
                            score += e.scoreVal;
                            scoreVal.textContent = score;
                            createParticles(e.x, e.y, e.color, 15, 1.5);
                            floatingTexts.push(new FloatingText(e.x, e.y, `+${e.scoreVal}`, e.color));
                            playSound('kill');
                        }
                        break;
                    }
                }

                // Collision: Player vs Enemy
                let distToPlayer = Math.hypot(e.x - player.x, e.y - player.y);
                if (distToPlayer < e.radius + player.radius) {
                    if (!player.isDashing) {
                        player.hp -= 15;
                        hpVal.textContent = Math.max(0, player.hp);
                        createParticles(player.x, player.y, '#ff0055', 12, 1.2);
                        playSound('hit');

                        e.markedForDeletion = true; // Enemy breaks on impact

                        if (player.hp <= 0) {
                            gameOver();
                            return;
                        }
                    }
                }

                if (e.markedForDeletion) {
                    enemies.splice(i, 1);
                }
            }

            // Wave progression check
            if (enemies.length === 0) {
                wave++;
                waveVal.textContent = wave;
                // Heal slight HP on wave clear
                player.hp = Math.min(player.maxHp, player.hp + 15);
                hpVal.textContent = player.hp;
                floatingTexts.push(new FloatingText(player.x, player.y - 20, "REPAIR +15", "#00f0ff"));
                spawnWave();
            }

            // 4. Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            }

            // 5. Update & Draw Floating Texts
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.update();
                ft.draw();
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            // 6. Custom Reticle
            drawReticle();

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
